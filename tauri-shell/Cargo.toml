# The Tauri/Servo shell for the Copse prototype — its own workspace,
# deliberately outside any parent workspace resolution.
#
# `tauri-runtime-servo` is consumed from a sibling checkout of
# jonathanKingston/tauri (branch claude/tauri-servo-prototype-8ugtq4, which
# contains jonathanKingston/tauri#1's `tauri-runtime-servo/` directory):
#
#   git clone -b claude/tauri-servo-prototype-8ugtq4 \
#     https://github.com/jonathanKingston/tauri ../../tauri
#
# Once that crate lives in its own repository (the PR is structured to be
# lifted verbatim), swap the path dependency for:
#   tauri-runtime-servo = { git = "https://github.com/jonathanKingston/tauri-runtime-servo" }
[workspace]

[package]
name = "copse-tauri-shell"
version = "0.1.0"
description = "Copse desktop shell on Tauri + Servo (prototype)"
edition = "2021"
rust-version = "1.90"
license = "Apache-2.0"
publish = false

[build-dependencies]
tauri-build = "2"

[dependencies]
tauri = { version = "2.11", default-features = false, features = [
  "common-controls-v6",
] }
tauri-runtime-servo = { path = "../../tauri/tauri-runtime-servo" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# To try a servo patch locally (see tauri-runtime-servo/servo-patches/ in the
# tauri fork): check servo out beside the repos, `git am` the series, and
# uncomment — cargo then builds the whole servo graph from the local tree.
# [patch."https://github.com/servo/servo.git"]
# servo = { path = "../../servo/components/servo" }
