# The Tauri/Servo shell for the Copse prototype — its own workspace,
# deliberately outside any parent workspace resolution.
#
# `tauri-runtime-servo` is consumed from a sibling checkout of its standalone
# repository:
#
#   git clone https://github.com/copse-dev/tauri-runtime-servo ../../tauri-runtime-servo
#
# The path dependency keeps local engine iteration cheap; swap it for
#   tauri-runtime-servo = { git = "https://github.com/copse-dev/tauri-runtime-servo" }
# once the crate is pinned rather than co-developed.
[workspace]

[package]
name = "copse-tauri-shell"
version = "0.1.0"
description = "Copse desktop shell on Tauri + Servo (prototype)"
edition = "2021"
rust-version = "1.90"
license = "Apache-2.0"
publish = false

[build-dependencies]
tauri-build = "2"

[dependencies]
tauri = { version = "2.11", default-features = false, features = [
  "common-controls-v6",
] }
tauri-runtime-servo = { path = "../../tauri-runtime-servo" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# To try a servo patch locally (see tauri-runtime-servo/servo-patches/ in the
# tauri fork): check servo out beside the repos, `git am` the series, and
# uncomment — cargo then builds the whole servo graph from the local tree.
# [patch."https://github.com/servo/servo.git"]
# servo = { path = "../../servo/components/servo" }

# CSP 'self' on tauri:// needs servo patch 0008 plus csp-0001 (both in the
# tauri fork's servo-patches/): 0008 gives registered custom schemes tuple
# origins; csp-0001 teaches the CSP crate to match 'self' against them. Check
# rust-content-security-policy out beside the repos at the published 0.8.1
# rev (6a523bab), `git am` csp-0001, and uncomment.
# [patch.crates-io]
# content-security-policy = { path = "../../rust-content-security-policy" }

# :has() — used by 26 rules in the core chat stylesheets — needs one flipped
# boolean in the STYLO repo (servo-patches/stylo-0001-… in the tauri fork):
# check stylo out beside the repos at the rev pinned in servo's Cargo.lock,
# apply the patch, and uncomment. All eleven stylo-repo crates must redirect
# together or the build gets two copies of the selector machinery.
# [patch."https://github.com/servo/stylo"]
# stylo = { path = "../../stylo/style" }
# selectors = { path = "../../stylo/selectors" }
# servo_arc = { path = "../../stylo/servo_arc" }
# stylo_atoms = { path = "../../stylo/stylo_atoms" }
# stylo_derive = { path = "../../stylo/style_derive" }
# stylo_dom = { path = "../../stylo/stylo_dom" }
# stylo_malloc_size_of = { path = "../../stylo/malloc_size_of" }
# stylo_static_prefs = { path = "../../stylo/stylo_static_prefs" }
# stylo_traits = { path = "../../stylo/style_traits" }
# to_shmem = { path = "../../stylo/to_shmem" }
# to_shmem_derive = { path = "../../stylo/to_shmem_derive" }
