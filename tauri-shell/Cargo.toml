# The Tauri/Servo shell for the Copse prototype — its own workspace,
# deliberately outside any parent workspace resolution.
#
# `tauri-runtime-servo` is consumed from a sibling checkout of its standalone
# repository:
#
#   git clone https://github.com/copse-dev/tauri-runtime-servo ../../tauri-runtime-servo
#
# The path dependency keeps local engine iteration cheap; swap it for
#   tauri-runtime-servo = { git = "https://github.com/copse-dev/tauri-runtime-servo" }
# once the crate is pinned rather than co-developed.
[workspace]

[package]
name = "copse-tauri-shell"
version = "0.1.0"
description = "Copse desktop shell on Tauri + Servo (prototype)"
edition = "2021"
rust-version = "1.90"
license = "Apache-2.0"
publish = false

[build-dependencies]
tauri-build = "2"

[dependencies]
tauri = { version = "2.11", default-features = false, features = [
  "common-controls-v6",
] }
tauri-runtime-servo = { path = "../../tauri-runtime-servo" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# On by default, because the patched engine is what the overrides below
# resolve to and what `pnpm build:servo` assumes. Enabling this against a
# stock libservo is a compile error rather than a silent no-op — the pref it
# sets is a struct field stock servo does not have — so the feature and the
# overrides cannot drift apart unnoticed. For a stock-engine build:
# `cargo run --no-default-features`, and build the web artifacts with
# COPSE_TAURI_STRIP_CSP=1 (stock servo cannot match CSP 'self' against
# tauri://localhost, so an enforced policy blocks every subresource).
default = ["patched-servo"]
patched-servo = ["tauri-runtime-servo/patched-servo"]

# The patched engine, as `tauri-runtime-patches` branches on the org's forks.
# This is the block the runtime repo's README publishes under "Using a patched
# Servo", with nothing changed but the indentation of this comment — that
# recipe is built in the runtime's own CI, so keep the two in step rather than
# improvising here.
#
# Pinned by rev rather than by branch: those branches are rebased whenever the
# crate they fork publishes a release the pin has to move to, and a branch pin
# would change what this builds on the next `cargo update`.
#
# For engine iteration, put a checkout at ../../servo (and ../../stylo) and run
# `pnpm build:servo`: it writes .cargo/config.toml with path overrides, which
# take precedence over these per crate. Delete the checkout and the next
# build:servo removes the file, putting you back on the pins.
[patch.crates-io]
servo = { git = "https://github.com/copse-dev/servo", rev = "3cb6867644a222d54dd5ed7fbd991cd5811fd2f4" }
content-security-policy = { git = "https://github.com/copse-dev/rust-content-security-policy", rev = "fb5fd0f1af7f0c0dc315bf938507290b2e48cdbe" }

# All eight stylo entries are required. Overriding `stylo` alone leaves the
# others resolving from the registry, which puts a second copy of
# `stylo_traits` and friends in the graph and fails to compile.
selectors = { git = "https://github.com/copse-dev/stylo", rev = "4973e76a24701bdf68ef15cc6f493b0737f07f64" }
servo_arc = { git = "https://github.com/copse-dev/stylo", rev = "4973e76a24701bdf68ef15cc6f493b0737f07f64" }
stylo = { git = "https://github.com/copse-dev/stylo", rev = "4973e76a24701bdf68ef15cc6f493b0737f07f64" }
stylo_atoms = { git = "https://github.com/copse-dev/stylo", rev = "4973e76a24701bdf68ef15cc6f493b0737f07f64" }
stylo_dom = { git = "https://github.com/copse-dev/stylo", rev = "4973e76a24701bdf68ef15cc6f493b0737f07f64" }
stylo_malloc_size_of = { git = "https://github.com/copse-dev/stylo", rev = "4973e76a24701bdf68ef15cc6f493b0737f07f64" }
stylo_static_prefs = { git = "https://github.com/copse-dev/stylo", rev = "4973e76a24701bdf68ef15cc6f493b0737f07f64" }
stylo_traits = { git = "https://github.com/copse-dev/stylo", rev = "4973e76a24701bdf68ef15cc6f493b0737f07f64" }
