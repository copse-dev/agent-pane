# Spin up N identical unified Linux runners that serve BOTH the e2e and check
# tiers, for one repo or a whole org:
#
#   cd ci-runners
#   cp .env.example .env          # fill in GITHUB_URL + ACCESS_TOKEN + BUILD_GH_TOKEN
#   DOCKER_BUILDKIT=1 docker compose up -d --build --scale runner=3
#
# BuildKit is required for the build-time clone token (secret). On recent Docker
# it is the default; older Engines need DOCKER_BUILDKIT=1 (as above).
#
# Works unchanged on Linux, macOS (Docker Desktop/OrbStack/Colima), and Windows
# (Docker Desktop in Linux-containers mode). Scale `runner` to your core/RAM
# budget — this superset image runs Chromium-under-Xvfb for e2e, so size for the
# heavy tier: ~4-6 GB + ~2 cores per concurrent runner.
services:
  runner:
    build:
      # The build context is THIS directory (Dockerfile + entrypoint only) — the
      # image no longer needs a consumer repo as its context. It clones the
      # target repo itself (see TARGET_REPO) to bake deps.
      context: .
      dockerfile: Dockerfile
      args:
        # Which consumer repo's dependency tree to bake for a warm start, and at
        # which ref ("thread in main"). Point at your heaviest consumer; other
        # repos still run here, they just fall back to npm ci at job time.
        TARGET_REPO: ${TARGET_REPO:-copse-dev/agent-pane}
        TARGET_REF: ${TARGET_REF:-main}
      secrets:
        # Read token used ONLY at build time to clone TARGET_REPO and let its
        # `npm ci` fetch the private @copse/streaming-markdown git dependency.
        # BuildKit keeps it on tmpfs — it is never written into an image layer.
        - gh_token
    image: copse-ci-runner:latest
    # Ephemeral runners exit after each job; `always` restarts a fresh, clean
    # container that re-registers. Per-job isolation for free.
    restart: always
    # .env carries GITHUB_URL + the registration/build secrets (ACCESS_TOKEN,
    # BUILD_GH_TOKEN). entrypoint.sh consumes ACCESS_TOKEN to register the runner,
    # then unsets ACCESS_TOKEN/BUILD_GH_TOKEN (and strips RUNNER_TOKEN from the
    # runner's env) BEFORE starting the agent, so job steps never inherit them.
    env_file: .env
    environment:
      EPHEMERAL: 'true'
    init: true # PID 1 reaps stray electron/chromedriver children
    # bubblewrap — ASRT's Linux backend — builds its confinement from a user
    # namespace. Without both entries below it cannot start at all, the app
    # degrades to unsandboxed, and executable packs stay unavailable because
    # they fail closed rather than run unconfined (pack-tool-host.ts).
    #
    # `seccomp` is not optional. Docker's default profile allows `clone`/`unshare`
    # but filters their flag argument to exclude CLONE_NEWUSER for containers
    # without CAP_SYS_ADMIN, so bwrap gets EPERM before it attempts any mount:
    #
    #   bwrap: No permissions to create new namespace, likely because the
    #   kernel does not allow non-privileged user namespaces.
    #
    # That specific message is Docker's syscall filter. Ubuntu 24.04 has a second,
    # distinct host restriction: `kernel.apparmor_restrict_unprivileged_userns=1`
    # permits the namespace but strips the capabilities bwrap needs to configure
    # loopback, producing `Failed RTM_NEWADDR`. The cloud host bootstrap disables
    # that restriction on these dedicated ephemeral hosts; `apparmor=unconfined`
    # here does not override the host sysctl. Docker also protects selected
    # `/proc` paths even with those two profiles relaxed. ASRT mounts a fresh
    # procfs inside its new PID namespace, so `systempaths=unconfined` is needed
    # or the real worker launch dies with:
    #
    #   bwrap: Can't mount proc on /newroot/proc: Operation not permitted
    #
    # `cap_add: [SYS_ADMIN]` would also satisfy the seccomp rule, but grants a
    # near-root capability for the whole container; dropping the syscall filter
    # while keeping the capability set is the smaller concession. Tighter still
    # would be a custom seccomp profile — Docker's default with the CLONE_NEWUSER
    # mask removed — if this ever needs narrowing.
    #
    # This does loosen the *container's* confinement on boxes that execute PR
    # code. The trade is deliberate: it is what lets the app impose its own
    # per-job sandbox around the processes that actually handle repo content,
    # which is a tighter boundary than the container profile was giving those
    # processes anyway. Remove this block to keep the stricter container profile
    # and accept an unsandboxed app (the previous behaviour).
    #
    # The burst startup path runs this probe before registering any runners:
    #   docker compose run --rm --no-deps --entrypoint bwrap runner \
    #     --new-session --die-with-parent --ro-bind / / --unshare-net \
    #     --unshare-pid --unshare-user --cap-drop ALL --proc /proc -- /usr/bin/true
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
      - systempaths=unconfined
    # Superset image runs the memory-hungry Chromium-under-Xvfb e2e suite, so
    # size for the heavy tier even though light jobs also land here. ~4-6 GB per
    # concurrent runner; cap so one shard can't take the host down.
    mem_limit: 6g
    # A roomy /dev/shm avoids Chromium shm crashes (wdio also passes
    # --disable-dev-shm-usage as a fallback).
    shm_size: '2gb'

  # Checks-only sibling of `runner`, used by the burst CLI's split-tier layout
  # (one e2e-capable slot + N checks-only slots per host, so two Electron e2e
  # suites never contend on one small cloud host — that contention pushed the
  # slowest specs over their fixed timeouts). Behind a compose profile so the
  # plain local flow (`--scale runner=N`, all-unified slots) is unchanged
  # unless COMPOSE_PROFILES=split-tiers is set.
  runner-checks:
    profiles: ['split-tiers']
    image: copse-ci-runner:latest
    restart: always
    env_file: .env
    environment:
      EPHEMERAL: 'true'
      # Service-level environment beats env_file, so this replaces the unified
      # RUNNER_LABELS from .env with the checks-only set.
      RUNNER_LABELS: ${RUNNER_CHECKS_LABELS:-self-hosted,linux,docker,copse-checks,burst}
    init: true
    # Check-tier jobs are lighter, but this is the same superset image; keep the
    # same guardrails so a misrouted heavy job can't take the host down.
    mem_limit: 6g
    shm_size: '2gb'

# The build-time clone token, sourced from the BUILD_GH_TOKEN env var in .env.
secrets:
  gh_token:
    environment: BUILD_GH_TOKEN
