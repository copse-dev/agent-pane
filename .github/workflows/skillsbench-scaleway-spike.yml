name: SkillsBench v1.1 (Scaleway Spike)

on:
  workflow_dispatch:
    inputs:
      model:
        description: Scaleway Generative APIs Serverless model ID
        required: true
        default: qwen3.6-35b-a3b
        type: string
      task_names:
        description: Comma-separated SkillsBench v1.1 task names
        required: true
        default: offer-letter-generator
        type: string
      instances:
        description: Disposable x86 Scaleway workers (1-8; capped by task count)
        required: true
        default: '1'
        type: string
      attempts:
        description: Attempts per task (1-5)
        required: true
        default: '1'
        type: string
      profile:
        description: Frozen Copse skill-delivery profile (@1 fixed cap, @2 checkpointed reasoning)
        required: true
        type: choice
        options:
          - skills-none@1
          - skills-none@2
          - skills-product@1
          - skills-product@2
          - skills-explicit@1
          - skills-explicit@2
      profiles:
        description: Optional comma-separated arms run on one fleet, e.g. skills-product@1,skills-product@2
        required: false
        default: ''
        type: string
      oracle:
        description: Run the task solution instead of an agent, to check task eligibility
        required: false
        default: false
        type: boolean
      scw_type:
        description: Scaleway x86 Instance type
        required: true
        default: BASIC3-X4C-16G
        type: string
      max_stream_output_tokens:
        description: Per-model-response stream cap
        required: true
        default: '4096'
        type: string

concurrency:
  group: skillsbench-scaleway-spike
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Validate and bake worker
    runs-on: ubuntu-24.04
    outputs:
      worker_image: ${{ steps.image.outputs.worker_image }}
    steps:
      - name: Validate configuration
        env:
          INSTANCES: ${{ inputs.instances }}
          ATTEMPTS: ${{ inputs.attempts }}
          PROFILE: ${{ inputs.profile }}
          PROFILES: ${{ inputs.profiles }}
          ORACLE: ${{ inputs.oracle }}
          TASK_NAMES: ${{ inputs.task_names }}
          MAX_STREAM_OUTPUT_TOKENS: ${{ inputs.max_stream_output_tokens }}
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
          SCW_GENERATIVE_API_KEY: ${{ secrets.SCW_GENERATIVE_API_KEY }}
          SCW_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.SCW_OBJECT_STORAGE_ACCESS_KEY_ID }}
          SCW_OBJECT_STORAGE_SECRET_KEY: ${{ secrets.SCW_OBJECT_STORAGE_SECRET_KEY }}
          SCW_OBJECT_STORAGE_BUCKET: ${{ vars.SCW_OBJECT_STORAGE_BUCKET }}
          SCW_SSH_PRIVATE_KEY: ${{ secrets.SCW_SSH_PRIVATE_KEY }}
          SCW_TERMINAL_REGISTRY: ${{ vars.SCW_TERMINAL_REGISTRY }}
        run: |
          if ! [[ "$INSTANCES" =~ ^[1-8]$ ]]; then
            echo "::error::instances must be an integer from 1 through 8"
            exit 2
          fi
          if ! [[ "$ATTEMPTS" =~ ^[1-5]$ ]]; then
            echo "::error::attempts must be an integer from 1 through 5"
            exit 2
          fi
          if [ "$ORACLE" = true ]; then
            echo "oracle mode: skipping profile validation"
            profile_csv=""
          else
            profile_csv="${PROFILES:-$PROFILE}"
          fi
          if [ -n "$profile_csv" ]; then
            IFS=',' read -r -a profile_ids <<< "$profile_csv"
            declare -A seen_profiles=()
            for profile_id in "${profile_ids[@]}"; do
              case "$profile_id" in
                skills-none|skills-product|skills-explicit) profile_id="$profile_id@1" ;;
                skills-none@[12]|skills-product@[12]|skills-explicit@[12]) ;;
                *) echo "::error::unsupported SkillsBench profile: $profile_id"; exit 2 ;;
              esac
              if [ -n "${seen_profiles[$profile_id]:-}" ]; then
                echo "::error::SkillsBench profiles must not contain duplicates: $profile_id"
                exit 2
              fi
              seen_profiles[$profile_id]=1
            done
          fi
          if [ -z "$TASK_NAMES" ] || ! [[ "$TASK_NAMES" =~ ^[a-z0-9-]+(,[a-z0-9-]+)*$ ]]; then
            echo "::error::task_names must be a comma-separated list of exact v1.1 task names"
            exit 2
          fi
          if ! [[ "$MAX_STREAM_OUTPUT_TOKENS" =~ ^[0-9]+$ ]] || \
            [ "$MAX_STREAM_OUTPUT_TOKENS" -lt 512 ] || [ "$MAX_STREAM_OUTPUT_TOKENS" -gt 16384 ]; then
            echo "::error::max_stream_output_tokens must be from 512 through 16384"
            exit 2
          fi
          required=(
            SCW_ACCESS_KEY SCW_SECRET_KEY SCW_DEFAULT_PROJECT_ID
            SCW_DEFAULT_ORGANIZATION_ID SCW_GENERATIVE_API_KEY
            SCW_OBJECT_STORAGE_ACCESS_KEY_ID SCW_OBJECT_STORAGE_SECRET_KEY
            SCW_OBJECT_STORAGE_BUCKET SCW_SSH_PRIVATE_KEY SCW_TERMINAL_REGISTRY
          )
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              echo "::error::Configure $name before dispatching this workflow"
              exit 2
            fi
          done

      - uses: actions/checkout@v7.0.1

      - name: Verify task, model, and Object Storage access
        env:
          API_KEY: ${{ secrets.SCW_GENERATIVE_API_KEY }}
          API_URL: ${{ vars.SCW_GENERATIVE_API_URL || 'https://api.scaleway.ai/v1' }}
          MODEL: ${{ inputs.model }}
          TASK_NAMES: ${{ inputs.task_names }}
          AWS_ACCESS_KEY_ID: ${{ secrets.SCW_OBJECT_STORAGE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SCW_OBJECT_STORAGE_SECRET_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.SCW_OBJECT_STORAGE_REGION || 'fr-par' }}
          AWS_EC2_METADATA_DISABLED: 'true'
          BUCKET: ${{ vars.SCW_OBJECT_STORAGE_BUCKET }}
          ENDPOINT: https://s3.${{ vars.SCW_OBJECT_STORAGE_REGION || 'fr-par' }}.scw.cloud
        run: |
          for task in ${TASK_NAMES//,/ }; do
            jq --exit-status --arg task "$task" '.active[] | select(.name == $task)' \
              benchmarks/skillsbench/dataset-v1.1.json >/dev/null || {
                echo "::error::Unknown SkillsBench v1.1 task: $task"
                exit 2
              }
          done
          response="$(mktemp)"
          status="$(curl --silent --show-error --output "$response" --write-out '%{http_code}' \
            --header "Authorization: Bearer $API_KEY" "$API_URL/models")"
          if [ "$status" != 200 ] || ! jq --exit-status --arg model "$MODEL" \
            '.data[] | select(.id == $model)' "$response" >/dev/null; then
            echo "::error::Model $MODEL is unavailable from $API_URL (HTTP $status)"
            exit 1
          fi
          probe="skillsbench-spike/_github_preflight/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/.write-check"
          printf 'ok\n' | aws s3 cp - "s3://${BUCKET}/${probe}" \
            --sse AES256 --only-show-errors --endpoint-url "$ENDPOINT"

      - name: Log in to Scaleway Container Registry
        env:
          REGISTRY: ${{ vars.SCW_TERMINAL_REGISTRY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        run: |
          registry_host="${REGISTRY%%/*}"
          echo "$SCW_SECRET_KEY" | docker login "$registry_host" --username nologin --password-stdin

      - name: Resolve immutable worker image
        id: image
        env:
          REGISTRY: ${{ vars.SCW_TERMINAL_REGISTRY }}
        run: |
          worker_image="${REGISTRY%/}/skillsbench-spike-worker:${GITHUB_SHA}"
          echo "worker_image=$worker_image" >> "$GITHUB_OUTPUT"
          if docker buildx imagetools inspect "$worker_image" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v4
        if: steps.image.outputs.exists != 'true'

      - name: Build and push worker once
        uses: docker/build-push-action@v7
        if: steps.image.outputs.exists != 'true'
        with:
          context: .
          file: benchmarks/skillsbench/Dockerfile.worker
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.worker_image }}
          cache-from: type=registry,ref=${{ vars.SCW_TERMINAL_REGISTRY }}/skillsbench-spike-worker:buildcache
          cache-to: type=registry,ref=${{ vars.SCW_TERMINAL_REGISTRY }}/skillsbench-spike-worker:buildcache,mode=max

  benchmark:
    name: Run disposable Scaleway spike
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install Scaleway CLI
        uses: scaleway/action-scw@v0.0.3
        with:
          version: v2.56.1
          access-key: ${{ secrets.SCW_ACCESS_KEY }}
          secret-key: ${{ secrets.SCW_SECRET_KEY }}
          default-project-id: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          default-organization-id: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
          export-config: true

      - name: Configure ephemeral SSH key
        env:
          SCW_SSH_PRIVATE_KEY: ${{ secrets.SCW_SSH_PRIVATE_KEY }}
        run: |
          install -d -m 700 "$RUNNER_TEMP/copse-ssh"
          printf '%s\n' "$SCW_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/copse-ssh/id"
          chmod 600 "$RUNNER_TEMP/copse-ssh/id"

      - name: Launch, run, upload, and terminate fleet
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
          SCW_DEFAULT_REGION: fr-par
          SCW_DEFAULT_ZONE: fr-par-1
          SCW_GENERATIVE_API_KEY: ${{ secrets.SCW_GENERATIVE_API_KEY }}
          SCW_GENERATIVE_API_URL: ${{ vars.SCW_GENERATIVE_API_URL || 'https://api.scaleway.ai/v1' }}
          SCW_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.SCW_OBJECT_STORAGE_ACCESS_KEY_ID }}
          SCW_OBJECT_STORAGE_SECRET_KEY: ${{ secrets.SCW_OBJECT_STORAGE_SECRET_KEY }}
          SCW_OBJECT_STORAGE_BUCKET: ${{ vars.SCW_OBJECT_STORAGE_BUCKET }}
          SCW_OBJECT_STORAGE_REGION: ${{ vars.SCW_OBJECT_STORAGE_REGION || 'fr-par' }}
          LM_STUDIO_MODEL: ${{ inputs.model }}
          COPSE_BENCH_RUN_ID: github-${{ github.run_id }}-${{ github.run_attempt }}
          COPSE_SKILLSBENCH_MAX_STREAM_OUTPUT_TOKENS: ${{ inputs.max_stream_output_tokens }}
          INSTANCES: ${{ inputs.instances }}
          TASK_NAMES: ${{ inputs.task_names }}
          ATTEMPTS: ${{ inputs.attempts }}
          PROFILE: ${{ inputs.profile }}
          PROFILES: ${{ inputs.profiles }}
          ORACLE: ${{ inputs.oracle }}
          SCW_TYPE: ${{ inputs.scw_type }}
          WORKER_IMAGE: ${{ needs.prepare.outputs.worker_image }}
          FLEET_NAME: skillsbench-spike-${{ github.run_id }}-${{ github.run_attempt }}
          OBJECT_PREFIX: skillsbench-spike/${{ github.repository }}/${{ github.run_id }}/${{ github.run_attempt }}
          SSH_KEY_PATH: ${{ runner.temp }}/copse-ssh/id
          BASE_IMAGE: ${{ vars.SCW_TERMINAL_BASE_IMAGE || 'ubuntu_noble' }}
          SCW_ZONE: ${{ vars.SCW_TERMINAL_ZONE }}
          SECURITY_GROUP_ID: ${{ vars.SCW_TERMINAL_SECURITY_GROUP_ID }}
        run: |
          args=(
            run --instances "$INSTANCES" --task-names "$TASK_NAMES"
            --attempts "$ATTEMPTS" --scw-type "$SCW_TYPE"
            --scw-image "$BASE_IMAGE" --volume-size-gb 100 --ttl-minutes 300
            --worker-image "$WORKER_IMAGE" --name "$FLEET_NAME"
            --object-prefix "$OBJECT_PREFIX" --key-path "$SSH_KEY_PATH"
          )
          if [ "$ORACLE" = true ]; then
            args+=(--oracle)
          elif [ -n "$PROFILES" ]; then
            args+=(--profiles "$PROFILES")
          else
            args+=(--profile "$PROFILE")
          fi
          if [ -n "$SCW_ZONE" ]; then args+=(--zone "$SCW_ZONE"); fi
          if [ -n "$SECURITY_GROUP_ID" ]; then args+=(--security-group-id "$SECURITY_GROUP_ID"); fi
          npm run bench:skills:fleet -- "${args[@]}"
          echo "Capsules: s3://${SCW_OBJECT_STORAGE_BUCKET}/${OBJECT_PREFIX}/" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify fleet teardown
        if: always()
        env:
          FLEET_NAME: skillsbench-spike-${{ github.run_id }}-${{ github.run_attempt }}
          SCW_ZONE: ${{ vars.SCW_TERMINAL_ZONE }}
        run: |
          args=(down --yes --name "$FLEET_NAME")
          if [ -n "$SCW_ZONE" ]; then args+=(--zone "$SCW_ZONE"); fi
          npm run bench:skills:fleet -- "${args[@]}"
