name: Secret scan

on:
  push:
    branches: [release, main]
  pull_request:
    # `main` is the default branch and where day-to-day PRs land, so it must
    # be listed or fork PRs — the ones this standalone job exists for — would go
    # unscanned entirely once PRs stopped targeting `release`.
    branches: [release, main]
  schedule:
    - cron: '41 6 * * 1'

# Same-repository PRs scan inside CI's existing self-hosted precheck. This
# standalone hosted job remains for main pushes, the weekly safety net, and fork
# PRs, which receive only the default read token and must never reach the
# self-hosted fleet.
permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_LINUX_X64_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gitleaks:
    name: Scan repository history
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # The scan walks only the checked-out commit's history (below), so fetch
      # just that rather than `fetch-depth: 0`'s every branch and tag. The
      # repository is public, so the fetch needs no token.
      - name: Fetch the checked-out commit's history
        run: git fetch --no-tags --quiet --unshallow origin "$(git rev-parse HEAD)"
      # gitleaks-action v2 requires a separate license for organization-owned
      # repositories. Run the open-source CLI directly and verify the pinned
      # release asset before executing it instead. The shared installer (also
      # used by CI's precheck) falls back to the release asset API when the
      # direct download fails, and checks the same checksum on either route.
      - name: Install pinned gitleaks CLI
        shell: bash
        run: bash scripts/install-gitleaks.sh
      # Default `gitleaks git` implies `--all --full-history`, which walks every
      # ref in the clone — when this used `fetch-depth: 0`, that included
      # machine-managed branches like `demo-previews` whose minified bundles trip
      # entropy heuristics and fail unrelated PR tips (seen on #1192 via commit
      # 22623c71). Keep the same history/diff filters, but limit the walk to the
      # checked-out tip (PR merge commit or `main`) so preview artifacts cannot
      # poison other scans even if more refs are ever fetched.
      - name: Scan repository history
        run: |
          "${RUNNER_TEMP}/gitleaks" git --redact --verbose --no-banner \
            --log-opts="--full-history --diff-filter=tuxdb HEAD" .
