name: Copse reusable reviewer

# Public npm/TypeScript adoption and Copse pnpm dogfooding. Both actions use trusted Copse
# commit; the caller's PR contributes data and commands that execute only in cells.
on:
  workflow_call:
    inputs:
      reviewer-ref:
        description: Full trusted agent-pane commit SHA (pin the workflow to this SHA too)
        required: true
        type: string
      preparation:
        description: Trusted dependency preparation (npm or copse-pnpm)
        default: npm
        type: string
      pr:
        description: PR number for a manual workflow_dispatch caller
        required: true
        type: number
      provider:
        default: openrouter
        type: string
      model:
        default: openai/gpt-6-luna
        type: string
      lenses:
        default: correctness,visual
        type: string
      max-steps:
        default: 12
        type: number
      max-verify:
        default: 3
        type: number
      post-summary:
        description: Update the PR description with the completed review's summary
        default: false
        type: boolean
    secrets:
      COPSE_REVIEW_API_KEY:
        required: false
      COPSE_REVIEW_OPENROUTER_API_KEY:
        required: false
      SCW_GENERATIVE_API_KEY:
        required: false
      SCW_DEFAULT_PROJECT_ID:
        required: false
      model-api-key:
        required: false
      app-id:
        required: false
      app-private-key:
        required: false
      # Native names inherited only by the trusted same-repository Copse caller.
      RELEASE_APP_ID:
        required: false
      RELEASE_APP_PRIVATE_KEY:
        required: false

permissions: {}

concurrency:
  group: copse-review-${{ github.repository }}-${{ inputs.pr }}
  cancel-in-progress: true

jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      request: ${{ steps.authorize.outputs.request }}
    steps:
      - uses: actions/github-script@v9
        id: authorize
        env:
          PREPARATION: ${{ inputs.preparation }}
          COPSE_CALLER_ALLOWED: ${{ github.event_name == 'workflow_dispatch' && github.repository_id == '1274237362' && github.actor_id == '338988' && github.triggering_actor == 'jonathanKingston' && github.ref == 'refs/heads/main' && github.workflow_ref == 'copse-dev/agent-pane/.github/workflows/review-trigger.yml@refs/heads/main' }}
          REVIEWER_REF: ${{ inputs.reviewer-ref }}
          MANUAL_PR: ${{ inputs.pr }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          MAX_STEPS: ${{ inputs.max-steps }}
          MAX_VERIFY: ${{ inputs.max-verify }}
          HAS_MODEL_KEY: ${{ secrets.model-api-key != '' }}
          HAS_APP_ID: ${{ secrets.app-id != '' }}
          HAS_APP_KEY: ${{ secrets.app-private-key != '' }}
        with:
          script: |
            const copse = process.env.PREPARATION === 'copse-pnpm';
            if (!['npm', 'copse-pnpm'].includes(process.env.PREPARATION)) {
              throw new Error('Unknown trusted preparation profile');
            }
            if (copse && process.env.COPSE_CALLER_ALLOWED !== 'true') return;
            if (!copse && process.env.HAS_MODEL_KEY !== 'true') {
              throw new Error('Configure a model API key in the caller repository/org and pass it as model-api-key');
            }
            if (!/^[0-9a-f]{40}$/.test(process.env.REVIEWER_REF)) {
              throw new Error('reviewer-ref must pin a trusted full Copse commit SHA');
            }
            if (!copse && process.env.HAS_APP_ID !== process.env.HAS_APP_KEY) {
              throw new Error('Supply both app-id and app-private-key, or neither');
            }
            if (!/^[1-9][0-9]*$/.test(process.env.MAX_STEPS) || Number(process.env.MAX_STEPS) > 100 ||
                !/^[1-9][0-9]*$/.test(process.env.MAX_VERIFY) || Number(process.env.MAX_VERIFY) > 10) {
              throw new Error('Review budgets must be positive integers (max-steps <= 100, max-verify <= 10)');
            }
            const { owner, repo } = context.repo;
            const { data: repository } = await github.rest.repos.get({ owner, repo });
            if (repository.private || context.ref !== `refs/heads/${repository.default_branch}`) {
              throw new Error('The initial Copse Actions release requires a public repo and default-branch workflow');
            }
            if (context.eventName !== 'workflow_dispatch') {
              throw new Error('Invoke from workflow_dispatch');
            }
            // Re-check both the initiating actor and the actor requesting a rerun.
            for (const username of new Set([context.actor, process.env.TRIGGERING_ACTOR])) {
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({ owner, repo, username });
              if (!['admin', 'maintain', 'write'].includes(data.permission)) {
                core.notice('Copse reviews require a caller with repository write permission.');
                return;
              }
            }
            const number = Number(process.env.MANUAL_PR);
            if (!Number.isSafeInteger(number) || number < 1) throw new Error('A valid PR number is required');
            const { data: pull } = await github.rest.pulls.get({ owner, repo, pull_number: number });
            if (pull.head.repo?.id !== repository.id) {
              core.notice('Copse reviews support same-repository PRs only; fork PRs are not supported.');
              return;
            }
            if (copse && (repository.id !== 1274237362 || pull.user?.id !== 338988 ||
                pull.head.repo?.id !== 1274237362)) return;
            const labels = pull.labels.map(label => label.name);
            if (pull.state !== 'open' || pull.base.repo.id !== repository.id ||
                pull.base.ref !== repository.default_branch || labels.includes('copse-review-skip') ||
                (pull.draft && !labels.includes('copse-review'))) return;
            if (!/^[0-9a-f]{40}$/.test(pull.head.sha) || !/^[0-9a-f]{40}$/.test(pull.base.sha)) {
              throw new Error('GitHub returned an invalid commit SHA');
            }
            core.setOutput('request', JSON.stringify({
              repository: `${owner}/${repo}`, pr: number, head: pull.head.sha, base: pull.base.sha,
            }));

  ground:
    needs: authorize
    if: ${{ needs.authorize.outputs.request != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # No model/App secrets are referenced or passed to this job. All project
    # commands execute inside network-disabled containers, never on this host.
    permissions: {}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          repository: copse-dev/agent-pane
          ref: ${{ inputs.reviewer-ref }}
          path: .copse-reviewer
          persist-credentials: false
      - name: Select the pinned reviewer Node version
        run: cp .copse-reviewer/.nvmrc .nvmrc
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: ./.copse-reviewer/.github/actions/review-ground
        with:
          request: ${{ needs.authorize.outputs.request }}
          preparation: ${{ inputs.preparation }}

  findings:
    if: ${{ inputs.preparation == 'npm' }}
    needs: [authorize, ground]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          repository: copse-dev/agent-pane
          ref: ${{ inputs.reviewer-ref }}
          path: .copse-reviewer
          persist-credentials: false
      - name: Select the pinned reviewer Node version
        run: cp .copse-reviewer/.nvmrc .nvmrc
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: ./.copse-reviewer/.github/actions/review-findings
        with:
          request: ${{ needs.authorize.outputs.request }}
          preparation: ${{ inputs.preparation }}
          model-api-key: ${{ secrets.model-api-key }}
          provider: ${{ inputs.provider }}
          model: ${{ inputs.model }}
          lenses: ${{ inputs.lenses }}
          max-steps: ${{ inputs.max-steps }}
          max-verify: ${{ inputs.max-verify }}
          post-summary: ${{ inputs['post-summary'] && 'true' || 'false' }}
          app-id: ${{ secrets.app-id }}
          app-private-key: ${{ secrets.app-private-key }}
          github-token: ${{ github.token }}

  copse-findings:
    if: ${{ inputs.preparation == 'copse-pnpm' && github.event_name == 'workflow_dispatch' && github.repository_id == '1274237362' && github.actor_id == '338988' && github.triggering_actor == 'jonathanKingston' && github.ref == 'refs/heads/main' && github.workflow_ref == 'copse-dev/agent-pane/.github/workflows/review-trigger.yml@refs/heads/main' }}
    needs: [authorize, ground]
    environment: copse-review-models
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          repository: copse-dev/agent-pane
          ref: ${{ inputs.reviewer-ref }}
          path: .copse-reviewer
          persist-credentials: false
      - name: Select the pinned reviewer Node version
        run: cp .copse-reviewer/.nvmrc .nvmrc
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: ./.copse-reviewer/.github/actions/review-findings
        with:
          request: ${{ needs.authorize.outputs.request }}
          preparation: copse-pnpm
          profile: ${{ vars.COPSE_REVIEW_PR_PROFILE || 'openrouter-luna' }}
          model-api-key: ${{ secrets.COPSE_REVIEW_API_KEY || secrets.SCW_GENERATIVE_API_KEY }}
          openrouter-api-key: ${{ secrets.COPSE_REVIEW_OPENROUTER_API_KEY }}
          openrouter-provider: ${{ vars.COPSE_REVIEW_OPENROUTER_PROVIDER || 'openai' }}
          scaleway-project-id: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          provider: ${{ vars.COPSE_REVIEW_PROVIDER || 'openai-compatible' }}
          model: ${{ vars.COPSE_REVIEW_MODEL || 'qwen3.8-27b' }}
          base-url: ${{ vars.COPSE_REVIEW_BASE_URL || vars.SCW_GENERATIVE_API_URL || 'https://api.scaleway.ai/v1' }}
          lenses: ${{ vars.COPSE_REVIEW_LENSES || 'correctness,visual' }}
          max-steps: ${{ vars.COPSE_REVIEW_MAX_STEPS || '12' }}
          max-verify: ${{ vars.COPSE_REVIEW_MAX_VERIFY || '3' }}
          verify-concurrency: ${{ vars.COPSE_REVIEW_VERIFY_CONCURRENCY || '2' }}
          feedback-label: ${{ vars.COPSE_REVIEW_FEEDBACK_LABEL || 'review-has-feedback' }}
          post-summary: 'true'
          app-id: ${{ secrets.RELEASE_APP_ID }}
          app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          github-token: ${{ github.token }}
