name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: actions/setup-node@v6
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1
          if-no-files-found: error

  e2e:
    needs: check
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # Split the seeded e2e suite (see wdio.ci.conf.ts) into parallel shards so the
    # whole gate finishes well inside the runner window. Each shard runs a disjoint
    # slice of specs via wdio's `--shard current/total`.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      SHARD_TOTAL: 4
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: actions/setup-node@v6
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      # The Electron/Chromedriver e2e session occasionally fails to start on the
      # runner ("DevToolsActivePort file doesn't exist" / "POST /session" timeout).
      # The hang wedges the whole wdio run, so in-process retries don't recover —
      # only a fresh xvfb+Electron launch does. Retry the entire shard instead.
      - name: e2e shard ${{ matrix.shard }}/${{ env.SHARD_TOTAL }} (retry on flaky session startup)
        run: |
          for attempt in 1 2 3; do
            echo "::group::e2e shard ${{ matrix.shard }} attempt $attempt"
            if npm run test:e2e:ci -- --shard ${{ matrix.shard }}/${{ env.SHARD_TOTAL }}; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "e2e shard ${{ matrix.shard }} attempt $attempt failed"
          done
          exit 1
