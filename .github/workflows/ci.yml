name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: actions/setup-node@v6
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check:dead-code
      # Unit suite under c8 + coverage-baseline.json ratchet (replaces the
      # separate coverage job — same tests, no duplicate npm test run).
      - run: npm run coverage:ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/lcov-report
          if-no-files-found: ignore
      # Differentially validate the JS CommonMark normalizer against the
      # reference normalize.py. The script fetches normalize.py from a pinned,
      # hash-verified upstream commit (not checked in) and runs the diff with
      # python3 (preinstalled on the runner).
      - run: npm run check:normalizer-parity
      - run: npm run build

  e2e:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # Split the seeded e2e suite (see wdio.ci.conf.ts) into parallel shards so the
    # whole gate finishes well inside the runner window. Each shard runs a disjoint
    # slice of specs via wdio's `--shard current/total`. Each shard builds its own
    # `dist` (rather than sharing an artifact): the upload/download path dropped
    # some Monaco worker files, breaking specs that open the diff editor.
    #
    # Shard count tuned from 12 recent green CI runs (Jun 2026): 8 shards billed
    # ~18 min/run (8× ~42s setup overhead + tests); slowest e2e step p50 was 126s
    # (shard 1). 4 shards drops ~4 duplicate npm ci/build cycles (~13 min billed),
    # but packs ~8–9 specs into one sequential wdio process per shard, so a clean
    # run is ~280s — too close to the old 300s per-attempt cap for the whole-shard
    # retry below to recover a flaky spec. The per-attempt `timeout` is raised to
    # 480s (and the step cap to 26 min for 3 attempts) so attempt 1 finishes
    # instead of being SIGKILL'd mid-retry, letting attempt 2 relaunch a fresh
    # Electron and pass.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      SHARD_TOTAL: 4
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: actions/setup-node@v6
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: npm run build
      # The Electron/Chromedriver e2e session occasionally fails to start on the
      # runner ("DevToolsActivePort file doesn't exist" / "POST /session" timeout).
      # The hang wedges the whole wdio run, so in-process retries don't recover —
      # only a fresh xvfb+Electron launch does. Retry the entire shard, and wrap
      # each attempt in `timeout` so a wedged session is killed and retried
      # (a plain hang would otherwise never exit and stall the job).
      - name: e2e shard ${{ matrix.shard }}/${{ env.SHARD_TOTAL }} (retry on flaky session startup)
        timeout-minutes: 26
        run: |
          for attempt in 1 2 3; do
            echo "::group::e2e shard ${{ matrix.shard }} attempt $attempt"
            if timeout -k 15 480 npm run test:e2e:ci -- --shard ${{ matrix.shard }}/${{ env.SHARD_TOTAL }}; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "e2e shard ${{ matrix.shard }} attempt $attempt failed or timed out"
          done
          exit 1
