name: CI
on:
  push:
    branches: [main]
  # `labeled` is included so adding the `update-screenshots` label kicks a fresh
  # run on the PR head — plan-e2e then forces mode=full and commit-screenshots
  # refreshes the reference shots. Without it the label only takes effect on the
  # next push/sync, so a label-only request would never regenerate. (For
  # pull_request events GitHub reads these triggers from the BASE branch's
  # workflow, so this is only active once merged to main.)
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  # Nightly full e2e on GitHub-hosted runners — the comprehensive safety net.
  # PR/push runs are oracle-thinned on self-hosted (see the e2e job), so the
  # full suite is no longer guaranteed on every main push; this catches anything
  # a partial map missed, within a day. Off-:00 minute to avoid the cron stampede.
  schedule:
    - cron: '17 6 * * *'

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Check-tier runner routing: every `runs-on` below (except e2e, which routes
  # by label with its own nightly-hosted exception, and release-mac in its own
  # workflow) reads the CHECKS_RUNNER Actions variable and falls back to
  # GitHub-hosted when it is unset or empty:
  #   CHECKS_RUNNER=copse-checks  ->  the org self-hosted check fleet (ci-runners/)
  #   (unset or '')               ->  ubuntu-latest
  # This replaces the old `pick-runner` probe job, which burned a billed
  # GitHub-hosted minute on EVERY run (a 3-second API probe rounds up to a full
  # minute) just to make this decision — and quietly routed the whole check
  # tier to paid hosted runners whenever its PAT lacked org runner read. A
  # variable costs nothing, needs no PAT, and is flipped by hand when the
  # fleet comes up or goes down:
  #   gh variable set CHECKS_RUNNER --org copse-dev --body copse-checks --visibility all
  #   gh variable delete CHECKS_RUNNER --org copse-dev
  # (or Settings -> Secrets and variables -> Actions -> Variables; a repo-level
  # CHECKS_RUNNER overrides the org one, and an empty value means hosted).
  #
  # Tradeoff vs the probe: nothing auto-detects the fleet going offline. If the
  # variable names a fleet with no online runner, routed jobs queue until a
  # runner returns or the variable is cleared — clear it when taking the fleet
  # down. Fork PRs run only the `precheck` safe tier, forced onto a GitHub-hosted
  # runner with a read-only token. Every heavier job that executes repository
  # code keeps its same-repo `if` guard, so untrusted commits never run on the
  # self-hosted fleet.

  # Cheap static gate + e2e planning. Runs the fast static checks (typecheck,
  # lint, format, dead-code, oracle liveness) AND computes the e2e oracle plan in
  # a single job. Everything expensive — coverage, build, e2e — hangs off this
  # via `needs: precheck`, so a typo, lint error, or bad format short-circuits
  # the pipeline before it burns runner minutes on the build + e2e shards.
  # Folding the former standalone `plan-e2e` job in here drops a duplicate
  # checkout + node setup (and its rounded-up billed minute) from every run.
  precheck:
    # Fork code gets a deliberately small, read-only check tier on an ephemeral
    # GitHub-hosted runner. Same-repo work can use the configured check fleet.
    runs-on: >-
      ${{ github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository &&
          'ubuntu-latest' || vars.CHECKS_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
    # Consumed by the e2e job: how much of the e2e tier this run needs (mode/
    # specs), and the runner-dependent shard fan-out (e2e_shards / shard_total).
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      specs: ${{ steps.plan.outputs.specs }}
      e2e_shards: ${{ steps.shards.outputs.list }}
      e2e_shard_total: ${{ steps.shards.outputs.total }}
    steps:
      # fetch-depth: 0 so the e2e oracle (plan step) can diff against the PR base
      # / previous main tip.
      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
          # Do not leave even the read-only GITHUB_TOKEN in a fork checkout.
          # Same-repo runs keep credentials for the oracle's base ref fetches.
          persist-credentials: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - uses: ./.github/actions/setup
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check:dead-code
      # Guard the e2e oracle that gates the `e2e` job: every spec must stay
      # selectable (liveness) and the mapping invariants must hold, so the gate
      # can't silently start skipping specs it should run.
      - run: npm run check:oracle
      # Test oracle (scripts/test-oracle.mts) decides how much of the e2e tier
      # this run needs. On a pull_request it maps the diff (vs the PR base) to the
      # specs it can affect; on a push to main it maps vs the previous main
      # commit. The nightly `schedule` always runs the full suite. The output
      # drives the `e2e` job below:
      #   mode=full    → all 8 shards run the whole CI suite
      #   mode=subset  → only the listed specs run, distributed across the shards
      #   mode=skip    → nothing e2e-relevant changed; shards report green, no run
      # subset is used only for confident, UI-coupled diffs; LOW-confidence
      # (backend logic with no selector coupling) and broad changes fall back to
      # full. Full coverage on every push is no longer guaranteed — the nightly
      # is the net.
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          # PR base on pull_request; previous-tip on push. Empty for schedule.
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          # Real PR head commit (not the merge ref this job checks out), used to
          # detect the commit-screenshots auto-commit.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # `update-screenshots` forces a full e2e run so every reference shot is
          # re-rendered and the commit-screenshots job can refresh it, even when
          # the oracle would otherwise thin (subset) or skip the suite.
          UPDATE_SCREENSHOTS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'update-screenshots') }}
        run: |
          if [ "$EVENT" = "schedule" ]; then
            echo "Nightly schedule -> full e2e suite"
            { echo "mode=full"; echo "specs="; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Screenshot-only head commit -> skip e2e. This is the commit-screenshots
          # auto-commit (now PAT-pushed, so it triggers its own CI run): its parent
          # already ran e2e, and it adds only reference PNGs, so re-running the suite
          # would just re-render identical shots. Skipping keeps `ci-passed` reporting
          # on the new head (lint/check/build still run) without paying for e2e twice.
          #
          # This MUST stay ahead of the update-screenshots label check below.
          # Otherwise the label forces a full run on the bot's OWN screenshot
          # commit; because rendering isn't pixel-deterministic that run commits a
          # few more shots, which (PAT-pushed) re-triggers CI, forces full again,
          # and loops indefinitely. Skipping screenshot-only commits first breaks
          # the cycle while still letting a real code commit + label force a full
          # render (a code commit isn't screenshot-only, so it falls through).
          if [ -n "$HEAD_SHA" ]; then
            changed="$(git diff --name-only "${HEAD_SHA}^" "${HEAD_SHA}" 2>/dev/null || true)"
            if [ -n "$changed" ] && ! printf '%s\n' "$changed" | grep -qv '^tests/e2e/screenshots/'; then
              echo "HEAD commit only refreshes reference screenshots -> skip e2e"
              { echo "mode=skip"; echo "specs="; } >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          if [ "$UPDATE_SCREENSHOTS_LABEL" = "true" ]; then
            echo "update-screenshots label -> full e2e suite (force screenshot refresh)"
            { echo "mode=full"; echo "specs="; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # No usable base (first push / forced push / branch create) -> full.
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "No base sha for $EVENT -> full e2e suite"
            { echo "mode=full"; echo "specs="; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # full clone already has base history; this is belt-and-suspenders.
          git fetch --no-tags --depth=1 origin "$BASE_SHA" 2>/dev/null || true
          node scripts/test-oracle.mts --plan --base "$BASE_SHA" | tee plan.txt
          grep -E '^(mode|specs)=' plan.txt >> "$GITHUB_OUTPUT"
          { echo '### e2e oracle plan'; echo '```'; cat plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # Advisory: annotate which reference shots a UI change will refresh. Stale
      # shots DON'T block the PR — the `e2e` job below already re-renders them as a
      # side effect of the gate run, and the `commit-screenshots` job auto-commits
      # the diff. Pure static analysis — no build, no Electron, no e2e rerun.
      # PR-only: no label exists for push/schedule.
      - name: Plan reference-screenshot regeneration
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          UPDATE_SCREENSHOTS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'update-screenshots') }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA" 2>/dev/null || true
          node scripts/check-screenshots.mts --plan --base "$BASE_SHA"
      # e2e shard fan-out is runner-dependent. The GitHub-hosted nightly keeps 8
      # shards to stay under the 2-core/7GB OOM ceiling (see the e2e job comment).
      # PR/push runs on the self-hosted Linux Docker `copse-e2e` fleet (see #422),
      # where 8 shards just means paying the (mostly-cached but non-trivial, and
      # occasionally cold) dep restore + Electron setup up to 8× across the fleet.
      # Fewer, larger shards there cut that repeated setup without duplicating any
      # spec: wdio `--shard current/total` and the `subset` round-robin both
      # partition the specs disjointly, so a lower total just makes each slice
      # bigger. Tune the self-hosted count below to your fleet size.
      - id: shards
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "schedule" ]; then
            { echo "total=8"; echo "list=[1,2,3,4,5,6,7,8]"; } >> "$GITHUB_OUTPUT"
          else
            { echo "total=3"; echo "list=[1,2,3]"; } >> "$GITHUB_OUTPUT"
          fi

  # Auto-fix the PR branch: run every autofix we have — ESLint `--fix` then
  # Prettier `--write` — and commit the result back onto the head branch. This
  # is the "fixer" half of the format gate; `precheck` still runs `lint` +
  # `format:check` as the "gate" half, which stays honest when this job is off
  # (no PAT) or can't run (fork PR).
  #
  # A SEPARATE job rather than folded into `precheck`: precheck checks out the
  # merge ref (fetch-depth: 0) so the e2e oracle can diff against base, whereas
  # committing needs the branch (head_ref) checkout — the same split that keeps
  # `commit-screenshots` its own job. Prettier runs last so it tidies whatever
  # ESLint rewrote; `eslint-config-prettier` means the two never fight.
  #
  # Pushed with SCREENSHOTS_PAT (reused) rather than the default GITHUB_TOKEN:
  # GitHub won't start a run for a GITHUB_TOKEN push (recursion guard), so a
  # token-pushed format commit would land as the PR head with no CI and leave
  # the PR blocked. The PAT push fires `pull_request: synchronize`, and the
  # top-level `concurrency: cancel-in-progress` supersedes THIS run with one on
  # the formatted commit — so build/e2e aren't paid for twice. It terminates in
  # one extra run: the re-triggered run reformats nothing (idempotent), so this
  # job finds no diff and pushes nothing. Falls back to github.token when the
  # secret is unset (commit lands, just no CI re-trigger — pre-PAT behaviour).
  autoformat:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ vars.CHECKS_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.SCREENSHOTS_PAT || github.token }}
      - uses: ./.github/actions/setup
      # `|| true`: a non-autofixable lint error must not abort the run — we still
      # want the fixes ESLint did apply to land. Real lint failures stay the job
      # of precheck's `lint` gate, not this fixer.
      - name: ESLint --fix
        run: npx eslint . --fix || true
      - name: Prettier --write
        run: npm run format
      - name: Commit and push fixes
        run: |
          if git diff --quiet; then
            echo "No formatting changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "style: apply eslint --fix and prettier"
          git push

  check:
    needs: precheck
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ vars.CHECKS_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: ./.github/actions/setup
      # Unit suite under c8 + coverage-baseline.json ratchet (replaces the
      # separate coverage job — same tests, no duplicate npm test run).
      - run: npm run coverage:ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/lcov-report
          if-no-files-found: ignore
      # The CommonMark normalizer-parity check now lives in the extracted
      # @copse/streaming-markdown repo's CI (copse-dev/streaming-markdown).
      # The build is validated once in the dedicated `build` job below (whose
      # dist artifact the e2e shards reuse), so it no longer runs here.

  # Retrieval-quality gate for the semantic-search backend. This job indexes the
  # repo and runs the fixture query set, asserting recall@k and search latency
  # stay within the committed thresholds. A drop in ranking quality (or a gortex
  # CLI/JSON change that breaks parsing) fails here rather than silently
  # degrading in-app search.
  bench:
    needs: precheck
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ vars.CHECKS_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: ./.github/actions/setup
      # Guarantee the gortex binary independently of the setup action. On a
      # self-hosted runner whose baked image predates gortex, the baked-deps seed
      # sets seeded=true (so npm ci + its postinstall fetch are skipped) yet the
      # baked layer has no vendor/gortex to copy — leaving the binary absent.
      # fetch-gortex is idempotent: a no-op when the (checksum-verified) binary is
      # already present, a download when it isn't.
      - run: node scripts/fetch-gortex.mts
      # The floor is a breakage detector, not a target: a gortex CLI/JSON change
      # that breaks parsing craters recall to ~0, and that's the main thing this
      # catches. Recall is deterministic per corpus (~81% observed on 16 fixture
      # queries), but unrelated PRs that add files shift rankings by a query or
      # two, so the 0.65 floor leaves headroom to avoid flaking those builds. The
      # p95 ceiling is generous vs the ~130ms observed locally (CI is slower, the
      # daemon starts cold). Tighten either once the fixture set is larger.
      - run: >-
          node scripts/semantic-search-bench.mts --backend gortex --gate
          --min-recall 0.65 --max-p95-ms 3000 --json bench-semantic.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-semantic
          path: bench-semantic.json
          if-no-files-found: ignore
      # Agent bench harness self-test (#752): the deterministic mock run drives
      # run-agent-loop headlessly end-to-end (directive tool call → workspace
      # write → grading) and the --gate ratchet compares solve rate and
      # tokens-per-solve against benchmarks/bench-baseline.json. No model, ~30s.
      - run: npm run bench:agent -- --mock --gate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-agent-mock
          path: bench-results/
          if-no-files-found: ignore

  # Real-model agent benchmark (#752): the SWE-bench Verified pinned subset
  # driven by a local model on a self-hosted runner with an LM Studio host.
  # Runs nightly (schedule) or on demand via the `bench-agent` PR label, and
  # only when the LM_EVAL_RUNNER repo variable names a runner. Deliberately
  # OUT of the ci-passed critical path (docs/testing-strategy.md): slow,
  # non-deterministic trend data, not a merge gate.
  bench-agent-model:
    needs: precheck
    if: >-
      vars.LM_EVAL_RUNNER != '' &&
      (github.event_name == 'schedule' ||
       contains(github.event.pull_request.labels.*.name, 'bench-agent'))
    runs-on: ${{ vars.LM_EVAL_RUNNER }}
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: ./.github/actions/setup
      # Resolve the pinned instance ids into task files (network required).
      - run: npm run bench:swe-tasks
      - env:
          LM_STUDIO_URL: ${{ vars.LM_STUDIO_URL }}
          LM_STUDIO_MODEL: ${{ vars.LM_STUDIO_MODEL }}
          LM_STUDIO_API_KEY: ${{ secrets.LM_STUDIO_API_KEY }}
        run: npm run bench:agent -- --tasks benchmarks/tasks/swe-bench --gate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-agent-model
          path: bench-results/
          if-no-files-found: ignore

  build:
    needs: precheck
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ vars.CHECKS_RUNNER || 'ubuntu-latest' }}
    # Build dist once and hand it to every e2e shard. Previously each shard ran
    # its own `npm run build`; an earlier attempt to share dist via upload/
    # download dropped some Monaco worker files, breaking specs that open the
    # diff editor. Packing dist into a single tar before upload preserves the
    # full tree (worker files, nested dirs, exec bits) verbatim, so the shards
    # get a byte-identical dist without each rebuilding it.
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: ./.github/actions/setup
      - run: npm run build
      - run: tar -cf dist.tar dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-tar
          path: dist.tar
          if-no-files-found: error
          retention-days: 1

  e2e:
    needs: [build, precheck]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # PR/push e2e runs on the self-hosted Docker runners (see ci-runners/):
    # free minutes, and a box big enough to avoid the 2-core/7GB hosted-runner
    # OOM that most of the shard quarantines exist to work around. The nightly
    # `schedule` runs the full suite on GitHub-hosted ubuntu-latest.
    #
    # Runner is picked by TRUST and fails closed. The label set requires BOTH
    # `self-hosted` AND `copse-e2e`, so trusted push/same-repo PR jobs land only
    # on the Linux Docker runners (never the macOS `self-hosted` boxes, which
    # lack `copse-e2e`). Nightly `schedule` uses GitHub-hosted ubuntu-latest.
    # Fork PRs are skipped by the `if` guard above and must never run on any
    # runner — there is no hosted fallback; if that guard were ever removed, the
    # expression below evaluates to a falsy value (not a runner label) so the
    # job fails closed instead of dispatching untrusted code anywhere. NOTE:
    # requires a registered `copse-e2e` runner or PR/push e2e queues forever.
    runs-on: >-
      ${{ github.event_name == 'schedule' && fromJSON('["ubuntu-latest"]') ||
          ((github.event_name == 'push' ||
            (github.event_name == 'pull_request' &&
             github.event.pull_request.head.repo.full_name == github.repository))
           && fromJSON('["self-hosted", "copse-e2e"]')) }}
    # Split the seeded e2e suite (see wdio.ci.conf.ts) into parallel shards so the
    # whole gate finishes well inside the runner window. Each shard runs a disjoint
    # slice of specs via wdio's `--shard current/total`. The shared `dist` artifact
    # from the `build` job is unpacked here rather than rebuilt per shard.
    #
    # Shard count is runner-dependent (computed by the precheck `shards` step):
    #   - hosted nightly: 8. Each shard runs its slice as one sequential wdio
    #     process, relaunching Electron per spec. On the 2-core/7GB runner, once a
    #     shard runs too many specs the accumulated electron/gortex processes
    #     exhaust it and a later spec's Electron fails to boot or OOM-crashes the
    #     runner ("shutdown signal"). #339's data showed 8 stays under that limit
    #     even in the densest spec range.
    #   - self-hosted PR/push: 3. These run on the Linux Docker `copse-e2e`
    #     runners (see #422), which have the headroom 8 was protecting against, so
    #     the only thing 8 buys there is paying dep restore + Electron setup up to
    #     8× across the fleet. Fewer, larger shards cut that repeated (and
    #     sometimes cold) setup — the dominant wall-clock cost — without
    #     duplicating any spec. Tune to the `copse-e2e` runner count.
    # The per-attempt `timeout` is 480s (step cap 26 min for 3 attempts) so attempt
    # 1 finishes instead of being SIGKILL'd mid-retry, letting attempt 2 relaunch.
    strategy:
      # Fail fast: the first shard to go red cancels the rest. On the self-hosted
      # fleet a failure is usually a whole-run problem (a poisoned dep cache, a
      # broken commit, a runner-env issue) that every shard would hit anyway, so
      # cancelling the siblings frees the box instead of grinding them all through
      # their retry budget. Tradeoff: you see the first failing shard, not every
      # failing shard, in one run.
      fail-fast: true
      matrix:
        shard: ${{ fromJSON(needs.precheck.outputs.e2e_shards) }}
    env:
      SHARD_TOTAL: ${{ needs.precheck.outputs.e2e_shard_total }}
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: ./.github/actions/setup
      # Reclaim ~20-30 GB of runner-preloaded toolchains (dotnet/android/ghc/
      # CodeQL/swift) and cached Docker images. The e2e shards have hit "No space
      # left on device" mid-run, which cascades into OOM / runner-shutdown and
      # Electron session-startup failures; freeing space up front removes that
      # whole failure class. Best-effort — never fail the job on cleanup. Only on
      # GitHub-hosted runners (the nightly) — never rm system dirs on a
      # self-hosted box.
      - name: Free disk space
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/boost || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /
      - uses: actions/download-artifact@v4
        with:
          name: dist-tar
      - run: tar -xf dist.tar
      # The Electron/Chromedriver e2e session occasionally fails to start on the
      # runner ("DevToolsActivePort file doesn't exist" / "POST /session" timeout).
      # The hang wedges the whole wdio run, so in-process retries don't recover —
      # only a fresh xvfb+Electron launch does. Retry the entire shard, and wrap
      # each attempt in `timeout` so a wedged session is killed and retried
      # (a plain hang would otherwise never exit and stall the job).
      # Oracle gate (see the precheck job's plan step): `full` shards the whole
      # suite; `subset` distributes only the planned specs round-robin across the
      # same 8 shards (so no shard exceeds the per-shard memory budget the count
      # is tuned for); `skip` runs nothing. Every shard still reports a status, so
      # this composes with any required check without depending on an aggregate
      # gate first.
      - name: e2e shard ${{ matrix.shard }}/${{ env.SHARD_TOTAL }} (oracle-gated, retry on flaky session startup)
        if: >-
          needs.precheck.outputs.mode == 'full' ||
          needs.precheck.outputs.mode == 'subset'
        timeout-minutes: 26
        env:
          PLAN_MODE: ${{ needs.precheck.outputs.mode }}
          PLAN_SPECS: ${{ needs.precheck.outputs.specs }}
        run: |
          if [ "$PLAN_MODE" = "subset" ]; then
            # Round-robin the planned specs onto this shard; an empty slice means
            # this shard has nothing to do (subset smaller than 8) — report green.
            i=0
            SPEC_ARGS=""
            for s in $PLAN_SPECS; do
              if [ $(( i % SHARD_TOTAL )) -eq $(( ${{ matrix.shard }} - 1 )) ]; then
                SPEC_ARGS="$SPEC_ARGS --spec $s"
              fi
              i=$(( i + 1 ))
            done
            if [ -z "$SPEC_ARGS" ]; then
              echo "shard ${{ matrix.shard }}: no specs in this subset slice — nothing to run"
              exit 0
            fi
            SHARD_ARGS=""
            echo "oracle subset shard ${{ matrix.shard }}:${SPEC_ARGS}"
          else
            SHARD_ARGS="--shard ${{ matrix.shard }}/${{ env.SHARD_TOTAL }}"
            SPEC_ARGS=""
          fi
          # `timeout` is GNU coreutils — present on Linux, but on macOS it's
          # `gtimeout` (from `brew install coreutils`). Pick whichever exists;
          # fall back to no inner timeout (the step `timeout-minutes` still caps
          # a wedged run) so the command can't die with "timeout: not found".
          TIMEOUT="$(command -v timeout || command -v gtimeout || true)"
          for attempt in 1 2 3; do
            echo "::group::e2e shard ${{ matrix.shard }} attempt $attempt"
            if ${TIMEOUT:+$TIMEOUT -k 15 480} npm run test:e2e:ci -- $SHARD_ARGS $SPEC_ARGS; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "e2e shard ${{ matrix.shard }} attempt $attempt failed or timed out"
          done
          exit 1
      # The specs above call saveScreenshot as they run, so this shard's slice has
      # already re-rendered its reference PNGs into tests/e2e/screenshots/. Collect
      # whatever changed (vs the committed shots) and hand it to commit-screenshots
      # — no second e2e suite needed. PR-only; the sentinel keeps the artifact
      # non-empty when a shard rendered no diffs.
      - name: Collect changed reference screenshots
        if: success() && github.event_name == 'pull_request'
        run: |
          mkdir -p changed/tests/e2e/screenshots
          touch "changed/.shard-${{ matrix.shard }}"
          # Untracked PNGs are first-time reference shots from a new spec —
          # without ls-files --others they would never reach commit-screenshots
          # (filter-screenshots.mts already classifies untracked files).
          mapfile -t files < <(
            {
              git diff --name-only -- tests/e2e/screenshots/
              git ls-files --others --exclude-standard -- tests/e2e/screenshots/
            } | sort -u
          )
          for f in "${files[@]}"; do
            [ -n "$f" ] || continue
            cp "$f" "changed/tests/e2e/screenshots/"
          done
          echo "Collected ${#files[@]} changed screenshot(s) for shard ${{ matrix.shard }}"
      - uses: actions/upload-artifact@v4
        if: success() && github.event_name == 'pull_request'
        with:
          name: screenshots-shard-${{ matrix.shard }}
          path: changed/
          include-hidden-files: true
          if-no-files-found: error
      # On failure, surface the screenshot + page source captured in afterTest so
      # the constrained-runner render/OOM flakes can be inspected. Skipped when a
      # hard runner OOM ("shutdown signal") kills the job before this step runs.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-failure-artifacts-shard-${{ matrix.shard }}
          path: e2e-failure-artifacts/
          if-no-files-found: ignore
          retention-days: 3

  # Auto-commit the reference screenshots the `e2e` gate already re-rendered.
  # Folds the old standalone e2e-screenshots workflow in here: rather than running
  # the whole seeded suite a SECOND time just to regenerate shots, we reuse the
  # PNGs the gate run produced (the specs write them as a side effect) and commit
  # the diff. One e2e run, not two. Same-repo PRs only (CI can't push to a fork
  # branch) and only after a green e2e run, so we never commit half-rendered shots.
  # Deliberately NOT in `ci-passed`'s needs: it's a side effect, not a gate.
  #
  # Write policy — UNCONTESTED SHOTS ONLY. A rendered shot is auto-committed only
  # when nothing contests the write: the baseline was inherited from main (or is
  # brand new) and neither this branch (by a non-bot author) nor main has touched
  # it since the merge-base. A shot someone deliberately committed on the branch,
  # or that main moved under the PR, is HELD — the branch's committed version
  # always wins — and surfaced in the PR comment with a base-vs-branch image
  # comparison. Adding the `update-screenshots` label is the explicit
  # "regenerate and take CI's render" override. (filter-screenshots.mts decides.)
  #
  # It also reconciles screenshot conflicts: if main re-rendered the same reference
  # PNG, that binary file can't 3-way merge and the PR goes `dirty`. The reconcile
  # step merges main, keeping the freshly re-rendered shots for any screenshot-path
  # conflict (regenerated PNGs have no meaningful merge). Source-code conflicts are
  # NEVER auto-resolved — they abort the merge and get a "needs a human" PR comment.
  #
  # The checkout uses a PAT (secrets.SCREENSHOTS_PAT) rather than the default
  # GITHUB_TOKEN: GitHub will not start a new workflow run for a commit pushed with
  # GITHUB_TOKEN (recursion guard), so a token-pushed screenshot commit would land
  # as the PR head with no CI run and no `ci-passed` status — leaving the PR blocked
  # and auto-merge stuck. Pushing with a PAT makes the commit trigger CI normally so
  # `ci-passed` reports on the new head. That re-run is cheap: plan-e2e skips the
  # e2e tier for a screenshot-only commit (see its `mode=skip` shortcut). Falls back
  # to github.token when the secret is unset — commits still land, just without the
  # CI re-trigger (the pre-PAT behaviour).
  commit-screenshots:
    needs: e2e
    if: >-
      always() && needs.e2e.result == 'success' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ vars.CHECKS_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.SCREENSHOTS_PAT || github.token }}
      - name: Download regenerated screenshots
        uses: actions/download-artifact@v4
        with:
          pattern: screenshots-shard-*
          merge-multiple: true
          path: artifacts
      - name: Apply regenerated screenshots
        run: |
          if compgen -G "artifacts/tests/e2e/screenshots/*" > /dev/null; then
            cp -f artifacts/tests/e2e/screenshots/* tests/e2e/screenshots/
          fi
      # Drop sub-threshold render noise before staging, and hold contested shots. A
      # re-render of an unchanged screen still wobbles a few pixels (font hinting /
      # anti-alias), and committing that churns the reference shots for nothing.
      # filter-screenshots.mts pixel-compares each changed PNG against its committed
      # baseline and reverts the ones whose difference is below the noise threshold
      # (clearly-different shots stay). It also reverts CONTESTED shots — a baseline
      # deliberately committed on this branch by a non-bot author, or moved on main
      # since the merge-base — so CI never overrides deliberate work (see the job
      # comment above). The reverted shots are reported back so the comment step can
      # offer them for manual review. Needs Node + pixelmatch/pngjs only — install
      # just those two into node_modules (an isolated, scripts-off install, ~0.3s)
      # rather than a full `npm ci`; this job otherwise needs no dependency tree.
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Filter sub-threshold screenshot noise
        id: filter
        env:
          UPDATE_SCREENSHOTS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'update-screenshots') }}
        run: |
          # The contested check compares against origin/main (merge-base, branch
          # authorship, main-side changes). fetch-depth: 0 above usually brings it
          # in already; fetch explicitly so a partial mirror can't silently
          # disable the check. Best-effort: on failure the filter degrades to
          # noise/flap-only (merge-base comes back empty), it doesn't clobber.
          git fetch --no-tags origin main || true
          npm install --no-save --no-audit --no-fund --ignore-scripts \
            --prefix /tmp/ssfilter pixelmatch pngjs
          # `node_modules` is committed as a symlink, so a bare `mkdir -p` errors
          # with "File exists". Drop it first so the copied deps resolve from a
          # real directory. (This job only commits screenshots, so removing the
          # symlink has no other effect.)
          rm -rf node_modules
          mkdir -p node_modules
          cp -r /tmp/ssfilter/node_modules/. node_modules/
          node scripts/filter-screenshots.mts
      - name: Detect screenshot changes
        id: diff
        run: |
          mapfile -t files < <(git diff --name-only -- tests/e2e/screenshots/)
          if [ ${#files[@]} -eq 0 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          {
            echo "files<<EOF"
            printf '%s\n' "${files[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Commit screenshot updates
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/screenshots/
          # No [skip ci]: let the pushed commit run CI so `ci-passed` reports on
          # the new HEAD — otherwise the PR sits `blocked` with no status on this
          # commit. It terminates in one extra run: a PNG-only diff makes the oracle
          # skip the e2e tier, so CI re-runs only lint/check/build, renders nothing,
          # and this job finds no further screenshots to commit.
          git commit -m "chore(e2e): update reference screenshots from CI"
      # Clear screenshot conflicts against main. A reference PNG re-rendered on BOTH
      # main and this PR is a binary file git can't merge, so the PR goes `dirty`
      # and STAYS that way: the render commit above only updates the head branch, it
      # never incorporates main, so head's PNG keeps conflicting with main's PNG.
      # Bring main in here so the conflict actually resolves. Generated PNGs have no
      # meaningful 3-way merge — for any screenshot-path conflict we keep the head
      # branch's version (--ours). Because the filter step above already reverted
      # contested renders, --ours here means: the fresh render for uncontested
      # shots, and the branch's deliberately COMMITTED shot for contested ones —
      # the branch always wins, but CI's render never displaces deliberate work.
      # We NEVER auto-resolve source code:
      # if anything outside tests/e2e/screenshots/ conflicts, abort and leave it to
      # a human (the `manual` output drives a PR comment below).
      #
      # The probe merge is --no-commit so a conflict-free PR is left byte-identical
      # — no needless merge commit baked onto a tidy branch, only onto one that was
      # genuinely conflicting. Runs regardless of the render diff above: a conflict
      # can exist even when this run re-rendered nothing new (the noise filter may
      # have reverted the wobble), so gating on `changed` would miss it.
      - name: Reconcile reference screenshots with main
        id: reconcile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin main
          if git merge --no-commit --no-ff origin/main; then
            # Clean (or already up to date) — don't bake a merge commit onto an
            # otherwise-tidy PR. --abort is a no-op / harmless when no merge started.
            git merge --abort 2>/dev/null || true
            echo "main merges cleanly; nothing to reconcile"
            exit 0
          fi
          conflicts="$(git diff --name-only --diff-filter=U)"
          non_ss="$(printf '%s\n' "$conflicts" | grep -vE '^tests/e2e/screenshots/' || true)"
          if [ -n "$non_ss" ]; then
            echo "Source conflicts need manual resolution — not auto-resolving:"
            printf '%s\n' "$non_ss"
            {
              echo "manual=true"
              echo "manual-files<<EOF"
              printf '%s\n' "$non_ss"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            git merge --abort
            exit 0
          fi
          echo "Screenshot-only conflict — keeping the freshly re-rendered shots"
          git checkout --ours -- tests/e2e/screenshots/
          git add tests/e2e/screenshots/
          git commit --no-edit
      - name: Push
        id: push
        run: |
          # No-op ("Everything up-to-date") when nothing was committed or merged, so
          # this is safe to run unconditionally — even on the manual-merge path it
          # just pushes the render commit (the aborted merge left HEAD untouched).
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Comment on PR with updated screenshots
        # Post when real shots were committed, shots were ignored as noise (the
        # ignored list is offered for manual acceptance), shots were held as
        # flapping or contested, OR main couldn't be merged automatically because
        # source conflicts need a human.
        if: steps.diff.outputs.changed == 'true' || steps.filter.outputs.ignored-count != '0' || steps.filter.outputs.flapping-count != '0' || steps.filter.outputs.contested-count != '0' || steps.reconcile.outputs.manual == 'true'
        uses: actions/github-script@v7
        env:
          CHANGED_FILES: ${{ steps.diff.outputs.files }}
          COMMIT_SHA: ${{ steps.push.outputs.sha }}
          IGNORED_JSON: ${{ steps.filter.outputs.ignored-json }}
          FLAPPING_JSON: ${{ steps.filter.outputs.flapping-json }}
          CONTESTED_JSON: ${{ steps.filter.outputs.contested-json }}
          MAIN_SHA: ${{ steps.filter.outputs.main-sha }}
          MANUAL_MERGE_FILES: ${{ steps.reconcile.outputs.manual-files }}
        with:
          script: |
            const marker = '<!-- copse-e2e-screenshots -->';
            const sha = process.env.COMMIT_SHA || context.sha;
            const repo = context.repo.owner + '/' + context.repo.repo;
            const files = (process.env.CHANGED_FILES || '').split('\n').filter(Boolean);
            const ignored = JSON.parse(process.env.IGNORED_JSON || '[]');
            const flapping = JSON.parse(process.env.FLAPPING_JSON || '[]');
            const contested = JSON.parse(process.env.CONTESTED_JSON || '[]');
            const mainSha = process.env.MAIN_SHA || '';
            const manualMerge = (process.env.MANUAL_MERGE_FILES || '').split('\n').filter(Boolean);
            const blob = (ref, path) => `https://github.com/${repo}/blob/${ref}/${path}?raw=1`;
            const sections = [];
            if (manualMerge.length) {
              const lines = manualMerge.map((path) => `- \`${path}\``);
              sections.push(
                `### Merge conflict needs a human (${manualMerge.length})\n\n` +
                  `Screenshot conflicts with \`main\` are resolved automatically, but these ` +
                  `**non-screenshot** files conflict and can't be auto-merged. Resolve them by ` +
                  `hand (merge or rebase \`main\`) — the screenshot reconcile was skipped:\n\n` +
                  lines.join('\n'),
              );
            }
            if (contested.length) {
              // Everything shown here is already committed somewhere, so plain blob
              // URLs work: main's version at the main tip, the branch's standing
              // version at the pushed head. The held CI render itself is in no
              // commit — labelling regenerates and commits it, making it visible.
              const rows = contested.map((s) => {
                const why = [
                  s.branchTouched ? 'committed on this branch' : null,
                  s.mainTouched ? 'changed on `main`' : null,
                ].filter(Boolean).join('; ');
                const diff = s.diffPixels == null ? 'differs' : `${s.diffPixels} px (${s.ratioPct})`;
                const base = mainSha ? `![main](${blob(mainSha, s.path)})` : '—';
                return `| \`${s.name}\`<br>${why}<br>CI render: ${diff} vs committed | ${base} | ![branch](${blob(sha, s.path)}) |`;
              });
              sections.push(
                `### Held — conflicts with committed work (${contested.length})\n\n` +
                  `CI re-rendered these, but their committed baselines are deliberate, so the fresh ` +
                  `render was **not** committed — the branch's version stands. To regenerate and take ` +
                  `CI's render instead, add the \`update-screenshots\` label:\n\n` +
                  `| shot | \`main\` | this branch |\n| --- | --- | --- |\n` +
                  rows.join('\n'),
              );
            }
            if (files.length) {
              const lines = files.map((path) => {
                const name = path.split('/').pop();
                const url = `https://github.com/${repo}/blob/${sha}/${path}`;
                return `- [${name}](${url}) — ![${name}](${url}?raw=1)`;
              });
              sections.push(
                `### Refreshed (${files.length})\n\n` +
                  `Clearly-different shots re-rendered by the CI e2e run and committed:\n\n` +
                  lines.join('\n'),
              );
            }
            if (ignored.length) {
              const lines = ignored.map((s) => `- \`${s.name}\` — ${s.diffPixels} px (${s.ratioPct})`);
              sections.push(
                `### Ignored as render noise (${ignored.length})\n\n` +
                  `These re-rendered below the variance threshold (font hinting / anti-alias ` +
                  `wobble) and were **not** committed. To accept them anyway, add the ` +
                  `\`update-screenshots\` label or commit the rendered PNGs by hand:\n\n` +
                  lines.join('\n'),
              );
            }
            if (flapping.length) {
              // The matched prior state IS committed (that's what makes it a flap),
              // so it can be shown inline at its commit's blob URL.
              const lines = flapping.map((s) => {
                const matched = s.matchedSha
                  ? `; matches ${s.matchedSha.slice(0, 7)}: ![prior](${blob(s.matchedSha, s.path)})`
                  : '';
                return `- \`${s.name}\` — ${s.diffPixels} px (${s.ratioPct})${matched}`;
              });
              sections.push(
                `### Held — render flapping (${flapping.length})\n\n` +
                  `These shots alternate between two runner render states and were **not** ` +
                  `committed, to stop the CI screenshot ping-pong ([#609](https://github.com/${repo}/issues/609)): ` +
                  `each re-render matched a recently committed version, so committing again would ` +
                  `just re-trigger CI and bring the other state back. If a real change is hiding ` +
                  `here, add the \`update-screenshots\` label to force it, or pin the runner ` +
                  `font/GPU rendering:\n\n` +
                  lines.join('\n'),
              );
            }
            const body = [
              marker,
              '## E2E screenshot updates',
              '',
              sections.join('\n\n'),
              '',
              'These PNGs live under `tests/e2e/screenshots/` for human visual review; CI asserts DOM structure, not pixel diffs.',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(
              (c) =>
                c.user?.type === 'Bot' &&
                typeof c.body === 'string' &&
                c.body.includes(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  # Single aggregate gate. Require ONLY this check in branch protection: it
  # `needs` every other job (and e2e's result aggregates all 8 shards), so it
  # turns the whole pipeline into one green/red status. New jobs or e2e shard
  # counts can change without touching the required-checks list — just add the
  # job to `needs` here. `if: always()` so this runs even when an upstream job
  # fails/is skipped; we then assert none failed or were cancelled. Fork PRs
  # have their own explicit safe-tier result below: they may pass only after
  # `precheck` actually ran on a GitHub-hosted runner, never merely because all
  # code-executing jobs were skipped.
  ci-passed:
    name: CI Passed
    if: always()
    needs: [precheck, check, bench, build, e2e]
    runs-on: >-
      ${{ github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository &&
          'ubuntu-latest' || vars.CHECKS_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Check upstream job results
        run: |
          FORK_PR=${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          if $FORK_PR; then
            if [ "${{ needs.precheck.result }}" != "success" ]; then
              echo "Fork PR safe check tier was not executed successfully."
              echo '${{ toJSON(needs) }}'
              exit 1
            fi
            echo "Fork PR safe check tier passed; privileged jobs were intentionally skipped."
            exit 0
          fi
          MODE="${{ needs.precheck.outputs.mode }}"
          ANY_FAILURE=${{ contains(needs.*.result, 'failure') }}
          ANY_BAD=${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
          CORE_OK=${{ needs.precheck.result == 'success' }}
          # Skip-mode runs (screenshots-only pushes, e.g. the e2e screenshot
          # bot's own commits) intentionally do not execute check/build/e2e;
          # those jobs surface as 'cancelled', which must not fail the gate —
          # that painted every bot push red and blocked auto-merge (issue
          # #609). Genuine failures still fail even in skip mode.
          if [ "$MODE" = "skip" ]; then
            if $ANY_FAILURE || ! $CORE_OK; then
              echo "Skip-mode run has a genuine failure:"
              echo '${{ toJSON(needs) }}'
              exit 1
            fi
            echo "All CI jobs passed (heavy jobs intentionally skipped: mode=skip)."
            exit 0
          fi
          if $ANY_BAD; then
            echo "One or more CI jobs failed or were cancelled:"
            echo '${{ toJSON(needs) }}'
            exit 1
          fi
          echo "All CI jobs passed (or were intentionally skipped)."
