name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: actions/setup-node@v6
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      # The Electron/Chromedriver e2e session occasionally fails to start on the
      # runner ("DevToolsActivePort file doesn't exist" / "POST /session" timeout).
      # The hang wedges the whole wdio run, so in-process retries don't recover —
      # only a fresh xvfb+Electron launch does. Retry the entire command instead.
      - name: e2e smoke (retry on flaky session startup)
        run: |
          for attempt in 1 2 3; do
            echo "::group::e2e attempt $attempt"
            if npm run test:e2e:ci; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "e2e attempt $attempt failed"
          done
          exit 1
