name: CI
on:
  push:
    branches: [main]
  # `labeled` is included so adding the `update-screenshots` label kicks a fresh
  # run on the PR head — plan-e2e then forces mode=full and commit-screenshots
  # refreshes the reference shots. Without it the label only takes effect on the
  # next push/sync, so a label-only request would never regenerate. (For
  # pull_request events GitHub reads these triggers from the BASE branch's
  # workflow, so this is only active once merged to main.)
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  # Nightly full e2e on GitHub-hosted runners — the comprehensive safety net.
  # PR/push runs are oracle-thinned on self-hosted (see the e2e job), so the
  # full suite is no longer guaranteed on every main push; this catches anything
  # a partial map missed, within a day. Off-:00 minute to avoid the cron stampede.
  schedule:
    - cron: '17 6 * * *'

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap static gate (~no build, no tests). Everything expensive — coverage,
  # build, e2e — hangs off this via `needs: lint`, so a typo, lint error, or
  # bad format short-circuits the pipeline before it burns runner minutes on
  # the build + four e2e shards.
  lint:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: ./.github/actions/setup
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check:dead-code
      # Guard the e2e oracle that gates the `e2e` job: every spec must stay
      # selectable (liveness) and the mapping invariants must hold, so the gate
      # can't silently start skipping specs it should run.
      - run: npm run check:oracle

  check:
    needs: lint
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: ./.github/actions/setup
      # Unit suite under c8 + coverage-baseline.json ratchet (replaces the
      # separate coverage job — same tests, no duplicate npm test run).
      - run: npm run coverage:ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/lcov-report
          if-no-files-found: ignore
      # Differentially validate the JS CommonMark normalizer against the
      # reference normalize.py. The script fetches normalize.py from a pinned,
      # hash-verified upstream commit (not checked in) and runs the diff with
      # python3 (preinstalled on the runner).
      - run: npm run check:normalizer-parity
      # The build is validated once in the dedicated `build` job below (whose
      # dist artifact the e2e shards reuse), so it no longer runs here.

  build:
    needs: lint
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # Build dist once and hand it to every e2e shard. Previously each shard ran
    # its own `npm run build`; an earlier attempt to share dist via upload/
    # download dropped some Monaco worker files, breaking specs that open the
    # diff editor. Packing dist into a single tar before upload preserves the
    # full tree (worker files, nested dirs, exec bits) verbatim, so the shards
    # get a byte-identical dist without each rebuilding it.
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: ./.github/actions/setup
      - run: npm run build
      - run: tar -cf dist.tar dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-tar
          path: dist.tar
          if-no-files-found: error
          retention-days: 1

  # Test oracle (scripts/test-oracle.mts) decides how much of the e2e tier this
  # run needs. On a pull_request it maps the diff (vs the PR base) to the specs
  # it can affect; on a push to main it maps vs the previous main commit. The
  # nightly `schedule` always runs the full suite. The output drives the `e2e`
  # job below:
  #   mode=full    → all 8 shards run the whole CI suite
  #   mode=subset  → only the listed specs run, distributed across the shards
  #   mode=skip    → nothing e2e-relevant changed; shards report green, no run
  # subset is used only for confident, UI-coupled diffs; LOW-confidence (backend
  # logic with no selector coupling) and broad changes fall back to full. Full
  # coverage on every push is no longer guaranteed — the nightly is the net.
  plan-e2e:
    needs: lint
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      specs: ${{ steps.plan.outputs.specs }}
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          # PR base on pull_request; previous-tip on push. Empty for schedule.
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          # Real PR head commit (not the merge ref this job checks out), used to
          # detect the commit-screenshots auto-commit.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # `update-screenshots` forces a full e2e run so every reference shot is
          # re-rendered and the commit-screenshots job can refresh it, even when
          # the oracle would otherwise thin (subset) or skip the suite.
          UPDATE_SCREENSHOTS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'update-screenshots') }}
        run: |
          if [ "$EVENT" = "schedule" ]; then
            echo "Nightly schedule -> full e2e suite"
            { echo "mode=full"; echo "specs="; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Screenshot-only head commit -> skip e2e. This is the commit-screenshots
          # auto-commit (now PAT-pushed, so it triggers its own CI run): its parent
          # already ran e2e, and it adds only reference PNGs, so re-running the suite
          # would just re-render identical shots. Skipping keeps `ci-passed` reporting
          # on the new head (lint/check/build still run) without paying for e2e twice.
          #
          # This MUST stay ahead of the update-screenshots label check below.
          # Otherwise the label forces a full run on the bot's OWN screenshot
          # commit; because rendering isn't pixel-deterministic that run commits a
          # few more shots, which (PAT-pushed) re-triggers CI, forces full again,
          # and loops indefinitely. Skipping screenshot-only commits first breaks
          # the cycle while still letting a real code commit + label force a full
          # render (a code commit isn't screenshot-only, so it falls through).
          if [ -n "$HEAD_SHA" ]; then
            changed="$(git diff --name-only "${HEAD_SHA}^" "${HEAD_SHA}" 2>/dev/null || true)"
            if [ -n "$changed" ] && ! printf '%s\n' "$changed" | grep -qv '^tests/e2e/screenshots/'; then
              echo "HEAD commit only refreshes reference screenshots -> skip e2e"
              { echo "mode=skip"; echo "specs="; } >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          if [ "$UPDATE_SCREENSHOTS_LABEL" = "true" ]; then
            echo "update-screenshots label -> full e2e suite (force screenshot refresh)"
            { echo "mode=full"; echo "specs="; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # No usable base (first push / forced push / branch create) -> full.
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "No base sha for $EVENT -> full e2e suite"
            { echo "mode=full"; echo "specs="; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # full clone already has base history; this is belt-and-suspenders.
          git fetch --no-tags --depth=1 origin "$BASE_SHA" 2>/dev/null || true
          node scripts/test-oracle.mts --plan --base "$BASE_SHA" | tee plan.txt
          grep -E '^(mode|specs)=' plan.txt >> "$GITHUB_OUTPUT"
          { echo '### e2e oracle plan'; echo '```'; cat plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # Advisory: annotate which reference shots a UI change will refresh. Stale
      # shots DON'T block the PR — the `e2e` job below already re-renders them as a
      # side effect of the gate run, and the `commit-screenshots` job auto-commits
      # the diff. Pure static analysis — no build, no Electron, no e2e rerun.
      # PR-only: no label exists for push/schedule.
      - name: Plan reference-screenshot regeneration
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          UPDATE_SCREENSHOTS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'update-screenshots') }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA" 2>/dev/null || true
          node scripts/check-screenshots.mts --plan --base "$BASE_SHA"

  e2e:
    needs: [build, plan-e2e]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # PR/push e2e runs on the self-hosted Docker runners (see .github/runner):
    # free minutes, and a box big enough to avoid the 2-core/7GB hosted-runner
    # OOM that most of the shard quarantines exist to work around. The nightly
    # `schedule` runs the full suite on GitHub-hosted ubuntu-latest.
    #
    # The label set requires BOTH `self-hosted` AND `copse-e2e`, so jobs land
    # only on the Linux Docker runners and never on the macOS `self-hosted`
    # boxes (which carry `macOS`/`ARM64` but not `copse-e2e`). NOTE: requires at
    # least one registered `copse-e2e` runner or PR/push e2e will queue forever.
    runs-on: ${{ github.event_name == 'schedule' && fromJSON('["ubuntu-latest"]') || fromJSON('["self-hosted", "copse-e2e"]') }}
    # Split the seeded e2e suite (see wdio.ci.conf.ts) into parallel shards so the
    # whole gate finishes well inside the runner window. Each shard runs a disjoint
    # slice of specs via wdio's `--shard current/total`. The shared `dist` artifact
    # from the `build` job is unpacked here rather than rebuilt per shard.
    #
    # Shard count: 8. Each shard runs its slice as one sequential wdio process,
    # relaunching Electron per spec. On the 2-core/7GB runner, once a shard runs
    # too many specs the accumulated electron/codesearch processes exhaust it and
    # a later spec's Electron fails to boot or OOM-crashes the runner ("shutdown
    # signal"). wdio range-shards the full glob, and the ciExclude'd specs cluster
    # alphabetically, so run-counts are uneven — at 7 shards the dense `t*` range
    # still packed ~7 specs into one shard and hit the wall. 8 shards is the count
    # #339's data showed green across 12 runs (~4 specs/shard, with these same
    # specs), so it stays under the limit even in the densest range. It's cheap
    # here because the shared `dist` artifact + cached node_modules mean shards no
    # longer rebuild or reinstall (the cost that originally motivated 8→4). The
    # per-attempt `timeout` is 480s (step cap 26 min for 3 attempts) so attempt 1
    # finishes instead of being SIGKILL'd mid-retry, letting attempt 2 relaunch.
    strategy:
      # Fail fast: the first shard to go red cancels the rest. On the self-hosted
      # fleet a failure is usually a whole-run problem (a poisoned dep cache, a
      # broken commit, a runner-env issue) that every shard would hit anyway, so
      # cancelling the siblings frees the box instead of grinding all 8 through
      # their retry budget. Tradeoff: you see the first failing shard, not every
      # failing shard, in one run.
      fail-fast: true
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      SHARD_TOTAL: 8
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: ./.github/actions/setup
      # Reclaim ~20-30 GB of runner-preloaded toolchains (dotnet/android/ghc/
      # CodeQL/swift) and cached Docker images. The e2e shards have hit "No space
      # left on device" mid-run, which cascades into OOM / runner-shutdown and
      # Electron session-startup failures; freeing space up front removes that
      # whole failure class. Best-effort — never fail the job on cleanup. Only on
      # GitHub-hosted runners (the nightly) — never rm system dirs on a
      # self-hosted box.
      - name: Free disk space
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/boost || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /
      - uses: actions/download-artifact@v4
        with:
          name: dist-tar
      - run: tar -xf dist.tar
      # The Electron/Chromedriver e2e session occasionally fails to start on the
      # runner ("DevToolsActivePort file doesn't exist" / "POST /session" timeout).
      # The hang wedges the whole wdio run, so in-process retries don't recover —
      # only a fresh xvfb+Electron launch does. Retry the entire shard, and wrap
      # each attempt in `timeout` so a wedged session is killed and retried
      # (a plain hang would otherwise never exit and stall the job).
      # Oracle gate (see plan-e2e): `full` shards the whole suite; `subset`
      # distributes only the planned specs round-robin across the same 8 shards
      # (so no shard exceeds the per-shard memory budget the count is tuned for);
      # `skip` runs nothing. Every shard still reports a status, so this composes
      # with any required check without depending on an aggregate gate first.
      - name: e2e shard ${{ matrix.shard }}/${{ env.SHARD_TOTAL }} (oracle-gated, retry on flaky session startup)
        if: >-
          needs.plan-e2e.outputs.mode == 'full' ||
          needs.plan-e2e.outputs.mode == 'subset'
        timeout-minutes: 26
        env:
          PLAN_MODE: ${{ needs.plan-e2e.outputs.mode }}
          PLAN_SPECS: ${{ needs.plan-e2e.outputs.specs }}
        run: |
          if [ "$PLAN_MODE" = "subset" ]; then
            # Round-robin the planned specs onto this shard; an empty slice means
            # this shard has nothing to do (subset smaller than 8) — report green.
            i=0
            SPEC_ARGS=""
            for s in $PLAN_SPECS; do
              if [ $(( i % SHARD_TOTAL )) -eq $(( ${{ matrix.shard }} - 1 )) ]; then
                SPEC_ARGS="$SPEC_ARGS --spec $s"
              fi
              i=$(( i + 1 ))
            done
            if [ -z "$SPEC_ARGS" ]; then
              echo "shard ${{ matrix.shard }}: no specs in this subset slice — nothing to run"
              exit 0
            fi
            SHARD_ARGS=""
            echo "oracle subset shard ${{ matrix.shard }}:${SPEC_ARGS}"
          else
            SHARD_ARGS="--shard ${{ matrix.shard }}/${{ env.SHARD_TOTAL }}"
            SPEC_ARGS=""
          fi
          # `timeout` is GNU coreutils — present on Linux, but on macOS it's
          # `gtimeout` (from `brew install coreutils`). Pick whichever exists;
          # fall back to no inner timeout (the step `timeout-minutes` still caps
          # a wedged run) so the command can't die with "timeout: not found".
          TIMEOUT="$(command -v timeout || command -v gtimeout || true)"
          for attempt in 1 2 3; do
            echo "::group::e2e shard ${{ matrix.shard }} attempt $attempt"
            if ${TIMEOUT:+$TIMEOUT -k 15 480} npm run test:e2e:ci -- $SHARD_ARGS $SPEC_ARGS; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "e2e shard ${{ matrix.shard }} attempt $attempt failed or timed out"
          done
          exit 1
      # The specs above call saveScreenshot as they run, so this shard's slice has
      # already re-rendered its reference PNGs into tests/e2e/screenshots/. Collect
      # whatever changed (vs the committed shots) and hand it to commit-screenshots
      # — no second e2e suite needed. PR-only; the sentinel keeps the artifact
      # non-empty when a shard rendered no diffs.
      - name: Collect changed reference screenshots
        if: success() && github.event_name == 'pull_request'
        run: |
          mkdir -p changed/tests/e2e/screenshots
          touch "changed/.shard-${{ matrix.shard }}"
          mapfile -t files < <(git diff --name-only -- tests/e2e/screenshots/)
          for f in "${files[@]}"; do
            [ -n "$f" ] || continue
            cp "$f" "changed/tests/e2e/screenshots/"
          done
          echo "Collected ${#files[@]} changed screenshot(s) for shard ${{ matrix.shard }}"
      - uses: actions/upload-artifact@v4
        if: success() && github.event_name == 'pull_request'
        with:
          name: screenshots-shard-${{ matrix.shard }}
          path: changed/
          include-hidden-files: true
          if-no-files-found: error
      # On failure, surface the screenshot + page source captured in afterTest so
      # the constrained-runner render/OOM flakes can be inspected. Skipped when a
      # hard runner OOM ("shutdown signal") kills the job before this step runs.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-failure-artifacts-shard-${{ matrix.shard }}
          path: e2e-failure-artifacts/
          if-no-files-found: ignore
          retention-days: 3

  # Auto-commit the reference screenshots the `e2e` gate already re-rendered.
  # Folds the old standalone e2e-screenshots workflow in here: rather than running
  # the whole seeded suite a SECOND time just to regenerate shots, we reuse the
  # PNGs the gate run produced (the specs write them as a side effect) and commit
  # the diff. One e2e run, not two. Same-repo PRs only (CI can't push to a fork
  # branch) and only after a green e2e run, so we never commit half-rendered shots.
  # Deliberately NOT in `ci-passed`'s needs: it's a side effect, not a gate.
  #
  # The checkout uses a PAT (secrets.SCREENSHOTS_PAT) rather than the default
  # GITHUB_TOKEN: GitHub will not start a new workflow run for a commit pushed with
  # GITHUB_TOKEN (recursion guard), so a token-pushed screenshot commit would land
  # as the PR head with no CI run and no `ci-passed` status — leaving the PR blocked
  # and auto-merge stuck. Pushing with a PAT makes the commit trigger CI normally so
  # `ci-passed` reports on the new head. That re-run is cheap: plan-e2e skips the
  # e2e tier for a screenshot-only commit (see its `mode=skip` shortcut). Falls back
  # to github.token when the secret is unset — commits still land, just without the
  # CI re-trigger (the pre-PAT behaviour).
  commit-screenshots:
    needs: e2e
    if: >-
      always() && needs.e2e.result == 'success' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.SCREENSHOTS_PAT || github.token }}
      - name: Download regenerated screenshots
        uses: actions/download-artifact@v4
        with:
          pattern: screenshots-shard-*
          merge-multiple: true
          path: artifacts
      - name: Apply regenerated screenshots
        run: |
          if compgen -G "artifacts/tests/e2e/screenshots/*" > /dev/null; then
            cp -f artifacts/tests/e2e/screenshots/* tests/e2e/screenshots/
          fi
      # Drop sub-threshold render noise before staging. A re-render of an unchanged
      # screen still wobbles a few pixels (font hinting / anti-alias), and committing
      # that churns the reference shots for nothing. filter-screenshots.mts pixel-
      # compares each changed PNG against its committed baseline and reverts the ones
      # whose difference is below the noise threshold (clearly-different shots stay).
      # The reverted "near-identical" shots are reported back so the comment step can
      # offer them for manual review. Needs Node + pixelmatch/pngjs only — install
      # just those two into node_modules (an isolated, scripts-off install, ~0.3s)
      # rather than a full `npm ci`; this job otherwise needs no dependency tree.
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Filter sub-threshold screenshot noise
        id: filter
        env:
          UPDATE_SCREENSHOTS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'update-screenshots') }}
        run: |
          npm install --no-save --no-audit --no-fund --ignore-scripts \
            --prefix /tmp/ssfilter pixelmatch pngjs
          mkdir -p node_modules
          cp -r /tmp/ssfilter/node_modules/. node_modules/
          node scripts/filter-screenshots.mts
      - name: Detect screenshot changes
        id: diff
        run: |
          mapfile -t files < <(git diff --name-only -- tests/e2e/screenshots/)
          if [ ${#files[@]} -eq 0 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          {
            echo "files<<EOF"
            printf '%s\n' "${files[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Commit screenshot updates
        if: steps.diff.outputs.changed == 'true'
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/screenshots/
          # No [skip ci]: let the pushed commit run CI so `ci-passed` reports on
          # the new HEAD — otherwise the PR sits `blocked` with no status on this
          # commit. It terminates in one extra run: a PNG-only diff makes the oracle
          # skip the e2e tier, so CI re-runs only lint/check/build, renders nothing,
          # and this job finds no further screenshots to commit.
          git commit -m "chore(e2e): update reference screenshots from CI"
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Comment on PR with updated screenshots
        # Post when real shots were committed OR when shots were ignored as noise —
        # the ignored list is offered for manual acceptance, so it's worth surfacing
        # even on a run that committed nothing.
        if: steps.diff.outputs.changed == 'true' || steps.filter.outputs.ignored-count != '0'
        uses: actions/github-script@v7
        env:
          CHANGED_FILES: ${{ steps.diff.outputs.files }}
          COMMIT_SHA: ${{ steps.commit.outputs.sha }}
          IGNORED_JSON: ${{ steps.filter.outputs.ignored-json }}
        with:
          script: |
            const marker = '<!-- copse-e2e-screenshots -->';
            const sha = process.env.COMMIT_SHA || context.sha;
            const repo = context.repo.owner + '/' + context.repo.repo;
            const files = (process.env.CHANGED_FILES || '').split('\n').filter(Boolean);
            const ignored = JSON.parse(process.env.IGNORED_JSON || '[]');
            const sections = [];
            if (files.length) {
              const lines = files.map((path) => {
                const name = path.split('/').pop();
                const url = `https://github.com/${repo}/blob/${sha}/${path}`;
                return `- [${name}](${url}) — ![${name}](${url}?raw=1)`;
              });
              sections.push(
                `### Refreshed (${files.length})\n\n` +
                  `Clearly-different shots re-rendered by the CI e2e run and committed:\n\n` +
                  lines.join('\n'),
              );
            }
            if (ignored.length) {
              const lines = ignored.map((s) => `- \`${s.name}\` — ${s.diffPixels} px (${s.ratioPct})`);
              sections.push(
                `### Ignored as render noise (${ignored.length})\n\n` +
                  `These re-rendered below the variance threshold (font hinting / anti-alias ` +
                  `wobble) and were **not** committed. To accept them anyway, add the ` +
                  `\`update-screenshots\` label or commit the rendered PNGs by hand:\n\n` +
                  lines.join('\n'),
              );
            }
            const body = [
              marker,
              '## E2E screenshot updates',
              '',
              sections.join('\n\n'),
              '',
              'These PNGs live under `tests/e2e/screenshots/` for human visual review; CI asserts DOM structure, not pixel diffs.',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(
              (c) =>
                c.user?.type === 'Bot' &&
                typeof c.body === 'string' &&
                c.body.includes(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  # Single aggregate gate. Require ONLY this check in branch protection: it
  # `needs` every other job (and e2e's result aggregates all 8 shards), so it
  # turns the whole pipeline into one green/red status. New jobs or e2e shard
  # counts can change without touching the required-checks list — just add the
  # job to `needs` here. `if: always()` so this runs even when an upstream job
  # fails/is skipped; we then assert none failed or were cancelled. Skipped is
  # treated as a pass so the fork guard above (which skips every job on fork
  # PRs) doesn't wedge the gate.
  ci-passed:
    name: CI Passed
    if: always()
    needs: [lint, check, build, plan-e2e, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Check upstream job results
        run: |
          if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}; then
            echo "One or more CI jobs failed or were cancelled:"
            echo '${{ toJSON(needs) }}'
            exit 1
          fi
          echo "All CI jobs passed (or were intentionally skipped)."
