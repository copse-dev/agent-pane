name: CI
on:
  push:
    # `main` is the default branch and the integration target: day-to-day PRs
    # land there under the LIGHT tier. `release` only ever receives promotion
    # PRs from `main`, and those run the FULL tier — so `release` is always in a
    # state a release can be cut from. See the heavy-tier guards on `bench` /
    # `e2e` below, and docs/testing-strategy.md.
    branches: [release, main]
    # A release tag must receive this exact same aggregate gate before the
    # publishing workflow will package it. See release-mac.yml's preflight.
    tags: ['v*']
  # `labeled` is included so adding the `update-screenshots` or `ci-full` label
  # kicks a fresh run on the PR head — plan-e2e then forces mode=full
  # (update-screenshots additionally refreshes the reference shots). Without it the label only takes effect on the
  # next push/sync, so a label-only request would never regenerate. (For
  # pull_request events GitHub reads these triggers from the BASE branch's
  # workflow, so this is only active once merged to main.)
  pull_request:
    # `ready_for_review` is required because the heavy tier (build / e2e / bench)
    # is gated on `draft == false` below: without it, promoting a draft would
    # never dispatch those jobs and `CI Passed` would sit on the draft's
    # heavy-jobs-skipped result forever.
    types: [opened, synchronize, reopened, labeled, ready_for_review]
    # No `branches:` filter — PRs into `main` and the promotion PRs into
    # `release` both run this workflow. Which TIER they get is decided per job by
    # `github.base_ref`, not here, so a PR retargeted from `main` to `release`
    # picks up the full tier on its next sync without touching this file.
  # Nightly full e2e on GitHub-hosted runners — the comprehensive safety net.
  # PR/push runs are oracle-thinned on self-hosted (see the e2e job), so the
  # full suite is no longer guaranteed on every main push; this catches anything
  # a partial map missed, within a day. Off-:00 minute to avoid the cron stampede.
  schedule:
    - cron: '17 6 * * *'
  # NOTE: there is deliberately no `merge_group` trigger. GitHub's merge queue
  # requires Enterprise Cloud for private repositories and this org is on Team,
  # so the trigger could never fire. The `main` -> `release` promotion flow is
  # the stand-in: `main` absorbs the day's merges under the light tier, and
  # the promotion PR runs the full tier once for the whole batch. What we give
  # up versus a real queue is automatic bisection — a red promotion names a
  # batch, not a commit — which is why promotions should be frequent enough to
  # stay small.

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Nightly schedule must not cancel an in-flight tip push/PR: cron can fire
  # hours late, and schedule+push share `ci-refs/heads/main`. They also use
  # different e2e runners (hosted vs self-hosted), so running in parallel is
  # fine. A new push/PR sync still cancels older runs in the group.
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  # Check-tier runner routing: every `runs-on` below (except e2e, which routes
  # by label with its own nightly-hosted exception, and release-mac in its own
  # workflow) reads the CHECKS_RUNNER Actions variable and falls back to
  # GitHub-hosted when it is unset or empty:
  #   CHECKS_RUNNER=copse-checks  ->  the org self-hosted check fleet (ci-runners/)
  #   (unset or '')               ->  ubuntu-latest
  # This replaces the old `pick-runner` probe job, which burned a billed
  # GitHub-hosted minute on EVERY run (a 3-second API probe rounds up to a full
  # minute) just to make this decision — and quietly routed the whole check
  # tier to paid hosted runners whenever its PAT lacked org runner read. A
  # variable costs nothing, needs no PAT, and is flipped by hand when the
  # fleet comes up or goes down:
  #   gh variable set CHECKS_RUNNER --org copse-dev --body copse-checks --visibility all
  #   gh variable delete CHECKS_RUNNER --org copse-dev
  # (or Settings -> Secrets and variables -> Actions -> Variables; a repo-level
  # CHECKS_RUNNER overrides the org one, and an empty value means hosted).
  #
  # Tradeoff vs the probe: nothing auto-detects the fleet going offline. If the
  # variable names a fleet with no online runner, routed jobs queue until a
  # runner returns or the variable is cleared — clear it when taking the fleet
  # down. Fork PRs run only the `precheck` safe tier, forced onto a GitHub-hosted
  # runner with a read-only token. Every heavier job that executes repository
  # code keeps its same-repo `if` guard, so untrusted commits never run on the
  # self-hosted fleet.

  # Cheap static gate + e2e planning. Runs the fast static checks (typecheck,
  # lint, format, dead-code, oracle liveness) AND computes the e2e oracle plan in
  # a single job. Everything expensive — coverage, build, e2e — hangs off this
  # via `needs: precheck`, so a typo, lint error, or bad format short-circuits
  # the pipeline before it burns runner minutes on the build + e2e shards.
  # Folding the former standalone `plan-e2e` job in here drops a duplicate
  # checkout + node setup (and its rounded-up billed minute) from every run.
  precheck:
    # Prefer the self-hosted check fleet (CHECKS_RUNNER) to conserve Actions
    # minutes; falls back to GitHub-hosted ubuntu-latest when the var is unset.
    # History: the 6 GB self-hosted cgroup has cgroup-killed `tsc` / `eslint .`
    # under load (exit 137). If that recurs, add fleet headroom rather than
    # re-pinning the static gate to hosted.
    runs-on: ${{ vars.CHECKS_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
    # Consumed by the e2e job: how much of the e2e tier this run needs (mode/
    # specs), and the runner-dependent shard fan-out (e2e_shards / shard_total).
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      specs: ${{ steps.plan.outputs.specs }}
      e2e_shards: ${{ steps.shards.outputs.list }}
      e2e_shard_total: ${{ steps.shards.outputs.total }}
    steps:
      # fetch-depth: 0 so the e2e oracle (plan step) can diff against the PR base
      # / previous main tip.
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          # Do not leave even the read-only GITHUB_TOKEN in a fork checkout.
          # Same-repo runs keep credentials for the oracle's base ref fetches.
          persist-credentials: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      # Same-repository PRs already execute inside this job's check-fleet trust
      # boundary. Scan them here so secret detection blocks the required
      # `CI Passed` gate without dispatching a second GitHub-hosted job. Forks
      # remain on the standalone hosted workflow in gitleaks.yml.
      - name: Install pinned gitleaks CLI
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_LINUX_X64_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        shell: bash
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          path="${RUNNER_TEMP}/${archive}"
          curl --fail --location --retry 3 \
            --output "${path}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_LINUX_X64_SHA256}  ${path}" | sha256sum --check --strict
          tar -xzf "${path}" -C "${RUNNER_TEMP}" gitleaks
          "${RUNNER_TEMP}/gitleaks" version
      - name: Scan repository history for secrets
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          "${RUNNER_TEMP}/gitleaks" git --redact --verbose --no-banner \
            --log-opts="--full-history --diff-filter=tuxdb HEAD" .
      - uses: ./.github/actions/setup
      # Retry once on exit 137 (SIGKILL / cgroup OOM). The check fleet caps each
      # runner at ~6 GB; under load, tsc/eslint can get killed even though a
      # second attempt on a quieter container succeeds. Real type/lint errors
      # exit non-137 and still fail the gate immediately.
      - name: Typecheck
        run: |
          set +e
          npm run typecheck
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then exit 0; fi
          if [ "$status" -ne 137 ]; then exit "$status"; fi
          echo "::warning::typecheck OOM-killed (137); retrying once"
          sleep 10
          npm run typecheck
      - name: Lint
        env:
          # Cap the V8 heap so eslint stays inside the ~6 GB check-runner cgroup
          # instead of racing other jobs for the whole container.
          NODE_OPTIONS: --max-old-space-size=3072
        run: |
          # Typecheck just exited; give the cgroup a beat to reclaim before
          # eslint's peak allocation, then retry a couple of times on 137.
          sleep 15
          attempt=1
          while true; do
            set +e
            npm run lint
            status=$?
            set -e
            if [ "$status" -eq 0 ]; then exit 0; fi
            if [ "$status" -ne 137 ] || [ "$attempt" -ge 3 ]; then exit "$status"; fi
            echo "::warning::lint OOM-killed (137); retry $attempt/3"
            attempt=$((attempt + 1))
            sleep 20
          done
      - run: npm run format:check
      - run: npm run check:dead-code
      # Fail closed on high/critical dependency advisories. This runs after the
      # lockfile-exact setup, so it audits precisely the tree CI will execute.
      - run: npm audit --audit-level=high
      # Guard the e2e oracle that gates the `e2e` job: every spec must stay
      # selectable (liveness) and the mapping invariants must hold, so the gate
      # can't silently start skipping specs it should run.
      - run: npm run check:oracle
      # Test oracle (scripts/test-oracle.mts) decides how much of the e2e tier
      # this run needs. On a pull_request it maps the diff (vs the PR base) to the
      # specs it can affect; on a push to main it maps vs the previous main
      # commit. The nightly `schedule` always runs the full suite. The output
      # drives the `e2e` job below:
      #   mode=full    → all 8 shards run the whole CI suite
      #   mode=subset  → only the listed specs run, distributed across the shards
      #   mode=skip    → nothing e2e-relevant changed; shards report green, no run
      # subset is used only for confident, UI-coupled diffs; LOW-confidence
      # (backend logic with no selector coupling) and broad changes fall back to
      # full. Full coverage on every push is no longer guaranteed — the nightly
      # is the net.
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          # PR base on pull_request; previous-tip on push. Empty for schedule.
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          # Real PR head commit (not the merge ref this job checks out), used to
          # detect the commit-screenshots auto-commit.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # `update-screenshots` forces a full e2e run so every reference shot is
          # re-rendered and the commit-screenshots job can refresh it, even when
          # the oracle would otherwise thin (subset) or skip the suite.
          UPDATE_SCREENSHOTS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'update-screenshots') }}
          # `ci-full` forces the full e2e suite, bypassing the oracle's thinning
          # entirely — for when a change wants exhaustive coverage NOW rather
          # than waiting for the nightly net (e.g. infra/runner changes whose
          # blast radius the selector-vocabulary map cannot see).
          CI_FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ci-full') }}
        run: |
          if [ "$EVENT" = "schedule" ]; then
            echo "Nightly schedule -> full e2e suite"
            { echo "mode=full"; echo "specs="; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Screenshot-only head commit -> skip e2e. This is the commit-screenshots
          # auto-commit (now PAT-pushed, so it triggers its own CI run): its parent
          # already ran e2e, and it adds only reference PNGs, so re-running the suite
          # would just re-render identical shots. Skipping keeps `ci-passed` reporting
          # on the new head (lint/check/build still run) without paying for e2e twice.
          #
          # This MUST stay ahead of the update-screenshots label check below.
          # Otherwise the label forces a full run on the bot's OWN screenshot
          # commit; because rendering isn't pixel-deterministic that run commits a
          # few more shots, which (PAT-pushed) re-triggers CI, forces full again,
          # and loops indefinitely. Skipping screenshot-only commits first breaks
          # the cycle while still letting a real code commit + label force a full
          # render (a code commit isn't screenshot-only, so it falls through).
          if [ -n "$HEAD_SHA" ]; then
            changed="$(git diff --name-only "${HEAD_SHA}^" "${HEAD_SHA}" 2>/dev/null || true)"
            if [ -n "$changed" ] && ! printf '%s\n' "$changed" | grep -qv '^tests/e2e/screenshots/'; then
              echo "HEAD commit only refreshes reference screenshots -> skip e2e"
              { echo "mode=skip"; echo "specs="; } >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          # A promotion is the release gate for the whole trunk batch. Always
          # exercise the complete e2e suite here rather than allowing the oracle
          # to thin or skip it. Keep this after the screenshot-only escape above:
          # the bot's reference-only follow-up has already inherited a successful
          # e2e run from its parent and must not start a render/commit loop.
          if [ "$EVENT" = "pull_request" ] && [ "$BASE_REF" = "release" ]; then
            echo "PR targets release -> full e2e suite (promotion gate)"
            { echo "mode=full"; echo "specs="; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$UPDATE_SCREENSHOTS_LABEL" = "true" ]; then
            echo "update-screenshots label -> full e2e suite (force screenshot refresh)"
            { echo "mode=full"; echo "specs="; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$CI_FULL_LABEL" = "true" ]; then
            echo "ci-full label -> full e2e suite (oracle bypassed on request)"
            { echo "mode=full"; echo "specs="; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # No usable base (first push / forced push / branch create) -> full.
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "No base sha for $EVENT -> full e2e suite"
            { echo "mode=full"; echo "specs="; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # full clone already has base history; this is belt-and-suspenders.
          git fetch --no-tags --depth=1 origin "$BASE_SHA" 2>/dev/null || true
          node scripts/test-oracle.mts --plan --base "$BASE_SHA" | tee plan.txt
          grep -E '^(mode|specs)=' plan.txt >> "$GITHUB_OUTPUT"
          { echo '### e2e oracle plan'; echo '```'; cat plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # Advisory: annotate which reference shots a UI change will refresh. Stale
      # shots DON'T block the PR — the `e2e` job below already re-renders them as a
      # side effect of the gate run, and the `commit-screenshots` job auto-commits
      # the diff. Pure static analysis — no build, no Electron, no e2e rerun.
      # PR-only: no label exists for push/schedule.
      - name: Plan reference-screenshot regeneration
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          UPDATE_SCREENSHOTS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'update-screenshots') }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA" 2>/dev/null || true
          node scripts/check-screenshots.mts --plan --base "$BASE_SHA"
      # Keep every full e2e run at 8 shards. Both runner classes have a tight
      # memory ceiling: GitHub-hosted is 7 GB and each self-hosted `copse-e2e`
      # container is capped at 6 GB. Packing the suite into 3 shards makes each
      # container launch too many sequential Electron sessions; accumulated
      # Electron/gortex processes then OOM-crash unrelated late-running specs.
      # `--shard` and the subset round-robin still partition specs disjointly.
      - id: shards
        env:
          PLAN_MODE: ${{ steps.plan.outputs.mode }}
          PLAN_SPECS: ${{ steps.plan.outputs.specs }}
        run: |
          # Size the matrix to the work the oracle actually planned. Previously
          # this was always 8, so a screenshots-only commit (mode=skip) still
          # dispatched 8 shards that each paid checkout + `npm ci` + dist
          # download before hitting the early-exit in the run step — 8 self-hosted
          # runners occupied to do nothing, on every bot screenshot push. Same for
          # a subset smaller than 8: the surplus shards booted only to find an
          # empty slice.
          #
          # An empty list must NOT reach the `e2e` matrix: GitHub Actions treats
          # `strategy.matrix: []` as a job **failure**, not 'skipped' (observed on
          # #1233 — `needs.e2e.result=failure` painted `CI Passed` red in skip
          # mode). The `e2e` job `if:` therefore gates on `e2e_shard_total != 0`
          # so a zero-shard plan skips the job cleanly; `ci-passed` then sees
          # 'skipped' and its mode=skip branch accepts it.
          if [ "$PLAN_MODE" = "skip" ]; then
            echo "mode=skip -> no e2e shards dispatched"
            { echo "total=0"; echo "list=[]"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$PLAN_MODE" = "subset" ]; then
            # SHARD_TOTAL is the round-robin modulus in the run step, so total and
            # the list must agree or specs would be assigned to shards that were
            # never dispatched. Cap at 8 (the memory ceiling from #339).
            n=0
            for _ in $PLAN_SPECS; do n=$(( n + 1 )); done
            [ "$n" -gt 8 ] && n=8
            if [ "$n" -lt 1 ]; then
              echo "mode=subset with no specs -> no e2e shards dispatched"
              { echo "total=0"; echo "list=[]"; } >> "$GITHUB_OUTPUT"
              exit 0
            fi
            list="$(seq -s, 1 "$n")"
            echo "mode=subset -> $n shard(s)"
            { echo "total=$n"; echo "list=[$list]"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          { echo "total=8"; echo "list=[1,2,3,4,5,6,7,8]"; } >> "$GITHUB_OUTPUT"

  # Auto-fix the PR branch: run every autofix we have — ESLint `--fix` then
  # Prettier `--write` — and commit the result back onto the head branch. This
  # is the "fixer" half of the format gate; `precheck` still runs `lint` +
  # `format:check` as the "gate" half, which stays honest when this job is off
  # (no PAT) or can't run (fork PR).
  #
  # Scope to files changed vs the PR base (not the whole tree): full-repo
  # `eslint . --fix` + `prettier --write .` regularly OOM-kill (exit 137) on
  # the 6 GB check runners under fleet load, painting every PR red before
  # precheck even starts. Diff-scoped autofix is enough — the gate half still
  # checks the whole tree — and keeps peak memory proportional to the PR.
  #
  # A SEPARATE job rather than folded into `precheck`: precheck checks out the
  # merge ref (fetch-depth: 0) so the e2e oracle can diff against base, whereas
  # committing needs the branch (head_ref) checkout — the same split that keeps
  # `commit-screenshots` its own job. Prettier runs last so it tidies whatever
  # ESLint rewrote; `eslint-config-prettier` means the two never fight.
  #
  # Pushed with SCREENSHOTS_PAT (reused) rather than the default GITHUB_TOKEN:
  # GitHub won't start a run for a GITHUB_TOKEN push (recursion guard), so a
  # token-pushed format commit would land as the PR head with no CI and leave
  # the PR blocked. The PAT push fires `pull_request: synchronize`, and the
  # top-level `concurrency: cancel-in-progress` supersedes THIS run with one on
  # the formatted commit — so build/e2e aren't paid for twice. It terminates in
  # one extra run: the re-triggered run reformats nothing (idempotent), so this
  # job finds no diff and pushes nothing. Falls back to github.token when the
  # secret is unset (commit lands, just no CI re-trigger — pre-PAT behaviour).
  autoformat:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    # Prefer self-hosted (CHECKS_RUNNER) to save Actions minutes; hosted fallback
    # when unset. Watch for 6 GB self-hosted OOM on eslint/prettier (see precheck).
    runs-on: ${{ vars.CHECKS_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.SCREENSHOTS_PAT || github.token }}
      - uses: ./.github/actions/setup
      # `|| true` on eslint: a non-autofixable lint error must not abort the run —
      # we still want the fixes ESLint did apply to land. Real lint failures stay
      # the job of precheck's `lint` gate, not this fixer. Prettier retries once
      # on OOM (137); a second kill fails the job so a wedged runner is visible.
      - name: Autofix changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
          fi
          mapfile -t files < <(
            git diff --name-only --diff-filter=ACMR "$BASE_SHA"...HEAD \
              | grep -E '\.(cjs|css|cts|js|json|jsx|md|mjs|mts|ts|tsx|yaml|yml)$' \
              || true
          )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No autofixable files changed vs base."
            exit 0
          fi
          echo "Autofixing ${#files[@]} changed file(s)"
          npx eslint --fix -- "${files[@]}" || true
          set +e
          npx prettier --write -- "${files[@]}"
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then exit 0; fi
          if [ "$status" -ne 137 ]; then exit "$status"; fi
          echo "::warning::prettier OOM-killed (137); retrying once"
          sleep 10
          npx prettier --write -- "${files[@]}"
      - name: Commit and push fixes
        run: |
          if git diff --quiet; then
            echo "No formatting changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "style: apply eslint --fix and prettier"
          git push

  check:
    needs: precheck
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # Prefer self-hosted (CHECKS_RUNNER) to save Actions minutes; hosted fallback
    # when unset. History: coverage/esbuild has died with "service was stopped" on
    # the 6 GB self-hosted fleet under load (same class as precheck OOM) — add
    # headroom if it recurs.
    runs-on: ${{ vars.CHECKS_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      # Unit suite under c8 + coverage-baseline.json ratchet (replaces the
      # separate coverage job — same tests, no duplicate npm test run).
      - run: npm run coverage:ci
        env:
          # c8 retains V8 coverage until the suite exits; the default ~2 GB heap
          # can OOM while finalizing a fully green run on the 6 GB check fleet.
          NODE_OPTIONS: --max-old-space-size=3072
      # Diagnostic HTML only — coverage:ci / coverage-gate already decided pass/fail.
      # Org artifact-storage quota must not fail the merge gate after a green suite
      # (seen on #1074: CreateArtifact quota error after 0 unit failures).
      - uses: actions/upload-artifact@v7
        if: always()
        continue-on-error: true
        with:
          name: coverage-report
          path: coverage/lcov-report
          if-no-files-found: ignore
          # Debug/inspection aid, not a durable record — expire quickly so it
          # doesn't accumulate against the org's Actions storage quota.
          retention-days: 7
      # The CommonMark normalizer-parity check now lives in the extracted
      # @copse/streaming-markdown repo's CI (copse-dev/streaming-markdown).
      # The build is validated once in the dedicated `build` job below (whose
      # dist artifact the e2e shards reuse), so it no longer runs here.

  # Retrieval-quality gate for the semantic-search backend. This job indexes the
  # repo and runs the fixture query set, asserting recall@k and search latency
  # stay within the committed thresholds. A drop in ranking quality (or a gortex
  # CLI/JSON change that breaks parsing) fails here rather than silently
  # degrading in-app search.
  bench:
    needs: precheck
    if: >-
      (github.event_name != 'push' || github.ref != 'refs/heads/main') &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event_name != 'pull_request' ||
       github.base_ref == 'release' ||
       contains(github.event.pull_request.labels.*.name, 'ci-full')) &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.draft == false ||
       contains(github.event.pull_request.labels.*.name, 'ci-full'))
    # HEAVY TIER. Runs on promotion PRs (base `release`), on pushes to `release`,
    # on the nightly schedule and on release tags — not on the day-to-day PRs into
    # `main`, and not on pushes to `main`. bench fetches gortex and runs
    # the semantic-search + agent gates; paying that per PR when ~20 land a day
    # is the cost the trunk/promotion model exists to amortise. The `ci-full`
    # label forces it on a trunk-targeted PR that genuinely wants the signal.
    # Draft PRs skip the heavy tier. Drafts cannot merge, so the expensive
    # signal has no consumer until the PR is promoted — and `ready_for_review`
    # (see the trigger block) dispatches the full tier the moment it is. The
    # `ci-full` label forces it earlier for a draft that genuinely wants it.
    # `precheck` / `check` / `autoformat` still run on drafts, so lint, types,
    # unit tests and the autofixer keep giving fast feedback.
    # Prefer self-hosted (CHECKS_RUNNER) to save Actions minutes; hosted fallback
    # when unset. No Electron/display need.
    runs-on: ${{ vars.CHECKS_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      # Guarantee the gortex binary independently of the setup action. On a
      # self-hosted runner whose baked image predates gortex, the baked-deps seed
      # sets seeded=true (so npm ci + its postinstall fetch are skipped) yet the
      # baked layer has no vendor/gortex to copy — leaving the binary absent.
      # fetch-gortex is idempotent: a no-op when the (checksum-verified) binary is
      # already present, a download when it isn't.
      - run: node scripts/fetch-gortex.mts
      # The floor is a breakage detector, not a target: a gortex CLI/JSON change
      # that breaks parsing craters recall to ~0, and that's the main thing this
      # catches. Recall is deterministic per corpus (~81% observed on 16 fixture
      # queries), but unrelated PRs that add files shift rankings by a query or
      # two, so the 0.65 floor leaves headroom to avoid flaking those builds. The
      # p95 ceiling is generous vs the ~130ms observed locally (CI is slower, the
      # daemon starts cold). Tighten either once the fixture set is larger.
      - run: >-
          node scripts/semantic-search-bench.mts --backend gortex --gate
          --min-recall 0.65 --max-p95-ms 3000 --json bench-semantic.json
      - uses: actions/upload-artifact@v7
        if: always()
        continue-on-error: true
        with:
          name: bench-semantic
          path: bench-semantic.json
          if-no-files-found: ignore
          # Small trend JSON; keep two weeks for regression triage, then expire.
          retention-days: 14
      # Agent bench harness self-test (#752): the deterministic mock run drives
      # run-agent-loop headlessly end-to-end (directive tool call → workspace
      # write → grading) and the --gate ratchet compares solve rate and
      # tokens-per-solve against benchmarks/bench-baseline.json. No model, ~30s.
      - run: npm run bench:agent -- --mock --gate
      # Doctrine ablation harness self-test (#744): runs the full and omit-tools
      # arms through the real agent loop with a deterministic mock task. The
      # real-model matrix stays in doctrine-eval-model below.
      - run: >-
          npm run eval:doctrine -- --provider mock --repeats 1 --sections tools
          --out bench-results/doctrine-mock --require-solved --require-doctrine
      - uses: actions/upload-artifact@v7
        if: always()
        continue-on-error: true
        with:
          name: bench-agent-mock
          path: bench-results/
          if-no-files-found: ignore
          # Small trend data; keep two weeks for regression triage, then expire.
          retention-days: 14

  # Real-model agent benchmark (#752): the SWE-bench Verified pinned subset
  # driven by a local model on a self-hosted runner with an LM Studio host.
  # Runs nightly (schedule) or on demand via the `bench-agent` PR label, and
  # only when the LM_EVAL_RUNNER repo variable names a runner. Deliberately
  # OUT of the ci-passed critical path (docs/testing-strategy.md): slow,
  # non-deterministic trend data, not a merge gate.
  bench-agent-model:
    needs: precheck
    if: >-
      vars.LM_EVAL_RUNNER != '' &&
      (github.event_name == 'schedule' ||
       contains(github.event.pull_request.labels.*.name, 'bench-agent'))
    runs-on: ${{ vars.LM_EVAL_RUNNER }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      # Resolve the pinned instance ids into task files (network required).
      - run: npm run bench:swe-tasks
      - env:
          LM_STUDIO_URL: ${{ vars.LM_STUDIO_URL }}
          LM_STUDIO_MODEL: ${{ vars.LM_STUDIO_MODEL }}
          LM_STUDIO_API_KEY: ${{ secrets.LM_STUDIO_API_KEY }}
        run: npm run bench:agent -- --tasks benchmarks/tasks/swe-bench --gate
      - uses: actions/upload-artifact@v7
        if: always()
        continue-on-error: true
        with:
          name: bench-agent-model
          path: bench-results/
          if-no-files-found: ignore
          # Small trend data; keep two weeks for regression triage, then expire.
          retention-days: 14

  # Working-style doctrine prompt-section A/B (#744): same fixed task subset,
  # model, and sampling posture for full vs omitted prompt sections. Runs only
  # nightly or when a PR is explicitly labelled `bench-doctrine`, and only on a
  # configured LM Studio eval runner. Trend report only; never a merge gate.
  doctrine-eval-model:
    needs: precheck
    if: >-
      vars.LM_EVAL_RUNNER != '' &&
      (github.event_name == 'schedule' ||
       contains(github.event.pull_request.labels.*.name, 'bench-doctrine'))
    runs-on: ${{ vars.LM_EVAL_RUNNER }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - env:
          LM_STUDIO_URL: ${{ vars.LM_STUDIO_URL }}
          LM_STUDIO_MODEL: ${{ vars.LM_STUDIO_MODEL }}
          LM_STUDIO_API_KEY: ${{ secrets.LM_STUDIO_API_KEY }}
        run: >-
          npm run eval:doctrine -- --provider lmstudio --repeats 3 --sections tools
          --out bench-results/doctrine
      - uses: actions/upload-artifact@v7
        if: always()
        continue-on-error: true
        with:
          name: doctrine-eval-model
          path: bench-results/doctrine/
          if-no-files-found: ignore
          retention-days: 30

  build:
    needs: precheck
    if: >-
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.draft == false ||
       contains(github.event.pull_request.labels.*.name, 'ci-full'))
    # Draft PRs skip the heavy tier. Drafts cannot merge, so the expensive
    # signal has no consumer until the PR is promoted — and `ready_for_review`
    # (see the trigger block) dispatches the full tier the moment it is. The
    # `ci-full` label forces it earlier for a draft that genuinely wants it.
    # `precheck` / `check` / `autoformat` still run on drafts, so lint, types,
    # unit tests and the autofixer keep giving fast feedback.
    # Prefer self-hosted (CHECKS_RUNNER) to save Actions minutes; hosted fallback
    # when unset. Produces the dist artifact consumed by the e2e shards below.
    runs-on: ${{ vars.CHECKS_RUNNER || 'ubuntu-latest' }}
    # Build dist once and hand it to every e2e shard. Previously each shard ran
    # its own `npm run build`; an earlier attempt to share dist via upload/
    # download dropped some Monaco worker files, breaking specs that open the
    # diff editor. Packing dist into a single tar before upload preserves the
    # full tree (worker files, nested dirs, exec bits) verbatim, so the shards
    # get a byte-identical dist without each rebuilding it.
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - run: npm run build
      # Plain-Chrome geometry coverage replaces Electron specs that do not need
      # main/preload IPC. Skip screenshot-only heads: their parent already ran
      # this tier and re-running could create a screenshot commit loop.
      - run: npm run build:demo
        if: needs.precheck.outputs.mode != 'skip'
      - run: npm run test:demo
        if: needs.precheck.outputs.mode != 'skip'
      - name: Collect changed browser reference screenshots
        if: >-
          success() && github.event_name == 'pull_request' &&
          needs.precheck.outputs.mode != 'skip'
        run: |
          mkdir -p changed/tests/e2e/screenshots
          touch changed/.demo
          mapfile -t files < <(
            {
              git diff --name-only -- tests/e2e/screenshots/
              git ls-files --others --exclude-standard -- tests/e2e/screenshots/
            } | sort -u
          )
          for f in "${files[@]}"; do
            [ -n "$f" ] || continue
            cp "$f" "changed/tests/e2e/screenshots/"
          done
          echo "Collected ${#files[@]} browser screenshot(s)"
      - uses: actions/upload-artifact@v7
        if: >-
          success() && github.event_name == 'pull_request' &&
          needs.precheck.outputs.mode != 'skip'
        with:
          name: screenshots-demo
          path: changed/
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: demo-failure-artifacts
          path: e2e-failure-artifacts/
          if-no-files-found: ignore
          retention-days: 3
      - run: tar -cf dist.tar dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist-tar
          path: dist.tar
          if-no-files-found: error
          retention-days: 1

  e2e:
    needs: [build, precheck]
    if: >-
      needs.precheck.outputs.e2e_shard_total != '0' &&
      (github.event_name != 'push' || github.ref != 'refs/heads/main') &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event_name != 'pull_request' ||
       github.base_ref == 'release' ||
       contains(github.event.pull_request.labels.*.name, 'ci-full') ||
       contains(github.event.pull_request.labels.*.name, 'update-screenshots')) &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.draft == false ||
       contains(github.event.pull_request.labels.*.name, 'ci-full'))
    # Zero-shard plans (oracle mode=skip / empty subset) skip this job via
    # `e2e_shard_total != 0` — an empty matrix is a GHA **failure**, not a skip
    # (see the precheck shards step).
    # HEAVY TIER, same rule as `bench` above: promotion PRs (base `release`),
    # pushes to `release`, the nightly schedule and release tags. PRs into
    # `main` skip 8 Electron shards apiece, which is where most of the
    # runner starvation came from. Two escape hatches on a trunk-targeted PR:
    # `ci-full` for the whole heavy tier, and `update-screenshots` for this job
    # specifically — without the latter that label would be inert on trunk
    # PRs, since the screenshot commit is produced by the e2e run.
    # Draft PRs skip e2e for the same reason as `build` above; `build` is also
    # gated, so on a draft this job's `needs` are unsatisfied and it would skip
    # regardless — the explicit clause keeps the intent readable at this job.
    # PR/push e2e runs on the self-hosted Docker runners (see ci-runners/):
    # free minutes, and a box big enough to avoid the 2-core/7GB hosted-runner
    # OOM that most of the shard quarantines exist to work around. The nightly
    # `schedule` runs the full suite on GitHub-hosted ubuntu-latest.
    #
    # Runner is picked by TRUST and fails closed. The label set requires BOTH
    # `self-hosted` AND `copse-e2e`, so trusted push/same-repo PR jobs land only
    # on the Linux Docker runners (never the macOS `self-hosted` boxes, which
    # lack `copse-e2e`). Nightly `schedule` uses GitHub-hosted ubuntu-latest. A
    # repo-level E2E_RUNNER=ubuntu-latest override is the break-glass path when
    # the self-hosted fleet is offline; delete it after the fleet recovers.
    # Fork PRs are skipped by the `if` guard above and must never run on any
    # runner — there is no hosted fallback; if that guard were ever removed, the
    # expression below evaluates to a falsy value (not a runner label) so the
    # job fails closed instead of dispatching untrusted code anywhere. NOTE:
    # Without the explicit hosted override, a registered `copse-e2e` runner is
    # required or PR/push e2e queues until the fleet returns.
    runs-on: >-
      ${{ github.event_name == 'schedule' && fromJSON('["ubuntu-latest"]') ||
          ((github.event_name == 'push' ||
            (github.event_name == 'pull_request' &&
             github.event.pull_request.head.repo.full_name == github.repository))
           && (vars.E2E_RUNNER == 'ubuntu-latest'
               && fromJSON('["ubuntu-latest"]')
               || fromJSON('["self-hosted", "copse-e2e"]'))) }}
    # Split the seeded e2e suite (see wdio.ci.conf.ts) into parallel shards so the
    # whole gate finishes well inside the runner window. Each shard runs a disjoint
    # slice of specs via wdio's `--shard current/total`. The shared `dist` artifact
    # from the `build` job is unpacked here rather than rebuilt per shard.
    #
    # Every full run uses 8 shards. Each shard runs its slice as one sequential
    # wdio process, relaunching Electron per spec. Both the hosted runner (7 GB)
    # and self-hosted container (6 GB cap) eventually exhaust memory when a shard
    # launches too many Electron/gortex processes; a later unrelated spec then
    # fails to boot or OOM-crashes ("shutdown signal"). #339's data showed that
    # 8 shards stays under that limit even in the densest spec range.
    # The per-attempt `timeout` is 480s (step cap 18 min for 2 attempts) so attempt
    # 1 finishes instead of being SIGKILL'd mid-retry, letting attempt 2 relaunch.
    strategy:
      # Fail fast: the first shard to go red cancels the rest. On the self-hosted
      # fleet a failure is usually a whole-run problem (a poisoned dep cache, a
      # broken commit, a runner-env issue) that every shard would hit anyway, so
      # cancelling the siblings frees the box instead of grinding them all through
      # their retry budget. Tradeoff: you see the first failing shard, not every
      # failing shard, in one run.
      #
      # `ci-full` is the exception, because there the tradeoff inverts. That label
      # already means "run the whole heavy tier on a trunk PR" — it is opt-in and
      # rare, and it is used precisely when the e2e signal is what's wanted. With
      # independent reds (not a whole-run problem) fail-fast surfaces exactly one
      # per run: #1425 spent five runs learning about six specs, cancelling six
      # shards each time, because each red hid the next. Letting a `ci-full` run
      # report every shard costs fleet time on a PR that is already failing, and
      # buys the complete list in one pass.
      #
      # Non-PR events have no labels, so `contains()` is false and fail-fast stays
      # on for pushes, the nightly schedule, and tags — the fleet-protecting
      # default is unchanged everywhere it was doing its job.
      fail-fast: ${{ !contains(github.event.pull_request.labels.*.name, 'ci-full') }}
      matrix:
        shard: ${{ fromJSON(needs.precheck.outputs.e2e_shards) }}
    env:
      SHARD_TOTAL: ${{ needs.precheck.outputs.e2e_shard_total }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      # Reclaim ~20-30 GB of runner-preloaded toolchains (dotnet/android/ghc/
      # CodeQL/swift) and cached Docker images. The e2e shards have hit "No space
      # left on device" mid-run, which cascades into OOM / runner-shutdown and
      # Electron session-startup failures; freeing space up front removes that
      # whole failure class. Best-effort — never fail the job on cleanup. Only on
      # GitHub-hosted runners (the nightly) — never rm system dirs on a
      # self-hosted box.
      - name: Free disk space
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/boost || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /
      # Outer retry: actions/download-artifact marks intermittent CDN 403s
      # ("Error from intermediary") as non-retryable, and with fail-fast:true a
      # single shard's download flake cancels the whole e2e matrix (see
      # actions/download-artifact#464 and main run 29591165512).
      - uses: ./.github/actions/download-artifact-retry
        with:
          name: dist-tar
      - run: tar -xf dist.tar
      # The Electron/Chromedriver e2e session occasionally fails to start on the
      # runner ("DevToolsActivePort file doesn't exist" / "POST /session" timeout).
      # The hang wedges the whole wdio run, so in-process retries don't recover —
      # only a fresh xvfb+Electron launch does. Retry the entire shard, cleaning
      # orphaned session processes before each attempt and when the step exits.
      # The runners are one job per PID-isolated container, so this cannot touch
      # another job. Wrap each attempt in `timeout` so a plain hang cannot stall
      # the job indefinitely.
      # Oracle gate (see the precheck job's plan step): `full` shards the whole
      # suite; `subset` distributes only the planned specs round-robin across the
      # same 8 shards (so no shard exceeds the per-shard memory budget the count
      # is tuned for); `skip` runs nothing. Every shard still reports a status, so
      # this composes with any required check without depending on an aggregate
      # gate first.
      - name: e2e shard ${{ matrix.shard }}/${{ env.SHARD_TOTAL }} (oracle-gated, retry on flaky session startup)
        if: >-
          needs.precheck.outputs.mode == 'full' ||
          needs.precheck.outputs.mode == 'subset'
        timeout-minutes: 18
        env:
          PLAN_MODE: ${{ needs.precheck.outputs.mode }}
          PLAN_SPECS: ${{ needs.precheck.outputs.specs }}
        run: |
          if [ "$PLAN_MODE" = "subset" ]; then
            # Round-robin the planned specs onto this shard; an empty slice means
            # this shard has nothing to do (subset smaller than 8) — report green.
            i=0
            SPEC_ARGS=""
            for s in $PLAN_SPECS; do
              if [ $(( i % SHARD_TOTAL )) -eq $(( ${{ matrix.shard }} - 1 )) ]; then
                SPEC_ARGS="$SPEC_ARGS --spec $s"
              fi
              i=$(( i + 1 ))
            done
            if [ -z "$SPEC_ARGS" ]; then
              echo "shard ${{ matrix.shard }}: no specs in this subset slice — nothing to run"
              exit 0
            fi
            SHARD_ARGS=""
            echo "oracle subset shard ${{ matrix.shard }}:${SPEC_ARGS}"
          else
            SHARD_ARGS="--shard ${{ matrix.shard }}/${{ env.SHARD_TOTAL }}"
            SPEC_ARGS=""
          fi
          # `timeout` is GNU coreutils — present on Linux, but on macOS it's
          # `gtimeout` (from `brew install coreutils`). Pick whichever exists;
          # fall back to no inner timeout (the step `timeout-minutes` still caps
          # a wedged run) so the command can't die with "timeout: not found".
          TIMEOUT="$(command -v timeout || command -v gtimeout || true)"

          cleanup_e2e_processes() {
            # Bracketed patterns avoid matching this shell's own command line.
            # A failed deleteSession can orphan any of these; self-hosted runner
            # containers are reused, so clean before attempt 1 as well as retries.
            pkill -TERM -f '[e]lectron/dist/electron' 2>/dev/null || true
            pkill -TERM -f '[e]lectron-chromedriver/bin/chromedriver' 2>/dev/null || true
            pkill -TERM -f '[X]vfb' 2>/dev/null || true
            pkill -TERM -f '[g]ortex' 2>/dev/null || true
            sleep 1
            pkill -KILL -f '[e]lectron/dist/electron' 2>/dev/null || true
            pkill -KILL -f '[e]lectron-chromedriver/bin/chromedriver' 2>/dev/null || true
            pkill -KILL -f '[X]vfb' 2>/dev/null || true
            pkill -KILL -f '[g]ortex' 2>/dev/null || true
          }

          capture_e2e_runner_diagnostics() {
            local attempt="$1"
            local attempt_status="$2"
            local diagnostics_dir="e2e-failure-artifacts"
            local diagnostics_file="${diagnostics_dir}/runner-attempt-${attempt}.txt"

            mkdir -p "$diagnostics_dir"
            {
              echo "captured_at=$(date --iso-8601=seconds 2>/dev/null || date)"
              echo "attempt=$attempt"
              echo "exit_status=$attempt_status"
              echo "runner_name=${RUNNER_NAME:-unknown}"
              echo "runner_os=${RUNNER_OS:-unknown}"
              echo "runner_arch=${RUNNER_ARCH:-unknown}"
              echo "runner_environment=${RUNNER_ENVIRONMENT:-unknown}"
              echo "github_run_id=${GITHUB_RUN_ID:-unknown}"
              echo "github_job=${GITHUB_JOB:-unknown}"
              echo "shard=${{ matrix.shard }}/${SHARD_TOTAL}"
              echo
              echo "## system"
              uname -a || true
              cat /etc/hostname 2>/dev/null || true
              echo
              echo "## cgroup"
              # Docker uses cgroup v2 on the burst hosts, while the v1 files
              # keep the artifact useful on older/self-managed Linux runners.
              for cgroup_file in \
                /sys/fs/cgroup/memory.current \
                /sys/fs/cgroup/memory.peak \
                /sys/fs/cgroup/memory.max \
                /sys/fs/cgroup/memory.events \
                /sys/fs/cgroup/memory.events.local \
                /sys/fs/cgroup/pids.current \
                /sys/fs/cgroup/pids.peak \
                /sys/fs/cgroup/pids.max \
                /sys/fs/cgroup/cpu.stat \
                /sys/fs/cgroup/io.stat \
                /sys/fs/cgroup/memory/memory.usage_in_bytes \
                /sys/fs/cgroup/memory/memory.max_usage_in_bytes \
                /sys/fs/cgroup/memory/memory.limit_in_bytes \
                /sys/fs/cgroup/memory/memory.failcnt \
                /sys/fs/cgroup/pids/pids.current \
                /sys/fs/cgroup/pids/pids.max; do
                if [ -r "$cgroup_file" ]; then
                  echo "### $cgroup_file"
                  cat "$cgroup_file"
                fi
              done
              echo
              echo "## memory"
              free -h || true
              echo
              echo "## processes by RSS"
              ps -eo pid,ppid,state,etimes,rss,vsz,comm --sort=-rss | head -n 80 || true
              echo
              echo "## filesystems"
              df -h / /tmp /dev/shm || true
              echo
              echo "## limits"
              ulimit -a || true
            } >"$diagnostics_file" 2>&1
            echo "Saved runner diagnostics to $diagnostics_file"
          }

          trap cleanup_e2e_processes EXIT
          # Two attempts, not three: attempt 2 absorbs the flaky-session-startup
          # case this retry exists for, while a deterministic failure (e.g. a
          # selector that can never match) previously burned three full 480s
          # attempts before reporting. Halves the cost of a genuine red shard.
          for attempt in 1 2; do
            cleanup_e2e_processes
            echo "::group::e2e shard ${{ matrix.shard }} attempt $attempt"
            if ${TIMEOUT:+$TIMEOUT -k 15 480} npm run test:e2e:ci -- $SHARD_ARGS $SPEC_ARGS; then
              echo "::endgroup::"
              exit 0
            else
              attempt_status=$?
            fi
            echo "::endgroup::"
            capture_e2e_runner_diagnostics "$attempt" "$attempt_status" || true
            echo "e2e shard ${{ matrix.shard }} attempt $attempt failed or timed out"
          done
          exit 1
      # The specs above call saveScreenshot as they run, so this shard's slice has
      # already re-rendered its reference PNGs into tests/e2e/screenshots/. Collect
      # whatever changed (vs the committed shots) and hand it to commit-screenshots
      # — no second e2e suite needed. PR-only; the sentinel keeps the artifact
      # non-empty when a shard rendered no diffs.
      - name: Collect changed reference screenshots
        if: success() && github.event_name == 'pull_request'
        run: |
          mkdir -p changed/tests/e2e/screenshots
          touch "changed/.shard-${{ matrix.shard }}"
          # Untracked PNGs are first-time reference shots from a new spec —
          # without ls-files --others they would never reach commit-screenshots
          # (filter-screenshots.mts already classifies untracked files).
          mapfile -t files < <(
            {
              git diff --name-only -- tests/e2e/screenshots/
              git ls-files --others --exclude-standard -- tests/e2e/screenshots/
            } | sort -u
          )
          for f in "${files[@]}"; do
            [ -n "$f" ] || continue
            cp "$f" "changed/tests/e2e/screenshots/"
          done
          echo "Collected ${#files[@]} changed screenshot(s) for shard ${{ matrix.shard }}"
      - uses: actions/upload-artifact@v7
        if: success() && github.event_name == 'pull_request'
        with:
          name: screenshots-shard-${{ matrix.shard }}
          path: changed/
          include-hidden-files: true
          if-no-files-found: error
          # Only consumed by commit-screenshots within this same run; it never
          # needs to outlive the run. Uploaded per shard on every PR, so the
          # default 90-day retention made this the largest draw on the org's
          # Actions storage quota. Expire fast, keeping a small debug window.
          retention-days: 3
      # On failure, surface the screenshot + page source captured in afterTest,
      # plus the per-attempt cgroup/process snapshot above. The latter is still
      # available when ChromeDriver is too dead to capture browser artifacts.
      # Skipped only when a hard runner OOM kills the whole job before this step.
      - uses: actions/upload-artifact@v7
        if: failure()
        continue-on-error: true
        with:
          name: e2e-failure-artifacts-shard-${{ matrix.shard }}
          path: e2e-failure-artifacts/
          if-no-files-found: ignore
          retention-days: 3

  # Auto-commit the reference screenshots the `e2e` gate already re-rendered.
  # Folds the old standalone e2e-screenshots workflow in here: rather than running
  # the whole seeded suite a SECOND time just to regenerate shots, we reuse the
  # PNGs the gate run produced (the specs write them as a side effect) and commit
  # the diff. One e2e run, not two. Same-repo PRs only (CI can't push to a fork
  # branch) and only after a green e2e run, so we never commit half-rendered shots.
  # Deliberately NOT in `ci-passed`'s needs: it's a side effect, not a gate.
  #
  # Write policy — OWNED, UNCONTESTED SHOTS ONLY. A rendered shot is auto-committed
  # only when this diff owns it AND nothing contests the write. Owned means the
  # oracle maps the diff to a spec that renders it, or someone hand-committed it on
  # this branch; the e2e tier re-renders far more than that (a broad selection
  # renders everything), and committing the rest attributed unrelated render drift
  # to whichever PR happened to run — a release-smoke fix once landed 17 refreshed
  # shots. Uncontested means the baseline was inherited from main (or is brand new)
  # and neither this branch (by a non-bot author) nor main has touched it since the
  # merge-base. Everything else is HELD — the branch's committed version stands —
  # and surfaced in the PR comment. Adding the `update-screenshots` label is the
  # explicit "regenerate and take CI's render" override, and is the escape hatch
  # when the oracle genuinely failed to map a render-affecting file to its shots.
  # (filter-screenshots.mts decides; scripts/lib/screenshot-scope.mts owns the rule.)
  #
  # It also reconciles screenshot conflicts: if main re-rendered the same reference
  # PNG, that binary file can't 3-way merge and the PR goes `dirty`. The reconcile
  # step merges main, keeping the freshly re-rendered shots for any screenshot-path
  # conflict (regenerated PNGs have no meaningful merge). Source-code conflicts are
  # NEVER auto-resolved — they abort the merge and get a "needs a human" PR comment.
  #
  # The checkout uses a PAT (secrets.SCREENSHOTS_PAT) rather than the default
  # GITHUB_TOKEN: GitHub will not start a new workflow run for a commit pushed with
  # GITHUB_TOKEN (recursion guard), so a token-pushed screenshot commit would land
  # as the PR head with no CI run and no `ci-passed` status — leaving the PR blocked
  # and auto-merge stuck. Pushing with a PAT makes the commit trigger CI normally so
  # `ci-passed` reports on the new head. That re-run is cheap: plan-e2e skips the
  # e2e tier for a screenshot-only commit (see its `mode=skip` shortcut). Falls back
  # to github.token when the secret is unset — commits still land, just without the
  # CI re-trigger (the pre-PAT behaviour).
  commit-screenshots:
    needs: [build, e2e]
    if: >-
      always() && needs.build.result == 'success' && needs.e2e.result == 'success' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ vars.CHECKS_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: write
      pull-requests: write
    outputs:
      # True when this job pushed a new commit, i.e. the SHA the rest of CI
      # gated is no longer the branch tip. Consumed by `ci-passed`.
      superseded: ${{ steps.push.outputs.superseded }}
    env:
      # The branch this PR is actually based on — `main` for day-to-day PRs,
      # `release` for a promotion PR. Every reconciliation below targets it, so
      # both tiers reconcile against the branch they will merge into and a future
      # branch rename cannot silently point this job at the wrong one. This job
      # only runs on `pull_request` (see the `if:` above), so `base_ref` is
      # always populated.
      BASE_REF: ${{ github.base_ref }}
    steps:
      # The PR can merge while this trailing job is still queued (auto-merge fires
      # the moment the e2e gate goes green), and GitHub then deletes the head
      # branch — so checking out by branch name fails with "branch not found" and
      # paints a red X on an already-merged PR (#1001). There is nothing to commit
      # screenshots to once the branch is gone; detect that first and no-op green.
      - name: Check head branch still exists
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref }}
          # Self-hosted CHECKS_RUNNER images ship curl+jq but not the gh CLI
          # (ci-runners/Dockerfile). Prefer the REST API over `gh api`.
          GITHUB_API_URL: ${{ github.api_url }}
        run: |
          ENC_BRANCH=$(printf '%s' "$BRANCH" | jq -sRr @uri)
          HTTP_STATUS=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${{ github.repository }}/branches/${ENC_BRANCH}") || {
              echo "::error::Could not query head branch '$BRANCH'; refusing to treat a transport failure as branch deletion."
              exit 1
            }
          case "$HTTP_STATUS" in
            200) echo "exists=true" >> "$GITHUB_OUTPUT" ;;
            404)
              echo "::notice::Head branch '$BRANCH' no longer exists (PR merged and branch deleted) — skipping screenshot commit."
              echo "exists=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Head branch lookup returned HTTP $HTTP_STATUS; refusing to skip screenshot reconciliation."
              exit 1
              ;;
          esac
      - uses: actions/checkout@v7.0.1
        if: steps.head.outputs.exists == 'true'
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.SCREENSHOTS_PAT || github.token }}
      - name: Download regenerated screenshots
        if: steps.head.outputs.exists == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: screenshots-*
          merge-multiple: true
          path: artifacts
      - name: Apply regenerated screenshots
        if: steps.head.outputs.exists == 'true'
        run: |
          if compgen -G "artifacts/tests/e2e/screenshots/*" > /dev/null; then
            cp -f artifacts/tests/e2e/screenshots/* tests/e2e/screenshots/
          fi
      # Drop sub-threshold render noise before staging, and hold contested shots. A
      # re-render of an unchanged screen still wobbles a few pixels (font hinting /
      # anti-alias), and committing that churns the reference shots for nothing.
      # filter-screenshots.mts pixel-compares each changed PNG against its committed
      # baseline and reverts the ones whose difference is below the noise threshold
      # (clearly-different shots stay). It also reverts CONTESTED shots — a baseline
      # deliberately committed on this branch by a non-bot author, or moved on the
      # base branch since the merge-base — so CI never overrides deliberate work (see the job
      # comment above). The reverted shots are reported back so the comment step can
      # offer them for manual review. Needs Node + pixelmatch/pngjs only — install
      # just those two into node_modules (an isolated, scripts-off install, ~0.3s)
      # rather than a full `npm ci`; this job otherwise needs no dependency tree.
      - uses: actions/setup-node@v7
        if: steps.head.outputs.exists == 'true'
        with:
          node-version: '22'
      - name: Filter sub-threshold screenshot noise
        if: steps.head.outputs.exists == 'true'
        id: filter
        env:
          UPDATE_SCREENSHOTS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'update-screenshots') }}
          # filter-screenshots.mts defaults this to `origin/main`; point it at the
          # PR's real base so a promotion PR contests against `release`.
          SCREENSHOT_MAIN_REF: origin/${{ github.base_ref }}
        run: |
          # The contested check compares against the base branch (merge-base,
          # branch authorship, base-side changes). fetch-depth: 0 above usually
          # brings it in already; fetch explicitly so a partial mirror can't
          # silently disable the check. Best-effort: on failure the filter degrades
          # to noise/flap-only (merge-base comes back empty), it doesn't clobber.
          git fetch --no-tags origin "$BASE_REF" || true
          npm install --no-save --no-audit --no-fund --ignore-scripts \
            --prefix /tmp/ssfilter pixelmatch pngjs
          # `node_modules` is committed as a symlink, so a bare `mkdir -p` errors
          # with "File exists". Drop it first so the copied deps resolve from a
          # real directory. (This job only commits screenshots, so removing the
          # symlink has no other effect.)
          rm -rf node_modules
          mkdir -p node_modules
          cp -r /tmp/ssfilter/node_modules/. node_modules/
          node scripts/filter-screenshots.mts
      - name: Detect screenshot changes
        if: steps.head.outputs.exists == 'true'
        id: diff
        run: |
          # Match Collect / filter-screenshots: e2e checks out the pull_request
          # merge commit (PR + base), so shots the base branch added since the PR
          # branched are present there and get re-rendered into the artifact. This
          # job checks out github.head_ref, where those paths are absent — Apply
          # therefore lands them as untracked. `git diff --name-only` alone
          # would miss them, skip the commit, and leave untracked PNGs that
          # make `git merge origin/$BASE_REF` refuse to start
          # ("untracked working tree files would be overwritten") — which the
          # reconcile step used to misread as a screenshot conflict and then
          # die on `git commit --no-edit` with no MERGE_HEAD.
          mapfile -t files < <(
            {
              git diff --name-only -- tests/e2e/screenshots/
              git ls-files --others --exclude-standard -- tests/e2e/screenshots/
            } | sort -u
          )
          if [ ${#files[@]} -eq 0 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          {
            echo "files<<EOF"
            printf '%s\n' "${files[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Commit screenshot updates
        if: steps.head.outputs.exists == 'true' && steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/screenshots/
          # No [skip ci]: let the pushed commit run CI so `ci-passed` reports on
          # the new HEAD — otherwise the PR sits `blocked` with no status on this
          # commit. It terminates in one extra run: a PNG-only diff makes the oracle
          # skip the e2e tier, so CI re-runs only lint/check/build, renders nothing,
          # and this job finds no further screenshots to commit.
          git commit -m "chore(e2e): update reference screenshots from CI"
      # Clear screenshot conflicts against the base branch. A reference PNG re-rendered
      # on BOTH the base and this PR is a binary file git can't merge, so the PR goes
      # `dirty` and STAYS that way: the render commit above only updates the head
      # branch, it never incorporates the base, so head's PNG keeps conflicting with
      # the base's PNG. Bring the base in here so the conflict actually resolves. Generated PNGs have no
      # meaningful 3-way merge, so each conflicting shot is resolved by OWNERSHIP:
      # the branch keeps (--ours) a shot the oracle maps to this diff or that
      # someone hand-committed here, and takes the base's (--theirs) for anything else.
      # Because the filter step above already reverted contested and out-of-scope
      # renders, --ours here means: the fresh render for uncontested owned shots,
      # and the branch's deliberately COMMITTED shot for contested ones — the
      # branch wins for what it owns, CI's render never displaces deliberate work,
      # and an unrelated re-render never reverts main.
      # We NEVER auto-resolve source code:
      # if anything outside tests/e2e/screenshots/ conflicts, abort and leave it to
      # a human (the `manual` output drives a PR comment below).
      #
      # The probe merge is --no-commit so a conflict-free PR is left byte-identical
      # — no needless merge commit baked onto a tidy branch, only onto one that was
      # genuinely conflicting. Runs regardless of the render diff above: a conflict
      # can exist even when this run re-rendered nothing new (the noise filter may
      # have reverted the wobble), so gating on `changed` would miss it.
      - name: Reconcile reference screenshots with the base branch
        if: steps.head.outputs.exists == 'true'
        id: reconcile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin "$BASE_REF"

          # Resolve ownership BEFORE any merge attempt: --own-paths reads the
          # branch's diff from the working tree, and a conflicted merge in progress
          # would fold the base's incoming changes into it and over-grant ownership.
          mapfile -t owned < <(node scripts/check-screenshots.mts --own-paths --base "origin/$BASE_REF")
          echo "Branch owns ${#owned[@]} reference shot(s)"

          # `git merge` returns non-zero for real conflicts AND for "untracked
          # working tree files would be overwritten" (no MERGE_HEAD). Only the
          # former is a conflict we can --ours; the latter must be cleared and
          # retried or failed loudly — never fall through to `git commit --no-edit`.
          try_merge() {
            git merge --no-commit --no-ff "origin/$BASE_REF"
          }
          clear_untracked_screenshots_blocking_merge() {
            mapfile -t blockers < <(
              git ls-files --others --exclude-standard -- tests/e2e/screenshots/
            )
            if [ ${#blockers[@]} -eq 0 ]; then
              return 1
            fi
            echo "Untracked screenshots blocked the merge — removing so the base branch can bring them in:"
            printf '%s\n' "${blockers[@]}"
            rm -f -- "${blockers[@]}"
            return 0
          }

          if try_merge; then
            # Clean (or already up to date) — don't bake a merge commit onto an
            # otherwise-tidy PR. --abort is a no-op / harmless when no merge started.
            git merge --abort 2>/dev/null || true
            echo "$BASE_REF merges cleanly; nothing to reconcile"
            exit 0
          fi
          if ! git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            if clear_untracked_screenshots_blocking_merge && try_merge; then
              git merge --abort 2>/dev/null || true
              echo "$BASE_REF merges cleanly after clearing untracked screenshots"
              exit 0
            fi
            if ! git rev-parse -q --verify MERGE_HEAD >/dev/null; then
              echo "::error::git merge origin/$BASE_REF failed without starting a merge (no MERGE_HEAD)"
              exit 1
            fi
          fi
          conflicts="$(git diff --name-only --diff-filter=U)"
          non_ss="$(printf '%s\n' "$conflicts" | grep -vE '^tests/e2e/screenshots/' || true)"
          if [ -n "$non_ss" ]; then
            echo "Source conflicts need manual resolution — not auto-resolving:"
            printf '%s\n' "$non_ss"
            {
              echo "manual=true"
              echo "manual-files<<EOF"
              printf '%s\n' "$non_ss"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            git merge --abort
            exit 0
          fi
          # Per-file resolution, not a blanket --ours. A shot this branch OWNS
          # (the oracle maps the diff to a spec that renders it, or someone
          # hand-committed it here) keeps the branch version. Anything else takes
          # main's — otherwise a branch that merely *re-rendered* an unrelated shot
          # reverts main's newer version on merge, the next PR flips it back, and
          # the shot ping-pongs between render states across PRs. `*` means scope
          # is unavailable (no merge-base) and every shot keeps --ours, the
          # pre-scope policy. See scripts/lib/screenshot-scope.mts.
          echo "Screenshot-only conflict — resolving by ownership"
          resolve_shot() {
            # `git checkout --ours/--theirs` reads the conflict's index stage, which
            # is absent when that side DELETED the shot (modify/delete). Removing
            # the file is the correct resolution for that side, so fall back to it
            # rather than dying under `set -e` mid-merge. `git add <dir>` below
            # stages the removal.
            local side="$1" path="$2"
            git checkout "--${side}" -- "$path" 2>/dev/null && return 0
            echo "    ${side} side deleted this shot — taking the deletion"
            git rm -q -f -- "$path"
          }
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            keep_ours=0
            for o in "${owned[@]}"; do
              if [ "$o" = '*' ] || [ "$o" = "$path" ]; then
                keep_ours=1
                break
              fi
            done
            if [ "$keep_ours" = 1 ]; then
              echo "  ours   $path (owned by this branch)"
              resolve_shot ours "$path"
            else
              echo "  theirs $path (not owned by this diff — keeping main's render)"
              resolve_shot theirs "$path"
            fi
          done <<< "$conflicts"
          git add tests/e2e/screenshots/
          # The push authenticates with SCREENSHOTS_PAT, a classic PAT without
          # `workflow` scope. If main advanced a file under .github/workflows/, the
          # merge folds it in and GitHub rejects the push ("refusing to allow a
          # Personal Access Token to create or update workflow ... without workflow
          # scope"), hard-failing the job. We can't drop main's workflow change
          # (reverting it to --ours would undo it when the PR merges), so abort the
          # merge and hand it to a human — the same policy as a source conflict.
          # Any screenshot render commit made above still pushes below; only the
          # unpushable merge is skipped. Grant the PAT `workflow` scope to let CI
          # resolve these automatically.
          wf="$(git diff --cached --name-only -- .github/workflows/ || true)"
          if [ -n "$wf" ]; then
            echo "Merge updates workflow files the PAT can't push — leaving to a human:"
            printf '%s\n' "$wf"
            git merge --abort
            {
              echo "workflow=true"
              echo "workflow-files<<EOF"
              printf '%s\n' "$wf"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit --no-edit
      - name: Push
        if: steps.head.outputs.exists == 'true'
        id: push
        env:
          RUN_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # No-op ("Everything up-to-date") when nothing was committed or merged, so
          # this is safe to run unconditionally — even on the manual-merge path it
          # just pushes the render commit (the aborted merge left HEAD untouched).
          git push
          NEW_SHA="$(git rev-parse HEAD)"
          echo "sha=$NEW_SHA" >> "$GITHUB_OUTPUT"
          # Did this job move the branch? If so the SHA this run gated is no
          # longer the tip, and `ci-passed` must not report green for it — see
          # the supersession check there. Covers both the screenshot commit and
          # the reconcile merge, since either advances HEAD.
          if [ -n "$RUN_HEAD_SHA" ] && [ "$NEW_SHA" != "$RUN_HEAD_SHA" ]; then
            echo "Head advanced ${RUN_HEAD_SHA} -> ${NEW_SHA}; this run's SHA is superseded."
            echo "superseded=true" >> "$GITHUB_OUTPUT"
          else
            echo "superseded=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Comment on PR with updated screenshots
        # Always run: when there's something to report (refreshed shots, ignored
        # noise, held flapping/contested renders, or a source conflict needing a
        # human) we post/update the summary; when there's nothing and a prior
        # comment exists we flip it to an "all match" note. The empty-and-no-comment
        # case no-ops inside the script.
        if: steps.head.outputs.exists == 'true'
        uses: actions/github-script@v9
        env:
          CHANGED_FILES: ${{ steps.diff.outputs.files }}
          COMMIT_SHA: ${{ steps.push.outputs.sha }}
          IGNORED_JSON: ${{ steps.filter.outputs.ignored-json }}
          FLAPPING_JSON: ${{ steps.filter.outputs.flapping-json }}
          CONTESTED_JSON: ${{ steps.filter.outputs.contested-json }}
          OUT_OF_SCOPE_JSON: ${{ steps.filter.outputs.out-of-scope-json }}
          MAIN_SHA: ${{ steps.filter.outputs.main-sha }}
          MANUAL_MERGE_FILES: ${{ steps.reconcile.outputs.manual-files }}
          WORKFLOW_MERGE_FILES: ${{ steps.reconcile.outputs.workflow-files }}
        with:
          script: |
            const marker = '<!-- copse-e2e-screenshots -->';
            const sha = process.env.COMMIT_SHA || context.sha;
            const repo = context.repo.owner + '/' + context.repo.repo;
            const files = (process.env.CHANGED_FILES || '').split('\n').filter(Boolean);
            const ignored = JSON.parse(process.env.IGNORED_JSON || '[]');
            const flapping = JSON.parse(process.env.FLAPPING_JSON || '[]');
            const contested = JSON.parse(process.env.CONTESTED_JSON || '[]');
            const outOfScope = JSON.parse(process.env.OUT_OF_SCOPE_JSON || '[]');
            const mainSha = process.env.MAIN_SHA || '';
            const manualMerge = (process.env.MANUAL_MERGE_FILES || '').split('\n').filter(Boolean);
            const workflowMerge = (process.env.WORKFLOW_MERGE_FILES || '').split('\n').filter(Boolean);
            const blob = (ref, path) => `https://github.com/${repo}/blob/${ref}/${path}?raw=1`;
            const sections = [];
            if (manualMerge.length) {
              const lines = manualMerge.map((path) => `- \`${path}\``);
              sections.push(
                `### Merge conflict needs a human (${manualMerge.length})\n\n` +
                  `Screenshot conflicts with \`main\` are resolved automatically, but these ` +
                  `**non-screenshot** files conflict and can't be auto-merged. Resolve them by ` +
                  `hand (merge or rebase \`main\`) — the screenshot reconcile was skipped:\n\n` +
                  lines.join('\n'),
              );
            }
            if (workflowMerge.length) {
              const lines = workflowMerge.map((path) => `- \`${path}\``);
              sections.push(
                `### Merge needs a human (${workflowMerge.length})\n\n` +
                  `Screenshot conflicts with \`main\` were resolved automatically, but the merge ` +
                  `updates these **workflow** files, which CI's token isn't scoped to push. Merge ` +
                  `or rebase \`main\` by hand — or grant the \`SCREENSHOTS_PAT\` the \`workflow\` ` +
                  `scope to let CI resolve these automatically:\n\n` +
                  lines.join('\n'),
              );
            }
            if (contested.length) {
              // Everything shown here is already committed somewhere, so plain blob
              // URLs work: main's version at the main tip, the branch's standing
              // version at the pushed head. The held CI render itself is in no
              // commit — labelling regenerates and commits it, making it visible.
              const rows = contested.map((s) => {
                const why = [
                  s.branchTouched ? 'committed on this branch' : null,
                  s.mainTouched ? 'changed on `main`' : null,
                ].filter(Boolean).join('; ');
                const diff = s.diffPixels == null ? 'differs' : `${s.diffPixels} px (${s.ratioPct})`;
                const base = mainSha ? `![main](${blob(mainSha, s.path)})` : '—';
                return `| \`${s.name}\`<br>${why}<br>CI render: ${diff} vs committed | ${base} | ![branch](${blob(sha, s.path)}) |`;
              });
              sections.push(
                `### Held — conflicts with committed work (${contested.length})\n\n` +
                  `CI re-rendered these, but their committed baselines are deliberate, so the fresh ` +
                  `render was **not** committed — the branch's version stands. To regenerate and take ` +
                  `CI's render instead, add the \`update-screenshots\` label:\n\n` +
                  `| shot | \`main\` | this branch |\n| --- | --- | --- |\n` +
                  rows.join('\n'),
              );
            }
            if (files.length) {
              const lines = files.map((path) => {
                const name = path.split('/').pop();
                const url = `https://github.com/${repo}/blob/${sha}/${path}`;
                return `- [${name}](${url}) — ![${name}](${url}?raw=1)`;
              });
              sections.push(
                `### Refreshed (${files.length})\n\n` +
                  `Clearly-different shots re-rendered by the CI e2e run and committed:\n\n` +
                  lines.join('\n'),
              );
            }
            if (ignored.length) {
              const noun = ignored.length === 1 ? 'shot' : 'shots';
              const verb = ignored.length === 1 ? 'was' : 'were';
              sections.push(
                `### Ignored as render noise (${ignored.length})\n\n` +
                  `${ignored.length} ${noun} re-rendered below the variance threshold ` +
                  `(font hinting / anti-alias wobble) and ${verb} **not** committed. To ` +
                  `accept them anyway, add the \`update-screenshots\` label or commit the ` +
                  `rendered PNGs by hand.`,
              );
            }
            if (flapping.length) {
              // The matched prior state IS committed (that's what makes it a flap),
              // so it can be shown inline at its commit's blob URL.
              const lines = flapping.map((s) => {
                const matched = s.matchedSha
                  ? `; matches ${s.matchedSha.slice(0, 7)}: ![prior](${blob(s.matchedSha, s.path)})`
                  : '';
                return `- \`${s.name}\` — ${s.diffPixels} px (${s.ratioPct})${matched}`;
              });
              sections.push(
                `### Held — render flapping (${flapping.length})\n\n` +
                  `These shots alternate between two runner render states and were **not** ` +
                  `committed, to stop the CI screenshot ping-pong ([#609](https://github.com/${repo}/issues/609)): ` +
                  `each re-render matched a recently committed version, so committing again would ` +
                  `just re-trigger CI and bring the other state back. If a real change is hiding ` +
                  `here, add the \`update-screenshots\` label to force it, or pin the runner ` +
                  `font/GPU rendering:\n\n` +
                  lines.join('\n'),
              );
            }
            if (outOfScope.length) {
              // Named individually rather than counted: a silent hold reads as
              // "nothing drifted", which is exactly the failure mode this replaces.
              const lines = outOfScope.map((s) => {
                const diff = s.diffPixels == null ? 'differs' : `${s.diffPixels} px (${s.ratioPct})`;
                return `- \`${s.name}\` — ${diff} vs committed`;
              });
              sections.push(
                `### Held — not owned by this diff (${outOfScope.length})\n\n` +
                  `The e2e run re-rendered these, but no spec the test oracle maps to this diff ` +
                  `produces them, so the difference is drift belonging to some other change — it ` +
                  `was **not** committed. This stops an unrelated PR rewriting screens it never ` +
                  `touched (and, on merge, reverting \`main\`'s newer render). If your change ` +
                  `really does move these shots and the oracle missed the mapping, add the ` +
                  `\`update-screenshots\` label to take CI's render:\n\n` +
                  lines.join('\n'),
              );
            }
            const body = sections.length
              ? [
                  marker,
                  '## E2E screenshot updates',
                  '',
                  sections.join('\n\n'),
                  '',
                  'These PNGs live under `tests/e2e/screenshots/` for human visual review; CI asserts DOM structure, not pixel diffs.',
                ].join('\n')
              : [marker, '## E2E screenshot updates', '', 'All screenshots match — nothing re-rendered above the noise threshold.'].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(
              (c) =>
                c.user?.type === 'Bot' &&
                typeof c.body === 'string' &&
                c.body.includes(marker),
            );
            // Nothing to report and no prior comment to reconcile — don't open a
            // fresh "all match" thread on every unrelated PR.
            if (!sections.length && !existing) {
              return;
            }
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  # Single aggregate gate. Require ONLY this check in branch protection: it
  # `needs` every other job (and e2e's result aggregates all 8 shards), so it
  # turns the whole pipeline into one green/red status. New jobs or e2e shard
  # counts can change without touching the required-checks list — just add the
  # job to `needs` here. `if: always()` so this runs even when an upstream job
  # fails/is skipped; we then assert none failed or were cancelled. Fork PRs
  # have their own explicit safe-tier result below: they may pass only after
  # `precheck` actually ran on a GitHub-hosted runner, never merely because all
  # code-executing jobs were skipped.
  #
  # Concurrency supersession: top-level `cancel-in-progress` cancels in-flight
  # jobs when a newer push/sync arrives on the same ref. Those cancelled jobs
  # must not paint the superseded SHA's `CI Passed` red — tip CI is the gate
  # that matters. We detect supersession by (1) comparing this run's head SHA
  # to the live tip, and (2) looking for a newer CI workflow run on the same
  # head SHA (same-SHA supersession — e.g. a delayed nightly schedule sharing
  # `ci-refs/heads/main` with a tip push). Genuine cancels of the tip with no
  # newer run (manual cancel, runner death) still fail. Sibling-matrix cancels
  # after a real shard failure still fail because `ANY_FAILURE` is true first.
  ci-passed:
    # A push to trunk (`main`) intentionally skips the expensive tier. Give that
    # run a distinct check context so its green result on the same head SHA
    # cannot satisfy `release`'s required `CI Passed` check before promotion e2e
    # has run.
    #
    # The literal name stays `Develop CI Passed` even though trunk is no longer
    # called `develop`: it is a check-context string that branch protection may
    # match on by name, so renaming it is a separate change that has to land
    # together with the protection rule.
    name: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'Develop CI Passed' || 'CI Passed' }}
    if: always()
    needs: [precheck, check, bench, build, e2e, commit-screenshots]
    # Tiny aggregate gate. Prefer self-hosted (CHECKS_RUNNER) to save Actions
    # minutes; hosted fallback when unset. Fails closed either way: if the fleet
    # is saturated this stays pending (never green), so it can't wave a run
    # through without its required status check.
    runs-on: ${{ vars.CHECKS_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      - name: Check upstream job results
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          RUN_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          # Self-hosted CHECKS_RUNNER images ship curl+jq but not the gh CLI
          # (ci-runners/Dockerfile). #1017 moved this gate back onto that fleet,
          # so tip/supersession lookups must use the REST API — `gh api` fails
          # with `gh: command not found` and the gate fail-closes on every
          # concurrency cancel (false red on main).
          GITHUB_API_URL: ${{ github.api_url }}
        run: |
          # Thin REST helper — curl+jq are on both hosted and self-hosted images.
          api_get() {
            curl -fsS \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${GITHUB_API_URL}/$1"
          }
          FORK_PR=${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          if $FORK_PR; then
            if [ "${{ needs.precheck.result }}" != "success" ]; then
              echo "Fork PR safe check tier was not executed successfully."
              echo '${{ toJSON(needs) }}'
              exit 1
            fi
            echo "Fork PR safe check tier passed; privileged jobs were intentionally skipped."
            exit 0
          fi
          # The screenshot job runs AFTER e2e and pushes reference PNGs to the PR
          # head. Before this check, `ci-passed` could go green on a SHA that job
          # was about to supersede — so auto-merge (which fires the moment the
          # gate is green) could merge the PR before its screenshots landed. The
          # head branch is then deleted, the job no-ops green by design (#1001),
          # and the shots are silently lost: `main` keeps stale references for a
          # change that moved them.
          #
          # Fail closed on the superseded SHA instead. The screenshot commit
          # creates a new head, that run is screenshots-only so the oracle
          # reports mode=skip, this job finds nothing to push, and the gate goes
          # green on a tip whose references are final. Terminates in exactly one
          # extra cheap cycle.
          if [ "${{ needs.commit-screenshots.outputs.superseded }}" = "true" ]; then
            echo "Reference screenshots were committed on top of ${RUN_HEAD_SHA}."
            echo "This SHA is superseded; the gate will report on the new tip."
            exit 1
          fi
          MODE="${{ needs.precheck.outputs.mode }}"
          ANY_FAILURE=${{ contains(needs.*.result, 'failure') }}
          ANY_CANCELLED=${{ contains(needs.*.result, 'cancelled') }}
          CORE_OK=${{ needs.precheck.result == 'success' }}
          # Skip-mode runs (screenshots-only pushes, e.g. the e2e screenshot
          # bot's own commits) intentionally do not execute check/build/e2e;
          # those jobs surface as 'cancelled', which must not fail the gate —
          # that painted every bot push red and blocked auto-merge (issue
          # #609). Genuine failures still fail even in skip mode.
          if [ "$MODE" = "skip" ]; then
            if $ANY_FAILURE || ! $CORE_OK; then
              echo "Skip-mode run has a genuine failure:"
              echo '${{ toJSON(needs) }}'
              exit 1
            fi
            echo "All CI jobs passed (heavy jobs intentionally skipped: mode=skip)."
            exit 0
          fi
          # Demand e2e only when the `e2e` job was actually dispatched. Its own
          # `if:` skips drafts (no `ci-full`) and zero-shard plans, so mirroring
          # those two guards here is what keeps the demand and the dispatch in
          # step. Without the draft guard a main-based DRAFT deadlocked: e2e
          # skipped because it was a draft, and this gate failed because e2e had
          # not succeeded, so `CI Passed` could never go green — and since a base
          # retarget does not re-run CI, the red outlived the move to `develop`.
          PROMOTION_PR=${{ github.event_name == 'pull_request' && github.base_ref == 'release' && github.event.pull_request.head.repo.full_name == github.repository && (github.event.pull_request.draft == false || contains(github.event.pull_request.labels.*.name, 'ci-full')) }}
          if $PROMOTION_PR && [ "${{ needs.precheck.outputs.e2e_shard_total }}" != "0" ] && [ "${{ needs.e2e.result }}" != "success" ]; then
            echo "Promotion PR e2e did not complete successfully (result=${{ needs.e2e.result }})."
            echo '${{ toJSON(needs) }}'
            exit 1
          fi
          if $ANY_FAILURE; then
            echo "One or more CI jobs failed:"
            echo '${{ toJSON(needs) }}'
            exit 1
          fi
          if $ANY_CANCELLED; then
            # Fail closed if we cannot resolve tip — a tip cancel must stay red.
            if [ -n "$PR_NUMBER" ]; then
              TIP_SHA=$(api_get "repos/${REPOSITORY}/pulls/${PR_NUMBER}" | jq -er .head.sha) || {
                echo "Could not resolve PR tip SHA; treating cancel as failure."
                echo '${{ toJSON(needs) }}'
                exit 1
              }
            else
              ENC_REF=$(printf '%s' "$REF_NAME" | jq -sRr @uri)
              TIP_SHA=$(api_get "repos/${REPOSITORY}/commits/${ENC_REF}" | jq -er .sha) || {
                echo "Could not resolve branch tip SHA; treating cancel as failure."
                echo '${{ toJSON(needs) }}'
                exit 1
              }
            fi
            if [ -n "$TIP_SHA" ] && [ "$TIP_SHA" != "$RUN_HEAD_SHA" ]; then
              echo "Run superseded by newer tip ${TIP_SHA} (this SHA=${RUN_HEAD_SHA}); cancelled jobs are concurrency noise."
              echo '${{ toJSON(needs) }}'
              exit 0
            fi
            # Same tip, but a newer CI run on this SHA may have taken the
            # concurrency slot (delayed schedule, re-run, workflow_dispatch).
            NEWER_RUN_ID=$(api_get \
              "repos/${REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${RUN_HEAD_SHA}&per_page=20" \
              | jq -r "[.workflow_runs[] | select(.id > ${CURRENT_RUN_ID}) | .id][0] // empty") || {
              echo "Could not resolve newer workflow runs; treating cancel as failure."
              echo '${{ toJSON(needs) }}'
              exit 1
            }
            if [ -n "$NEWER_RUN_ID" ]; then
              echo "Run superseded by newer CI run ${NEWER_RUN_ID} on tip ${RUN_HEAD_SHA}; cancelled jobs are concurrency noise."
              echo '${{ toJSON(needs) }}'
              exit 0
            fi
            echo "One or more CI jobs were cancelled while still at tip (${RUN_HEAD_SHA}):"
            echo '${{ toJSON(needs) }}'
            exit 1
          fi
          echo "All CI jobs passed (or were intentionally skipped)."
