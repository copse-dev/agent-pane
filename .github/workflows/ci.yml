name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      # Full seeded e2e gate (see wdio.ci.conf.ts). Skips network/git/timing flakes.
      # Retries recover occasional Electron session startup failures on the runner.
      - name: e2e (retry on flaky session startup)
        run: |
          for attempt in 1 2 3; do
            echo "::group::e2e attempt $attempt"
            if npm run test:e2e:ci; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "e2e attempt $attempt failed"
          done
          exit 1
