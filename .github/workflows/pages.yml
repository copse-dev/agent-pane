name: Deploy site

# Publishes the copse.dev marketing site (site/) to GitHub Pages.
# Pages source must be set to "GitHub Actions" in repo Settings → Pages
# (classic Pages can only serve from the repo root or /docs, not /site).

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # CHECKS_RUNNER routes to the self-hosted check fleet when set (see
    # ci.yml's routing note); hosted otherwise. Trusted main-branch content
    # only, and deploy-pages/OIDC work fine from self-hosted runners.
    runs-on: ${{ vars.CHECKS_RUNNER || 'ubuntu-latest' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
