name: Deploy site

# Publishes the copse.dev site (site/) to GitHub Pages, plus any per-PR demo
# previews staged on the machine-managed `demo-previews` branch, served under
# copse.dev/pr-<n>/. Pages source must be set to "GitHub Actions" in repo
# Settings → Pages (classic Pages can only serve from the repo root or /docs,
# not /site).
#
# GitHub Pages allows one deployment per repo and each deploy REPLACES the whole
# published tree, so previews cannot be deployed independently of the site. This
# job is the single assembler: it lays down site/ at the root, then overlays
# every demo-previews/pr-*/ directory under its own path. It runs on a site push
# (below) and is also invoked via workflow_call by demo-preview.yml and
# demo-preview-cleanup.yml after they mutate the previews branch, so a preview
# publish and a site update both deploy through this one path.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  workflow_call:
    outputs:
      page_url:
        description: The deployed GitHub Pages base URL.
        value: ${{ jobs.deploy.outputs.page_url }}

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; let an in-progress run finish. Preview
# publishes and site pushes share this group and therefore serialize.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # CHECKS_RUNNER routes to the self-hosted check fleet when set (see
    # ci.yml's routing note); hosted otherwise. Trusted main-branch content
    # only, and deploy-pages/OIDC work fine from self-hosted runners.
    runs-on: ${{ vars.CHECKS_RUNNER || 'ubuntu-latest' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Always publish the marketing site from `main`, even when this deploy was
      # invoked (workflow_call) by a preview push on a feature branch. A preview
      # can therefore only ever add or change its own pr-<n>/ subtree — never the
      # site — so pre-merge preview deploys can't ship unreviewed site changes.
      - uses: actions/checkout@v7.0.0
        with:
          ref: main
      # Assemble the published tree: the marketing site at the root, then every
      # per-PR demo preview from the machine-managed demo-previews branch laid
      # down under its pr-<n>/ subdirectory. The previews branch may not exist
      # yet (no preview ever published) — that is expected; we then ship site/
      # alone. Each pr-<n>/ already contains the demo files at its root, so it
      # is served at copse.dev/pr-<n>/ with the demo's document-relative asset
      # URLs resolving correctly.
      - name: Assemble site and demo previews
        run: |
          set -euo pipefail
          rm -rf _site _previews
          mkdir -p _site
          cp -R site/. _site/
          if git ls-remote --exit-code --heads origin demo-previews >/dev/null 2>&1; then
            git fetch --depth=1 origin demo-previews
            mkdir -p _previews
            git archive FETCH_HEAD | tar -x -C _previews
            shopt -s nullglob
            for dir in _previews/pr-*/; do
              name="$(basename "$dir")"
              echo "Adding demo preview: $name"
              cp -R "$dir" "_site/$name"
            done
          else
            echo "No demo-previews branch yet — publishing site only."
          fi
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
