name: Deploy site

# Publishes the marketing site (site/) to GitHub Pages, plus browser demos
# staged on the machine-managed `demo-previews` branch. All demos and preview
# bundles are served below /demo/: persistent /demo/main/ and /demo/release/
# builds plus ephemeral /demo/pr-<n>/ and /demo/pr-<n>-preview/ builds. Pages
# source must be set to "GitHub Actions" in repo Settings → Pages (classic Pages
# can only serve from the repo root or /docs, not /site).
#
# GitHub Pages allows one deployment per repo and each deploy REPLACES the whole
# published tree, so previews cannot be deployed independently of the site. This
# job is the single assembler: it lays down site/ at the root, then mounts every
# directory from demo-previews below /demo/. A site update and a preview publish
# both deploy through this one path.

on:
  push:
    # `demo-previews` is the machine-managed preview store. demo-preview.yml and
    # demo-preview-cleanup.yml mutate it, and that push is the deploy trigger —
    # they used to call this workflow directly, which is what made deploys queue
    # (see the concurrency note below). `release` covers marketing-site changes.
    #
    # No `paths` filter: GitHub applies it to every branch in the trigger, and
    # every demo-previews push is by construction a content change worth
    # deploying. The cost is that a release push with no site change also
    # deploys, which at one promotion a day is noise next to what this saves.
    branches: [release, demo-previews]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; let an in-progress run finish. Preview
# publishes and site pushes share this group and therefore serialize.
#
# Deliberately NOT `queue: max`. This job assembles whatever is on the
# demo-previews tip, not the content of whichever run scheduled it, so two
# queued deploys publish the same tree twice and only the last one can matter.
# Keeping every one of them meant a burst of preview publishes became a backlog
# that drained no faster than an ~11-minute full-tree upload — deploys were
# observed starting six and a half hours after they were created, and the PR
# comment that waited on them landed seven hours after the push.
#
# GitHub's default single pending slot is the behaviour we want: a newer pending
# deploy supersedes an older one. That was previously rejected because it
# cancelled a job the PR was waiting on and painted the PR red — no longer true,
# now that publishing triggers this by pushing to demo-previews instead of
# calling it, so no PR check waits on this run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # CHECKS_RUNNER routes to the self-hosted check fleet when set (see
    # ci.yml's routing note); hosted otherwise. Trusted main-branch content
    # only, and deploy-pages/OIDC work fine from self-hosted runners.
    runs-on: ${{ vars.CHECKS_RUNNER || 'ubuntu-latest' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Always publish the marketing site from `main`, even when this deploy was
      # triggered by a preview publish landing on demo-previews. A preview
      # can therefore only ever add or change its own /demo/ subtree — never the
      # site — so pre-merge preview deploys can't ship unreviewed site changes.
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      # Assemble the published tree: the marketing site at the root and every
      # machine-managed preview directory below /demo/. The previews branch may
      # not exist yet (no demo ever published) — that is expected; we then ship
      # site/ alone.
      - name: Assemble site and demo previews
        run: |
          set -euo pipefail
          rm -rf _site _previews
          mkdir -p _site
          cp -R site/. _site/
          if git ls-remote --exit-code --heads origin demo-previews >/dev/null 2>&1; then
            git fetch --depth=1 origin demo-previews
            mkdir -p _previews
            git archive FETCH_HEAD | tar -x -C _previews
            shopt -s nullglob
            for dir in _previews/release/ _previews/main/ _previews/pr-*/; do
              [ -d "$dir" ] || continue
              name="$(basename "$dir")"
              echo "Adding demo: demo/$name"
              mkdir -p "_site/demo/$name"
              cp -R "$dir". "_site/demo/$name/"
            done
          else
            echo "No demo-previews branch yet — publishing site only."
          fi
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
