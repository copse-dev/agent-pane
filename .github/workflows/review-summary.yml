name: Copse review summary

# The pull request's description summary (docs/plans/copse-reviewer.md, §PR
# description summary): a risk level and a short overview kept at the bottom of
# the description, replaced in place. "Copse review trigger" dispatches this
# default-branch workflow on every push to a ready or labelled pull request,
# and when one is opened or becomes ready, so a summary appears in minutes; the
# full review in "Copse review findings" rewrites it later with the findings'
# evidence, provided the pull request has not moved on.
#
# Nothing from the pull request is executed. The CLI is this branch's, runs
# with `--summary-only` (read-only checkouts, one tool-free model turn over the
# diff) and needs no container, no Stage 0 and no ground run. The model key is
# the only secret, and it stays in the protected environment's one step.
#
# The description is edited with this job's own `GITHUB_TOKEN`, not the Copse
# App token the review posts with. GitHub starts no workflow run for an event
# the workflow token causes, so the `edited` event this write fires does not
# start a second full CI run on the same head (ci.yml subscribes to `edited`
# for base retargets). An App-token edit did, on every push.

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number resolved by the trusted trigger
        required: true
        type: string
      head:
        description: Exact pull request head the summary describes
        required: true
        type: string
      base:
        description: Base branch resolved by the trusted trigger
        required: true
        type: string

run-name: copse-review-summary pr=${{ inputs.pr }} head=${{ inputs.head }}

permissions:
  contents: read
  pull-requests: read

# A newer push supersedes an in-flight summary of an older head.
concurrency:
  group: copse-review-summary-${{ inputs.pr }}
  cancel-in-progress: true

jobs:
  authorize:
    name: Authorize the paid summary without model credentials
    if: >-
      ${{ github.repository_id == '1274237362' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.workflow_ref == 'copse-dev/agent-pane/.github/workflows/review-summary.yml@refs/heads/main' &&
      contains(fromJSON('["338988","41898282"]'), github.actor_id) &&
      contains(fromJSON('["jonathanKingston","github-actions[bot]"]'), github.triggering_actor) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      authorized: ${{ steps.pr.outputs.authorized }}
    steps:
      - uses: actions/github-script@v9
        id: pr
        env:
          PR_NUMBER: ${{ inputs.pr }}
          EXPECTED_HEAD: ${{ inputs.head }}
          EXPECTED_BASE: ${{ inputs.base }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const number = process.env.PR_NUMBER;
            if (!/^[1-9][0-9]*$/.test(number)) {
              core.setFailed('pr must be a positive pull request number');
              return;
            }
            const { data: pull } = await github.rest.pulls.get({
              owner, repo, pull_number: Number(number),
            });
            if (pull.state !== 'open' || pull.user?.id !== 338988 ||
                pull.head.repo?.id !== 1274237362 || pull.base.repo?.id !== 1274237362 ||
                pull.head.sha !== process.env.EXPECTED_HEAD ||
                pull.base.ref !== process.env.EXPECTED_BASE) {
              core.notice('Paid summaries require a current owner PR from this repository.');
              return;
            }
            const labels = pull.labels.map(label => label.name);
            // The same rule as the review: ready, or a draft with the label.
            if (labels.includes('copse-review-skip') ||
                (pull.draft && !labels.includes('copse-review'))) {
              core.notice('Paid summaries skip copse-review-skip and unlabelled draft PRs.');
              return;
            }
            core.setOutput('authorized', 'true');

  summary:
    name: Summarise the pull request in its description
    needs: authorize
    # Recheck on this job too: a failed-job rerun may reuse authorize's outputs.
    if: >-
      ${{ needs.authorize.outputs.authorized == 'true' &&
      github.repository_id == '1274237362' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.workflow_ref == 'copse-dev/agent-pane/.github/workflows/review-summary.yml@refs/heads/main' &&
      contains(fromJSON('["338988","41898282"]'), github.actor_id) &&
      contains(fromJSON('["jonathanKingston","github-actions[bot]"]'), github.triggering_actor) }}
    environment: copse-review-models
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only this job's token may write, and only pull requests: the description
    # edit needs it (see the header).
    permissions:
      contents: read
      pull-requests: write
    env:
      # The same model route as the review; see review-findings.yml.
      REVIEW_PROFILE: ${{ vars.COPSE_REVIEW_PR_PROFILE || 'openrouter-luna' }}
      COPSE_REVIEW_OPENROUTER_PROVIDER: ${{ vars.COPSE_REVIEW_OPENROUTER_PROVIDER || 'openai' }}
      REVIEW_PROVIDER: ${{ vars.COPSE_REVIEW_PROVIDER || 'openai-compatible' }}
      REVIEW_MODEL: ${{ vars.COPSE_REVIEW_MODEL || 'qwen3.8-27b' }}
      REVIEW_BASE_URL: ${{ vars.COPSE_REVIEW_BASE_URL || vars.SCW_GENERATIVE_API_URL || 'https://api.scaleway.ai/v1' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          # Keep ancestry for merge-base; hydrate only trees we actually read.
          filter: blob:none
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Activate the pinned pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare --activate
          pnpm --version

      - name: Install the reviewer
        shell: bash
        run: pnpm install --frozen-lockfile --ignore-scripts --filter "@copse/review..."

      - name: Resolve the pull request and fetch its head
        id: pr
        shell: bash
        env:
          EXPECTED_BASE: ${{ inputs.base }}
          EXPECTED_HEAD: ${{ inputs.head }}
          EXPECTED_PR: ${{ inputs.pr }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_PR" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          git check-ref-format --branch "$EXPECTED_BASE"
          number="$EXPECTED_PR"
          IFS=$'\t' read -r head base state author_id head_repo_id base_repo_id draft labelled skipped < <(
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${number}" \
              --jq '[.head.sha, .base.ref, .state, .user.id, .head.repo.id, .base.repo.id, .draft,
                ([.labels[].name] | index("copse-review") != null),
                ([.labels[].name] | index("copse-review-skip") != null)] | @tsv'
          )
          test "$state" = "open"
          test "$base" = "$EXPECTED_BASE"
          test "$author_id" = 338988 && test "$head_repo_id" = 1274237362 && test "$base_repo_id" = 1274237362
          test "$skipped" = false
          test "$draft" = false || test "$labelled" = true
          # A newer push has dispatched its own summary; this one has nothing to say.
          if test "$head" != "$EXPECTED_HEAD"; then
            echo "::notice::the pull request has moved on to ${head}; not summarising ${EXPECTED_HEAD}"
            echo "current=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --quiet origin \
            "+refs/pull/${number}/head:refs/remotes/pr/${number}" \
            "+refs/heads/${base}:refs/remotes/origin/${base}"
          test "$(git rev-parse "refs/remotes/pr/${number}")" = "$head"
          echo "current=true" >> "$GITHUB_OUTPUT"
          echo "number=${number}" >> "$GITHUB_OUTPUT"
          echo "base=${base}" >> "$GITHUB_OUTPUT"

      - name: Summarise the pull request and update its description
        if: steps.pr.outputs.current == 'true'
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.COPSE_REVIEW_OPENROUTER_API_KEY }}
          COPSE_REVIEW_API_KEY: ${{ secrets.COPSE_REVIEW_API_KEY || secrets.SCW_GENERATIVE_API_KEY }}
          # The workflow token, so the edit starts no CI run (see the header).
          COPSE_REVIEW_FORGE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          BASE_REF: ${{ steps.pr.outputs.base }}
        run: |
          set -euo pipefail
          case "$REVIEW_PROFILE" in
            configured) unset OPENROUTER_API_KEY ;;
            openrouter-luna)
              unset COPSE_REVIEW_API_KEY SCW_DEFAULT_PROJECT_ID
              if test -z "$OPENROUTER_API_KEY"; then
                echo "::error::Set COPSE_REVIEW_OPENROUTER_API_KEY in the protected copse-review-models environment"
                exit 1
              fi
              REVIEW_PROVIDER=openrouter
              REVIEW_MODEL=openai/gpt-6-luna
              REVIEW_BASE_URL=https://openrouter.ai/api/v1
              ;;
            *) echo "::error::Unknown PR reviewer profile"; exit 1 ;;
          esac
          review_base_url="${REVIEW_BASE_URL%/}"
          if test "$review_base_url" = "https://api.scaleway.ai/v1"; then
            if test -z "$SCW_DEFAULT_PROJECT_ID"; then
              echo "::error::SCW_DEFAULT_PROJECT_ID is required for explicit Scaleway billing attribution"
              exit 1
            fi
            if [[ ! "$SCW_DEFAULT_PROJECT_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]; then
              echo "::error::SCW_DEFAULT_PROJECT_ID is not a lowercase UUID"
              exit 1
            fi
            review_base_url="https://api.scaleway.ai/${SCW_DEFAULT_PROJECT_ID}/v1"
          fi
          node packages/review/bin/copse-review.mjs \
            --foreign \
            --summary-only \
            --head "refs/remotes/pr/${PR_NUMBER}" \
            --base "origin/${BASE_REF}" \
            --scratch-parent "$RUNNER_TEMP" \
            --provider "$REVIEW_PROVIDER" \
            --model "$REVIEW_MODEL" \
            --base-url "$review_base_url" \
            --post-summary github \
            --repo "$GITHUB_REPOSITORY" \
            --pr "$PR_NUMBER"
