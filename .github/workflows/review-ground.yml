name: Copse review ground
run-name: copse-review-ground pr=${{ github.event.issue.number }}

# Shell C, job A (docs/plans/copse-reviewer.md, §Execution isolation, "Backend
# per shell — CI"). Opt-in by label: add `copse-review` to a pull request and
# this workflow starts from the default branch on the `issues:labeled` event,
# which fires for pull requests too. A small resolver job reads the PR metadata
# but checks out and executes nothing. A separate `permissions: {}` job receives
# only the resolved number, head and base, checks out the trusted default-branch
# reviewer, then fetches the PR head as data. With no secrets, credentials removed
# after checkout and a fresh hosted runner, contributor code has nothing privileged
# to reach. It runs Stage 0 (build,
# typecheck, lint, test on head, and on base for whatever failed on head) with
# the runner itself as the execution cell and uploads the report. Nothing here
# can reach a model or a token: the runner is ephemeral and holds neither,
# which is what lets a contributor's code run.
#
# The model stages run in "Copse review findings", triggered by this
# workflow's completion on the base ref, with the key and a write token; that
# job never executes the pull request's code. The artefact is the only thing
# that crosses between them, and it is validated there before use.

on:
  issues:
    types: [labeled]

permissions: {}

concurrency:
  group: copse-review-ground-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  resolve:
    name: Resolve the labelled pull request without executing it
    if: github.event.issue.pull_request != null && github.event.label.name == 'copse-review'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      number: ${{ steps.pr.outputs.number }}
      head: ${{ steps.pr.outputs.head }}
      base: ${{ steps.pr.outputs.base }}
    steps:
      - name: Resolve the current pull request head and base
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          IFS=$'\t' read -r head base state < <(
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
              --jq '[.head.sha, .base.ref, .state] | @tsv'
          )
          test -n "$head" && test -n "$base" && test "$state" = "open"
          echo "number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "head=${head}" >> "$GITHUB_OUTPUT"
          echo "base=${base}" >> "$GITHUB_OUTPUT"

  ground:
    name: Stage 0 on the pull request head
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Repeat the workflow-level denial at the execution boundary so a future
    # sibling job cannot make this job inherit broader permissions.
    permissions: {}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # Use the reviewed CLI from the default branch. The PR head is fetched
          # below and executed only by Stage 0's secret-free execution cell.
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Activate the pinned pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare --activate
          pnpm --version

      # Only the reviewer and its workspace dependencies, with no lifecycle
      # scripts: the pull request's own install runs inside Stage 0, under the
      # reviewer's own rules, not here.
      - name: Install the reviewer
        shell: bash
        run: pnpm install --frozen-lockfile --ignore-scripts --filter "@copse/review..."

      - name: Run Stage 0 with the runner as the cell
        shell: bash
        env:
          HEAD_SHA: ${{ needs.resolve.outputs.head }}
          BASE_REF: ${{ needs.resolve.outputs.base }}
          PR_NUMBER: ${{ needs.resolve.outputs.number }}
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet origin \
            "+refs/pull/${PR_NUMBER}/head:refs/remotes/pr/${PR_NUMBER}" \
            "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          test "$(git rev-parse "refs/remotes/pr/${PR_NUMBER}")" = "$HEAD_SHA"
          mkdir -p ground
          printf '{"pr":%s,"headSha":"%s","baseRef":"%s"}\n' "$PR_NUMBER" "$HEAD_SHA" "$BASE_REF" > ground/meta.json
          # Findings never affect the exit code; a refused execution (3) or an
          # undetectable project (2) does, and then there is no ground to upload.
          node packages/review/bin/copse-review.mjs \
            --foreign \
            --head "refs/remotes/pr/${PR_NUMBER}" \
            --base "origin/${BASE_REF}" \
            --backend ephemeral-runner \
            --no-model \
            --json ground/report.json

      - uses: actions/upload-artifact@v7
        with:
          name: copse-review-ground
          path: ground/
          retention-days: 7
          if-no-files-found: error
