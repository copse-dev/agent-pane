name: Copse review ground
run-name: copse-review-ground pr=${{ inputs.pr }}

# Shell C, job A (docs/plans/copse-reviewer.md, §Execution isolation, "Backend
# per shell — CI"). `review-trigger.yml` dispatches this workflow from its
# default-branch `pull_request_target:labeled` resolver; the target-context
# workflow never executes pull-request code. Its ground job has no token
# permissions or secrets. It checks out the trusted default-branch reviewer,
# then fetches the exact resolved PR head as data. With credentials removed
# after checkout and a fresh hosted runner, contributor code has nothing
# privileged to reach. It runs Stage 0 (build,
# typecheck, lint, test on head, and on base for whatever failed on head) as a
# dedicated unprivileged user on the ephemeral runner and uploads the report.
# Nothing in that job can reach a model or a privileged token. The job's
# Actions runtime token, which `permissions: {}` does not remove, lives only in
# later steps the runner user executes; the cell user has no sudo and cannot
# read or write the runner's home, where those actions and command files live
# (packages/review/ci/ground-as-cell-user.sh).
#
# A separate, fresh handoff job gets only Actions-dispatch permission after
# grounding succeeds. It explicitly dispatches "Copse review findings" on the
# base ref with this run id; that job gets the model key and review token but
# its trusted host never executes pull-request code. Brokered focused commands
# run in that job's separate network-disabled container with a scrubbed
# environment. The ground artefact is validated there before use.

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number resolved by the trusted trigger
        required: true
        type: string
      head:
        description: Exact pull request head SHA resolved by the trusted trigger
        required: true
        type: string
      base:
        description: Base branch resolved by the trusted trigger
        required: true
        type: string
      fresh:
        description: Ignore previous successful grounding and rerun all checks
        default: false
        type: boolean

permissions: {}

concurrency:
  group: copse-review-ground-${{ inputs.pr }}
  cancel-in-progress: true

jobs:
  reuse:
    name: Look for verified grounding of the same revision
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # A cache/setup outage must not make a successful fresh grounding run fail.
    continue-on-error: true
    permissions:
      contents: read
      actions: read
    outputs:
      run_id: ${{ steps.reuse.outputs.run_id }}
    steps:
      - uses: actions/checkout@v7.0.1
        if: ${{ !inputs.fresh }}
        with:
          ref: ${{ github.sha }}
          filter: blob:none
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        if: ${{ !inputs.fresh }}
        with:
          node-version-file: '.nvmrc'
      - name: Install only trusted reviewer dependencies
        if: ${{ !inputs.fresh }}
        run: |
          corepack enable
          corepack prepare --activate
          pnpm install --frozen-lockfile --ignore-scripts --filter "@copse/review..."
      - name: Validate previous run, policy and report
        id: reuse
        if: ${{ !inputs.fresh }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr }}
          HEAD_SHA: ${{ inputs.head }}
          BASE_REF: ${{ inputs.base }}
        run: node packages/review/ci/reuse-ground.mts

  ground:
    needs: reuse
    if: always() && !cancelled() && needs.reuse.outputs.run_id == ''
    name: Stage 0 on the pull request head
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Repeat the workflow-level denial at the execution boundary so a future
    # sibling job cannot make this job inherit broader permissions.
    permissions: {}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # Use the reviewed CLI from the default branch. The PR head is fetched
          # below and executed only by Stage 0's secret-free execution cell.
          ref: ${{ github.sha }}
          # Keep ancestry for merge-base; hydrate only trees we actually review.
          filter: blob:none
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      # The review cell inherits only a scrubbed PATH and a disposable HOME.
      # Provision the same native tools the full unit gate expects before the
      # contributor ref is fetched, while this job still contains only trusted
      # default-branch code. Apt's /usr/bin Cargo is intentional: rustup's shim
      # depends on the runner HOME that the cell must not inherit.
      - name: Provision the Stage 0 test toolchain
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap cargo ripgrep socat
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          command -v bwrap
          command -v cargo
          command -v rg
          command -v rustc
          command -v socat
          bwrap --unshare-all --dev-bind / / --die-with-parent true

      - name: Activate the pinned pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare --activate
          pnpm --version

      # Only the reviewer and its workspace dependencies, with no lifecycle
      # scripts: the pull request's own install runs inside Stage 0, under the
      # reviewer's own rules, not here.
      - name: Install the reviewer
        shell: bash
        run: pnpm install --frozen-lockfile --ignore-scripts --filter "@copse/review..."

      # Pull-request code runs as a separate user with no sudo and no access
      # to the runner's home, so it cannot reach the actions and command files
      # later steps execute with the job's Actions runtime token.
      - name: Run Stage 0 as the unprivileged review cell user
        shell: bash
        env:
          HEAD_SHA: ${{ inputs.head }}
          BASE_REF: ${{ inputs.base }}
          PR_NUMBER: ${{ inputs.pr }}
          OUT_DIR: ground
        run: |
          set -euo pipefail
          setup_node_bin="$(dirname "$(command -v node)")"
          export PATH="${setup_node_bin}:/usr/bin:${PATH}"
          test "$(command -v cargo)" = /usr/bin/cargo
          test "$(command -v node)" = "${setup_node_bin}/node"
          mkdir -p ground
          printf '{"pr":%s,"headSha":"%s","baseRef":"%s"}\n' "$PR_NUMBER" "$HEAD_SHA" "$BASE_REF" > ground/meta.json
          bash packages/review/ci/ground-as-cell-user.sh

      - uses: actions/upload-artifact@v7
        with:
          name: copse-review-ground
          path: ground/
          retention-days: 7
          if-no-files-found: error

  handoff:
    name: Dispatch findings after secret-free grounding
    needs: [reuse, ground]
    if: >-
      always() && !cancelled() &&
      (needs.ground.result == 'success' ||
      (needs.reuse.result == 'success' && needs.reuse.outputs.run_id != '' && needs.ground.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # This is a fresh runner. It checks out, downloads and executes nothing;
    # the untrusted ground job above never receives this token.
    permissions:
      actions: write
    steps:
      - name: Dispatch the container-backed findings workflow
        shell: bash
        env:
          BASE_REF: ${{ inputs.base }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          GROUND_RUN_ID: ${{ needs.reuse.outputs.run_id || github.run_id }}
          HEAD_SHA: ${{ inputs.head }}
          PR_NUMBER: ${{ inputs.pr }}
        run: |
          set -euo pipefail
          gh workflow run review-findings.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$DEFAULT_BRANCH" \
            -f "ground_run_id=${GROUND_RUN_ID}" \
            -f "pr=${PR_NUMBER}" \
            -f "head=${HEAD_SHA}" \
            -f "base=${BASE_REF}"
