name: Sync model catalog

# Refreshes packages/llm/src/model-catalog.generated.ts from BerriAI/litellm's
# public price + context-window catalog and opens a PR if anything changed.
# See packages/llm/src/model-catalog.ts for the data flow.

on:
  schedule:
    # Mondays at 11:00 UTC. LiteLLM ships updates within a few days of vendor
    # changes, so a weekly cadence catches drift without spamming PRs.
    - cron: '0 11 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    # CHECKS_RUNNER routes to the self-hosted check fleet when set (see
    # ci.yml's routing note); hosted otherwise. Scheduled, trusted-main only.
    runs-on: ${{ vars.CHECKS_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7.0.1

      # Same install path as ci.yml's check job: lifecycle scripts must run so
      # node-pty (and esbuild optional deps) are present for `npm run check`.
      # The old `npm ci --ignore-scripts` left pty.node missing and failed ~75
      # unit tests that import main-process code through node-pty.
      - uses: ./.github/actions/setup

      - name: Regenerate model catalog
        run: npm run sync:models

      # `npm run check` covers typecheck + lint + format:check + unit tests,
      # including model-catalog.test.ts which asserts every TRACKED_MODELS
      # entry has data. If LiteLLM ever drops or renames a tracked id, this
      # step fails and the PR is never opened — exactly the fail-fast we want.
      - name: Validate
        env:
          # Match the normal CI lint guard. ESLint's default ~2 GB V8 heap can
          # OOM here even when the tiny generated catalog is valid; the check
          # fleet leaves enough room for a 3 GB heap inside its ~6 GB cgroup.
          NODE_OPTIONS: --max-old-space-size=3072
        run: npm run check

      # Short-lived installation token from the copse-release-bot App, in place
      # of the SYNC_PR_TOKEN PAT. Scoped to this repository (create-github-app-
      # token's default when `repositories` is empty) and to exactly the two
      # permissions create-pull-request needs; expires in ~1h. Pinning the
      # permissions matters — the App is installed org-wide, so an inherited
      # token would carry every permission the installation ever gains.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open PR if catalog changed
        uses: peter-evans/create-pull-request@v8
        with:
          # Open the PR as the App rather than with the default GITHUB_TOKEN.
          # Two reasons (same as sync-streaming-markdown.yml):
          #   1. Org policy blocks GITHUB_TOKEN from creating PRs ("GitHub
          #      Actions is not permitted to create or approve pull requests"),
          #      so the default-token path fails at PR creation even though the
          #      branch pushes fine.
          #   2. A PR opened by GITHUB_TOKEN does not trigger downstream
          #      workflows (CI), whereas one opened by an App token does —
          #      so the catalog PR gets a real CI run automatically.
          token: ${{ steps.app-token.outputs.token }}
          branch: chore/sync-model-catalog
          delete-branch: true
          commit-message: 'chore(models): sync pricing & context windows from LiteLLM'
          title: 'chore(models): sync pricing & context windows from LiteLLM'
          labels: dependencies
          body: |
            Auto-generated by [`sync-model-catalog.yml`](.github/workflows/sync-model-catalog.yml)
            from [BerriAI/litellm's `model_prices_and_context_window.json`](https://github.com/BerriAI/litellm/blob/main/model_prices_and_context_window.json).

            Review the diff in `packages/llm/src/model-catalog.generated.ts` and confirm the new
            input/output rates and context windows match each vendor's pricing page before merging.

            `npm run check` already passed on this branch.
