name: Promote main to release

# `main` is the integration branch (trunk); `release` is the release-ready branch.
# Open one daily promotion PR and let the release ruleset's required `CI Passed`
# check decide when it is safe to merge.
#
# The PR's head is `promote/main`, a branch this workflow points at the `main`
# commit it read, not `main` itself. With `main` as the head, every merge to
# trunk moved the PR and cancelled its full-tier CI, so on a busy day the
# promotion only merged once trunk went quiet — 10 to 16 hours after it opened.
# A pinned head is tested once and merges as soon as that run is green.
#
# A red run leaves the PR open for a human to diagnose. The next scheduled run,
# or a manual dispatch, fast-forwards `promote/main` to the current `main` and
# re-runs CI, so a fix on trunk reaches the promotion then rather than on push.
# The branch only ever fast-forwards along `main`, and `release` merges it with a
# merge commit, so every promoted commit stays an ancestor of `release`. It is
# deleted on merge and recreated by the next run.
on:
  schedule:
    # After the 06:17 UTC nightly full run, and off the top of the hour to avoid
    # GitHub Actions' busiest cron window.
    - cron: '17 8 * * *'
  workflow_dispatch:

concurrency:
  group: promote-main-to-release
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Require promotion App credentials
        env:
          APP_ID: ${{ secrets.RELEASE_APP_ID }}
          APP_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_KEY" ]; then
            echo "RELEASE_APP_ID / RELEASE_APP_PRIVATE_KEY are required to open promotion PRs and trigger CI" >&2
            exit 1
          fi

      # copse-release-bot installation token in place of the SYNC_PR_TOKEN PAT.
      # Contents: write as well as Pull requests: write — opening the PR needs
      # only the latter, but enabling auto-merge is a merge and wants both.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Pin main, open the promotion PR and enable auto-merge
        uses: actions/github-script@v9
        with:
          # GITHUB_TOKEN-created PRs do not trigger downstream workflows, and
          # this organization blocks that token from creating PRs. The App is
          # a distinct actor, so neither restriction applies to it.
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { owner, repo } = context.repo;
            const base = 'release';
            const source = 'main';
            const head = 'promote/main';

            // Read `main` once; everything below promotes exactly this commit.
            const { data: sourceRef } = await github.rest.git.getRef({
              owner,
              repo,
              ref: `heads/${source}`,
            });
            const sha = sourceRef.object.sha;

            // A promotion is complete only when every `main` commit is an
            // ancestor of `release`. Comparing trees would mistake a squash merge
            // for a complete promotion even though it discards that ancestry.
            const comparison = await github.request(
              'GET /repos/{owner}/{repo}/compare/{basehead}',
              { owner, repo, basehead: `${base}...${sha}` },
            );
            if (comparison.data.ahead_by === 0) {
              core.info(`${source} has no commits to promote.`);
              return;
            }

            // Pin the promotion head. The App token is a distinct actor, so the
            // move triggers CI on an open PR as a normal push would.
            let pinned = null;
            try {
              const { data } = await github.rest.git.getRef({ owner, repo, ref: `heads/${head}` });
              pinned = data.object.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (pinned === null) {
              await github.rest.git.createRef({ owner, repo, ref: `refs/heads/${head}`, sha });
              core.info(`Created ${head} at ${sha}.`);
            } else if (pinned !== sha) {
              // Never forced: `promote/main` only ever holds an earlier `main`
              // commit, so anything but a fast-forward means someone pushed to it
              // by hand, and that commit must not reach `release`.
              await github.rest.git.updateRef({ owner, repo, ref: `heads/${head}`, sha, force: false });
              core.info(`Fast-forwarded ${head} from ${pinned} to ${sha}.`);
            } else {
              core.info(`${head} is already at ${sha}.`);
            }

            const open = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              base,
              head: `${owner}:${head}`,
              per_page: 100,
            });
            if (open.length > 1) {
              core.setFailed(`Found ${open.length} open ${head} -> ${base} pull requests.`);
              return;
            }

            let pull = open[0];
            if (!pull) {
              const created = await github.rest.pulls.create({
                owner,
                repo,
                base,
                head,
                title: 'Promote main to release',
                body: [
                  'Daily automated promotion of `main` to the release-ready `release` branch.',
                  '',
                  '`promote/main` holds the `main` commit this promotion tests; later merges',
                  'to `main` do not move it, so they cannot cancel its CI. The next',
                  'scheduled run, or a manual dispatch of `Promote main to release`,',
                  'fast-forwards it to the current `main`.',
                  '',
                  'The repository ruleset requires the full `CI Passed` gate. This PR will',
                  'merge automatically when that gate is green; failures leave it open',
                  'until the underlying issue is fixed on `main` and the branch moves.',
                ].join('\n'),
              });
              pull = created.data;
              core.info(`Opened promotion PR #${pull.number}.`);
            } else {
              core.info(`Reusing promotion PR #${pull.number}.`);
            }

            if (pull.draft) {
              core.setFailed(`Promotion PR #${pull.number} is unexpectedly a draft.`);
              return;
            }
            if (pull.auto_merge) {
              core.info(`Auto-merge is already enabled on PR #${pull.number}.`);
              return;
            }

            await github.graphql(
              `mutation EnablePromotionAutoMerge($pullRequestId: ID!) {
                enablePullRequestAutoMerge(input: {
                  pullRequestId: $pullRequestId
                  mergeMethod: MERGE
                }) {
                  pullRequest { number }
                }
              }`,
              { pullRequestId: pull.node_id },
            );
            core.info(`Enabled merge auto-merge on PR #${pull.number}.`);
