name: Copse review findings

# Shell C, job B (docs/plans/copse-reviewer.md, §Execution isolation, "Backend
# per shell — CI"). Runs after "Copse review ground" succeeds and its fresh
# handoff job dispatches this default-branch workflow with the model key. This
# job builds a credential-free, network-disabled container and primes its
# read-only dependency store before minting the existing Copse App's narrowly
# scoped review token. The model loop stays on the trusted host; only brokered
# focused commands and reproducers enter that container, whose environment has
# no model, cloud, workflow, or App credential. The Stage 0 report remains
# untrusted input and is validated before a field reaches a model. Then one
# review is posted on the pull request: each anchored finding an inline comment
# on the head commit, the rest in the body.
#
# The fresh handoff job at the end of "Copse review ground" explicitly
# dispatches this workflow. `workflow_dispatch` is GitHub's documented
# exception that always starts a workflow when called with `GITHUB_TOKEN`;
# an implicit `workflow_run` event is suppressed for a token-dispatched run.
# The host must not run anything the fork wrote. The CLI is this branch's and
# `--stage0-json` is read-only by default; this workflow explicitly attaches a
# hardened container cell for focused validation.

on:
  workflow_dispatch:
    inputs:
      ground_run_id:
        description: Successful Copse review ground run containing the artifact
        required: true
        type: string
      pr:
        description: Pull request number resolved by the trusted trigger
        required: true
        type: string
      head:
        description: Exact pull request head grounded by the secret-free job
        required: true
        type: string
      base:
        description: Base branch resolved by the trusted trigger
        required: true
        type: string

run-name: copse-review-findings pr=${{ inputs.pr }} ground=${{ inputs.ground_run_id }}

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: copse-review-findings-${{ inputs.ground_run_id }}
  cancel-in-progress: true

jobs:
  findings:
    name: Review the pull request and post the findings
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Copse dogfoods the existing Scaleway OpenAI-compatible route. Repository
      # variables can move the reviewer without editing the workflow; a
      # dedicated key takes precedence when another deployment supplies one.
      REVIEW_PROVIDER: ${{ vars.COPSE_REVIEW_PROVIDER || 'openai-compatible' }}
      REVIEW_MODEL: ${{ vars.COPSE_REVIEW_MODEL || 'qwen3.8-27b' }}
      REVIEW_BASE_URL: ${{ vars.COPSE_REVIEW_BASE_URL || vars.SCW_GENERATIVE_API_URL || 'https://api.scaleway.ai/v1' }}
      REVIEW_LENSES: ${{ vars.COPSE_REVIEW_LENSES || 'correctness' }}
      REVIEW_MAX_STEPS: ${{ vars.COPSE_REVIEW_MAX_STEPS || '12' }}
      REVIEW_MAX_VERIFY: ${{ vars.COPSE_REVIEW_MAX_VERIFY || '3' }}
      REVIEW_CELL_IMAGE: copse-review-cell:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Activate the pinned pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare --activate
          pnpm --version

      - name: Install the reviewer
        shell: bash
        run: pnpm install --frozen-lockfile --ignore-scripts --filter "@copse/review..."

      # The handoff inputs come from trusted workflow code on a fresh runner,
      # not from the ground artefact. Verify the named run and resolve the
      # current PR again before a byte of untrusted output reaches the model.
      - name: Verify the ground run and resolve the pull request
        id: pr
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_BASE: ${{ inputs.base }}
          EXPECTED_HEAD: ${{ inputs.head }}
          EXPECTED_PR: ${{ inputs.pr }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GROUND_RUN_ID: ${{ inputs.ground_run_id }}
        run: |
          set -euo pipefail
          [[ "$GROUND_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXPECTED_PR" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          git check-ref-format --branch "$EXPECTED_BASE"

          # This workflow can start just before its dispatching handoff job
          # exits. Wait briefly for the ground run itself to become successful.
          for attempt in {1..12}; do
            IFS=$'\t' read -r run_name title event status conclusion branch path < <(
              gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GROUND_RUN_ID}" \
                --jq '[.name, .display_title, .event, .status, (.conclusion // ""), .head_branch, .path] | @tsv'
            )
            if test "$status" = "completed"; then
              break
            fi
            sleep 5
          done
          test "$run_name" = "copse-review-ground pr=${EXPECTED_PR}"
          test "$title" = "copse-review-ground pr=${EXPECTED_PR}"
          test "$event" = "workflow_dispatch"
          test "$status" = "completed"
          test "$conclusion" = "success"
          test "$branch" = "$DEFAULT_BRANCH"
          test "$path" = ".github/workflows/review-ground.yml"

          number="$EXPECTED_PR"
          IFS=$'\t' read -r head base state < <(
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${number}" \
              --jq '[.head.sha, .base.ref, .state] | @tsv'
          )
          test -n "$number" && test -n "$head" && test -n "$base"
          test "$state" = "open"
          test "$head" = "$EXPECTED_HEAD"
          test "$base" = "$EXPECTED_BASE"
          echo "number=${number}" >> "$GITHUB_OUTPUT"
          echo "head=${head}" >> "$GITHUB_OUTPUT"
          echo "base=${base}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v6
        with:
          name: copse-review-ground
          path: ground
          run-id: ${{ inputs.ground_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Build only trusted default-branch Dockerfile content, then prime the
      # exact head's dependency store from data-only lockfile inputs. This all
      # happens before model or App credentials enter any step. The later CLI
      # mounts the store read-only into a network-disabled container.
      - name: Prepare the focused-validation cell
        shell: bash
        env:
          HEAD_SHA: ${{ steps.pr.outputs.head }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          BASE_REF: ${{ steps.pr.outputs.base }}
        run: |
          set -euo pipefail
          node_version="$(tr -d '[:space:]' < .nvmrc)"
          docker build --pull \
            --build-arg "NODE_VERSION=${node_version}" \
            --tag "$REVIEW_CELL_IMAGE" \
            --file packages/review/Dockerfile.cell \
            packages/review

          git fetch --no-tags --quiet origin \
            "+refs/pull/${PR_NUMBER}/head:refs/remotes/pr/${PR_NUMBER}" \
            "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          test "$(git rev-parse "refs/remotes/pr/${PR_NUMBER}")" = "$HEAD_SHA"

          dependency_seed="$RUNNER_TEMP/copse-review-findings-dependencies"
          mkdir -p "$dependency_seed"
          git show "${HEAD_SHA}:pnpm-lock.yaml" > "$dependency_seed/pnpm-lock.yaml"
          if git cat-file -e "${HEAD_SHA}:patches" 2>/dev/null; then
            git archive --format=tar "$HEAD_SHA" patches | tar -xf - -C "$dependency_seed"
          fi
          pnpm fetch --frozen-lockfile --dir "$dependency_seed"

      # Reviews should carry the same Copse App identity as the repository's
      # deploy automation. Keep the workflow token read-only and mint only the
      # one write permission the final REST call needs.
      - name: Mint the Copse GitHub App review token
        id: review-app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-pull-requests: write

      - name: Review with focused validation and post the findings
        shell: bash
        env:
          COPSE_REVIEW_API_KEY: ${{ secrets.COPSE_REVIEW_API_KEY || secrets.SCW_GENERATIVE_API_KEY }}
          COPSE_REVIEW_FORGE_TOKEN: ${{ steps.review-app-token.outputs.token }}
          SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          HEAD_SHA: ${{ steps.pr.outputs.head }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          BASE_REF: ${{ steps.pr.outputs.base }}
        run: |
          set -euo pipefail
          review_base_url="${REVIEW_BASE_URL%/}"
          if test "$review_base_url" = "https://api.scaleway.ai/v1"; then
            if test -z "$SCW_DEFAULT_PROJECT_ID"; then
              echo "::error::SCW_DEFAULT_PROJECT_ID is required for explicit Scaleway billing attribution"
              exit 1
            fi
            if [[ ! "$SCW_DEFAULT_PROJECT_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]; then
              echo "::error::SCW_DEFAULT_PROJECT_ID is not a lowercase UUID"
              exit 1
            fi
            review_base_url="https://api.scaleway.ai/${SCW_DEFAULT_PROJECT_ID}/v1"
            echo "::notice::Copse Reviewer is using an explicit Scaleway project endpoint"
          fi
          # The report is for exactly this commit, or the CLI refuses it.
          test "$(git rev-parse "refs/remotes/pr/${PR_NUMBER}")" = "$HEAD_SHA"
          node packages/review/bin/copse-review.mjs \
            --foreign \
            --head "refs/remotes/pr/${PR_NUMBER}" \
            --base "origin/${BASE_REF}" \
            --stage0-json ground/report.json \
            --backend container \
            --image "$REVIEW_CELL_IMAGE" \
            --scratch-parent "$RUNNER_TEMP" \
            --trusted-prepare "$GITHUB_WORKSPACE/scripts/prepare-review-stage0.mts" \
            --provider "$REVIEW_PROVIDER" \
            --model "$REVIEW_MODEL" \
            --base-url "$review_base_url" \
            --lenses "$REVIEW_LENSES" \
            --max-steps "$REVIEW_MAX_STEPS" \
            --max-verify "$REVIEW_MAX_VERIFY" \
            --post-review github \
            --repo "$GITHUB_REPOSITORY" \
            --pr "$PR_NUMBER" \
            --json findings.json \
            --sarif findings.sarif \
            --events findings.events.jsonl

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: copse-review-findings
          path: |
            findings.json
            findings.sarif
            findings.events.jsonl
          retention-days: 30
          if-no-files-found: ignore
