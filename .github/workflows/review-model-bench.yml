name: Copse Reviewer model benchmark

# Manual, advisory quality measurement for the dogfood profile or an explicit
# OpenRouter experiment. This workflow executes only trusted benchmark fixtures from
# the default branch. It never checks out or executes pull-request code.

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Model profile (OpenRouter requires the protected environment secret)
        required: true
        type: choice
        default: configured
        options:
          - configured
          - openrouter-luna
          - openrouter-sol
      case:
        description: One case (timer-leak by default), or all for the full corpus
        required: false
        type: string
        default: timer-leak
      lenses:
        description: Comma-separated reviewer lenses
        required: true
        default: correctness,boundaries
        type: string

permissions:
  contents: read

concurrency:
  group: copse-review-model-bench
  cancel-in-progress: false

jobs:
  benchmark:
    name: Run the labelled reviewer corpus
    # Both identities matter: a rerun uses the original actor's permissions.
    # Pin the workflow ref as well as the checkout; branch workflow edits must
    # never turn this into a route to a paid model key.
    if: >-
      ${{ github.repository_id == '1274237362' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.workflow_ref == 'copse-dev/agent-pane/.github/workflows/review-model-bench.yml@refs/heads/main' &&
      github.actor_id == '338988' &&
      github.triggering_actor == 'jonathanKingston' }}
    environment: copse-review-models
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      REVIEW_PROFILE: ${{ inputs.profile || 'configured' }}
      REVIEW_PROVIDER: ${{ vars.COPSE_REVIEW_PROVIDER || 'openai-compatible' }}
      REVIEW_MODEL: ${{ vars.COPSE_REVIEW_MODEL || 'qwen3.8-27b' }}
      REVIEW_BASE_URL: ${{ vars.COPSE_REVIEW_BASE_URL || vars.SCW_GENERATIVE_API_URL || 'https://api.scaleway.ai/v1' }}
      REVIEW_LENSES: ${{ inputs.lenses || 'correctness,boundaries' }}
      REVIEW_CASE: ${{ inputs.case }}
      REVIEW_MAX_STEPS: ${{ vars.COPSE_REVIEW_MAX_STEPS || '12' }}
      REVIEW_MAX_VERIFY: ${{ vars.COPSE_REVIEW_MAX_VERIFY || '3' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Activate the pinned pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare --activate
          pnpm --version

      - name: Install the reviewer
        shell: bash
        run: pnpm install --frozen-lockfile --ignore-scripts --filter "@copse/review..."

      - name: Run the advisory real-model benchmark
        shell: bash
        env:
          # Environment-only name: never fall back to the org-wide key.
          OPENROUTER_API_KEY: ${{ secrets.COPSE_REVIEW_OPENROUTER_API_KEY }}
          COPSE_REVIEW_API_KEY: ${{ secrets.COPSE_REVIEW_API_KEY || secrets.SCW_GENERATIVE_API_KEY }}
          SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
        run: |
          set -euo pipefail
          case "$REVIEW_PROFILE" in
            configured) ;;
            openrouter-luna|openrouter-sol)
              # Never send the fallback Scaleway key to an OpenRouter experiment.
              unset COPSE_REVIEW_API_KEY SCW_DEFAULT_PROJECT_ID
              if test -z "$OPENROUTER_API_KEY"; then
                echo "::error::Set COPSE_REVIEW_OPENROUTER_API_KEY only in the protected copse-review-models environment"
                exit 1
              fi
              REVIEW_PROVIDER=openrouter
              REVIEW_MODEL="openai/gpt-6-${REVIEW_PROFILE#openrouter-}"
              REVIEW_BASE_URL=https://openrouter.ai/api/v1
              REVIEW_MAX_STEPS=12
              REVIEW_MAX_VERIFY=3
              ;;
            *)
              echo "::error::Unknown reviewer benchmark profile"
              exit 1
              ;;
          esac
          review_base_url="${REVIEW_BASE_URL%/}"
          if test "$review_base_url" = "https://api.scaleway.ai/v1"; then
            if test -z "$SCW_DEFAULT_PROJECT_ID"; then
              echo "::error::SCW_DEFAULT_PROJECT_ID is required for explicit Scaleway billing attribution"
              exit 1
            fi
            if [[ ! "$SCW_DEFAULT_PROJECT_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]; then
              echo "::error::SCW_DEFAULT_PROJECT_ID is not a lowercase UUID"
              exit 1
            fi
            review_base_url="https://api.scaleway.ai/${SCW_DEFAULT_PROJECT_ID}/v1"
            echo "::notice::Copse Reviewer benchmark is using an explicit Scaleway project endpoint"
          fi
          bench_args=(
            scripts/bench-review.mts
            --provider "$REVIEW_PROVIDER"
            --model "$REVIEW_MODEL"
            --challenger "$REVIEW_MODEL"
            --base-url "$review_base_url"
            --lenses "$REVIEW_LENSES"
            --max-steps "$REVIEW_MAX_STEPS"
            --max-verify "$REVIEW_MAX_VERIFY"
            --out bench-results/review-model
          )
          if test -n "$REVIEW_CASE" && test "$REVIEW_CASE" != all; then
            bench_args+=(--case "$REVIEW_CASE")
          fi
          pnpm exec node "${bench_args[@]}"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: copse-review-model-bench
          path: bench-results/review-model/
          retention-days: 30
          if-no-files-found: error
