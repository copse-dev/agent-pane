          const path = require('node:path');
          const check = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'menu-carrier-check/receipt.json')));
          assert.equal(check.checkInvocations, 1);
          assert.equal(check.status, 0, 'Full carrier check failed or timed out');
          assert.equal(check.error, null);
          assert.equal(check.evidenceError, null);
          assert.equal(check.finalGitStatus, '');
          const diagnostic = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'menu-screenshot-diagnostic/receipt.json')));
          assert.equal(diagnostic.builds, 1);
          assert.equal(diagnostic.nativeInvocations, 2);
          assert.deepEqual(diagnostic.errors, []);
          assert.equal(diagnostic.finalGitStatus, '');
          assert.ok(diagnostic.invocationResults.every(result => result.state === 'passed'));
