name: Thread container (Docker path)

# The unattended container runtime (`containerRunsEnabled`) is hardened by design, but its
# integration tests need a real Docker daemon, so the main `CI` workflow's unit tier never ran
# them (`COPSE_THREAD_CONTAINER_E2E` was set nowhere). This workflow runs them on a hosted
# runner, where Docker is preinstalled and egress to the registry, apt and npm is open.
#
# ADVISORY, not a required check, on purpose: it has not yet been observed green on a hosted
# runner, and it is deliberately not part of the `CI Passed` aggregate (which is pinned by
# scripts/ci-workflow-invariants.test.ts). Promote it into that aggregate only after it has
# stayed green across a representative run of PRs and nightlies — see
# docs/plans/default-on-readiness.md, "Unattended container runs".
on:
  pull_request:
    paths:
      - 'src/main/services/container-runtime/**'
      - 'src/main/services/security/runtime-containment.ts'
      - 'src/shared/container-run-schema.ts'
      - 'src/shared/types/unattended-run.ts'
      - '.github/workflows/thread-container.yml'
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: thread-container-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/codex/composer-canonical-diagnostic-20261114' }}

jobs:
  docker-path:
    name: Docker-path integration tests
    # Fork PRs get no secrets and no trust; the nightly and dispatch runs cover them after merge.
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      !(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/composer-canonical-diagnostic-20261114') &&
      !(github.event_name == 'pull_request' && github.head_ref == 'codex/composer-canonical-diagnostic-20261114')
    runs-on: ubuntu-24.04
    # A cold run builds the worker image (15 minute cap inside the test) and then runs a few
    # short containers. The cap is a leak-stopper, not a latency target.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Show the container engine
        shell: bash
        run: |
          set -euo pipefail
          docker version
          docker info --format '{{.ServerVersion}} {{.SecurityOptions}} cgroup={{.CgroupVersion}}'
      - name: Run the Docker-path integration tests
        env:
          COPSE_THREAD_CONTAINER_E2E: '1'
        run: npm test -- src/main/services/container-runtime/thread-container.integration.test.ts src/main/services/container-runtime/acp-container.integration.test.ts

  composer-canonical-pair:
    name: Bounded composer capture diagnostic (two fixed sources)
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'copse-dev/agent-pane' &&
      github.ref == 'refs/heads/codex/composer-canonical-diagnostic-20261114' &&
      github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      COPSE_E2E_HEADLESS: '0'
      COPSE_PANEL_MOCK_LLM: '1'
      DIAGNOSTIC_RUNNER_ENVIRONMENT: ${{ runner.environment }}
      ANTHROPIC_API_KEY: ''
      OPENAI_API_KEY: ''
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Freeze reviewed inputs and select first immutable source
        run: python3 tests/fixtures/composer-capture-diagnostic/run.py prepare
      - uses: ./.github/actions/setup
      - name: Cache verified R2 baseline objects
        uses: actions/cache@v6
        with:
          path: .cache/screenshots/sha256
          key: screenshot-r2-v1-${{ hashFiles('tests/e2e/screenshots/manifest.json') }}
          restore-keys: screenshot-r2-v1-
      - name: Install normal Linux sandbox prerequisites
        shell: bash
        run: |
          sudo apt-get install -y --no-install-recommends bubblewrap socat
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --unshare-all --dev-bind / / --die-with-parent true
      - name: Run each fixed owning spec once and retain every outcome
        run: python3 "$RUNNER_TEMP/composer-capture-diagnostic/run.py" run
      - name: Preserve source, builds, raw captures and failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: composer-canonical-pair-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/composer-capture-diagnostic/evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 5
