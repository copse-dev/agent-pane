name: Thread container (Docker path)

# The unattended container runtime (`containerRunsEnabled`) is hardened by design, but its
# integration tests need a real Docker daemon, so the main `CI` workflow's unit tier never ran
# them (`COPSE_THREAD_CONTAINER_E2E` was set nowhere). This workflow runs them on a hosted
# runner, where Docker is preinstalled and egress to the registry, apt and npm is open.
#
# ADVISORY, not a required check, on purpose: it has not yet been observed green on a hosted
# runner, and it is deliberately not part of the `CI Passed` aggregate (which is pinned by
# scripts/ci-workflow-invariants.test.ts). Promote it into that aggregate only after it has
# stayed green across a representative run of PRs and nightlies — see
# docs/plans/default-on-readiness.md, "Unattended container runs".
on:
  pull_request:
    paths:
      - 'src/main/services/container-runtime/**'
      - 'src/main/services/security/runtime-containment.ts'
      - 'src/shared/container-run-schema.ts'
      - 'src/shared/types/unattended-run.ts'
      - '.github/workflows/thread-container.yml'
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: thread-container-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docker-path:
    name: Docker-path integration tests
    # Fork PRs get no secrets and no trust; the nightly and dispatch runs cover them after merge.
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && !(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/diagnose-reserve-mechanism-20261113')
    runs-on: ubuntu-24.04
    # A cold run builds the worker image (15 minute cap inside the test) and then runs a few
    # short containers. The cap is a leak-stopper, not a latency target.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Show the container engine
        shell: bash
        run: |
          set -euo pipefail
          docker version
          docker info --format '{{.ServerVersion}} {{.SecurityOptions}} cgroup={{.CgroupVersion}}'
      - name: Run the Docker-path integration tests
        env:
          COPSE_THREAD_CONTAINER_E2E: '1'
        run: npm test -- src/main/services/container-runtime/thread-container.integration.test.ts src/main/services/container-runtime/acp-container.integration.test.ts
  markdown-reserve-linux:
    name: Markdown reserve mechanism and production sync diagnostic
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/diagnose-reserve-mechanism-20261113' && github.repository == 'copse-dev/agent-pane'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      COPSE_E2E_HEADLESS: '0'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: fd5ba80a11c77094dc5b8bf6f919b6b4f9ab66c7
          persist-credentials: false
      - name: Require immutable subject checkout and tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = fd5ba80a11c77094dc5b8bf6f919b6b4f9ab66c7
          test "$(git rev-parse 'HEAD^{tree}')" = 875d4078d2e783e2964f545fd024b5dfcafced31
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - uses: ./.github/actions/setup
      - name: Install stock Linux runtime prerequisites
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap socat
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          command -v bwrap
          command -v socat
          bwrap --unshare-all --dev-bind / / --die-with-parent true
      - name: Materialize hash-bound diagnostic inputs
        shell: bash
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const zlib = require('node:zlib');
          const inputs = {"run.cjs":{"sha256":"8f3b82276798af30f7224c45eae0d653d5606b37e2bc7b1e47b7a8bbc8c7246b","data":""},"subject.json":{"sha256":"e7d3a5f3ee093c47cccf9f932faa7685b5a7522c8d6b056385bb0085f326bc35","data":""},"chat-layout.original.ts":{"sha256":"a9e47d174619b533607d77a55f03030cac81ee18bafbd5e577ed5905930c5b60","data":""},"chat-layout.instrumented.ts":{"sha256":"d74e76a509d24d7b05a93f5840765148d640b6a7f377ddf53b5f25057cdc3c54","data":""},"markdown-reserve-historical.e2e.ts":{"sha256":"ceaa0dab3d93e7c0fd69e4a719f27ad7810800ffe28425604615e818e4b1e6e6","data":""},"markdown-reserve-mechanism.e2e.ts":{"sha256":"bc16278c6c19938fffe54a6f8057df5e541202543a9e72d905486641af90c66a","data":""},"markdown-reserve-hydration.e2e.ts":{"sha256":"d0f8de90b8766eeb6a60ee1df8bb434f51c2cea94998ae91ef89e87116b6c264","data":""},"hydration-barrier-fixture.cjs":{"sha256":"14a538f06d20fadae96335dc1c75a6e4a93e8c346d3f207d40bdf6d0f2aff536","data":""},"bootstrap.original.cjs":{"sha256":"c6ab9cee04391c92fb15dd1d1abc98a6c79d760d0d86fc421426187a483e0da9","data":""},"bootstrap.instrumented.cjs":{"sha256":"43e9d3da0320e89b1b94c8e9d0cf9dc324428f6a3372a3fbccda567c96cc97b9","data":""}};
          fs.mkdirSync('.tmp/reserve-diagnostic-inputs', {recursive:true});
          for (const [name, input] of Object.entries(inputs)) {
            const data = zlib.gunzipSync(Buffer.from(input.data,'base64'));
            if (crypto.createHash('sha256').update(data).digest('hex') !== input.sha256) throw new Error('Input hash mismatch: '+name);
            fs.writeFileSync('.tmp/reserve-diagnostic-inputs/'+name,data);
          }
          NODE
      - name: Build once and run each diagnostic once
        run: node .tmp/reserve-diagnostic-inputs/run.cjs
      - name: Preserve every diagnostic outcome
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reserve-mechanism-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/reserve-diagnostic/
            ${{ github.workspace }}/.tmp/reserve-mechanism/
            ${{ github.workspace }}/e2e-failure-artifacts/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
