name: Thread container (Docker path)

# The unattended container runtime (`containerRunsEnabled`) is hardened by design, but its
# integration tests need a real Docker daemon, so the main `CI` workflow's unit tier never ran
# them (`COPSE_THREAD_CONTAINER_E2E` was set nowhere). This workflow runs them on a hosted
# runner, where Docker is preinstalled and egress to the registry, apt and npm is open.
#
# ADVISORY, not a required check, on purpose: it has not yet been observed green on a hosted
# runner, and it is deliberately not part of the `CI Passed` aggregate (which is pinned by
# scripts/ci-workflow-invariants.test.ts). Promote it into that aggregate only after it has
# stayed green across a representative run of PRs and nightlies — see
# docs/plans/default-on-readiness.md, "Unattended container runs".
on:
  pull_request:
    paths:
      - 'src/main/services/container-runtime/**'
      - 'src/main/services/security/runtime-containment.ts'
      - 'src/shared/container-run-schema.ts'
      - 'src/shared/types/unattended-run.ts'
      - '.github/workflows/thread-container.yml'
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: thread-container-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docker-path:
    name: Docker-path integration tests
    # Fork PRs get no secrets and no trust; the nightly and dispatch runs cover them after merge.
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && !(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/diagnose-composer-reserve-linux')
    runs-on: ubuntu-24.04
    # A cold run builds the worker image (15 minute cap inside the test) and then runs a few
    # short containers. The cap is a leak-stopper, not a latency target.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Show the container engine
        shell: bash
        run: |
          set -euo pipefail
          docker version
          docker info --format '{{.ServerVersion}} {{.SecurityOptions}} cgroup={{.CgroupVersion}}'
      - name: Run the Docker-path integration tests
        env:
          COPSE_THREAD_CONTAINER_E2E: '1'
        run: npm test -- src/main/services/container-runtime/thread-container.integration.test.ts src/main/services/container-runtime/acp-container.integration.test.ts

  markdown-reserve-linux:
    name: Markdown reserve Linux diagnostic (original prefix and atomic case)
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/diagnose-composer-reserve-linux' && github.repository == 'copse-dev/agent-pane'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      COPSE_E2E_HEADLESS: '0'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: 39543e6a1655b8a51f1570c3027eb3a46b53d22b
          persist-credentials: false
      - name: Require exact failing checkout and tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 39543e6a1655b8a51f1570c3027eb3a46b53d22b
          test "$(git rev-parse 'HEAD^{tree}')" = 2cea9efb41cd1c98113829a60c10c5c1c8cddb40
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test -z "$(git diff --cached --name-only)"
      - uses: ./.github/actions/setup
      - name: Install stock Linux runtime prerequisites
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap socat
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          command -v bwrap
          command -v socat
          bwrap --unshare-all --dev-bind / / --die-with-parent true
      - name: Materialize frozen ignored observations
        shell: bash
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const zlib = require('node:zlib');
          const runner = '';
          const observer = '';
          const runnerBytes = zlib.gunzipSync(Buffer.from(runner, 'base64'));
          const observerBytes = zlib.gunzipSync(Buffer.from(observer, 'base64'));
          const sha = bytes => crypto.createHash('sha256').update(bytes).digest('hex');
          if (sha(runnerBytes) !== 'fba3b55ac5a62edaeed0cee38b992ed8a646bc0ba351d082afd318f62e330df1') throw new Error('Runner payload mismatch');
          if (sha(observerBytes) !== '6d7823945b6d4a5a8f5622a6fa779cad4339d95af9b843ac1b09605c91db6429') throw new Error('Observer payload mismatch');
          fs.mkdirSync('.tmp/md-reserve-linux-diagnostic/runtime', { recursive: true });
          fs.writeFileSync('.tmp/md-reserve-linux-diagnostic/runtime/run.mts', runnerBytes);
          fs.writeFileSync('.tmp/markdown-reserve-observed.e2e.ts', observerBytes);
          NODE
      - name: Run original prefix then atomic Markdown once
        run: node .tmp/md-reserve-linux-diagnostic/runtime/run.mts run-prefix-md
      - name: Preserve numeric snapshots and original failure always
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: markdown-reserve-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/markdown-reserve-linux/
            ${{ github.workspace }}/.tmp/md-reserve-observation/
            ${{ github.workspace }}/e2e-failure-artifacts/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
