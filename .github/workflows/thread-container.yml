name: Thread container (Docker path)

# The unattended container runtime (`containerRunsEnabled`) is hardened by design, but its
# integration tests need a real Docker daemon, so the main `CI` workflow's unit tier never ran
# them (`COPSE_THREAD_CONTAINER_E2E` was set nowhere). This workflow runs them on a hosted
# runner, where Docker is preinstalled and egress to the registry, apt and npm is open.
#
# ADVISORY, not a required check, on purpose: it has not yet been observed green on a hosted
# runner, and it is deliberately not part of the `CI Passed` aggregate (which is pinned by
# scripts/ci-workflow-invariants.test.ts). Promote it into that aggregate only after it has
# stayed green across a representative run of PRs and nightlies — see
# docs/plans/default-on-readiness.md, "Unattended container runs".
on:
  pull_request:
    paths:
      - 'src/main/services/container-runtime/**'
      - 'src/main/services/security/runtime-containment.ts'
      - 'src/shared/container-run-schema.ts'
      - 'src/shared/types/unattended-run.ts'
      - '.github/workflows/thread-container.yml'
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: thread-container-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docker-path:
    name: Docker-path integration tests
    # Fork PRs get no secrets and no trust; the nightly and dispatch runs cover them after merge.
    # Preserve all ordinary PR/nightly/manual jobs. Only the exact manual
    # diagnostic ref runs the separately bounded job below instead of Docker.
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && !(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/diagnostic-queued-held-linux-pair')
    runs-on: ubuntu-24.04
    # A cold run builds the worker image (15 minute cap inside the test) and then runs a few
    # short containers. The cap is a leak-stopper, not a latency target.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Show the container engine
        shell: bash
        run: |
          set -euo pipefail
          docker version
          docker info --format '{{.ServerVersion}} {{.SecurityOptions}} cgroup={{.CgroupVersion}}'
      - name: Run the Docker-path integration tests
        env:
          COPSE_THREAD_CONTAINER_E2E: '1'
        run: npm test -- src/main/services/container-runtime/thread-container.integration.test.ts src/main/services/container-runtime/acp-container.integration.test.ts

  # Ephemeral diagnostic branch only; never part of CI Passed or release evidence.
  queued-held-linux-pair:
    name: Queued-held pinned Linux pair (diagnostic only)
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/diagnostic-queued-held-linux-pair' && github.repository == 'copse-dev/agent-pane'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      COPSE_E2E_HEADLESS: '0'
    steps:
      # The workflow control is loaded from the diagnostic ref, but product code
      # and setup start at exact Main. The second worktree is detached at Menu.
      - uses: actions/checkout@v7.0.1
        with:
          ref: fb2a99e61baa56df51239b7a776d9aa187ffb093
          persist-credentials: false
      - name: Require the pinned clean first checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = fb2a99e61baa56df51239b7a776d9aa187ffb093
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test -z "$(git diff --cached --name-only)"
      - uses: ./.github/actions/setup
      # Same hosted Linux containment prerequisites as current ci.yml1711-1724.
      - name: Install stock Linux runtime prerequisites
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap socat
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          command -v bwrap
          command -v socat
          bwrap --unshare-all --dev-bind / / --die-with-parent true
      - name: Materialize frozen ignored diagnostics
        shell: bash
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const runner = '';
          const observer = '';
          const runnerBytes = require('node:zlib').gunzipSync(Buffer.from(runner, 'base64'));
          const observerBytes = require('node:zlib').gunzipSync(Buffer.from(observer, 'base64'));
          const sha = bytes => crypto.createHash('sha256').update(bytes).digest('hex');
          if (sha(runnerBytes) !== '82af8cbfc7eaa6df7ac3658d0093f4d7790a18643d86efd018e06fc3e233f871') throw new Error('Runner payload mismatch');
          if (sha(observerBytes) !== 'ce408c105bb1d75c0f01d67e2439b8ad7352b6631aefb23bdc30371da9b35b8d') throw new Error('Observer payload mismatch');
          fs.mkdirSync('.tmp/queued-held-linux-diagnostic/runtime', { recursive: true });
          fs.writeFileSync('.tmp/queued-held-linux-diagnostic/runtime/pair.mts', runnerBytes);
          fs.writeFileSync('.tmp/queued-held-observed.e2e.ts', observerBytes);
          NODE
      - name: Run the two pinned roles once
        run: node .tmp/queued-held-linux-diagnostic/runtime/pair.mts run-pinned-pair
      - name: Retain exact raw evidence even on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: queued-held-linux-pair-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/queued-held-linux-pair/
            ${{ github.workspace }}/e2e-failure-artifacts/
            ${{ runner.temp }}/queued-held-menu/e2e-failure-artifacts/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
