name: Bump release version

# The weekly release cadence. Everything after a version bump is already
# automatic — promotion carries it to `release`, `Cut release tag` tags it, and
# `Release (macOS)` builds, signs, notarizes, and smoke-tests it — so all this
# workflow does is open that bump: set package.json to the next beta and move
# CHANGELOG.md's Unreleased notes under the new version (scripts/release-bump.mts).
#
# It skips the week when:
#   - the current version has not been published yet. One release is in flight
#     at a time; bumping past an unpublished version would drop its notes and
#     queue betas nobody has install-tested. Publish it (or cut past it by hand,
#     docs/releasing-macos.md) and the next run resumes.
#   - Unreleased is empty. There is nothing to release.
#
# Publication stays manual (`Publish release artifacts`). Stable releases are
# never cut on schedule: dispatch this with an explicit version to cut one.
on:
  schedule:
    # Mondays, ahead of the 06:17 nightly full run and the 08:17 promotion, so
    # the bump can land on `main` in time for that day's promotion. Off the top
    # of the hour to avoid GitHub Actions' busiest cron window.
    - cron: '37 5 * * 1'
  workflow_dispatch:
    inputs:
      version:
        description: Version to release instead of the next beta (X.Y.Z or X.Y.Z-beta.N)
        required: false
        type: string

concurrency:
  group: release-bump
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bump:
    runs-on: ubuntu-latest
    env:
      RELEASE_REPOSITORY: copse-dev/copse-releases
    steps:
      - name: Require release App credentials
        env:
          APP_ID: ${{ secrets.RELEASE_APP_ID }}
          APP_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_KEY" ]; then
            echo "RELEASE_APP_ID / RELEASE_APP_PRIVATE_KEY are required to open the bump PR and trigger CI" >&2
            exit 1
          fi

      - uses: actions/checkout@v7.0.1
        with:
          ref: main

      # The bump script is `.mts`, which needs the type stripping that .nvmrc's
      # Node has and the runner default may not. It imports nothing outside the
      # repository, so no dependency install is needed.
      - uses: actions/setup-node@v7
        with: { node-version-file: '.nvmrc' }

      - id: bump
        name: Bump the version and stamp the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          current="$(node -p "require('./package.json').version")"
          # The release repository is public, so the workflow token can read it.
          if ! gh release view "v$current" --repo "$RELEASE_REPOSITORY" > /dev/null 2>&1; then
            echo "::notice::v$current is not published in $RELEASE_REPOSITORY yet; skipping this week's bump."
            exit 0
          fi
          args=(--skip-if-empty)
          if [ -n "$REQUESTED_VERSION" ]; then
            args+=("$REQUESTED_VERSION")
          fi
          # stdout is the new version, or empty when Unreleased has no notes.
          next="$(node scripts/release-bump.mts "${args[@]}")"
          if [ -z "$next" ]; then
            echo "::notice::CHANGELOG.md's Unreleased section is empty; nothing to release this week."
            exit 0
          fi
          node scripts/release-notes.mts "$next" > "$RUNNER_TEMP/release-notes.md"
          echo "Bumping $current -> $next"
          echo "version=$next" >> "$GITHUB_OUTPUT"

      # copse-release-bot installation token, pinned to the two permissions the
      # PR and its auto-merge need (see promote-develop.yml). A PR opened with
      # GITHUB_TOKEN would never trigger CI, and this organization blocks that
      # token from opening PRs at all.
      - uses: actions/create-github-app-token@v3
        if: steps.bump.outputs.version != ''
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - id: pr
        if: steps.bump.outputs.version != ''
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          # One fixed branch: a rerun before the PR merges updates it in place
          # rather than opening a second bump.
          branch: chore/release-bump
          base: main
          delete-branch: true
          add-paths: |
            package.json
            CHANGELOG.md
          commit-message: 'Release ${{ steps.bump.outputs.version }}'
          title: 'Release ${{ steps.bump.outputs.version }}'
          body: |
            Weekly release bump from [`release-bump.yml`](.github/workflows/release-bump.yml).

            Sets `package.json` to `${{ steps.bump.outputs.version }}` and moves `CHANGELOG.md`'s
            Unreleased notes under `## ${{ steps.bump.outputs.version }}`. Once this merges, the next
            daily promotion carries it to `release`, `Cut release tag` tags it, and
            `Release (macOS)` builds the signed artifacts. Publishing them stays manual — see
            [docs/releasing-macos.md](docs/releasing-macos.md).

            This PR merges automatically when `CI Passed` is green. To hold the release, disable
            auto-merge; to change the notes, edit the `## ${{ steps.bump.outputs.version }}` section
            on this branch.

      - name: Enable auto-merge
        if: steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
        run: gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --auto --squash

      - name: Summarize
        if: steps.bump.outputs.version != ''
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
        run: |
          {
            echo "## Release $VERSION"
            echo
            echo "Bump PR: $PR_URL"
            echo
            echo '### Generated release notes'
            echo
            cat "$RUNNER_TEMP/release-notes.md"
          } >> "$GITHUB_STEP_SUMMARY"
