name: Bump release version

# The weekly release cadence. Everything after a version bump is already
# automatic — promotion carries it to `release`, `Cut release tag` tags it, and
# `Release (macOS)` builds, signs, notarizes, and smoke-tests it — so all this
# workflow does is open that bump: set package.json to the next beta and move
# CHANGELOG.md's Unreleased notes under the new version (scripts/release-bump.mts).
#
# It skips the week when:
#   - the current version has not been published yet. One release is in flight
#     at a time, so the schedule never queues betas nobody has install-tested.
#     Publish it and the next run resumes. If it can never be published (its
#     release run failed, or its artifacts expired), dispatch this workflow with
#     the next version: an explicit version cuts past the unpublished one and
#     carries its notes forward, since it has no GitHub Release to keep them.
#     The `publication-window` job reports how long the skipped version can
#     still be published, and raises an issue before it no longer can.
#   - Unreleased is empty. There is nothing to release.
#
# Publication stays manual (`Publish release artifacts`). Stable releases are
# never cut on schedule: dispatch this with an explicit version to cut one.
on:
  schedule:
    # Mondays, ahead of the 06:17 nightly full run and the 08:17 promotion, so
    # the bump can land on `main` in time for that day's promotion. Off the top
    # of the hour to avoid GitHub Actions' busiest cron window.
    - cron: '37 5 * * 1'
  workflow_dispatch:
    inputs:
      version:
        description: Version to release instead of the next beta (X.Y.Z or X.Y.Z-beta.N)
        required: false
        type: string

concurrency:
  group: release-bump
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bump:
    runs-on: ubuntu-24.04
    env:
      RELEASE_REPOSITORY: copse-dev/copse-releases
    outputs:
      unpublished: ${{ steps.bump.outputs.unpublished }}
    steps:
      - name: Require release App credentials
        env:
          APP_ID: ${{ secrets.RELEASE_APP_ID }}
          APP_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_KEY" ]; then
            echo "RELEASE_APP_ID / RELEASE_APP_PRIVATE_KEY are required to open the bump PR and trigger CI" >&2
            exit 1
          fi

      - uses: actions/checkout@v7.0.1
        with:
          ref: main

      # The bump script is `.mts`, which needs the type stripping that .nvmrc's
      # Node has and the runner default may not. It imports nothing outside the
      # repository, so no dependency install is needed.
      - uses: actions/setup-node@v7
        with: { node-version-file: '.nvmrc' }

      - id: bump
        name: Bump the version and stamp the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          current="$(node -p "require('./package.json').version")"
          args=(--skip-if-empty)
          # The release repository is public, so the workflow token can read it.
          # Only a confirmed 404 means unpublished. Any other failure (rate limit,
          # outage, auth) must stop the run: treating it as unpublished would let
          # a dispatch carry an already-published version's notes forward again.
          if ! lookup="$(gh api "repos/$RELEASE_REPOSITORY/releases/tags/v$current" --silent 2>&1)"; then
            case "$lookup" in
              *"HTTP 404"*) ;;
              *)
                echo "::error::Could not check whether v$current is published in $RELEASE_REPOSITORY: $lookup"
                exit 1
                ;;
            esac
            # A missing repository also answers 404; make sure that is not the cause.
            if ! gh api "repos/$RELEASE_REPOSITORY" --silent; then
              echo "::error::$RELEASE_REPOSITORY is not reachable, so v$current's publication cannot be checked."
              exit 1
            fi
            if [ -z "$REQUESTED_VERSION" ]; then
              echo "::notice::v$current is not published in $RELEASE_REPOSITORY yet; skipping this week's bump. If it can never be published, dispatch this workflow with the next version to cut past it."
              # The publication-window job checks how long it still can be.
              echo "unpublished=$current" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # A person chose to abandon the unpublished version, usually one
            # whose release run failed. Its notes ship with this release.
            echo "::notice::v$current is not published; cutting $REQUESTED_VERSION past it and carrying its notes forward."
            args+=(--carry-forward)
            echo "carried=$current" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$REQUESTED_VERSION" ]; then
            args+=("$REQUESTED_VERSION")
          fi
          # stdout is the new version, or empty when Unreleased has no notes.
          next="$(node scripts/release-bump.mts "${args[@]}")"
          if [ -z "$next" ]; then
            echo "::notice::CHANGELOG.md's Unreleased section is empty; nothing to release this week."
            exit 0
          fi
          node scripts/release-notes.mts "$next" > "$RUNNER_TEMP/release-notes.md"
          echo "Bumping $current -> $next"
          echo "version=$next" >> "$GITHUB_OUTPUT"

      # copse-release-bot installation token, pinned to the two permissions the
      # PR and its auto-merge need (see promote-develop.yml). A PR opened with
      # GITHUB_TOKEN would never trigger CI, and this organization blocks that
      # token from opening PRs at all.
      - uses: actions/create-github-app-token@v3
        if: steps.bump.outputs.version != ''
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - id: pr
        if: steps.bump.outputs.version != ''
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          # One fixed branch: a rerun before the PR merges updates it in place
          # rather than opening a second bump.
          branch: chore/release-bump
          base: main
          delete-branch: true
          add-paths: |
            package.json
            CHANGELOG.md
          commit-message: 'Release ${{ steps.bump.outputs.version }}'
          title: 'Release ${{ steps.bump.outputs.version }}'
          body: |
            Weekly release bump from [`release-bump.yml`](.github/workflows/release-bump.yml).

            Sets `package.json` to `${{ steps.bump.outputs.version }}` and moves `CHANGELOG.md`'s
            Unreleased notes under `## ${{ steps.bump.outputs.version }}`.${{ steps.bump.outputs.carried && format(' It cuts past {0}, which was never published, and folds that version''s notes into this section.', steps.bump.outputs.carried) || '' }} Once this merges, the next
            daily promotion carries it to `release`, `Cut release tag` tags it, and
            `Release (macOS)` builds the signed artifacts. Publishing them stays manual — see
            [docs/releasing-macos.md](docs/releasing-macos.md).

            This PR merges automatically when `CI Passed` is green. To hold the release, disable
            auto-merge; to change the notes, edit the `## ${{ steps.bump.outputs.version }}` section
            on this branch.

      - name: Enable auto-merge
        if: steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
        run: gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --auto --squash

      - name: Summarize
        if: steps.bump.outputs.version != ''
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
        run: |
          {
            echo "## Release $VERSION"
            echo
            echo "Bump PR: $PR_URL"
            echo
            echo '### Generated release notes'
            echo
            cat "$RUNNER_TEMP/release-notes.md"
          } >> "$GITHUB_STEP_SUMMARY"

  # Skipping for an unpublished version is the one-release-in-flight rule at
  # work, but alone it is silent: a build nobody publishes looks like one being
  # install-tested until its artifacts expire. Then it can never be published
  # and the skip would repeat every week for good, as with v0.1.0-beta.16. So
  # check the version's successful Release (macOS) run, by the tag's commit,
  # and how long its artifacts last (scripts/release-publication-window.mts).
  # Near expiry this opens or updates an `area:release` issue, as it does for a
  # cancelled or never-run build that report-failure misses; once the artifacts
  # have expired it fails too. It never cuts past the version itself:
  # abandoning a build is a person's call (docs/releasing-macos.md#publication-window).
  publication-window:
    needs: bump
    if: needs.bump.outputs.unpublished != ''
    runs-on: ubuntu-24.04
    permissions:
      actions: read # the version's Release (macOS) run and its artifacts
      contents: read # the tag, and this checkout
      issues: write # the unpublished-release issue
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@v7
        with: { node-version-file: '.nvmrc' }
      - name: Check how long the unpublished version can still be published
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.bump.outputs.unpublished }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          window=scripts/release-publication-window.mts
          release_sha=none runs=none artifacts=none
          # Only a confirmed 404 means untagged. Any other failure leaves the
          # window unknown, which must not read as fine.
          if ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" 2> "$RUNNER_TEMP/tag.err")"; then
            release_sha="$(jq -r .object.sha <<< "$ref")"
            # Cut release tag creates lightweight tags; peel an annotated one.
            if [ "$(jq -r .object.type <<< "$ref")" = tag ]; then
              release_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$release_sha" | jq -r .object.sha)"
            fi
            runs="$RUNNER_TEMP/runs.json"
            gh api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/actions/workflows/release-mac.yml/runs?head_sha=$release_sha&per_page=100" > "$runs"
            run_id="$(node "$window" latest-run "$runs" "$release_sha")"
            if [ -n "$run_id" ]; then
              artifacts="$RUNNER_TEMP/artifacts.json"
              gh api --paginate --slurp \
                "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" > "$artifacts"
            fi
          else
            case "$(cat "$RUNNER_TEMP/tag.err")" in
              *"HTTP 404"*) ;;
              *)
                echo "::error::Could not look up $tag, so its publication window is unknown: $(cat "$RUNNER_TEMP/tag.err")"
                exit 1
                ;;
            esac
          fi
          report="$RUNNER_TEMP/report.json"
          node "$window" report "$tag" "$release_sha" "$runs" "$artifacts" > "$report"
          level="$(jq -r .level "$report")"
          message="$(jq -r .message "$report")"
          echo "::$level::$message"
          echo "$message" >> "$GITHUB_STEP_SUMMARY"
          title="$(jq -r '.issue.title // empty' "$report")"
          if [ -n "$title" ]; then
            { jq -r .issue.body "$report"; printf '\n[Bump release version run](%s)\n' "$RUN_URL"; } > "$RUNNER_TEMP/issue.md"
            # One open issue per tag, as report-failure keeps in release-mac.yml:
            # each later week comments on it with the current countdown.
            existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label area:release \
              --search "\"$title\" in:title" --json number,title \
              | jq -r --arg title "$title" 'map(select(.title == $title))[0].number // empty')"
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/issue.md"
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --label area:release --body-file "$RUNNER_TEMP/issue.md"
            fi
          fi
          # Expired artifacts stall the weekly train until a person cuts past
          # the version, so fail visibly rather than skip quietly each week.
          if [ "$level" = error ]; then exit 1; fi
