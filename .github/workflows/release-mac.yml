name: Release (macOS)

# Publish a stable or beta tag only after the full CI aggregate passes at the
# exact tagged commit. Packaging and promotion are deliberately separate jobs:
# the publisher downloads signed, notarized, smoke-tested files and never rebuilds.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v<package-version> tag to publish
        required: true
        type: string
  push:
    tags: ['v*']

permissions:
  contents: read
  checks: read
  attestations: write
  id-token: write

concurrency:
  group: release-mac-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.release.outputs.release_sha }}
      release_type: ${{ steps.release.outputs.release_type }}
      tag: ${{ steps.release.outputs.tag }}
      update_channel: ${{ steps.release.outputs.update_channel }}
    steps:
      # First step in the whole workflow, before the checkout and long before
      # the mac runner: an unset signing secret is the likeliest reason a first
      # release fails, and discovering it after preflight's CI wait would cost
      # an hour and a half to learn nothing about the release itself.
      - name: Require signing and notarization credentials
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for credential in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!credential:-}" ]; then
              echo "Required release credential is unavailable: $credential"
              echo "See docs/releasing-macos.md#required-credentials"
              exit 1
            fi
          done
      - uses: actions/checkout@v7.0.1
        with:
          # Dispatch accepts a tag *name*, never an arbitrary branch/ref.
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          fetch-depth: 0
      # The validation below runs `.mts` scripts, which need the type stripping
      # that .nvmrc's Node has and the runner image's default Node may not.
      - uses: actions/setup-node@v7
        with: { node-version-file: '.nvmrc' }
      - id: release
        name: Validate tag, version, ancestry, and exact-SHA CI
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$REQUESTED_TAG"
          case "$tag" in
            v*) ;;
            *) echo "Release tag must start with v: $tag"; exit 1 ;;
          esac
          if ! git show-ref --verify --quiet "refs/tags/$tag"; then
            echo "Release target must be an existing tag: $tag"
            exit 1
          fi
          version="$(node -p "require('./package.json').version")"
          if [ "${tag#v}" != "$version" ]; then
            echo "Tag $tag does not match package.json version $version"
            exit 1
          fi
          release_type="$(node scripts/release-channel.mts --release-type "$version")"
          update_channel="$(node scripts/release-channel.mts --channel "$version")"
          # For a manual dispatch GITHUB_SHA is the workflow's default-branch
          # revision, not necessarily the requested tag. Checkout above has
          # already resolved that tag, so HEAD is the only trustworthy source.
          release_sha="$(git rev-parse 'HEAD^{commit}')"
          # Releases are cut from `release`, not from trunk. A promotion merge
          # is a commit ON `release` and is therefore NOT reachable from `main`,
          # so checking ancestry against trunk would reject every real release.
          # `release` is the branch that has actually passed the full promotion
          # gate, and the ruleset protects it against deletion and non-fast-
          # forward, so reachability from it is the property worth demanding.
          # Use an explicit refspec: `git fetch origin release` alone does not
          # reliably write refs/remotes/origin/release when checkout configured
          # the remote for a tag.
          git fetch --no-tags origin +refs/heads/release:refs/remotes/origin/release
          if ! git merge-base --is-ancestor "$release_sha" origin/release; then
            echo "Release tag commit is not reachable from protected branch origin/release"
            exit 1
          fi
          # `gh release create` has no TTY here and refuses to publish without a
          # body. Generate it from CHANGELOG.md now so a missing or emptied
          # Unreleased section fails in seconds rather than after notarization.
          node scripts/release-notes.mts "$version" > /dev/null
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "release_type=$release_type" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "update_channel=$update_channel" >> "$GITHUB_OUTPUT"

          # A tag push starts CI and this workflow together. Wait for CI's
          # aggregate status on precisely the commit we resolved above; do not
          # accept a run for the branch tip, a PR merge ref, or any other SHA.
          for attempt in $(seq 1 180); do
            result="$(gh api "/repos/$GITHUB_REPOSITORY/commits/$release_sha/check-runs?check_name=CI%20Passed&per_page=100" \
              --jq '[.check_runs[] | select(.name == "CI Passed")] | sort_by(.started_at) | last | {status, conclusion}' 2>/dev/null || true)"
            status="$(printf '%s' "$result" | jq -r '.status // "missing"' 2>/dev/null || true)"
            conclusion="$(printf '%s' "$result" | jq -r '.conclusion // ""' 2>/dev/null || true)"
            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then
                echo "CI Passed succeeded for $release_sha"
                exit 0
              fi
              echo "CI Passed concluded $conclusion for $release_sha"
              exit 1
            fi
            echo "Waiting for CI Passed on $release_sha (attempt $attempt/180; status ${status:-missing})"
            sleep 30
          done
          echo "Timed out waiting for CI Passed on $release_sha"
          exit 1

  # Keep a deliberately uncached install in the release path. The shared setup
  # action restores a complete node_modules tree when possible, which is useful
  # for packaging but can hide an undeclared/transitive production dependency.
  # Exercise the exact release commit from a clean lockfile install before any
  # signing or packaging begins.
  verify-clean-release-build:
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.release_sha }}
      - uses: actions/setup-node@v7
        with: { node-version-file: '.nvmrc' }
      - name: Verify clean release build
        run: npm ci --ignore-scripts && npm run build:release

  build-test:
    needs: [preflight, verify-clean-release-build]
    # The runtime smoke test below is the only gate that actually launches the
    # packaged app, so it has to run on an OS the app supports. Keep this label
    # at or above `build.mac.minimumSystemVersion` in package.json; the
    # deployment-target check in the verify step enforces that and fails the
    # release rather than letting the gate silently drift below the floor again.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.release_sha }}
      - uses: ./.github/actions/setup
      # GitHub retired its Intel macOS images, so this runner is Apple Silicon
      # and the x64 bundle's smoke test — plus its `gortex version` call — runs
      # translated. Rosetta is not guaranteed on the arm64 images, and finding
      # that out at the verify step would cost a whole sign-and-notarize cycle
      # first ("Bad CPU type in executable"). A no-op when already present.
      - name: Ensure Rosetta can run the x64 bundle
        run: softwareupdate --install-rosetta --agree-to-license
      - name: Build a universal bundled gortex
        run: npm run prepare:gortex:mac
      # The credentials themselves were asserted in preflight, before this
      # runner was provisioned.
      - name: Build, sign, and notarize without publishing
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          UPDATE_CHANNEL: ${{ needs.preflight.outputs.update_channel }}
        run: |
          set -euo pipefail
          npm run build:release
          npx electron-builder --mac -c.mac.notarize=true -c.publish.channel="$UPDATE_CHANNEL" --publish never
          node scripts/finalize-release-metadata.mts
      - name: Verify signatures, notarization, metadata, and packaged runtime
        env:
          COPSE_WORKSPACE_DIR: ${{ runner.temp }}/copse-release-smoke-workspace
          RELEASE_TYPE: ${{ needs.preflight.outputs.release_type }}
          UPDATE_CHANNEL: ${{ needs.preflight.outputs.update_channel }}
        run: |
          set -euo pipefail
          # The smoke test below launches the packaged app, so this runner must be
          # at least the version the app declares it supports. Without this check a
          # runner-label bump (or an OS-image retirement) can silently move the only
          # runtime gate onto an OS no shipped build will ever run on.
          declared_minimum="$(node -p "require('./package.json').build.mac.minimumSystemVersion")"
          runner_version="$(sw_vers -productVersion)"
          if [ "$(printf '%s\n%s\n' "$declared_minimum" "$runner_version" | sort -V | head -n1)" != "$declared_minimum" ]; then
            echo "Runner macOS $runner_version is below the declared minimum $declared_minimum;"
            echo "the packaged runtime smoke test would not run on a supported OS."
            exit 1
          fi
          echo "Runner macOS $runner_version satisfies the declared minimum $declared_minimum"
          apps=()
          while IFS= read -r app; do apps+=("$app"); done < <(find release -type d -name Copse.app -print)
          if [ "${#apps[@]}" -ne 2 ]; then
            echo "Expected signed arm64 and x64 app bundles, found ${#apps[@]}"
            exit 1
          fi
          for app in "${apps[@]}"; do
            echo "Verifying $app"
            codesign --verify --deep --strict --verbose=2 "$app"
            spctl -a -vvv -t install "$app"
            xcrun stapler validate "$app"
            test -x "$app/Contents/Resources/app.asar.unpacked/dist/resources/gortex/gortex"
            app_arch="$(lipo "$app/Contents/MacOS/Copse" -archs)"
            gortex_arch="$(lipo "$app/Contents/Resources/app.asar.unpacked/dist/resources/gortex/gortex" -archs)"
            if [ "$gortex_arch" != "$app_arch" ]; then
              echo "Bundled gortex architecture $gortex_arch does not match app architecture $app_arch"
              exit 1
            fi
            "$app/Contents/Resources/app.asar.unpacked/dist/resources/gortex/gortex" version
            test -s "$app/Contents/Resources/app-update.yml"
            grep -q '^provider: github$' "$app/Contents/Resources/app-update.yml"
            grep -q '^owner: copse-dev$' "$app/Contents/Resources/app-update.yml"
            grep -q '^repo: agent-pane$' "$app/Contents/Resources/app-update.yml"
            grep -q "^channel: $UPDATE_CHANNEL$" "$app/Contents/Resources/app-update.yml"
            minimum_system_version="$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$app/Contents/Info.plist")"
            if [ "$minimum_system_version" != '26.0' ]; then
              echo "Expected LSMinimumSystemVersion 26.0, found $minimum_system_version"
              exit 1
            fi
            "$app/Contents/MacOS/Copse" --release-smoke-test
          done
          test -s "release/$UPDATE_CHANNEL-mac.yml"
          # Beta clients follow the beta feed but are allowed to advance to a
          # newer stable version, so stable builds must update both feeds.
          if [ "$RELEASE_TYPE" = 'release' ]; then
            test -s release/latest-mac.yml
            test -s release/beta-mac.yml
          fi
          test -n "$(find release -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$(find release -maxdepth 1 -name '*.zip' -print -quit)"
          test -n "$(find release -maxdepth 1 -name '*.blockmap' -print -quit)"
          update_metadata=()
          while IFS= read -r metadata; do update_metadata+=("$metadata"); done < <(find release -maxdepth 1 -name '*-mac.yml' -print)
          if [ "${#update_metadata[@]}" -eq 0 ]; then
            echo 'No macOS update metadata was generated'
            exit 1
          fi
          for metadata in "${update_metadata[@]}"; do
            for zip in release/*.zip; do
              grep -Fq "$(basename "$zip")" "$metadata"
            done
          done
          shasum -a 256 release/*.dmg release/*.zip release/*.blockmap "${update_metadata[@]}" > release/SHA256SUMS
      # Publish the reviewed notes with the artifacts they describe. Generating
      # them here rather than in `publish` keeps that job artifact-only.
      - name: Generate the release notes from CHANGELOG.md
        run: node scripts/release-notes.mts > release/RELEASE_NOTES.md
      # Artifact attestations are unavailable for PRIVATE repositories outside
      # GitHub Enterprise Cloud, and this org is on Team — the action fails the
      # job with "Feature not available for the organization". Publishing to a
      # private repository is a rehearsal, not distribution (#802), so skip
      # provenance there and let it switch itself back on the moment the
      # repository is public. SHA256SUMS ships either way.
      - name: Note the skipped attestation
        if: github.event.repository.private
        run: echo "::warning::Private repository — artifact attestation skipped. Provenance needs a public repository or GitHub Enterprise Cloud."
      - name: Attest tested release artifacts
        if: ${{ !github.event.repository.private }}
        uses: actions/attest@v4.2.0
        with:
          subject-path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/*-mac.yml
            release/SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: copse-macos-${{ needs.preflight.outputs.release_sha }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/*-mac.yml
            release/SHA256SUMS
            release/RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [preflight, build-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: copse-macos-${{ needs.preflight.outputs.release_sha }}
          path: release
      - name: Promote the exact tested artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TYPE: ${{ needs.preflight.outputs.release_type }}
          TAG: ${{ needs.preflight.outputs.tag }}
          TARGET: ${{ needs.preflight.outputs.release_sha }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "A release already exists for $TAG; refusing to replace it"
            exit 1
          fi
          release_flags=()
          if [ "$RELEASE_TYPE" = 'prerelease' ]; then
            release_flags+=(--prerelease)
          else
            release_flags+=(--latest)
          fi
          # `gh release create` has no TTY here: without a body it refuses to
          # run. The notes were generated from CHANGELOG.md alongside the
          # artifacts they describe; `--verify-tag` keeps gh from inventing a
          # tag if that ever stops being true.
          test -s release/RELEASE_NOTES.md
          gh release create "$TAG" release/*.dmg release/*.zip release/*.blockmap release/*-mac.yml release/SHA256SUMS \
            --target "$TARGET" --title "$TAG" --notes-file release/RELEASE_NOTES.md --verify-tag \
            "${release_flags[@]}"
