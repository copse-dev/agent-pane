name: Cut release tag

# `release` receives nothing but promotion merges from `main` (promote-develop.yml),
# and the ruleset only lets one merge after the full `CI Passed` tier is green.
# Tagging that commit is mechanical, so do it here rather than by hand: when a
# promotion carries a package version that has never been tagged, create
# `v<version>` at that exact commit. `Release (macOS)` builds it once the
# commit's CI finishes: release-dispatch.yml starts it from CI's completion, or
# this workflow does when CI had already finished (scripts/release-dispatch.mts).
#
# Promotions that do not change the version — most of them — are no-ops, so the
# release cadence is driven entirely by bumping `package.json` on `main`, which
# `release-bump.yml` does weekly (and `scripts/release-bump.mts` does by hand). A
# version is cut exactly once: if its release run fails, bump to the next version
# rather than re-cutting the same one. Releases are forward-fix only
# (docs/recovery.md), and the publisher refuses to replace an existing release.
on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: write # create the tag ref
  actions: write # dispatch Release (macOS)

concurrency:
  group: release-cut
  cancel-in-progress: false

jobs:
  cut:
    runs-on: ubuntu-24.04
    steps:
      - id: target
        name: Resolve the release commit to cut from
        env:
          GH_TOKEN: ${{ github.token }}
          # On a push this is the promoted commit. A manual dispatch runs from
          # the default branch, whose version may already be ahead of what was
          # promoted, so resolve `release` explicitly instead of trusting
          # github.sha.
          PUSHED_SHA: ${{ github.event_name == 'push' && github.sha || '' }}
        run: |
          set -euo pipefail
          sha="$PUSHED_SHA"
          if [ -z "$sha" ]; then
            sha="$(gh api "/repos/$GITHUB_REPOSITORY/commits/release" --jq .sha)"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # Read the version from the commit being cut, never from the workflow's
      # own ref: those differ on a manual dispatch.
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ steps.target.outputs.sha }}

      # The classifier and note generator are `.mts`, which needs the type
      # stripping that .nvmrc's Node has and the runner default may not.
      - uses: actions/setup-node@v7
        with: { node-version-file: '.nvmrc' }

      - id: version
        name: Read and classify the promoted version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          # The shared classifier fails closed on anything that is not X.Y.Z or
          # X.Y.Z-beta.N, so an alpha, RC, or malformed version cannot be tagged.
          channel="$(node scripts/release-channel.mts --channel "$version")"
          echo "Promoted version $version targets the $channel channel"
          # Fail here rather than after signing and notarization: the publisher
          # generates the GitHub Release body from CHANGELOG.md's `## <version>`
          # section, and `gh release create` cannot run without one. A version
          # already tagged at an older commit is the ordinary no-op below and is
          # not re-validated: versions released before notes were kept per
          # version have no section. Any lookup failure falls through to the
          # check, which fails closed.
          existing="$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/tags/v$version" --jq .object.sha 2>/dev/null || true)"
          if [ -z "$existing" ] || [ "$existing" = "$RELEASE_SHA" ]; then
            node scripts/release-notes.mts "$version" > /dev/null
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - id: tag
        name: Tag the release commit
        uses: actions/github-script@v9
        env:
          RELEASE_SHA: ${{ steps.target.outputs.sha }}
          TAG: ${{ steps.version.outputs.tag }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const sha = process.env.RELEASE_SHA;
            const tag = process.env.TAG;

            // Most promotions carry an already-released version, so finding the
            // tag at an older commit is the ordinary outcome and not a failure.
            // Finding it at this exact commit means a previous attempt created
            // the tag but may have failed before its build started; continue
            // far enough to prove that Release (macOS) has a run for the commit.
            try {
              const existing = await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
              if (existing.data.object.sha !== sha) {
                core.info(
                  `${tag} already exists at ${existing.data.object.sha}; nothing to cut. ` +
                    'Bump package.json on `main` to release the next version.',
                );
                return;
              }
              core.info(`${tag} already exists at the release commit; checking its release run.`);
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({ owner, repo, ref: `refs/tags/${tag}`, sha });
              core.info(`Created ${tag} at ${sha}.`);
            }
            core.setOutput('tag', tag);

      # Load the helper from this workflow's own commit, not the release
      # checkout above: a manual dispatch runs main's workflow file, which can be
      # ahead of what was promoted. On a push the two are the same commit.
      - name: Load the release dispatch helper
        if: steps.tag.outputs.tag != ''
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-dispatch
          persist-credentials: false
          sparse-checkout: |
            scripts/release-dispatch.mts
            scripts/lib/safe-json.mts
          sparse-checkout-cone-mode: false

      # The push that promoted this commit is normally still running CI, which
      # is what the release gates on. When it finishes, release-dispatch.yml
      # starts Release (macOS), so this job does not wait for it. Only a cut
      # made after CI already finished (a recovery run) starts the build here.
      # An API error fails this step rather than dispatching early; the tag
      # already exists, so CI's completion still starts the build.
      #
      # A tag pushed with GITHUB_TOKEN raises no `push` event, so a tag trigger
      # could never start the build. workflow_dispatch is the documented
      # exception that does fire, and dispatching also avoids a third heavy-tier
      # CI run on this SHA: the push that promoted it already produced the
      # full-release validation preflight reads.
      - name: Start Release (macOS) if CI has finished
        if: steps.tag.outputs.tag != ''
        uses: actions/github-script@v9
        env:
          RELEASE_SHA: ${{ steps.target.outputs.sha }}
          TAG: ${{ steps.tag.outputs.tag }}
        with:
          script: |
            const { startReleaseWhenCiFinished } = await import(
              `${process.env.GITHUB_WORKSPACE}/.release-dispatch/scripts/release-dispatch.mts`);
            await startReleaseWhenCiFinished(
              { github, owner: context.repo.owner, repo: context.repo.repo, log: core.info },
              process.env.RELEASE_SHA,
              process.env.TAG,
            );
