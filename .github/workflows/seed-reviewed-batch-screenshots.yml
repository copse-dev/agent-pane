name: Seed reviewed Settings Copilot screenshot objects

# One-time recovery for #3745. Remove after public-object verification succeeds.
on:
  push:
    branches: [recovery/settings-providers-3640]
    paths: [.github/workflows/seed-reviewed-batch-screenshots.yml]

permissions:
  contents: read
  actions: read

concurrency:
  group: seed-reviewed-batch-screenshots
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Read pinned trusted storage policy from main
        uses: actions/checkout@v7.0.1
        with:
          ref: cfc6b8ffe59e1d9e1d04632554c882965312bf6a
          path: .bootstrap-policy
          persist-credentials: false
          sparse-checkout: |
            .nvmrc
            scripts/lib
            scripts/screenshot-storage.mts
            packages/std/src
            packages/std/package.json
            tests/e2e/screenshots/manifest.json
          sparse-checkout-cone-mode: false

      - name: Download the one reviewed current-head CI candidates as data
        uses: actions/download-artifact@v7
        with:
          repository: copse-dev/agent-pane
          run-id: 38440543460
          artifact-ids: 11837451856
          merge-multiple: true
          github-token: ${{ github.token }}
          path: .bootstrap-source

      - uses: actions/setup-node@v7
        with:
          node-version-file: .bootstrap-policy/.nvmrc

      - name: Validate exactly the one reviewed image hashes
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { lstatSync, mkdirSync, readFileSync, writeFileSync } from 'node:fs'
          import { join } from 'node:path'
          import { parseScreenshotManifest, serializeScreenshotManifest, verifyScreenshot } from './.bootstrap-policy/scripts/lib/screenshot-manifest.mts'
          const reviewed = parseScreenshotManifest('{"version":1,"screenshots":{"acp-copilot-fixture-turn.png":{"sha256":"207db4af0f91c37fcdce6ec68dd8a3d4e840d1d67e409dd3787b8ead68da21c2","bytes":74291}}}')
          const directory = join(process.env.RUNNER_TEMP, 'reviewed-copilot')
          mkdirSync(directory, { recursive: true })
          for (const [name, entry] of Object.entries(reviewed.screenshots)) {
            const source = join('.bootstrap-source/tests/e2e/screenshots', name)
            const stat = lstatSync(source)
            assert.ok(stat.isFile() && !stat.isSymbolicLink())
            const bytes = readFileSync(source)
            verifyScreenshot(bytes, entry)
            writeFileSync(join(directory, name), bytes)
            console.log(`${name}: verified ${entry.sha256} (${entry.bytes} bytes)`)
          }
          writeFileSync(join(process.env.RUNNER_TEMP, 'reviewed-copilot-manifest.json'), serializeScreenshotManifest(reviewed))
          NODE

      - name: Upload with the existing trusted storage implementation
        env:
          SCREENSHOT_R2_ACCOUNT_ID: ${{ secrets.SCREENSHOT_R2_ACCOUNT_ID || vars.SCREENSHOT_R2_ACCOUNT_ID }}
          SCREENSHOT_R2_BUCKET: ${{ secrets.SCREENSHOT_R2_BUCKET || vars.SCREENSHOT_R2_BUCKET || 'copse-screenshots' }}
          SCREENSHOT_R2_ACCESS_KEY_ID: ${{ secrets.SCREENSHOT_R2_ACCESS_KEY_ID }}
          SCREENSHOT_R2_SECRET_ACCESS_KEY: ${{ secrets.SCREENSHOT_R2_SECRET_ACCESS_KEY }}
        run: |
          node .bootstrap-policy/scripts/screenshot-storage.mts upload \
            --dir "$RUNNER_TEMP/reviewed-copilot" \
            --manifest "$RUNNER_TEMP/reviewed-copilot-manifest.json"

      - name: Verify all one public objects without write credentials
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          import { join } from 'node:path'
          import { parseScreenshotManifest } from './.bootstrap-policy/scripts/lib/screenshot-manifest.mts'
          import { publicScreenshot } from './.bootstrap-policy/scripts/lib/screenshot-hydration.mts'
          const manifest = parseScreenshotManifest(readFileSync(join(process.env.RUNNER_TEMP, 'reviewed-copilot-manifest.json'), 'utf8'))
          for (const [name, entry] of Object.entries(manifest.screenshots)) {
            await publicScreenshot(entry)
            console.log(`${name}: public bytes and SHA-256 verified`)
          }
          NODE
