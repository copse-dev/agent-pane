name: Seed reviewed Settings-batch screenshot objects

# One-time recovery for #3745. Remove after public-object verification succeeds.
on:
  push:
    branches: [recovery/settings-providers-3640]
    paths: [.github/workflows/seed-reviewed-batch-screenshots.yml]

permissions:
  contents: read
  actions: read

concurrency:
  group: seed-reviewed-batch-screenshots
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Read pinned trusted storage policy from main
        uses: actions/checkout@v7.0.1
        with:
          ref: cfc6b8ffe59e1d9e1d04632554c882965312bf6a
          path: .bootstrap-policy
          persist-credentials: false
          sparse-checkout: |
            .nvmrc
            scripts/lib
            scripts/screenshot-storage.mts
            packages/std/src
            packages/std/package.json
            tests/e2e/screenshots/manifest.json
          sparse-checkout-cone-mode: false

      - name: Download the 102 reviewed current-head CI candidates as data
        uses: actions/download-artifact@v7
        with:
          repository: copse-dev/agent-pane
          run-id: 38435549619
          artifact-ids: 11834635077,11834430541,11834365709,11833913014,11833863458,11833578692,11833328640,11833242423,11833144815
          merge-multiple: true
          github-token: ${{ github.token }}
          path: .bootstrap-source

      - uses: actions/setup-node@v7
        with:
          node-version-file: .bootstrap-policy/.nvmrc

