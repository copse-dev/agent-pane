name: Screenshot review selection

# The per-screenshot counterpart of the `accept-screenshots` label
# (screenshot-review-labels.yml). The screenshot evidence comment lists each
# changed reference as a task-list checkbox, ending with a
# "Commit the ticked screenshots" box. A maintainer ticks the screenshots to
# keep, then ticks the last box; GitHub saves that as an edit to the comment,
# which starts this workflow.
#
# Only the ticked PNGs are committed: one new commit on the reviewed head whose
# tree takes those blobs from the view-only compare commit, pushed with the
# release App token so the new head gets its own `CI Passed` (CI skips e2e for a
# screenshot-only commit). The unticked candidates are not committed. As with the
# labels, the decision is recorded on the reviewed head's `Screenshot review`
# status, clears `screenshots-need-review`, and any later push starts a new review.
#
# Nothing in the comment is trusted beyond the ticks. The live comment is
# re-read, the editor must have write access, the listed head must still be the
# PR head, and every ticked name must be a PNG this compare commit actually
# changes. A refused attempt unticks the trigger box and says why.
#
# Bot edits (the publisher and the decision rewrite) never start it: only a
# human `sender` does. Nothing is checked out and no PR code runs here.
on:
  issue_comment:
    types: [edited]

permissions:
  contents: read

concurrency:
  group: screenshot-review-${{ github.event.issue.number }}
  # Retain queued publications and decisions; the default replaces pending runs.
  queue: max
  cancel-in-progress: false

jobs:
  select:
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.user.type == 'Bot' &&
      github.event.sender.type == 'User' &&
      contains(github.event.comment.body, '<!-- copse-e2e-screenshot-review -->') &&
      contains(github.event.comment.body, '[x] **Commit the ticked screenshots**')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
      statuses: write
    steps:
      # Read-only: every write happens in the last step, so a refusal and a
      # decision take the same path.
      - name: Validate the selection against the live head
        id: validate
        uses: actions/github-script@v9
        env:
          COMMENT_ID: ${{ github.event.comment.id }}
          PR_NUMBER: ${{ github.event.issue.number }}
          ACTOR: ${{ github.event.sender.login }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const number = Number(process.env.PR_NUMBER);
            const statusContext = 'Screenshot review';
            const refuse = (reason) => {
              core.setOutput('outcome', 'refuse');
              core.setOutput('reason', reason);
              core.notice(reason);
            };

            const { data: permission } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner,
              repo,
              username: process.env.ACTOR,
            });
            if (!['admin', 'maintain', 'write'].includes(permission.permission)) {
              refuse('only someone with write access can commit screenshots.');
              return;
            }

            // The event payload can be stale by the time this runs.
            const { data: comment } = await github.rest.issues.getComment({
              owner,
              repo,
              comment_id: Number(process.env.COMMENT_ID),
            });
            const body = comment.body ?? '';
            const stateStart = '<!-- copse-screenshot-review-state -->';
            const stateEnd = '<!-- /copse-screenshot-review-state -->';
            const start = body.indexOf(stateStart);
            const end = body.indexOf(stateEnd, start);
            if (comment.user?.type !== 'Bot' || start < 0 || end < 0) {
              refuse('the comment no longer asks for a review decision.');
              return;
            }
            const block = body.slice(start, end);
            if (!/^- \[x\] \*\*Commit the ticked screenshots\*\*$/im.test(block)) {
              refuse('the "Commit the ticked screenshots" box is no longer ticked.');
              return;
            }
            const listed = /<!-- copse-screenshot-selection:([0-9a-f]{12}) -->/.exec(block)?.[1];
            const names = [
              ...new Set(
                [...block.matchAll(/^- \[x\] `([A-Za-z0-9][A-Za-z0-9._-]*\.png)`/gim)].map((match) => match[1]),
              ),
            ];
            if (names.length === 0) {
              refuse('no screenshot is ticked.');
              return;
            }

            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
            const head = pr.head.sha;
            if (
              pr.state !== 'open' ||
              pr.head.repo?.full_name !== `${owner}/${repo}` ||
              !/^[0-9a-f]{40}$/.test(head)
            ) {
              refuse('only an open same-repository PR has a screenshot review.');
              return;
            }
            core.setOutput('head-sha', head);
            const sha12 = head.slice(0, 12);
            if (listed !== sha12) {
              refuse(`this list was published for ${listed ? `\`${listed}\`` : 'another head'}, not the current \`${sha12}\`.`);
              return;
            }

            // Newest first, so the first match is the current state.
            const { data: statuses } = await github.rest.repos.listCommitStatusesForRef({
              owner,
              repo,
              ref: head,
              per_page: 100,
            });
            const review = statuses.find((status) => status.context === statusContext);
            if (review?.state !== 'pending') {
              refuse(
                review
                  ? `the \`Screenshot review\` check for \`${sha12}\` is no longer waiting: ${review.description}.`
                  : `no screenshot evidence has been published for \`${sha12}\` yet.`,
              );
              return;
            }

            if (pr.body?.includes('<!-- copse-screenshot-stack:') && pr.body.includes(`tip=#${number} -->`)) {
              const declarations = [...pr.body.matchAll(/<!-- copse-screenshot-stack: [^\n]+ -->/g)];
              const { createHash } = require('node:crypto');
              const digest = declarations.length === 1
                ? createHash('sha256').update(declarations[0][0]).digest('hex') : '';
              const coverage = statuses.find((status) => status.context === 'Screenshot stack coverage');
              if (coverage?.state !== 'success' || coverage.creator?.id !== 41898282 || !digest ||
                  coverage.description !== `Stack coverage ${digest}`) {
                refuse('the stack tip has not published combined screenshot coverage yet.');
                return;
              }
              core.setOutput('stack-digest', digest);
            }

            const branch = `screenshot-compare/pr-${number}/${sha12}`;
            let compareCommit;
            try {
              const { data: ref } = await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` });
              compareCommit = ref.object.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
              refuse(`\`${sha12}\` has no compare commit to take screenshots from.`);
              return;
            }
            const { data: commit } = await github.rest.git.getCommit({
              owner,
              repo,
              commit_sha: compareCommit,
            });
            if (commit.parents.length !== 1 || commit.parents[0].sha !== head) {
              refuse(`the compare commit is not a single commit on \`${sha12}\`.`);
              return;
            }

            // Descend to tests/e2e/screenshots on both sides. Only the ticked
            // blobs are copied, so nothing else in the compare commit matters.
            const { data: headCommit } = await github.rest.git.getCommit({ owner, repo, commit_sha: head });
            const readTree = async (treeSha) => {
              const { data } = await github.rest.git.getTree({ owner, repo, tree_sha: treeSha });
              if (data.truncated) throw new Error(`Tree ${treeSha} is truncated.`);
              return new Map(data.tree.map((entry) => [entry.path, entry]));
            };
            const descend = async (rootSha) => {
              let sha = rootSha;
              for (const name of ['tests', 'e2e', 'screenshots']) {
                const entry = (await readTree(sha)).get(name);
                if (entry?.type !== 'tree') return undefined;
                sha = entry.sha;
              }
              return readTree(sha);
            };
            const [before, after] = await Promise.all([descend(headCommit.tree.sha), descend(commit.tree.sha)]);
            if (!before || !after) {
              refuse('the compare commit has no tests/e2e/screenshots/ tree to take screenshots from.');
              return;
            }

            const selected = [];
            for (const name of names) {
              const entry = after.get(name);
              if (entry?.type !== 'blob' || entry.mode !== '100644' || before.get(name)?.sha === entry.sha) {
                refuse(`\`${name}\` is not a changed candidate in the compare commit.`);
                return;
              }
              selected.push({ name, sha: entry.sha });
            }
            const candidates = [...after.entries()].filter(
              ([name, entry]) => entry.type === 'blob' && before.get(name)?.sha !== entry.sha,
            ).length;
            core.setOutput('outcome', 'accept');
            core.setOutput('compare-commit', compareCommit);
            core.setOutput('head-ref', pr.head.ref);
            core.setOutput('head-tree', headCommit.tree.sha);
            core.setOutput('selected', JSON.stringify(selected));
            core.setOutput('candidates', String(candidates));

      # continue-on-error: a missing or broken App credential leaves the token
      # empty, and the last step refuses with the manual route.
      - uses: actions/create-github-app-token@v3
        id: app-token
        if: steps.validate.outputs.outcome == 'accept'
        continue-on-error: true
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      # Not forced: if the branch moved after validation, GitHub refuses the
      # update because it is no longer a fast-forward of the reviewed head.
      - name: Commit the ticked screenshots to the PR branch
        id: commit
        if: steps.validate.outputs.outcome == 'accept' && steps.app-token.outputs.token != ''
        continue-on-error: true
        uses: actions/github-script@v9
        env:
          ACTOR: ${{ github.event.sender.login }}
          HEAD_SHA: ${{ steps.validate.outputs.head-sha }}
          HEAD_REF: ${{ steps.validate.outputs.head-ref }}
          HEAD_TREE: ${{ steps.validate.outputs.head-tree }}
          SELECTED: ${{ steps.validate.outputs.selected }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { owner, repo } = context.repo;
            const selected = JSON.parse(process.env.SELECTED);
            const namePattern = /^[A-Za-z0-9][A-Za-z0-9._-]*\.png$/;
            if (
              !Array.isArray(selected) ||
              selected.length === 0 ||
              !selected.every((item) => namePattern.test(item.name) && /^[0-9a-f]{40}$/.test(item.sha))
            ) {
              core.setFailed('Refusing an unexpected selection.');
              return;
            }
            const { data: tree } = await github.rest.git.createTree({
              owner,
              repo,
              base_tree: process.env.HEAD_TREE,
              tree: selected.map((item) => ({
                path: `tests/e2e/screenshots/${item.name}`,
                mode: '100644',
                type: 'blob',
                sha: item.sha,
              })),
            });
            const noun = selected.length === 1 ? 'screenshot' : 'screenshots';
            const { data: commit } = await github.rest.git.createCommit({
              owner,
              repo,
              message:
                `test(e2e): accept ${selected.length} reviewed ${noun}\n\n` +
                `Selected by @${process.env.ACTOR} from the screenshot review comment:\n` +
                selected.map((item) => `- ${item.name}`).join('\n'),
              tree: tree.sha,
              parents: [process.env.HEAD_SHA],
            });
            await github.rest.git.updateRef({
              owner,
              repo,
              ref: `heads/${process.env.HEAD_REF}`,
              sha: commit.sha,
              force: false,
            });
            core.setOutput('pushed', 'true');
            core.setOutput('commit', commit.sha);

      - name: Record the decision
        if: always()
        uses: actions/github-script@v9
        env:
          COMMENT_ID: ${{ github.event.comment.id }}
          PR_NUMBER: ${{ github.event.issue.number }}
          ACTOR: ${{ github.event.sender.login }}
          OUTCOME: ${{ steps.validate.outputs.outcome }}
          REASON: ${{ steps.validate.outputs.reason }}
          HEAD_SHA: ${{ steps.validate.outputs.head-sha }}
          SELECTED: ${{ steps.validate.outputs.selected }}
          CANDIDATES: ${{ steps.validate.outputs.candidates }}
          STACK_DIGEST: ${{ steps.validate.outputs.stack-digest }}
          TOKEN_MINTED: ${{ steps.app-token.outputs.token != '' }}
          PUSHED: ${{ steps.commit.outputs.pushed }}
          COMMIT: ${{ steps.commit.outputs.commit }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const number = Number(process.env.PR_NUMBER);
            const commentId = Number(process.env.COMMENT_ID);
            const actor = process.env.ACTOR;
            const sha = process.env.HEAD_SHA || '';
            const sha12 = sha.slice(0, 12);
            const stateStart = '<!-- copse-screenshot-review-state -->';
            const stateEnd = '<!-- /copse-screenshot-review-state -->';
            const trigger = '**Commit the ticked screenshots**';

            const { data: comment } = await github.rest.issues.getComment({
              owner,
              repo,
              comment_id: commentId,
            });
            const current = comment.body ?? '';

            let refusal = '';
            if (process.env.OUTCOME === 'accept' && process.env.PUSHED === 'true') {
              const selected = JSON.parse(process.env.SELECTED || '[]');
              const count = selected.length;
              const total = Math.max(Number(process.env.CANDIDATES) || 0, count);
              const commit12 = (process.env.COMMIT || '').slice(0, 12);
              // Recorded on the reviewed head for the audit trail; the new head
              // gets its own status once CI runs on it.
              await github.rest.repos.createCommitStatus({
                owner,
                repo,
                sha,
                state: 'success',
                context: 'Screenshot review',
                description: `Accepted by @${actor}; committed ${count} of ${total} screenshots as ${commit12}`,
                target_url: `https://github.com/${owner}/${repo}/pull/${number}`,
              });
              const bindDecision = async (head) => {
                if (/^[0-9a-f]{64}$/.test(process.env.STACK_DIGEST || '')) await github.rest.repos.createCommitStatus({
                  owner, repo, sha: head, state: 'success', context: 'Screenshot stack decision',
                  description: `Stack decision ${process.env.STACK_DIGEST}`,
                  target_url: `https://github.com/${owner}/${repo}/pull/${number}`,
                });
              };
              await bindDecision(sha);
              // Do not clear the reminder if another push already superseded
              // the screenshot commit this selection made.
              const { data: parent } = await github.rest.pulls.get({ owner, repo, pull_number: number });
              if (parent.state === 'open' && parent.head.sha === process.env.COMMIT && parent.head.repo?.full_name === `${owner}/${repo}`) {
                if (parent.body?.includes('<!-- copse-screenshot-stack:') &&
                    parent.body.includes(`tip=#${number} -->`)) {
                  await github.rest.repos.createCommitStatus({
                    owner, repo, sha: process.env.COMMIT, state: 'success', context: 'Screenshot review',
                    description: `Accepted by @${actor}; screenshot-only follow-up of ${sha12}`,
                    target_url: `https://github.com/${owner}/${repo}/pull/${number}`,
                  });
                  await bindDecision(process.env.COMMIT);
                }
                try {
                  await github.rest.issues.removeLabel({ owner, repo, issue_number: number, name: 'screenshots-need-review' });
                } catch (error) {
                  if (error.status !== 404) throw error;
                }
              }
              const decision =
                `**Reviewed:** accepted by @${actor}. The PR branch was advanced from \`${sha12}\` to ` +
                `\`${commit12}\`, committing ${count} of ${total} changed screenshot${total === 1 ? '' : 's'}: ` +
                `${selected.map((item) => `\`${item.name}\``).join(', ')}. ` +
                'The others were not committed; CI re-runs; declared stack tips repeat combined e2e, other PNG-only heads skip it.';
              const start = current.indexOf(stateStart);
              const end = current.indexOf(stateEnd, start);
              const block = `${stateStart}\n${decision}\n${stateEnd}`;
              const body =
                start >= 0 && end > start
                  ? `${current.slice(0, start)}${block}${current.slice(end + stateEnd.length)}`
                  : `${current.trimEnd()}\n\n${block}`;
              await github.rest.issues.updateComment({ owner, repo, comment_id: commentId, body });
              return;
            }

            if (process.env.OUTCOME === 'accept') {
              refusal =
                process.env.TOKEN_MINTED === 'true'
                  ? 'the PR branch could not be advanced. It may have moved since the evidence was published.'
                  : 'the release App token is unavailable, and a push with the job token would start no CI. ' +
                    'Use the `git checkout` command in the comment to take those files yourself.';
            } else {
              refusal = process.env.REASON || 'the selection could not be evaluated.';
            }

            // Untick the trigger so the box can be ticked again to retry.
            const reset = current.replace(`- [x] ${trigger}`, `- [ ] ${trigger}`);
            if (reset !== current) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: commentId, body: reset });
            }
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: number,
              body: `The ticked screenshots were not committed: ${refusal} ([workflow run](${process.env.RUN_URL}))`,
            });
            core.notice(refusal);
