name: E2E Screenshots

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: e2e-screenshots-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      ui: ${{ steps.filter.outputs.ui }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ui:
              - 'src/renderer/**'
              - 'tests/e2e/**'
              - 'wdio*.conf.ts'
              - 'assets/**'
              - '.github/workflows/e2e-screenshots.yml'

  update-screenshots:
    needs: changes
    if: |
      github.event.pull_request.head.repo.full_name == github.repository &&
      (
        needs.changes.outputs.ui == 'true' ||
        contains(github.event.pull_request.labels.*.name, 'update-screenshots') ||
        (github.event.action == 'labeled' && github.event.label.name == 'update-screenshots')
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: npm run build

      - name: Regenerate e2e reference screenshots
        run: |
          for attempt in 1 2 3; do
            echo "::group::e2e screenshot attempt $attempt"
            if npm run test:e2e:ci; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "e2e attempt $attempt failed"
          done
          exit 1

      - name: Detect screenshot changes
        id: diff
        run: |
          mapfile -t files < <(git diff --name-only -- tests/e2e/screenshots/)
          if [ ${#files[@]} -eq 0 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          {
            echo "files<<EOF"
            printf '%s\n' "${files[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Commit screenshot updates
        if: steps.diff.outputs.changed == 'true'
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/screenshots/
          git commit -m "chore(e2e): update reference screenshots from CI"
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Comment on PR with updated screenshots
        if: steps.diff.outputs.changed == 'true'
        uses: actions/github-script@v7
        env:
          CHANGED_FILES: ${{ steps.diff.outputs.files }}
          COMMIT_SHA: ${{ steps.commit.outputs.sha }}
        with:
          script: |
            const marker = '<!-- copse-e2e-screenshots -->';
            const sha = process.env.COMMIT_SHA || context.sha;
            const repo = context.repo.owner + '/' + context.repo.repo;
            const files = process.env.CHANGED_FILES.split('\n').filter(Boolean);
            const lines = files.map((path) => {
              const name = path.split('/').pop();
              const url = `https://github.com/${repo}/blob/${sha}/${path}`;
              return `- [${name}](${url}) — ![${name}](${url}?raw=1)`;
            });
            const body = `${marker}
            ## E2E screenshot updates

            This commit refreshed ${files.length} reference screenshot(s) from the Linux CI runner:

            ${lines.join('\n')}

            These PNGs live under \`tests/e2e/screenshots/\` for human visual review; CI asserts DOM structure, not pixel diffs.
            `;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(
              (c) =>
                c.user?.type === 'Bot' &&
                typeof c.body === 'string' &&
                c.body.includes(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
