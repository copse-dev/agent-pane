name: E2E Screenshots

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: e2e-screenshots-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  regenerate:
    # Regeneration runs the full seeded e2e suite — the same heavy suite the CI
    # workflow already gates on. Running both on every push overwhelms the shared
    # GitHub-hosted runners (flaky failures + cancelled jobs), so make screenshot
    # regeneration opt-in via the `update-screenshots` label instead of
    # auto-running on every UI change.
    if: |
      github.event.pull_request.head.repo.full_name == github.repository &&
      (
        contains(github.event.pull_request.labels.*.name, 'update-screenshots') ||
        (github.event.action == 'labeled' && github.event.label.name == 'update-screenshots')
      )
    runs-on: ubuntu-latest
    # Regenerate the seeded reference screenshots in parallel shards (same split as
    # the CI e2e gate) so the suite finishes inside the runner window. Each shard
    # uploads only the PNGs it changed; the `commit` job merges and commits them.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      SHARD_TOTAL: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: npm run build

      - name: Regenerate e2e reference screenshots (shard ${{ matrix.shard }}/${{ env.SHARD_TOTAL }})
        run: |
          for attempt in 1 2 3; do
            echo "::group::e2e screenshot shard ${{ matrix.shard }} attempt $attempt"
            if npm run test:e2e:ci -- --shard ${{ matrix.shard }}/${{ env.SHARD_TOTAL }}; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "e2e shard ${{ matrix.shard }} attempt $attempt failed"
          done
          exit 1

      - name: Collect changed screenshots
        run: |
          mkdir -p changed/tests/e2e/screenshots
          # Sentinel keeps the artifact non-empty so the commit job's download
          # never fails when a shard produced no screenshot diffs.
          touch "changed/.shard-${{ matrix.shard }}"
          mapfile -t files < <(git diff --name-only -- tests/e2e/screenshots/)
          for f in "${files[@]}"; do
            [ -n "$f" ] || continue
            cp "$f" "changed/tests/e2e/screenshots/"
          done
          echo "Collected ${#files[@]} changed screenshot(s) for shard ${{ matrix.shard }}"

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots-shard-${{ matrix.shard }}
          path: changed/
          include-hidden-files: true
          if-no-files-found: error

  commit:
    needs: regenerate
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Download regenerated screenshots
        uses: actions/download-artifact@v4
        with:
          pattern: screenshots-shard-*
          merge-multiple: true
          path: artifacts

      - name: Apply regenerated screenshots
        run: |
          if compgen -G "artifacts/tests/e2e/screenshots/*" > /dev/null; then
            cp -f artifacts/tests/e2e/screenshots/* tests/e2e/screenshots/
          fi

      - name: Detect screenshot changes
        id: diff
        run: |
          mapfile -t files < <(git diff --name-only -- tests/e2e/screenshots/)
          if [ ${#files[@]} -eq 0 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          {
            echo "files<<EOF"
            printf '%s\n' "${files[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Commit screenshot updates
        if: steps.diff.outputs.changed == 'true'
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/screenshots/
          # [skip ci]: a screenshot-only commit needs no CI gate, and skipping
          # also stops it from re-triggering this workflow (regeneration loop)
          # or cancelling an in-progress CI run via concurrency.
          git commit -m "chore(e2e): update reference screenshots from CI [skip ci]"
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Comment on PR with updated screenshots
        if: steps.diff.outputs.changed == 'true'
        uses: actions/github-script@v7
        env:
          CHANGED_FILES: ${{ steps.diff.outputs.files }}
          COMMIT_SHA: ${{ steps.commit.outputs.sha }}
        with:
          script: |
            const marker = '<!-- copse-e2e-screenshots -->';
            const sha = process.env.COMMIT_SHA || context.sha;
            const repo = context.repo.owner + '/' + context.repo.repo;
            const files = process.env.CHANGED_FILES.split('\n').filter(Boolean);
            const lines = files.map((path) => {
              const name = path.split('/').pop();
              const url = `https://github.com/${repo}/blob/${sha}/${path}`;
              return `- [${name}](${url}) — ![${name}](${url}?raw=1)`;
            });
            const body = `${marker}
            ## E2E screenshot updates

            This commit refreshed ${files.length} reference screenshot(s) from the Linux CI runner:

            ${lines.join('\n')}

            These PNGs live under \`tests/e2e/screenshots/\` for human visual review; CI asserts DOM structure, not pixel diffs.
            `;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(
              (c) =>
                c.user?.type === 'Bot' &&
                typeof c.body === 'string' &&
                c.body.includes(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
