name: Prune Scaleway IPs

on:
  schedule:
    - cron: '47 3 * * *'
  workflow_dispatch:
    inputs:
      settle_seconds:
        description: Gap between the two unattached observations required before deleting
        required: true
        default: '120'
        type: string

concurrency:
  group: prune-scaleway-ips
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prune:
    name: Delete managed orphan flexible IPs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install Scaleway CLI
        uses: scaleway/action-scw@v0.0.3
        with:
          version: v2.56.1
          access-key: ${{ secrets.SCW_ACCESS_KEY }}
          secret-key: ${{ secrets.SCW_SECRET_KEY }}
          default-project-id: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          default-organization-id: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
          export-config: true

      - name: Prune tagged unattached IPs
        env:
          SETTLE_SECONDS: ${{ inputs.settle_seconds || '120' }}
        run: npm run scaleway:prune-ips -- --yes --settle-seconds "$SETTLE_SECONDS"
