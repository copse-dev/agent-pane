name: Sync intellect scores

# Refreshes scripts/data/intellect-scores.json and the generated model-intellect
# table from Artificial Analysis. The script only accepts models already in the
# reviewed scores/wanted lists, and this workflow opens a PR for human review if
# any measured value changes or a wanted model gains a measurement.

on:
  schedule:
    # Tuesdays at 11:00 UTC, between the Monday model-catalog sync and the
    # Wednesday model-card sync so their automated PR jobs do not overlap.
    - cron: '0 11 * * 2'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    # CHECKS_RUNNER routes to the self-hosted check fleet when set (see
    # ci.yml's routing note); hosted otherwise. Scheduled, trusted-main only.
    runs-on: ${{ vars.CHECKS_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ./.github/actions/setup

      - name: Refresh intellect scores from Artificial Analysis
        env:
          ARTIFICIAL_ANALYSIS_API_KEY: ${{ secrets.ARTIFICIAL_ANALYSIS_API_KEY }}
        run: npm run sync:intellect -- --from-api

      # Covers the sync unit tests, generated-table contracts, typecheck, lint,
      # formatting, and the rest of the repository's pre-commit gate.
      - name: Validate
        id: validate
        continue-on-error: true
        run: npm run check

      - name: Open PR if intellect scores changed
        uses: peter-evans/create-pull-request@v8
        with:
          # The existing sync PAT/App token can create PRs under org policy and
          # ensures the new PR triggers the normal CI workflow. It needs
          # Contents + Pull requests: write on this repository.
          token: ${{ secrets.SYNC_PR_TOKEN }}
          branch: chore/sync-intellect
          delete-branch: true
          commit-message: 'chore(models): sync intellect scores from Artificial Analysis'
          title: 'chore(models): sync intellect scores from Artificial Analysis'
          labels: dependencies
          body: |
            Auto-generated by [`sync-intellect.yml`](.github/workflows/sync-intellect.yml)
            from the [Artificial Analysis language-model API](https://artificialanalysis.ai/).

            Review the diffs in `scripts/data/intellect-scores.json` and
            `packages/llm/src/model-intellect.generated.ts`. Confirm that each changed score is
            for the intended model/configuration and that the API index version still matches
            `canonicalVersion` before merging.

            Pre-PR validation outcome: `${{ steps.validate.outcome }}`. The normal PR checks are
            the source of truth; a failed validation keeps this workflow red while still leaving
            the generated diff available for review and repair.

      - name: Propagate validation failure
        if: steps.validate.outcome == 'failure'
        run: |
          echo 'Validation failed; see the generated sync PR for the reviewable diff.'
          exit 1
