name: Sync model cards

# Refreshes packages/llm/src/model-cards.generated.ts from the reviewed link file
# scripts/data/model-cards.json, discovering cards for any model still listed in
# `wanted` and verifying that every link resolves. Opens a PR if anything moved.
# See packages/llm/src/model-cards.ts for the data flow.
#
# Discovery and verification need direct egress to vendor sites (anthropic.com,
# openai.com, deepmind.google, llama.com), which sit behind bot protection and
# are commonly blocked from sandboxes — a hosted runner is the reliable place to
# run them, which is why both are opt-in flags rather than the default.

on:
  schedule:
    # Wednesdays at 11:00 UTC — offset from the model-catalog sync so the two
    # never race for the same PR branch runner. Cards move on model launches, so
    # weekly is plenty, and --verify doubles as a link-rot check.
    - cron: '0 11 * * 3'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    # CHECKS_RUNNER routes to the self-hosted check fleet when set (see ci.yml's
    # routing note); hosted otherwise. Scheduled, trusted-main only.
    runs-on: ${{ vars.CHECKS_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7.0.1

      # Same install path as ci.yml's check job: lifecycle scripts must run so
      # node-pty (and esbuild optional deps) are present for `npm run check`.
      - uses: ./.github/actions/setup

      - name: Discover and verify model cards
        # --discover fills models listed in `wanted` from each vendor's card
        # index; --verify GETs every link and fails on link rot, so a dead card
        # breaks this workflow instead of shipping to the value map.
        run: npm run sync:model-cards -- --discover --verify --delay=1.5

      # `npm run check` covers typecheck + lint + format:check + unit tests,
      # including model-cards.test.ts, which fails if a card is filed under a
      # model id nothing in the app can resolve.
      - name: Validate
        run: npm run check

      - name: Open PR if cards changed
        uses: peter-evans/create-pull-request@v8
        with:
          # A PAT / App token rather than GITHUB_TOKEN, for the same two reasons
          # as sync-model-catalog.yml: org policy blocks GITHUB_TOKEN from
          # opening PRs, and a GITHUB_TOKEN PR would not trigger CI.
          token: ${{ secrets.SYNC_PR_TOKEN }}
          branch: chore/sync-model-cards
          delete-branch: true
          commit-message: 'chore(models): sync vendor model cards'
          title: 'chore(models): sync vendor model cards'
          labels: dependencies
          body: |
            Auto-generated by [`sync-model-cards.yml`](.github/workflows/sync-model-cards.yml)
            from each vendor's own model-card / system-card index.

            Review the diff in `scripts/data/model-cards.json` and
            `packages/llm/src/model-cards.generated.ts`: open each new URL and confirm it is the
            card for that exact model (not a sibling — `gpt-5` vs `gpt-5-mini`) before merging.
            Discovered titles are placeholder quality; polish them in the data file.

            `npm run check` already passed on this branch.
