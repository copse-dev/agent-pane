name: Sync streaming-markdown

# Bumps @copse/streaming-markdown the moment a new release is published and
# opens a PR — push model instead of dependabot's weekly poll (dependabot
# stays enabled as the backstop if a dispatch is ever missed). The producer
# side lives in copse-dev/streaming-markdown's notify-agent-pane.yml, which
# fires a repository_dispatch here on every non-prerelease GitHub Release.

on:
  repository_dispatch:
    types: [streaming-markdown-release]
  # Manual fallback / backfill: run with an explicit version, or leave blank
  # to bump to whatever npm's `latest` dist-tag points at.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to bump to (blank = latest on npm)'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  pull-requests: write

# Releases are rare enough that queuing (not cancelling) is right: if two
# dispatches land close together, the second run re-bumps the same PR branch
# to the newer version rather than racing the first for it.
concurrency:
  group: sync-streaming-markdown
  cancel-in-progress: false

jobs:
  bump:
    # CHECKS_RUNNER routes to the self-hosted check fleet when set (see
    # ci.yml's routing note); hosted otherwise. Dispatch/manual, trusted only.
    runs-on: ${{ vars.CHECKS_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v6.0.3

      - uses: actions/setup-node@v6
        with: { node-version: '22', cache: 'npm' }

      - name: Resolve target version
        id: version
        env:
          DISPATCH_VERSION: ${{ github.event.client_payload.version }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="${DISPATCH_VERSION:-${INPUT_VERSION:-}}"
          if [ -z "$VERSION" ]; then
            VERSION=$(npm view @copse/streaming-markdown dist-tags.latest)
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Target: @copse/streaming-markdown@$VERSION"

      # streaming-markdown's release workflow publishes to npm *before* it
      # creates the GitHub Release that triggers the dispatch, so the version
      # should already be live — but registry replication can lag a little.
      # Poll briefly instead of failing the run on a race.
      - name: Wait for npm to serve the version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if npm view "@copse/streaming-markdown@$VERSION" version >/dev/null 2>&1; then
              echo "@copse/streaming-markdown@$VERSION is on the registry"
              exit 0
            fi
            echo "Not on the registry yet, retrying ($i/30)..."
            sleep 10
          done
          echo "@copse/streaming-markdown@$VERSION never appeared on npm" >&2
          exit 1

      # Skip the native postinstall steps (electron-rebuild, gortex download)
      # like sync-model-catalog.yml does — the bump and `npm run check` only
      # need pure-JS deps.
      - name: Install dependencies
        run: npm ci --ignore-scripts
        env:
          SKIP_ELECTRON_REBUILD: '1'
          SKIP_GORTEX_FETCH: '1'

      # `npm install pkg@^X.Y.Z` rewrites the range in package.json, keeping
      # the caret style the manifest already uses.
      - name: Bump dependency
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          npm install "@copse/streaming-markdown@^$VERSION" --ignore-scripts
          git diff --stat -- package.json package-lock.json

      # Same gate as sync-model-catalog: typecheck + lint + format:check +
      # dead-code + oracle + unit tests. continue-on-error because the whole
      # point is a push model: a PR you can pull down and fix beats a red run
      # with no branch. The outcome is surfaced in the PR body, and the final
      # step re-raises the failure so the run itself still goes red.
      - name: Validate
        id: check
        continue-on-error: true
        run: npm run check

      # Fixed branch name, so a second release before the first PR merges
      # force-updates the same PR to the newer version instead of stacking.
      # add-paths keeps any files the test run touched out of the commit.
      - name: Create branch and PR
        uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/bump-streaming-markdown
          delete-branch: true
          add-paths: |
            package.json
            package-lock.json
          commit-message: 'chore(deps): bump @copse/streaming-markdown to ${{ steps.version.outputs.version }}'
          title: 'chore(deps): bump @copse/streaming-markdown to ${{ steps.version.outputs.version }}'
          labels: dependencies
          body: |
            Auto-generated by [`sync-streaming-markdown.yml`](.github/workflows/sync-streaming-markdown.yml),
            dispatched by the [streaming-markdown ${{ github.event.client_payload.tag || format('v{0}', steps.version.outputs.version) }} release](https://github.com/copse-dev/streaming-markdown/releases/tag/${{ github.event.client_payload.tag || format('v{0}', steps.version.outputs.version) }}).

            `npm run check` on this branch: **${{ steps.check.outcome }}**.

            Note: PRs opened with `GITHUB_TOKEN` don't trigger the CI workflow —
            close/reopen this PR (or push to the branch) to get a full CI run
            before merging.

      - name: Surface validation failure
        if: steps.check.outcome == 'failure'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "npm run check failed against @copse/streaming-markdown@$VERSION — see the Validate step above. The bump PR was still opened." >&2
          exit 1
