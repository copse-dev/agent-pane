name: Copse review nightly sample

# One bounded dogfood sample per night, including draft pull requests. Copse's
# active backlog is draft-heavy, and draft state does not change the trust
# boundary: only same-repository heads can enter the secret-free ground job.
# The trust split is the same as the
# label-triggered pair, but all three jobs live in this scheduled workflow so
# the trusted selector's PR identity crosses jobs as outputs rather than as an
# artefact the pull request can rewrite. `ground` runs aggregate checks with no
# permissions or secrets on an ephemeral hosted runner. `findings` keeps model
# and App credentials in its trusted host process and brokers focused commands
# into a separate network-disabled container before posting an advisory review.

on:
  schedule:
    - cron: '37 2 * * *'
  workflow_dispatch:
    inputs:
      pr:
        description: 'Same-repository pull request number (empty selects the nightly sample)'
        required: false
        type: string

permissions: {}

concurrency:
  group: copse-review-nightly
  cancel-in-progress: false

jobs:
  select:
    name: Select one recent pull request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      number: ${{ steps.pr.outputs.number }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      base_ref: ${{ steps.pr.outputs.base_ref }}
    steps:
      - uses: actions/github-script@v9
        id: pr
        env:
          REQUESTED_PR: ${{ inputs.pr || '' }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const requested = process.env.REQUESTED_PR.trim();
            let selected;

            if (requested) {
              if (!/^[1-9][0-9]*$/.test(requested)) {
                core.setFailed('pr must be a positive pull request number');
                return;
              }
              selected = (await github.rest.pulls.get({
                owner,
                repo,
                pull_number: Number(requested),
              })).data;
            } else {
              const pulls = await github.paginate(github.rest.pulls.list, {
                owner,
                repo,
                state: 'open',
                sort: 'updated',
                direction: 'desc',
                per_page: 100,
              });
              const cutoff = Date.now() - 14 * 24 * 60 * 60 * 1000;
              const candidates = pulls.filter((pull) => {
                const labels = pull.labels.map((label) => label.name);
                return pull.head.repo?.full_name === `${owner}/${repo}` &&
                  Date.parse(pull.updated_at) >= cutoff &&
                  !labels.includes('copse-review') &&
                  !labels.includes('copse-review-skip') &&
                  !pull.title.startsWith('chore(e2e): review screenshots for #');
              });
              if (candidates.length === 0) {
                core.notice('No eligible same-repository pull request was updated in the last 14 days.');
                return;
              }
              const utcDay = Math.floor(Date.now() / (24 * 60 * 60 * 1000));
              selected = candidates[utcDay % candidates.length];
            }

            if (selected.state !== 'open' || selected.head.repo?.full_name !== `${owner}/${repo}`) {
              core.setFailed('dogfood samples must be open pull requests from this repository');
              return;
            }
            core.setOutput('number', String(selected.number));
            core.setOutput('head_sha', selected.head.sha);
            core.setOutput('base_ref', selected.base.ref);
            await core.summary
              .addHeading('Copse Reviewer nightly sample')
              .addLink(`#${selected.number}: ${selected.title}`, selected.html_url)
              .addRaw(`<p>Head <code>${selected.head.sha}</code></p>`)
              .write();

  ground:
    name: Stage 0 on the selected pull request head
    needs: select
    if: needs.select.outputs.number != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions: {}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # Use the reviewed CLI from the default branch. The selected head is
          # fetched below and executed only inside the secret-free Stage 0 cell.
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      # The cell gets a disposable HOME, so install a system Cargo rather than
      # relying on the hosted image's HOME-bound rustup shim. The other tools
      # match the full unit gate's Linux sandbox and search prerequisites. This
      # still runs before any contributor ref is fetched or executed.
      - name: Provision the Stage 0 test toolchain
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap cargo ripgrep socat
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          command -v bwrap
          command -v cargo
          command -v rg
          command -v rustc
          command -v socat
          bwrap --unshare-all --dev-bind / / --die-with-parent true

      - name: Activate the pinned pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare --activate
          pnpm --version

      - name: Install the reviewer
        shell: bash
        run: pnpm install --frozen-lockfile --ignore-scripts --filter "@copse/review..."

      - name: Run Stage 0 with the runner as the cell
        shell: bash
        env:
          HEAD_SHA: ${{ needs.select.outputs.head_sha }}
          BASE_REF: ${{ needs.select.outputs.base_ref }}
          PR_NUMBER: ${{ needs.select.outputs.number }}
        run: |
          set -euo pipefail
          setup_node_bin="$(dirname "$(command -v node)")"
          export PATH="${setup_node_bin}:/usr/bin:${PATH}"
          test "$(command -v cargo)" = /usr/bin/cargo
          test "$(command -v node)" = "${setup_node_bin}/node"
          git fetch --no-tags --quiet origin \
            "+refs/pull/${PR_NUMBER}/head:refs/remotes/pr/${PR_NUMBER}" \
            "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          test "$(git rev-parse "refs/remotes/pr/${PR_NUMBER}")" = "$HEAD_SHA"

          # Populate the store for the PR's exact lockfile without running any
          # contributor manifest or lifecycle script on the host. The checks
          # themselves remain offline inside the secret-free execution cell.
          dependency_seed="$RUNNER_TEMP/copse-review-dependencies"
          mkdir -p "$dependency_seed"
          git show "${HEAD_SHA}:pnpm-lock.yaml" > "$dependency_seed/pnpm-lock.yaml"
          if git cat-file -e "${HEAD_SHA}:patches" 2>/dev/null; then
            git archive --format=tar "$HEAD_SHA" patches | tar -xf - -C "$dependency_seed"
          fi
          pnpm fetch --frozen-lockfile --dir "$dependency_seed"

          mkdir -p ground
          printf '{"pr":%s,"headSha":"%s","baseRef":"%s"}\n' "$PR_NUMBER" "$HEAD_SHA" "$BASE_REF" > ground/meta.json
          node packages/review/bin/copse-review.mjs \
            --foreign \
            --head "refs/remotes/pr/${PR_NUMBER}" \
            --base "origin/${BASE_REF}" \
            --backend ephemeral-runner \
            --trusted-prepare "$GITHUB_WORKSPACE/scripts/prepare-review-stage0.mts" \
            --no-model \
            --json ground/report.json

      - uses: actions/upload-artifact@v7
        with:
          name: copse-review-nightly-ground-${{ needs.select.outputs.number }}
          path: ground/
          retention-days: 7
          if-no-files-found: error

  findings:
    name: Review the selected pull request
    needs: [select, ground]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
    env:
      REVIEW_PROVIDER: ${{ vars.COPSE_REVIEW_PROVIDER || 'openai-compatible' }}
      REVIEW_MODEL: ${{ vars.COPSE_REVIEW_MODEL || 'qwen3.8-27b' }}
      REVIEW_BASE_URL: ${{ vars.COPSE_REVIEW_BASE_URL || vars.SCW_GENERATIVE_API_URL || 'https://api.scaleway.ai/v1' }}
      REVIEW_LENSES: ${{ vars.COPSE_REVIEW_LENSES || 'correctness' }}
      REVIEW_MAX_STEPS: ${{ vars.COPSE_REVIEW_MAX_STEPS || '12' }}
      REVIEW_MAX_VERIFY: ${{ vars.COPSE_REVIEW_MAX_VERIFY || '3' }}
      REVIEW_CELL_IMAGE: copse-review-cell:${{ github.sha }}
    steps:
      # Scheduled workflows only run from the default branch. Pinning the ref
      # here makes the same guarantee explicit for manual dispatches.
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Activate the pinned pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare --activate
          pnpm --version

      - name: Install the reviewer
        shell: bash
        run: pnpm install --frozen-lockfile --ignore-scripts --filter "@copse/review..."

      - uses: actions/download-artifact@v6
        with:
          name: copse-review-nightly-ground-${{ needs.select.outputs.number }}
          path: ground

      - name: Prepare the focused-validation cell
        shell: bash
        env:
          HEAD_SHA: ${{ needs.select.outputs.head_sha }}
          PR_NUMBER: ${{ needs.select.outputs.number }}
          BASE_REF: ${{ needs.select.outputs.base_ref }}
        run: |
          set -euo pipefail
          node_version="$(tr -d '[:space:]' < .nvmrc)"
          docker build --pull \
            --build-arg "NODE_VERSION=${node_version}" \
            --tag "$REVIEW_CELL_IMAGE" \
            --file packages/review/Dockerfile.cell \
            packages/review

          git fetch --no-tags --quiet origin \
            "+refs/pull/${PR_NUMBER}/head:refs/remotes/pr/${PR_NUMBER}" \
            "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          test "$(git rev-parse "refs/remotes/pr/${PR_NUMBER}")" = "$HEAD_SHA"

          dependency_seed="$RUNNER_TEMP/copse-review-findings-dependencies"
          mkdir -p "$dependency_seed"
          git show "${HEAD_SHA}:pnpm-lock.yaml" > "$dependency_seed/pnpm-lock.yaml"
          if git cat-file -e "${HEAD_SHA}:patches" 2>/dev/null; then
            git archive --format=tar "$HEAD_SHA" patches | tar -xf - -C "$dependency_seed"
          fi
          pnpm fetch --frozen-lockfile --dir "$dependency_seed"

      # Use the repository's existing deploy App as the public reviewer
      # identity, scoped to the single write permission used by review posting.
      - name: Mint the Copse GitHub App review token
        id: review-app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-pull-requests: write

      - name: Review with focused validation and post the findings
        shell: bash
        env:
          COPSE_REVIEW_API_KEY: ${{ secrets.COPSE_REVIEW_API_KEY || secrets.SCW_GENERATIVE_API_KEY }}
          COPSE_REVIEW_FORGE_TOKEN: ${{ steps.review-app-token.outputs.token }}
          SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          HEAD_SHA: ${{ needs.select.outputs.head_sha }}
          PR_NUMBER: ${{ needs.select.outputs.number }}
          BASE_REF: ${{ needs.select.outputs.base_ref }}
        run: |
          set -euo pipefail
          review_base_url="${REVIEW_BASE_URL%/}"
          if test "$review_base_url" = "https://api.scaleway.ai/v1"; then
            if test -z "$SCW_DEFAULT_PROJECT_ID"; then
              echo "::error::SCW_DEFAULT_PROJECT_ID is required for explicit Scaleway billing attribution"
              exit 1
            fi
            if [[ ! "$SCW_DEFAULT_PROJECT_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]; then
              echo "::error::SCW_DEFAULT_PROJECT_ID is not a lowercase UUID"
              exit 1
            fi
            review_base_url="https://api.scaleway.ai/${SCW_DEFAULT_PROJECT_ID}/v1"
            echo "::notice::Copse Reviewer is using an explicit Scaleway project endpoint"
          fi
          test "$(git rev-parse "refs/remotes/pr/${PR_NUMBER}")" = "$HEAD_SHA"
          node packages/review/bin/copse-review.mjs \
            --foreign \
            --head "refs/remotes/pr/${PR_NUMBER}" \
            --base "origin/${BASE_REF}" \
            --stage0-json ground/report.json \
            --backend container \
            --image "$REVIEW_CELL_IMAGE" \
            --trusted-prepare "$GITHUB_WORKSPACE/scripts/prepare-review-stage0.mts" \
            --provider "$REVIEW_PROVIDER" \
            --model "$REVIEW_MODEL" \
            --base-url "$review_base_url" \
            --lenses "$REVIEW_LENSES" \
            --max-steps "$REVIEW_MAX_STEPS" \
            --max-verify "$REVIEW_MAX_VERIFY" \
            --post-review github \
            --repo "$GITHUB_REPOSITORY" \
            --pr "$PR_NUMBER" \
            --json findings.json \
            --sarif findings.sarif \
            --events findings.events.jsonl

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: copse-review-nightly-findings-${{ needs.select.outputs.number }}
          path: |
            findings.json
            findings.sarif
            findings.events.jsonl
          retention-days: 30
          if-no-files-found: ignore
