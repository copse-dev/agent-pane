name: Copse review trigger

# Dogfood the same workflow that external repositories call. GitHub resolves the
# local workflow and reviewer source from this trusted default-branch revision.
# Reviews run on main after a credential-free PR signal, or by manual dispatch.
on:
  workflow_run:
    workflows: [Copse review request]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to review
        required: true
        type: number

permissions: {}

# Retries of one head supersede each other; a late old request cannot cancel a newer head.
concurrency:
  group: copse-review-trigger-${{ github.event.workflow_run.pull_requests[0].number || inputs.pr || github.run_id }}-${{ github.event.workflow_run.head_sha || 'manual' }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.repository_id == '1274237362' && github.actor_id == '338988' &&
      github.triggering_actor == 'jonathanKingston' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.id == github.event.repository.id))
    permissions:
      contents: read
      # Ceiling for the portable variant; the protected Copse job reduces this to read.
      pull-requests: write
    uses: ./.github/workflows/reviewer.yml
    with:
      reviewer-ref: ${{ github.sha }}
      preparation: copse-pnpm
      pr: ${{ github.event.workflow_run.pull_requests[0].number || inputs.pr || 0 }}
    # Same-repository inheritance enables the protected job's environment secrets
    # (actions/runner#4453); naming an empty value does not. Grounding references
    # no secrets, and only the guarded Copse findings job reads RELEASE_APP_*.
    secrets: inherit
