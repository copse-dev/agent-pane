name: Copse review trigger

# Dogfood the same workflow that external repositories call. GitHub resolves the
# local workflow and reviewer source from this trusted default-branch revision.
# Full reviews do not follow pushes; the independent cheap summary still does.
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, labeled, synchronize]

  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to review
        required: true
        type: number

permissions: {}

# Pushes cancel each other's dispatch, never a review's.
concurrency:
  group: copse-review-trigger-${{ github.event.pull_request.number }}-${{ github.event.action == 'synchronize' && 'push' || 'review' }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.repository_id == '1274237362' && github.actor_id == '338988' &&
      github.triggering_actor == 'jonathanKingston' && github.event.action != 'synchronize'
    permissions:
      contents: read
      # Ceiling for the portable variant; the protected Copse job reduces this to read.
      pull-requests: write
    uses: ./.github/workflows/reviewer.yml
    with:
      reviewer-ref: ${{ github.sha }}
      preparation: copse-pnpm
      pr: ${{ inputs.pr || 0 }}
    secrets:
      app-id: ${{ secrets.RELEASE_APP_ID }}
      app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      COPSE_REVIEW_API_KEY: ${{ secrets.COPSE_REVIEW_API_KEY }}
      COPSE_REVIEW_OPENROUTER_API_KEY: ${{ secrets.COPSE_REVIEW_OPENROUTER_API_KEY }}
      SCW_GENERATIVE_API_KEY: ${{ secrets.SCW_GENERATIVE_API_KEY }}
      SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}

  summary:
    name: Dispatch the description summary for the current head
    # The review's own rule, plus pushes: ready, or a draft with the label.
    if: >-
      github.event_name == 'pull_request_target' &&
      github.repository_id == '1274237362' &&
      github.actor_id == '338988' &&
      github.event.pull_request.user.id == 338988 &&
      github.event.pull_request.head.repo.id == 1274237362 &&
      !contains(github.event.pull_request.labels.*.name, 'copse-review-skip') &&
      ((github.event.action == 'labeled' && github.event.label.name == 'copse-review') ||
      (github.event.action != 'labeled' && (!github.event.pull_request.draft ||
      contains(github.event.pull_request.labels.*.name, 'copse-review'))))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      pull-requests: read
    steps:
      - name: Resolve the current pull request and dispatch its summary
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          IFS=$'\t' read -r head base state draft labelled skipped < <(
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
              --jq '[.head.sha, .base.ref, .state, .draft,
                ([.labels[].name] | index("copse-review") != null),
                ([.labels[].name] | index("copse-review-skip") != null)] | @tsv'
          )
          test -n "$head" && test -n "$base" && test "$state" = "open"
          if [ "$skipped" = "true" ]; then
            echo "::notice::copse-review-skip is set; not summarising"
            exit 0
          fi
          if [ "$draft" = "true" ] && [ "$labelled" != "true" ]; then
            echo "::notice::a draft is summarised only with the copse-review label"
            exit 0
          fi
          gh workflow run review-summary.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$DEFAULT_BRANCH" \
            -f "pr=${PR_NUMBER}" \
            -f "head=${head}" \
            -f "base=${base}"
