name: Copse review trigger

# Dogfood the same workflow that external repositories call. GitHub resolves the
# local workflow and reviewer source from this trusted default-branch revision.
# Reviews are requested manually on main for same-repository PRs only.
on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to review
        required: true
        type: number

permissions: {}

# A new manual request for the same PR supersedes the previous request.
concurrency:
  group: copse-review-trigger-${{ inputs.pr }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.repository_id == '1274237362' && github.actor_id == '338988' &&
      github.triggering_actor == 'jonathanKingston' && github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      # Ceiling for the portable variant; the protected Copse job reduces this to read.
      pull-requests: write
    uses: ./.github/workflows/reviewer.yml
    with:
      reviewer-ref: ${{ github.sha }}
      preparation: copse-pnpm
      pr: ${{ inputs.pr }}
    # Same-repository inheritance enables the protected job's environment secrets
    # (actions/runner#4453); naming an empty value does not. Grounding references
    # no secrets, and only the guarded Copse findings job reads RELEASE_APP_*.
    secrets: inherit
