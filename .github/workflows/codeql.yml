name: CodeQL

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

# CodeQL is advisory rather than a required PR check. It scans the `main` tip
# once a day. Every commit reaches `release` via a promotion from `main`, so
# scanning `main` covers the same code a promotion earlier.
#
# It used to scan every push to `main` as well (~30 a day, ~8 minutes each).
# That bought nothing: this repository does not have GitHub Code Security
# enabled, so the SARIF is only retained as a 7-day workflow artifact, and no
# one is notified per push. A daily scan still covers every day's tip for about
# a thirtieth of the minutes; dispatch it by hand to scan a specific ref. If
# Code Security is enabled and results are uploaded, per-push scanning becomes
# worth reconsidering.
permissions:
  actions: read
  contents: read

jobs:
  analyze:
    name: Analyze JavaScript and TypeScript
    runs-on: ${{ vars.SELF_HOSTED_CHECKS || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4.38.0
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@v4.38.0
        with:
          upload: false
          output: codeql-results
      - uses: actions/upload-artifact@v7
        with:
          name: codeql-results
          path: codeql-results
          retention-days: 7
