name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 6 * * 1'

# The workflow runs untrusted fork code only on GitHub-hosted runners. This
# repository does not currently have GitHub Code Security enabled, so retain the
# SARIF as a workflow artifact instead of asking the API to ingest it.
permissions:
  actions: read
  contents: read

jobs:
  analyze:
    name: Analyze JavaScript and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          upload: false
          output: codeql-results
      - uses: actions/upload-artifact@v7.0.0
        with:
          name: codeql-results
          path: codeql-results
          retention-days: 7
