name: Merge queue decisions

on:
  merge_group:
    types: [checks_requested]

permissions: {}

concurrency:
  group: merge-queue-decisions-${{ github.event.merge_group.head_sha }}
  cancel-in-progress: false

jobs:
  decisions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Check out the gate script from the trusted queue base
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.merge_group.base_sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/merge-queue-gates.mts
            scripts/merge-queue-tree.mts
          sparse-checkout-cone-mode: false
      - name: Verify PR decisions and report them on the synthetic commit
        uses: actions/github-script@v9
        env:
          GROUP_BASE_REF: ${{ github.event.merge_group.base_ref }}
          GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        with:
          script: |
            const { evaluateMergeQueueGates } = await import(
              `${process.env.GITHUB_WORKSPACE}/scripts/merge-queue-gates.mts`
            );
            await evaluateMergeQueueGates(github, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              baseRef: process.env.GROUP_BASE_REF,
              baseSha: process.env.GROUP_BASE_SHA,
              headSha: process.env.GROUP_HEAD_SHA,
            });
