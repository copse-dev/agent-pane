name: Publish screenshot candidates

# CI itself stays read-only. Once a successful PR run has produced the immutable
# candidate artifact, this trusted-default-branch workflow makes it reviewable
# from the parent PR. Every eligible run with candidates pushes a view-only
# compare branch, `screenshot-compare/pr-<N>/<sha12>`: one bot commit of
# validated PNGs on top of the exact rendered head. The parent comment links
# GitHub's compare view for that commit, so image diffs (2-up/swipe/onion skin)
# need no download, and previews up to 20 before/after pairs inline from raw
# URLs pinned to the head and compare commit SHAs (the repository is public, so
# GitHub renders them in the comment). Screenshots the PR touches (reference
# PNGs it changes, or names its changed e2e specs mention) preview first, so
# unrelated rendering drift cannot crowd them out of the table.
#
# The branch is pushed with this job's GITHUB_TOKEN, which starts no workflows,
# so it never runs CI or demo previews, and it is never merged. Accepting
# references means committing the PNGs to the PR branch, for example by
# cherry-picking the compare commit. `update-screenshots` only makes CI render
# the full reference set; the result reaches this workflow like any other
# candidate set. No code path here opens a PR or mints an App token.
#
# Review is blocking. Every eligible head gets a `Screenshot review` commit
# status, which the default-branch ruleset requires: pending while candidates
# await a decision, success when there are none. The `accept-screenshots` and
# `decline-screenshots` labels record the decision
# (screenshot-review-labels.yml); a push starts a new review, because statuses
# belong to one SHA.
#
# `workflow_run` is deliberately used instead of adding a
# write token to the job that executes pull-request code. Nothing from the
# checkout is ever executed here; the candidate PNGs are validated as data.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

concurrency:
  group: screenshot-candidates-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  publish:
    # A workflow_run receives secrets even when its source run came from a fork.
    # Reject forks before pushing any branch or writing to a PR.
    # Failed/cancelled runs have no accepted evidence to publish.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ${{ vars.SELF_HOSTED_CHECKS || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
      pull-requests: write
      statuses: write
    steps:
      - name: Resolve the live parent PR and exact artifact
        id: discover
        uses: actions/github-script@v9
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const runId = Number(process.env.RUN_ID);
            const runHeadSha = process.env.RUN_HEAD_SHA;
            const candidates = context.payload.workflow_run.pull_requests || [];

            core.setOutput('eligible', 'false');
            core.setOutput('has-artifact', 'false');
            // Every bot ref below is derived from this SHA; refuse anything but
            // a full hex object id before it can shape a branch name.
            if (!/^[0-9a-f]{40}$/.test(runHeadSha || '')) {
              core.setFailed(`Run ${runId} reported an unexpected head SHA.`);
              return;
            }
            if (candidates.length !== 1) {
              core.notice(`Expected one parent PR for run ${runId}; found ${candidates.length}.`);
              return;
            }

            const number = candidates[0].number;
            const { data: parent } = await github.rest.pulls.get({ owner, repo, pull_number: number });
            const sameRepository = parent.head.repo?.full_name === `${owner}/${repo}`;
            const integrationHead = parent.head.ref === 'main' || parent.head.ref === 'release';
            // Promotion and merge-back PRs carry commits whose screenshots were
            // reviewed on their source PRs; their review gate passes unasked.
            if (
              parent.state === 'open' &&
              sameRepository &&
              integrationHead &&
              parent.head.sha === runHeadSha
            ) {
              core.setOutput('gate-sha', runHeadSha);
              core.setOutput('integration', 'true');
            }
            if (
              parent.state !== 'open' ||
              !sameRepository ||
              integrationHead ||
              parent.head.sha !== runHeadSha
            ) {
              core.notice(
                `PR #${number} is closed, external, integration-owned, or moved past ${runHeadSha}; ` +
                  'publishing no screenshot evidence.',
              );
              return;
            }

            const artifactName = `reference-screenshot-candidates-${runId}`;
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner,
              repo,
              run_id: runId,
              per_page: 100,
            });
            const matches = artifacts.filter(
              (artifact) => artifact.name === artifactName && !artifact.expired,
            );
            if (matches.length > 1) {
              core.setFailed(`Run ${runId} has ${matches.length} artifacts named ${artifactName}.`);
              return;
            }

            core.setOutput('eligible', 'true');
            core.setOutput('parent-number', String(number));
            core.setOutput('head-sha', runHeadSha);
            core.setOutput('gate-sha', runHeadSha);
            // A separate prefix: `screenshots/pr-<N>/` belonged to the retired
            // review PRs, whose legacy cleanup still matches on it.
            core.setOutput(
              'compare-branch',
              `screenshot-compare/pr-${number}/${runHeadSha.slice(0, 12)}`,
            );
            if (matches.length === 1) {
              core.setOutput('has-artifact', 'true');
              core.setOutput('artifact-id', String(matches[0].id));
              // The comment previews screenshots this PR touches first: the
              // reference PNGs it changes and the e2e specs it changes. Only
              // names and paths leave here; the candidate step re-validates
              // them. A failed listing only loses the ordering.
              const screenshotPath = /^tests\/e2e\/screenshots\/([A-Za-z0-9][A-Za-z0-9._-]*\.png)$/;
              const specPath =
                /^tests\/e2e\/(?:[A-Za-z0-9][A-Za-z0-9_-]*\/)*[A-Za-z0-9][A-Za-z0-9._-]*\.e2e\.ts$/;
              const focusScreenshots = [];
              const focusSpecs = [];
              try {
                const files = await github.paginate(github.rest.pulls.listFiles, {
                  owner,
                  repo,
                  pull_number: number,
                  per_page: 100,
                });
                for (const file of files) {
                  if (typeof file?.filename !== 'string' || file.status === 'removed') continue;
                  const screenshot = screenshotPath.exec(file.filename);
                  if (screenshot && focusScreenshots.length < 500) focusScreenshots.push(screenshot[1]);
                  if (specPath.test(file.filename) && focusSpecs.length < 200) focusSpecs.push(file.filename);
                }
              } catch (error) {
                core.notice(`Could not list PR #${number} files; previews stay in name order: ${error.message}`);
              }
              core.setOutput('focus-screenshots', focusScreenshots.join('\n'));
              core.setOutput('focus-specs', focusSpecs.join('\n'));
            } else {
              core.notice(`Run ${runId} published no changed screenshot candidates.`);
            }

      # Checkout by the immutable SHA discovered above, never by an
      # attacker-controlled ref. Nothing from this checkout is executed, and no
      # credential is left in it: the one push below carries its own header.
      # Shallow: the compare commit needs nothing but the head, which the remote
      # already has, and full history is GiBs of PNG revisions.
      - uses: actions/checkout@v7.0.1
        if: steps.discover.outputs.has-artifact == 'true'
        with:
          ref: ${{ steps.discover.outputs.head-sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download the immutable candidate artifact
        if: steps.discover.outputs.has-artifact == 'true'
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.discover.outputs.artifact-id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          merge-multiple: true
          path: ${{ runner.temp }}/screenshot-candidates

      - name: Validate and apply candidate PNGs
        if: steps.discover.outputs.has-artifact == 'true'
        id: candidates
        env:
          CANDIDATE_ROOT: ${{ runner.temp }}/screenshot-candidates
          FOCUS_SCREENSHOTS: ${{ steps.discover.outputs.focus-screenshots }}
          FOCUS_SPECS: ${{ steps.discover.outputs.focus-specs }}
        run: |
          listing="$RUNNER_TEMP/screenshot-candidate-names"
          : > "$listing"

          # Screenshots this PR touches: reference PNGs it changes, plus every
          # literal `<name>.png` in the e2e specs it changes. Specs are read as
          # blobs from the head commit, never executed or followed as links.
          focus_names="$RUNNER_TEMP/screenshot-focus-names"
          focus_text="$RUNNER_TEMP/screenshot-focus-specs"
          printf '%s\n' "$FOCUS_SCREENSHOTS" |
            grep -xE '[A-Za-z0-9][A-Za-z0-9._-]*\.png' > "$focus_names" || true
          : > "$focus_text"
          while IFS= read -r spec; do
            if [[ "$spec" =~ ^tests/e2e/([A-Za-z0-9][A-Za-z0-9_-]*/)*[A-Za-z0-9][A-Za-z0-9._-]*\.e2e\.ts$ ]]; then
              git cat-file blob "HEAD:$spec" >> "$focus_text" 2> /dev/null || true
            fi
          done <<< "$FOCUS_SPECS"
          grep -oE '[A-Za-z0-9][A-Za-z0-9._-]*\.png' "$focus_text" >> "$focus_names" || true
          if find "$CANDIDATE_ROOT" -type l -print -quit | grep -q .; then
            echo '::error::Screenshot candidate artifact contains a symlink.'
            exit 1
          fi

          count=0
          total=0
          while IFS= read -r -d '' path; do
            relative="${path#"$CANDIDATE_ROOT"/}"
            case "$relative" in
              .shard-[1-8])
                ;;
              tests/e2e/screenshots/*.png)
                name="${relative#tests/e2e/screenshots/}"
                if [[ "$name" == */* || ! "$name" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*\.png$ ]]; then
                  echo "::error::Invalid screenshot candidate path: $relative"
                  exit 1
                fi
                # wc -c, not GNU stat -c, so the step's unit test also runs on macOS.
                size="$(wc -c < "$path" | tr -d ' ')"
                signature="$(head -c 8 "$path" | od -An -t x1 | tr -d ' \n')"
                if [ "$signature" != '89504e470d0a1a0a' ]; then
                  echo "::error::Candidate is not a PNG: $relative"
                  exit 1
                fi
                if [ "$size" -gt 16777216 ]; then
                  echo "::error::Candidate exceeds 16 MiB: $relative"
                  exit 1
                fi
                count=$((count + 1))
                total=$((total + size))
                # A labelled refresh renders every committed reference, so the
                # budget must exceed the whole reference set with headroom
                # (ci-workflow-invariants.test.ts pins it at twice the count
                # and size of tests/e2e/screenshots).
                if [ "$count" -gt 2048 ] || [ "$total" -gt 536870912 ]; then
                  echo '::error::Screenshot candidate artifact exceeds its count or size budget.'
                  exit 1
                fi
                # Recorded before applying: a name absent from the head tree is new.
                # The leading rank sorts screenshots this PR touches first.
                rank=1
                if grep -qxF -- "$name" "$focus_names"; then rank=0; fi
                if git cat-file -e "HEAD:tests/e2e/screenshots/$name" 2> /dev/null; then
                  printf '%s %s changed\n' "$rank" "$name" >> "$listing"
                else
                  printf '%s %s new\n' "$rank" "$name" >> "$listing"
                fi
                install -m 0644 "$path" "tests/e2e/screenshots/$name"
                ;;
              *)
                echo "::error::Unexpected file in screenshot candidate artifact: $relative"
                exit 1
                ;;
            esac
          done < <(find "$CANDIDATE_ROOT" -type f -print0)

          if [ "$count" -eq 0 ]; then
            echo '::error::The candidate artifact contains no reviewable PNGs.'
            exit 1
          fi
          echo "count=$count" >> "$GITHUB_OUTPUT"

          # The parent comment previews the first names: those this PR touches,
          # then the rest, each in byte order. Emit only a bounded prefix: a
          # full refresh can carry thousands of names, and one environment
          # variable is capped at 128 KiB on Linux. `count` stays the exact
          # total. Names already matched the strict pattern above, so they need
          # no JSON escaping.
          names="$(LC_ALL=C sort "$listing" | awk '
            NR <= 50 {
              printf "%s{\"name\":\"%s\",\"new\":%s,\"focus\":%s}", (NR > 1 ? "," : ""), $2,
                ($3 == "new" ? "true" : "false"), ($1 == "0" ? "true" : "false")
            }')"
          echo "names=[$names]" >> "$GITHUB_OUTPUT"

      # A view-only branch for GitHub's compare page: one commit holding exactly
      # the validated PNGs, parented on the rendered head. Its message is worded
      # for the PR branch, where accepting references cherry-picks it. It is built with a
      # throwaway index and `git commit-tree`, so no hook from the checkout runs
      # and its HEAD, index, and working tree are left untouched.
      # GITHUB_TOKEN pushes trigger no workflows. The token reaches git only
      # through env-scoped config for this one push, never argv or .git/config.
      # A refused push (for example a ruleset) degrades to the artifact-only
      # comment instead of blocking publication; bad candidates already failed
      # the validation step above.
      - name: Push the view-only screenshot compare branch
        id: compare
        if: steps.discover.outputs.has-artifact == 'true'
        continue-on-error: true
        env:
          COMPARE_BRANCH: ${{ steps.discover.outputs.compare-branch }}
          HEAD_SHA: ${{ steps.discover.outputs.head-sha }}
          PARENT_NUMBER: ${{ steps.discover.outputs.parent-number }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          PUSH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          if [[ ! "$COMPARE_BRANCH" =~ ^screenshot-compare/pr-[1-9][0-9]*/[0-9a-f]{12}$ ]] ||
            [ "$COMPARE_BRANCH" != "screenshot-compare/pr-$PARENT_NUMBER/${HEAD_SHA:0:12}" ] ||
            [ "$(git rev-parse HEAD)" != "$HEAD_SHA" ]; then
            echo '::error::Refusing an unexpected compare branch or checkout.'
            exit 1
          fi

          index="$RUNNER_TEMP/screenshot-compare.index"
          rm -f "$index"
          GIT_INDEX_FILE="$index" git read-tree HEAD
          GIT_INDEX_FILE="$index" git add -- tests/e2e/screenshots/
          tree="$(GIT_INDEX_FILE="$index" git write-tree)"
          rm -f "$index"
          if [ "$tree" = "$(git rev-parse 'HEAD^{tree}')" ]; then
            echo "::notice::Candidates already match $HEAD_SHA; no compare branch needed."
            exit 0
          fi
          unexpected="$(git diff-tree -r --name-only HEAD "$tree" |
            grep -Ev '^tests/e2e/screenshots/[A-Za-z0-9][A-Za-z0-9._-]*\.png$' || true)"
          if [ -n "$unexpected" ]; then
            echo '::error::Compare commit would touch files outside tests/e2e/screenshots/.'
            exit 1
          fi

          commit="$(
            GIT_AUTHOR_NAME='github-actions[bot]' \
            GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com' \
            GIT_COMMITTER_NAME='github-actions[bot]' \
            GIT_COMMITTER_EMAIL='41898282+github-actions[bot]@users.noreply.github.com' \
            git commit-tree "$tree" -p HEAD \
              -m "chore(e2e): update reference screenshots for #$PARENT_NUMBER" \
              -m "Rendered by CI run $RUN_ID at ${HEAD_SHA:0:12}."
          )"

          basic="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)"
          echo "::add-mask::$basic"
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0="http.$SERVER_URL/.extraheader" \
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $basic" \
            git push --force "$SERVER_URL/$REPOSITORY.git" "$commit:refs/heads/$COMPARE_BRANCH"
          echo 'pushed=true' >> "$GITHUB_OUTPUT"
          # The parent comment pins its "after" images to this immutable commit.
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      # The blocking review gate, set before the best-effort cleanup below so a
      # cleanup error cannot leave the head without it. Statuses belong to one
      # SHA, so no decision outlives the head it was made on. A decision already
      # recorded for this head is kept: the `labeled` event that carried it
      # re-runs CI on the same head, and that run's candidates must not reopen
      # the review. The last step below fails the gate closed if this job
      # breaks before reaching here.
      - name: Gate the parent on screenshot review
        id: gate
        if: steps.discover.outputs.gate-sha != ''
        uses: actions/github-script@v9
        env:
          PARENT_NUMBER: ${{ steps.discover.outputs.parent-number }}
          GATE_SHA: ${{ steps.discover.outputs.gate-sha }}
          INTEGRATION: ${{ steps.discover.outputs.integration }}
          CANDIDATE_COUNT: ${{ steps.candidates.outputs.count }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const statusContext = 'Screenshot review';
            const sha = process.env.GATE_SHA;
            const count = Number(process.env.CANDIDATE_COUNT) || 0;
            const number = Number(process.env.PARENT_NUMBER);
            const setStatus = (state, description) =>
              github.rest.repos.createCommitStatus({
                owner,
                repo,
                sha,
                state,
                context: statusContext,
                description,
                ...(number > 0 ? { target_url: `https://github.com/${owner}/${repo}/pull/${number}` } : {}),
              });

            if (process.env.INTEGRATION === 'true') {
              await setStatus('success', 'Integration branch: screenshots were reviewed on the source PRs');
              return;
            }
            // Newest first, so the first match is the current state.
            const { data: statuses } = await github.rest.repos.listCommitStatusesForRef({
              owner,
              repo,
              ref: sha,
              per_page: 100,
            });
            const latest = statuses.find((status) => status.context === statusContext);
            if (latest?.state === 'success' && /^(?:Accepted|Declined) by @/.test(latest.description ?? '')) {
              core.info(`Keeping the recorded decision: ${latest.description}`);
              core.setOutput('decision', latest.description);
              return;
            }
            if (count === 0) {
              await setStatus('success', 'No changed reference screenshots');
              return;
            }
            const noun = count === 1 ? 'screenshot awaits' : 'screenshots await';
            await setStatus(
              'pending',
              `${count} changed ${noun} review: label accept-screenshots or decline-screenshots`,
            );
            core.setOutput('pending', 'true');

      # Legacy cleanup. Earlier versions of this workflow opened PNG review PRs
      # from `screenshots/pr-<N>/` branches; nothing creates them any more, so
      # close any still open once the parent has a newer successful render.
      # Guarded like the compare cleanup below: only a publisher whose parent is
      # still open at its exact head acts.
      - name: Close legacy screenshot review PRs
        if: steps.discover.outputs.eligible == 'true'
        uses: actions/github-script@v9
        env:
          PARENT_NUMBER: ${{ steps.discover.outputs.parent-number }}
          EXPECTED_HEAD_SHA: ${{ steps.discover.outputs.head-sha }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const parentNumber = Number(process.env.PARENT_NUMBER);
            const prefix = `screenshots/pr-${parentNumber}/`;
            const { data: parent } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: parentNumber,
            });
            if (parent.state !== 'open' || parent.head.sha !== process.env.EXPECTED_HEAD_SHA) return;
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });
            for (const pull of pulls) {
              if (pull.head.repo?.full_name !== `${owner}/${repo}` || !pull.head.ref.startsWith(prefix)) continue;
              await github.rest.pulls.update({ owner, repo, pull_number: pull.number, state: 'closed' });
              core.info(`Closed legacy screenshot review PR #${pull.number}.`);
              try {
                await github.rest.git.deleteRef({ owner, repo, ref: `heads/${pull.head.ref}` });
              } catch (error) {
                core.info(`Could not delete ${pull.head.ref}: ${error.message}`);
              }
            }

      # Only a publisher whose parent is still open at its exact head may
      # delete another run's branch. A
      # stale publisher deletes only the branch it just pushed, so it can never
      # remove evidence for a newer head.
      - name: Delete superseded screenshot compare branches
        id: compare-cleanup
        if: steps.discover.outputs.eligible == 'true'
        uses: actions/github-script@v9
        env:
          PARENT_NUMBER: ${{ steps.discover.outputs.parent-number }}
          EXPECTED_HEAD_SHA: ${{ steps.discover.outputs.head-sha }}
          COMPARE_BRANCH: ${{ steps.discover.outputs.compare-branch }}
          COMPARE_PUSHED: ${{ steps.compare.outputs.pushed }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const parentNumber = Number(process.env.PARENT_NUMBER);
            const prefix = `screenshot-compare/pr-${parentNumber}/`;
            const current = process.env.COMPARE_BRANCH;
            if (!Number.isSafeInteger(parentNumber) || parentNumber < 1 || !current?.startsWith(prefix)) {
              core.setFailed('Refusing to clean up an unexpected compare branch prefix.');
              return;
            }
            const deleteBranch = async (branch) => {
              try {
                await github.rest.git.deleteRef({ owner, repo, ref: `heads/${branch}` });
                core.info(`Deleted screenshot compare branch ${branch}.`);
              } catch (error) {
                // Best-effort: a concurrent publisher or the close workflow may
                // already have removed it.
                core.info(`Could not delete ${branch}: ${error.message}`);
              }
            };

            const { data: parent } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: parentNumber,
            });
            if (parent.state !== 'open' || parent.head.sha !== process.env.EXPECTED_HEAD_SHA) {
              if (process.env.COMPARE_PUSHED === 'true') await deleteBranch(current);
              core.notice(`Parent PR #${parentNumber} moved while publishing; removed the stale compare branch.`);
              return;
            }

            const refs = await github.paginate(github.rest.git.listMatchingRefs, {
              owner,
              repo,
              ref: `heads/${prefix}`,
              per_page: 100,
            });
            for (const { ref } of refs) {
              if (!ref.startsWith(`refs/heads/${prefix}`)) continue;
              const branch = ref.slice('refs/heads/'.length);
              if (branch !== current) await deleteBranch(branch);
            }

      - name: Link screenshot evidence from the parent
        if: steps.discover.outputs.eligible == 'true'
        uses: actions/github-script@v9
        env:
          PARENT_NUMBER: ${{ steps.discover.outputs.parent-number }}
          EXPECTED_HEAD_SHA: ${{ steps.discover.outputs.head-sha }}
          ARTIFACT_ID: ${{ steps.discover.outputs.artifact-id }}
          COMPARE_BRANCH: ${{ steps.discover.outputs.compare-branch }}
          COMPARE_PUSHED: ${{ steps.compare.outputs.pushed }}
          COMPARE_COMMIT: ${{ steps.compare.outputs.commit }}
          CANDIDATE_NAMES: ${{ steps.candidates.outputs.names }}
          CANDIDATE_COUNT: ${{ steps.candidates.outputs.count }}
          REVIEW_DECISION: ${{ steps.gate.outputs.decision }}
          REVIEW_PENDING: ${{ steps.gate.outputs.pending }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const marker = '<!-- copse-e2e-screenshot-review -->';
            const parentNumber = Number(process.env.PARENT_NUMBER);
            const sha12 = process.env.EXPECTED_HEAD_SHA.slice(0, 12);
            const compareUrl =
              process.env.COMPARE_PUSHED === 'true'
                ? `https://github.com/${owner}/${repo}/compare/${process.env.EXPECTED_HEAD_SHA}...${process.env.COMPARE_BRANCH}`
                : '';

            // Inline before/after previews. Both sides are raw URLs pinned to
            // immutable commits (never a branch), so an image cannot change
            // under the comment. Names are re-checked here because they reach
            // markdown and HTML; anything unexpected drops the whole table.
            const previewLimit = 20;
            const previewTable = () => {
              const commit = process.env.COMPARE_COMMIT || '';
              if (!compareUrl || !/^[0-9a-f]{40}$/.test(commit)) return [];
              let entries;
              try {
                entries = JSON.parse(process.env.CANDIDATE_NAMES || '[]');
              } catch {
                return [];
              }
              const namePattern = /^[A-Za-z0-9][A-Za-z0-9._-]*\.png$/;
              if (
                !Array.isArray(entries) ||
                entries.length === 0 ||
                !entries.every(
                  (entry) =>
                    typeof entry?.name === 'string' &&
                    namePattern.test(entry.name) &&
                    typeof entry.new === 'boolean' &&
                    (entry.focus === undefined || typeof entry.focus === 'boolean'),
                )
              ) {
                return [];
              }
              // Screenshots this PR touches lead; unrelated changes (usually
              // rendering drift) fill whatever rows remain.
              const byName = (a, b) => (a.name < b.name ? -1 : a.name > b.name ? 1 : 0);
              const touched = entries.filter((entry) => entry.focus === true).sort(byName);
              const others = entries.filter((entry) => entry.focus !== true).sort(byName);
              const shownTouched = touched.slice(0, previewLimit);
              const shownOthers = others.slice(0, previewLimit - shownTouched.length);
              const shownCount = shownTouched.length + shownOthers.length;
              const total = Math.max(Number(process.env.CANDIDATE_COUNT) || 0, entries.length);
              const raw = (sha, name) =>
                `https://github.com/${owner}/${repo}/raw/${sha}/tests/e2e/screenshots/${name}`;
              const image = (sha, name) => `<img src="${raw(sha, name)}" width="360">`;
              const rows = (shown) => [
                '| Screenshot | Before | After |',
                '| --- | --- | --- |',
                ...shown.map(
                  (entry) =>
                    `| \`${entry.name}\` | ` +
                    `${entry.new ? '*new*' : image(process.env.EXPECTED_HEAD_SHA, entry.name)} | ` +
                    `${image(commit, entry.name)} |`,
                ),
              ];
              const lines = [];
              if (shownTouched.length === 0) {
                lines.push(...rows(shownOthers));
              } else {
                lines.push('**Screenshots this PR touches**', '', ...rows(shownTouched));
                if (shownOthers.length > 0) {
                  lines.push(
                    '',
                    '**Other changed screenshots**, not linked to this PR’s files (often rendering drift):',
                    '',
                    ...rows(shownOthers),
                  );
                }
              }
              if (total > shownCount) {
                lines.push('', `…and ${total - shownCount} more — see [the compare view](${compareUrl}).`);
              }
              return ['', ...lines];
            };
            const table = previewTable();
            const { data: parent } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: parentNumber,
            });

            // The source branch can move while this workflow is publishing.
            // Never post a compare link or cherry-pick command for a head the
            // parent no longer has.
            if (parent.state !== 'open' || parent.head.sha !== process.env.EXPECTED_HEAD_SHA) {
              if (compareUrl) {
                try {
                  await github.rest.git.deleteRef({
                    owner,
                    repo,
                    ref: `heads/${process.env.COMPARE_BRANCH}`,
                  });
                } catch (error) {
                  core.info(`Could not delete ${process.env.COMPARE_BRANCH}: ${error.message}`);
                }
              }
              core.notice(`Parent PR #${parentNumber} moved while publishing; posted no stale evidence.`);
              return;
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: parentNumber,
              per_page: 100,
            });
            const previous = comments.find(
              (comment) => comment.user?.type === 'Bot' && comment.body?.includes(marker),
            );
            const labelled = parent.labels.some((label) => label.name === 'update-screenshots');
            const refreshGuidance = labelled
              ? 'This run rendered every reference because `update-screenshots` is set. ' +
                'Remove the label now to avoid repeating full runs.'
              : 'To re-render every reference into the compare branch, add `update-screenshots`, ' +
                'then remove it after that run to avoid repeating full runs.';
            const commit = process.env.COMPARE_COMMIT || '';
            const acceptable = compareUrl !== '' && /^[0-9a-f]{40}$/.test(commit);
            // The blocking gate's state for this head, from the gate step.
            // screenshot-review-labels.yml rewrites the text between the
            // markers when a label records a decision.
            const decision = (process.env.REVIEW_DECISION || '').replace(/[<>`]/g, '');
            const reviewState = decision
              ? [`**Reviewed:** ${decision}.`]
              : process.env.REVIEW_PENDING === 'true'
                ? [
                    '**Review required.** The `Screenshot review` check blocks merging until a maintainer adds one label:',
                    ...(acceptable
                      ? [
                          '- `accept-screenshots` commits every candidate: the PR branch is fast-forwarded to the ' +
                            'compare commit, and CI re-runs on it without e2e.',
                        ]
                      : []),
                    '- `decline-screenshots` passes the check and commits nothing. Use it for unrelated drift, or for ' +
                      'references that belong in another PR.',
                    '',
                    'Committing reviewed PNGs yourself also works: a screenshot-only commit re-runs CI without e2e. ' +
                      'Any push starts a new review.',
                  ]
                : [];
            const review = reviewState.length
              ? ['<!-- copse-screenshot-review-state -->', ...reviewState, '<!-- /copse-screenshot-review-state -->', '']
              : [];
            let body;
            if (process.env.ARTIFACT_ID) {
              const artifactUrl = `${process.env.RUN_URL}/artifacts/${process.env.ARTIFACT_ID}`;
              const artifactLink =
                `[the screenshot artifact](${artifactUrl}) from [CI run ${process.env.RUN_ID}](${process.env.RUN_URL})`;
              body = [
                marker,
                '### Screenshot evidence',
                '',
                ...review,
                ...(acceptable
                  ? [
                      `**[View the changed reference screenshots](${compareUrl})** for \`${sha12}\` in ` +
                        'GitHub’s image diff (2-up, swipe, onion skin).',
                      'The compare view is for viewing only: it shows one bot commit of candidate PNGs on top of this ' +
                        'head and is never merged.',
                      ...table,
                      '',
                      'To accept every candidate locally instead, cherry-pick the compare commit onto the PR branch:',
                      '',
                      '```sh',
                      `git fetch origin ${process.env.COMPARE_BRANCH} && git cherry-pick ${commit}`,
                      '```',
                      '',
                      'To accept only some, run the fetch and then check out just those files: ' +
                        `\`git checkout ${commit} -- tests/e2e/screenshots/<name>.png\`.`,
                      `The same candidates are in ${artifactLink}.`,
                    ]
                  : [
                      `Changed reference candidates for \`${sha12}\` are in ${artifactLink}.`,
                      'To accept them, download the artifact and commit the intended PNGs to the PR branch.',
                    ]),
                'The artifact is retained for 14 days; its presence does not mean the visual changes have been accepted.',
                '',
                refreshGuidance,
                'Do not refresh references merely to absorb unrelated rendering drift.',
              ].join('\n');
            } else {
              if (!previous) return;
              body = [
                marker,
                '### Reference screenshots',
                '',
                `CI run [${process.env.RUN_ID}](${process.env.RUN_URL}) published no filtered screenshot candidates ` +
                  `for \`${sha12}\`.`,
                'Compare branches for older source SHAs have been deleted.',
              ].join('\n');
            }

            if (previous) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: parentNumber,
                body,
              });
            }

      # Fail the gate closed: a head whose evidence could not be validated or
      # linked must not look reviewable, and a missing status reads as "waiting"
      # rather than broken. `decline-screenshots` can still override it.
      - name: Fail the screenshot review closed
        if: failure() && steps.discover.outputs.gate-sha != '' && steps.gate.outcome != 'success'
        uses: actions/github-script@v9
        env:
          GATE_SHA: ${{ steps.discover.outputs.gate-sha }}
          PUBLISHER_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const { owner, repo } = context.repo;
            await github.rest.repos.createCommitStatus({
              owner,
              repo,
              sha: process.env.GATE_SHA,
              state: 'error',
              context: 'Screenshot review',
              description: 'Screenshot evidence could not be published; see the publisher run',
              target_url: process.env.PUBLISHER_RUN_URL,
            });
