name: Publish screenshot candidates

# CI itself stays read-only. Once a successful PR run has produced the immutable
# candidate artifact, this trusted-default-branch workflow makes it reviewable
# from the parent PR:
#
# - Every eligible run with candidates pushes a view-only compare branch,
#   `screenshot-compare/pr-<N>/<sha12>`: one bot commit of validated PNGs on top
#   of the exact rendered head. The parent comment links GitHub's compare view
#   for that commit, so image diffs (2-up/swipe/onion skin) need no download and
#   no PR, and previews up to 20 before/after pairs inline from raw URLs pinned
#   to the head and compare commit SHAs (the repository is public, so GitHub
#   renders them in the comment). It is pushed with this job's GITHUB_TOKEN, which starts no workflows,
#   so the branch never runs CI or demo previews. It is never merged; accepting
#   references still needs a manual commit or the review PR below.
# - Only an explicit `update-screenshots` request mints the App token and
#   creates a child review PR into the source branch.
#
# `workflow_run` is deliberately used instead of adding a
# write token to the job that executes pull-request code. Nothing from the
# checkout is ever executed here; the candidate PNGs are validated as data.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

concurrency:
  group: screenshot-candidates-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  publish:
    # A workflow_run receives secrets even when its source run came from a fork.
    # Reject forks before minting a write token or pushing any branch.
    # Failed/cancelled runs have no accepted evidence to publish.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ${{ vars.SELF_HOSTED_CHECKS || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
      pull-requests: write
    steps:
      - name: Resolve the live parent PR and exact artifact
        id: discover
        uses: actions/github-script@v9
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const runId = Number(process.env.RUN_ID);
            const runHeadSha = process.env.RUN_HEAD_SHA;
            const candidates = context.payload.workflow_run.pull_requests || [];

            core.setOutput('eligible', 'false');
            core.setOutput('has-artifact', 'false');
            core.setOutput('create-review', 'false');
            // Every bot ref below is derived from this SHA; refuse anything but
            // a full hex object id before it can shape a branch name.
            if (!/^[0-9a-f]{40}$/.test(runHeadSha || '')) {
              core.setFailed(`Run ${runId} reported an unexpected head SHA.`);
              return;
            }
            if (candidates.length !== 1) {
              core.notice(`Expected one parent PR for run ${runId}; found ${candidates.length}.`);
              return;
            }

            const number = candidates[0].number;
            const { data: parent } = await github.rest.pulls.get({ owner, repo, pull_number: number });
            const sameRepository = parent.head.repo?.full_name === `${owner}/${repo}`;
            const integrationHead = parent.head.ref === 'main' || parent.head.ref === 'release';
            if (
              parent.state !== 'open' ||
              !sameRepository ||
              integrationHead ||
              parent.head.sha !== runHeadSha
            ) {
              core.notice(
                `PR #${number} is closed, external, integration-owned, or moved past ${runHeadSha}; ` +
                  'retaining the artifact-only review path.',
              );
              return;
            }

            const artifactName = `reference-screenshot-candidates-${runId}`;
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner,
              repo,
              run_id: runId,
              per_page: 100,
            });
            const matches = artifacts.filter(
              (artifact) => artifact.name === artifactName && !artifact.expired,
            );
            if (matches.length > 1) {
              core.setFailed(`Run ${runId} has ${matches.length} artifacts named ${artifactName}.`);
              return;
            }

            core.setOutput('eligible', 'true');
            core.setOutput('parent-number', String(number));
            core.setOutput('head-ref', parent.head.ref);
            core.setOutput('head-sha', runHeadSha);
            core.setOutput('review-branch', `screenshots/pr-${number}/${runHeadSha.slice(0, 12)}`);
            // A separate prefix: `screenshots/pr-<N>/` belongs to review PR heads,
            // whose cleanup matches on it. View-only branches stay out of it.
            core.setOutput(
              'compare-branch',
              `screenshot-compare/pr-${number}/${runHeadSha.slice(0, 12)}`,
            );
            core.setOutput('artifact-name', artifactName);
            if (matches.length === 1) {
              core.setOutput('has-artifact', 'true');
              core.setOutput('artifact-id', String(matches[0].id));
              core.setOutput(
                'create-review',
                String(parent.labels.some((label) => label.name === 'update-screenshots')),
              );
            } else {
              core.notice(`Run ${runId} published no changed screenshot candidates.`);
            }

      # The App is already the repository's reviewed automation identity. Unlike
      # GITHUB_TOKEN, its PR creation triggers the child PR's normal CI run.
      - uses: actions/create-github-app-token@v3
        id: app-token
        if: steps.discover.outputs.create-review == 'true'
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # Checkout by the immutable SHA discovered above, never by an
      # attacker-controlled ref. Nothing from this checkout is executed, and no
      # credential is left in it: the one push below carries its own header.
      # Full history (GiBs of PNG revisions) only for the review-PR action; the
      # compare commit needs nothing but the head, which the remote already has.
      - uses: actions/checkout@v7.0.1
        if: steps.discover.outputs.has-artifact == 'true'
        with:
          ref: ${{ steps.discover.outputs.head-sha }}
          fetch-depth: ${{ steps.discover.outputs.create-review == 'true' && '0' || '1' }}
          persist-credentials: false

      - name: Download the immutable candidate artifact
        if: steps.discover.outputs.has-artifact == 'true'
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.discover.outputs.artifact-id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          merge-multiple: true
          path: ${{ runner.temp }}/screenshot-candidates

      - name: Validate and apply candidate PNGs
        if: steps.discover.outputs.has-artifact == 'true'
        id: candidates
        env:
          CANDIDATE_ROOT: ${{ runner.temp }}/screenshot-candidates
        run: |
          listing="$RUNNER_TEMP/screenshot-candidate-names"
          : > "$listing"
          if find "$CANDIDATE_ROOT" -type l -print -quit | grep -q .; then
            echo '::error::Screenshot candidate artifact contains a symlink.'
            exit 1
          fi

          count=0
          total=0
          while IFS= read -r -d '' path; do
            relative="${path#"$CANDIDATE_ROOT"/}"
            case "$relative" in
              .shard-[1-8])
                ;;
              tests/e2e/screenshots/*.png)
                name="${relative#tests/e2e/screenshots/}"
                if [[ "$name" == */* || ! "$name" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*\.png$ ]]; then
                  echo "::error::Invalid screenshot candidate path: $relative"
                  exit 1
                fi
                size="$(stat -c '%s' "$path")"
                signature="$(head -c 8 "$path" | od -An -t x1 | tr -d ' \n')"
                if [ "$signature" != '89504e470d0a1a0a' ]; then
                  echo "::error::Candidate is not a PNG: $relative"
                  exit 1
                fi
                if [ "$size" -gt 16777216 ]; then
                  echo "::error::Candidate exceeds 16 MiB: $relative"
                  exit 1
                fi
                count=$((count + 1))
                total=$((total + size))
                # A labelled refresh renders every committed reference, so the
                # budget must exceed the whole reference set with headroom
                # (ci-workflow-invariants.test.ts pins it at twice the count
                # and size of tests/e2e/screenshots).
                if [ "$count" -gt 2048 ] || [ "$total" -gt 536870912 ]; then
                  echo '::error::Screenshot candidate artifact exceeds its count or size budget.'
                  exit 1
                fi
                # Recorded before applying: a name absent from the head tree is new.
                if git cat-file -e "HEAD:tests/e2e/screenshots/$name" 2> /dev/null; then
                  printf '%s changed\n' "$name" >> "$listing"
                else
                  printf '%s new\n' "$name" >> "$listing"
                fi
                install -m 0644 "$path" "tests/e2e/screenshots/$name"
                ;;
              *)
                echo "::error::Unexpected file in screenshot candidate artifact: $relative"
                exit 1
                ;;
            esac
          done < <(find "$CANDIDATE_ROOT" -type f -print0)

          if [ "$count" -eq 0 ]; then
            echo '::error::The candidate artifact contains no reviewable PNGs.'
            exit 1
          fi
          echo "count=$count" >> "$GITHUB_OUTPUT"

          # The parent comment previews the first names in byte order. Emit only
          # a bounded prefix: a full refresh can carry thousands of names, and one
          # environment variable is capped at 128 KiB on Linux. `count` stays
          # the exact total. Names already matched the strict pattern above, so
          # they need no JSON escaping.
          names="$(LC_ALL=C sort "$listing" | awk '
            NR <= 50 {
              printf "%s{\"name\":\"%s\",\"new\":%s}", (NR > 1 ? "," : ""), $1, ($2 == "new" ? "true" : "false")
            }')"
          echo "names=[$names]" >> "$GITHUB_OUTPUT"

      # A view-only branch for GitHub's compare page: one commit holding exactly
      # the validated PNGs, parented on the rendered head. It is built with a
      # throwaway index and `git commit-tree`, so no hook runs and the checkout's
      # HEAD, index, and working tree stay as the review-PR step expects them.
      # GITHUB_TOKEN pushes trigger no workflows. The token reaches git only
      # through env-scoped config for this one push, never argv or .git/config.
      # A refused push (for example a ruleset) degrades to the artifact-only
      # comment instead of blocking publication; bad candidates already failed
      # the validation step above.
      - name: Push the view-only screenshot compare branch
        id: compare
        if: steps.discover.outputs.has-artifact == 'true'
        continue-on-error: true
        env:
          COMPARE_BRANCH: ${{ steps.discover.outputs.compare-branch }}
          HEAD_SHA: ${{ steps.discover.outputs.head-sha }}
          PARENT_NUMBER: ${{ steps.discover.outputs.parent-number }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          PUSH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          if [[ ! "$COMPARE_BRANCH" =~ ^screenshot-compare/pr-[1-9][0-9]*/[0-9a-f]{12}$ ]] ||
            [ "$COMPARE_BRANCH" != "screenshot-compare/pr-$PARENT_NUMBER/${HEAD_SHA:0:12}" ] ||
            [ "$(git rev-parse HEAD)" != "$HEAD_SHA" ]; then
            echo '::error::Refusing an unexpected compare branch or checkout.'
            exit 1
          fi

          index="$RUNNER_TEMP/screenshot-compare.index"
          rm -f "$index"
          GIT_INDEX_FILE="$index" git read-tree HEAD
          GIT_INDEX_FILE="$index" git add -- tests/e2e/screenshots/
          tree="$(GIT_INDEX_FILE="$index" git write-tree)"
          rm -f "$index"
          if [ "$tree" = "$(git rev-parse 'HEAD^{tree}')" ]; then
            echo "::notice::Candidates already match $HEAD_SHA; no compare branch needed."
            exit 0
          fi
          unexpected="$(git diff-tree -r --name-only HEAD "$tree" |
            grep -Ev '^tests/e2e/screenshots/[A-Za-z0-9][A-Za-z0-9._-]*\.png$' || true)"
          if [ -n "$unexpected" ]; then
            echo '::error::Compare commit would touch files outside tests/e2e/screenshots/.'
            exit 1
          fi

          commit="$(
            GIT_AUTHOR_NAME='github-actions[bot]' \
            GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com' \
            GIT_COMMITTER_NAME='github-actions[bot]' \
            GIT_COMMITTER_EMAIL='41898282+github-actions[bot]@users.noreply.github.com' \
            git commit-tree "$tree" -p HEAD \
              -m "chore(e2e): screenshot candidates for #$PARENT_NUMBER at ${HEAD_SHA:0:12}" \
              -m "View-only: rendered by CI run $RUN_ID. Do not merge this branch."
          )"

          basic="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)"
          echo "::add-mask::$basic"
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0="http.$SERVER_URL/.extraheader" \
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $basic" \
            git push --force "$SERVER_URL/$REPOSITORY.git" "$commit:refs/heads/$COMPARE_BRANCH"
          echo 'pushed=true' >> "$GITHUB_OUTPUT"
          # The parent comment pins its "after" images to this immutable commit.
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      # The review branch is derived only from the numeric PR id and immutable
      # source SHA. It targets the contributor's branch, never main: merging it
      # applies reviewed PNGs to the parent PR and triggers the cheap
      # screenshot-only CI path.
      - name: Open or update the screenshot review PR
        id: review-pr
        if: steps.discover.outputs.create-review == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          base: ${{ steps.discover.outputs.head-ref }}
          branch: ${{ steps.discover.outputs.review-branch }}
          delete-branch: true
          add-paths: tests/e2e/screenshots/
          commit-message: >-
            chore(e2e): update reference screenshots for #${{ steps.discover.outputs.parent-number }}
          title: >-
            chore(e2e): review screenshots for #${{ steps.discover.outputs.parent-number }}
          body: |
            Screenshot candidates rendered for parent PR
            #${{ steps.discover.outputs.parent-number }} at
            `${{ steps.discover.outputs.head-sha }}` by
            [CI run ${{ github.event.workflow_run.id }}](${{ github.event.workflow_run.html_url }}).

            Requested with the parent PR's `update-screenshots` label.
            Review GitHub's image diffs, then merge this PR to apply the
            accepted references to `${{ steps.discover.outputs.head-ref }}`. This branch contains
            only PNG candidates from the immutable
            `${{ steps.discover.outputs.artifact-name }}` artifact and never targets `main`.

            If the parent branch has advanced beyond the source SHA above, do not merge this PR;
            a successful CI run for the new head will close it and publish fresh evidence.
            Remove `update-screenshots` after this review PR is created to avoid another full refresh.

      - name: Close superseded screenshot review PRs
        id: reviews
        if: steps.discover.outputs.eligible == 'true'
        uses: actions/github-script@v9
        env:
          BASE_REF: ${{ steps.discover.outputs.head-ref }}
          PARENT_NUMBER: ${{ steps.discover.outputs.parent-number }}
          KEEP_NUMBER: ${{ steps.review-pr.outputs.pull-request-number }}
          REVIEW_BRANCH: ${{ steps.discover.outputs.review-branch }}
          EXPECTED_HEAD_SHA: ${{ steps.discover.outputs.head-sha }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const prefix = `screenshots/pr-${process.env.PARENT_NUMBER}/`;
            const keep = Number(process.env.KEEP_NUMBER || 0);
            const { data: parent } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: Number(process.env.PARENT_NUMBER),
            });
            if (parent.state !== 'open' || parent.head.sha !== process.env.EXPECTED_HEAD_SHA) return;
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              base: process.env.BASE_REF,
              per_page: 100,
            });
            for (const pull of pulls) {
              // Removing the label after creation must not destroy an accepted
              // review request if this publisher or same-head CI is rerun.
              if (
                pull.head.repo?.full_name === `${owner}/${repo}` &&
                pull.head.ref === process.env.REVIEW_BRANCH
              ) {
                core.setOutput('existing-number', String(pull.number));
                core.setOutput('existing-url', pull.html_url);
                continue;
              }
              if (
                pull.number !== keep &&
                pull.head.repo?.full_name === `${owner}/${repo}` &&
                pull.head.ref.startsWith(prefix)
              ) {
                await github.rest.pulls.update({
                  owner,
                  repo,
                  pull_number: pull.number,
                  state: 'closed',
                });
                core.info(`Closed superseded screenshot review PR #${pull.number}.`);
              }
            }

      # Same guard as closing superseded reviews: only a publisher whose parent
      # is still open at its exact head may delete another run's branch. A
      # stale publisher deletes only the branch it just pushed, so it can never
      # remove evidence for a newer head.
      - name: Delete superseded screenshot compare branches
        id: compare-cleanup
        if: steps.discover.outputs.eligible == 'true'
        uses: actions/github-script@v9
        env:
          PARENT_NUMBER: ${{ steps.discover.outputs.parent-number }}
          EXPECTED_HEAD_SHA: ${{ steps.discover.outputs.head-sha }}
          COMPARE_BRANCH: ${{ steps.discover.outputs.compare-branch }}
          COMPARE_PUSHED: ${{ steps.compare.outputs.pushed }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const parentNumber = Number(process.env.PARENT_NUMBER);
            const prefix = `screenshot-compare/pr-${parentNumber}/`;
            const current = process.env.COMPARE_BRANCH;
            if (!Number.isSafeInteger(parentNumber) || parentNumber < 1 || !current?.startsWith(prefix)) {
              core.setFailed('Refusing to clean up an unexpected compare branch prefix.');
              return;
            }
            const deleteBranch = async (branch) => {
              try {
                await github.rest.git.deleteRef({ owner, repo, ref: `heads/${branch}` });
                core.info(`Deleted screenshot compare branch ${branch}.`);
              } catch (error) {
                // Best-effort: a concurrent publisher or the close workflow may
                // already have removed it.
                core.info(`Could not delete ${branch}: ${error.message}`);
              }
            };

            const { data: parent } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: parentNumber,
            });
            if (parent.state !== 'open' || parent.head.sha !== process.env.EXPECTED_HEAD_SHA) {
              if (process.env.COMPARE_PUSHED === 'true') await deleteBranch(current);
              core.notice(`Parent PR #${parentNumber} moved while publishing; removed the stale compare branch.`);
              return;
            }

            const refs = await github.paginate(github.rest.git.listMatchingRefs, {
              owner,
              repo,
              ref: `heads/${prefix}`,
              per_page: 100,
            });
            for (const { ref } of refs) {
              if (!ref.startsWith(`refs/heads/${prefix}`)) continue;
              const branch = ref.slice('refs/heads/'.length);
              if (branch !== current) await deleteBranch(branch);
            }

      - name: Link screenshot evidence from the parent
        if: steps.discover.outputs.eligible == 'true'
        uses: actions/github-script@v9
        env:
          PARENT_NUMBER: ${{ steps.discover.outputs.parent-number }}
          EXPECTED_HEAD_SHA: ${{ steps.discover.outputs.head-sha }}
          HEAD_REF: ${{ steps.discover.outputs.head-ref }}
          REVIEW_NUMBER: ${{ steps.review-pr.outputs.pull-request-number }}
          REVIEW_URL: ${{ steps.review-pr.outputs.pull-request-url }}
          EXISTING_REVIEW_NUMBER: ${{ steps.reviews.outputs.existing-number }}
          EXISTING_REVIEW_URL: ${{ steps.reviews.outputs.existing-url }}
          ARTIFACT_ID: ${{ steps.discover.outputs.artifact-id }}
          COMPARE_BRANCH: ${{ steps.discover.outputs.compare-branch }}
          COMPARE_PUSHED: ${{ steps.compare.outputs.pushed }}
          COMPARE_COMMIT: ${{ steps.compare.outputs.commit }}
          CANDIDATE_NAMES: ${{ steps.candidates.outputs.names }}
          CANDIDATE_COUNT: ${{ steps.candidates.outputs.count }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const marker = '<!-- copse-e2e-screenshot-review -->';
            const parentNumber = Number(process.env.PARENT_NUMBER);
            const reviewNumber = Number(process.env.REVIEW_NUMBER || process.env.EXISTING_REVIEW_NUMBER || 0);
            const reviewUrl = process.env.REVIEW_URL || process.env.EXISTING_REVIEW_URL;
            const sha12 = process.env.EXPECTED_HEAD_SHA.slice(0, 12);
            const compareUrl =
              process.env.COMPARE_PUSHED === 'true'
                ? `https://github.com/${owner}/${repo}/compare/${process.env.EXPECTED_HEAD_SHA}...${process.env.COMPARE_BRANCH}`
                : '';

            // Inline before/after previews. Both sides are raw URLs pinned to
            // immutable commits (never a branch), so an image cannot change
            // under the comment. Names are re-checked here because they reach
            // markdown and HTML; anything unexpected drops the whole table.
            const previewLimit = 20;
            const previewTable = () => {
              const commit = process.env.COMPARE_COMMIT || '';
              if (!compareUrl || !/^[0-9a-f]{40}$/.test(commit)) return [];
              let entries;
              try {
                entries = JSON.parse(process.env.CANDIDATE_NAMES || '[]');
              } catch {
                return [];
              }
              const namePattern = /^[A-Za-z0-9][A-Za-z0-9._-]*\.png$/;
              if (
                !Array.isArray(entries) ||
                entries.length === 0 ||
                !entries.every(
                  (entry) =>
                    typeof entry?.name === 'string' &&
                    namePattern.test(entry.name) &&
                    typeof entry.new === 'boolean',
                )
              ) {
                return [];
              }
              const sorted = [...entries].sort((a, b) => (a.name < b.name ? -1 : a.name > b.name ? 1 : 0));
              const shown = sorted.slice(0, previewLimit);
              const total = Math.max(Number(process.env.CANDIDATE_COUNT) || 0, entries.length);
              const raw = (sha, name) =>
                `https://github.com/${owner}/${repo}/raw/${sha}/tests/e2e/screenshots/${name}`;
              const image = (sha, name) => `<img src="${raw(sha, name)}" width="360">`;
              const lines = [
                '| Screenshot | Before | After |',
                '| --- | --- | --- |',
                ...shown.map(
                  (entry) =>
                    `| \`${entry.name}\` | ` +
                    `${entry.new ? '*new*' : image(process.env.EXPECTED_HEAD_SHA, entry.name)} | ` +
                    `${image(commit, entry.name)} |`,
                ),
              ];
              if (total > shown.length) {
                lines.push('', `…and ${total - shown.length} more — see [the compare view](${compareUrl}).`);
              }
              return ['', ...lines];
            };
            const table = previewTable();
            const { data: parent } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: parentNumber,
            });

            // The source branch can move while this workflow is preparing the
            // child PR. Never leave a stale review link merge-ready, and never
            // post a compare link for a head the parent no longer has.
            if (parent.state !== 'open' || parent.head.sha !== process.env.EXPECTED_HEAD_SHA) {
              if (reviewNumber) {
                await github.rest.pulls.update({
                  owner,
                  repo,
                  pull_number: reviewNumber,
                  state: 'closed',
                });
              }
              if (compareUrl) {
                try {
                  await github.rest.git.deleteRef({
                    owner,
                    repo,
                    ref: `heads/${process.env.COMPARE_BRANCH}`,
                  });
                } catch (error) {
                  core.info(`Could not delete ${process.env.COMPARE_BRANCH}: ${error.message}`);
                }
              }
              core.notice(`Parent PR #${parentNumber} moved while publishing; closed the stale review.`);
              return;
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: parentNumber,
              per_page: 100,
            });
            const previous = comments.find(
              (comment) => comment.user?.type === 'Bot' && comment.body?.includes(marker),
            );
            let body;
            if (reviewUrl) {
              body = [
                marker,
                '### Reference screenshots ready for review',
                '',
                `Review GitHub’s image diffs in [screenshot PR #${reviewNumber}](${reviewUrl}).`,
                `After review, merge it to apply the accepted PNGs to \`${process.env.HEAD_REF}\`.`,
                'Remove `update-screenshots` now to avoid repeating the full refresh.',
                '',
                `The review PR records its source run and candidates for \`${sha12}\`.`,
                `Latest successful evidence: [CI run ${process.env.RUN_ID}](${process.env.RUN_URL}).`,
                ...(compareUrl
                  ? [`The same candidates are also in a [view-only compare](${compareUrl}) against \`${sha12}\`.`]
                  : []),
                ...table,
                '',
                'If this source branch moves, a later successful render closes the stale review PR and replaces this link.',
              ].join('\n');
            } else if (process.env.ARTIFACT_ID) {
              const artifactUrl = `${process.env.RUN_URL}/artifacts/${process.env.ARTIFACT_ID}`;
              const artifactLink =
                `[the screenshot artifact](${artifactUrl}) from [CI run ${process.env.RUN_ID}](${process.env.RUN_URL})`;
              body = [
                marker,
                '### Screenshot evidence',
                '',
                ...(compareUrl
                  ? [
                      `**[View the changed reference screenshots](${compareUrl})** for \`${sha12}\` in ` +
                        'GitHub’s image diff (2-up, swipe, onion skin).',
                      'The compare view is for viewing only: it shows one bot commit of candidate PNGs on top of this ' +
                        'head and is never merged. Accepting references still needs `update-screenshots` or a manual commit.',
                      ...table,
                      '',
                      `The same candidates are in ${artifactLink}.`,
                    ]
                  : [`Changed reference candidates for \`${sha12}\` are in ${artifactLink}.`]),
                'The artifact is retained for 14 days; its presence does not mean the visual changes have been accepted.',
                '',
                'Review this evidence with the parent PR. No baseline-update PR was opened.',
                'If the references should change, add `update-screenshots` to run a full refresh and open a PNG review PR, ' +
                  'or commit the reviewed PNGs manually. Remove the label once the review PR is created.',
                'Do not refresh references merely to absorb unrelated rendering drift.',
              ].join('\n');
            } else {
              if (!previous) return;
              body = [
                marker,
                '### Reference screenshots',
                '',
                `CI run [${process.env.RUN_ID}](${process.env.RUN_URL}) published no filtered screenshot candidates ` +
                  `for \`${sha12}\`.`,
                'Review PRs and compare branches for older source SHAs have been closed or deleted.',
              ].join('\n');
            }

            if (previous) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: parentNumber,
                body,
              });
            }
