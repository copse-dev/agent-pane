name: Reconcile PR screenshots after a base push

# When an integration branch re-renders a reference PNG, every open PR based on it
# that also touched that PNG silently goes `dirty` — a binary file git can't 3-way
# merge. Nothing re-runs a
# PR's CI when its *base* moves (the `pull_request` event only fires on head
# changes), so the commit-screenshots reconcile in ci.yml would never get a
# chance to clear the conflict on an idle PR. This workflow closes that gap: on a
# base push that changes screenshots, it merges the new base into each conflicting
# PR head and resolves screenshot-only conflicts by OWNERSHIP — the same policy as
# ci.yml's reconcile, but driven reactively by the base moving. A shot the PR owns
# (the oracle maps its diff to a spec that renders it, or someone hand-committed it
# on the branch) keeps the PR's version; anything else takes main's. The PR's
# committed shots are trustworthy for what it owns because commit-screenshots only
# ever auto-commits OWNED, UNCONTESTED renders (see its write-policy comment):
# anything deliberately committed on the branch is still the author's own work.
# Keeping the PR's version for the rest is what made unrelated re-renders revert
# main and ping-pong across PRs. See scripts/lib/screenshot-scope.mts.
#
# It is intentionally cheap: a pure git merge, no build/e2e. The push that
# resolves the conflict fires the PR's normal `synchronize` CI once (which, for a
# PNG/merge head, the oracle thins to lint/check/build), so the PR re-validates
# without this workflow ever running the suite itself.
on:
  push:
    # Both integration branches. Day-to-day PRs are based on `develop`, so that
    # is where a moving base creates their conflicts; `main` still matters for
    # the promotion PR. Every step below reconciles against the branch that was
    # actually pushed (`github.ref_name`), and only PRs based on THAT branch are
    # considered — a develop push must not merge develop into a main-based PR.
    branches: [main, develop]
    # Only screenshot churn can create a screenshot conflict, so don't wake on
    # unrelated commits.
    paths:
      - 'tests/e2e/screenshots/**'

# A burst of pushes only needs the latest reconcile pass; collapse them. Keyed by
# branch so a develop push and a main push don't cancel each other — they act on
# disjoint sets of PRs.
concurrency:
  group: reconcile-screenshots-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # Enumerate open, same-repo PRs that currently conflict with main. Forks are
  # skipped (CI can't push to a fork branch). mergeable_state is computed async by
  # GitHub, so poll past the transient `unknown` before deciding.
  list:
    # CHECKS_RUNNER routes to the self-hosted check fleet when set (see
    # ci.yml's routing note); hosted otherwise. Both jobs here only touch
    # same-repo branches (forks are filtered out below), so the fleet is safe.
    runs-on: ${{ vars.CHECKS_RUNNER || 'ubuntu-latest' }}
    outputs:
      prs: ${{ steps.find.outputs.prs }}
    steps:
      - id: find
        uses: actions/github-script@v9
        env:
          BASE_BRANCH: ${{ github.ref_name }}
        with:
          script: |
            const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
            const self = `${context.repo.owner}/${context.repo.repo}`;
            const base = process.env.BASE_BRANCH;
            const open = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              // Only PRs based on the branch that just moved. Without this, a
              // `develop` push would try to merge develop into the promotion PR
              // (base `main`) and into any main-based hotfix.
              base,
              per_page: 100,
            });
            const out = [];
            for (const pr of open) {
              if (pr.head.repo?.full_name !== self) continue; // fork — can't push
              // Always re-fetch: the paginated list is a snapshot, and a PR can
              // merge while we poll later ones. Using the stale list's
              // mergeable_state alone would enqueue an already-merged PR (seen on
              // #941: listed open, merged mid-list, still emitted at list end).
              const { data: latest } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
              });
              if (latest.state !== 'open') continue;
              let state = latest.mergeable_state;
              // The list payload omits a freshly-computed state; re-fetch and let
              // `unknown` settle (GitHub computes mergeability on demand).
              for (let i = 0; i < 4 && (state === 'unknown' || state == null); i++) {
                await sleep(2000);
                const { data } = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr.number,
                });
                if (data.state !== 'open') {
                  state = null;
                  break;
                }
                state = data.mergeable_state;
              }
              // `dirty` == conflicting. Treat a stuck `unknown` as a maybe: the
              // merge step is the real source of truth and no-ops when clean.
              if (state === 'dirty' || state === 'unknown') {
                out.push({ number: pr.number, head: latest.head.ref });
              }
            }
            console.log(`Conflicting PR(s): ${JSON.stringify(out)}`);
            core.setOutput('prs', JSON.stringify(out));

  reconcile:
    needs: list
    if: needs.list.outputs.prs != '[]'
    runs-on: ${{ vars.CHECKS_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: write
      pull-requests: write
    strategy:
      # One PR's source conflict (which we deliberately don't auto-resolve) must
      # not cancel reconciling the others.
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(needs.list.outputs.prs) }}
    steps:
      # The list→matrix handoff is not atomic: a PR can merge after `list` emits
      # it and before this job checks out — same race as commit-screenshots /
      # #1001. Re-fetch the PR and no-op only when GitHub confirms it is closed.
      # An API error must fail the job instead of being mistaken for a deleted
      # branch and silently skipping a live conflict.
      - name: Check pull request is still open
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ matrix.pr.number }}
          # Self-hosted CHECKS_RUNNER images ship curl+jq but not the gh CLI
          # (ci-runners/Dockerfile). Prefer the REST API over `gh api` — same
          # class of failure #1031 fixed in ci.yml (`gh: command not found`).
          GITHUB_API_URL: ${{ github.api_url }}
        run: |
          state="$(curl -fsS \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${{ github.repository }}/pulls/${PR_NUMBER}" \
            | jq -er .state)" || {
              echo "::error::Could not query PR #$PR_NUMBER state; refusing to skip reconcile."
              exit 1
            }
          if [ "$state" = "open" ]; then
            echo "open=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::PR #$PR_NUMBER is $state — skipping reconcile."
            echo "open=false" >> "$GITHUB_OUTPUT"
          fi
      # PAT so the resolving push re-triggers the PR's CI (GITHUB_TOKEN pushes are
      # recursion-guarded and wouldn't fire `synchronize`, leaving ci-passed stale
      # on the new head). Falls back to github.token: the conflict still clears,
      # just without the CI re-trigger.
      - uses: actions/checkout@v7.0.1
        if: steps.pr.outputs.open == 'true'
        with:
          ref: ${{ matrix.pr.head }}
          fetch-depth: 0
          token: ${{ secrets.SCREENSHOTS_PAT || github.token }}
      # Only to run check-screenshots.mts --own-paths, which walks the repo and git
      # with no external dependencies — no `npm ci`, so this stays a cheap job.
      - uses: actions/setup-node@v7
        if: steps.pr.outputs.open == 'true'
        with:
          node-version: '22'
      - name: Merge the base branch, auto-resolving screenshot-only conflicts
        if: steps.pr.outputs.open == 'true'
        id: merge
        env:
          PR_NUMBER: ${{ matrix.pr.number }}
          # The branch whose push woke this run — `develop` for day-to-day PRs,
          # `main` for the promotion PR. `list` already filtered the matrix to
          # PRs based on it, so this is always the right merge source.
          BASE_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin "$BASE_BRANCH"

          # Resolve ownership BEFORE any merge attempt: --own-paths reads the PR's
          # diff from the working tree, and a conflicted merge in progress would
          # fold main's incoming changes into it and over-grant ownership.
          mapfile -t owned < <(node scripts/check-screenshots.mts --own-paths --base origin/$BASE_BRANCH)
          echo "PR #$PR_NUMBER owns ${#owned[@]} reference shot(s)"

          # Non-zero merge is not always a conflict: untracked working-tree files
          # that main also adds abort before MERGE_HEAD exists. Clearing those
          # screenshot paths and retrying avoids the false "screenshot conflict"
          # path that then dies on `git commit --no-edit` with an empty message.
          try_merge() {
            git merge --no-commit --no-ff origin/$BASE_BRANCH
          }
          clear_untracked_screenshots_blocking_merge() {
            mapfile -t blockers < <(
              git ls-files --others --exclude-standard -- tests/e2e/screenshots/
            )
            if [ ${#blockers[@]} -eq 0 ]; then
              return 1
            fi
            echo "PR #$PR_NUMBER: untracked screenshots blocked the merge — removing:"
            printf '%s\n' "${blockers[@]}"
            rm -f -- "${blockers[@]}"
            return 0
          }

          if try_merge; then
            git merge --abort 2>/dev/null || true
            echo "PR #$PR_NUMBER: no conflict with main — nothing to do"
            exit 0
          fi
          if ! git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            if clear_untracked_screenshots_blocking_merge && try_merge; then
              git merge --abort 2>/dev/null || true
              echo "PR #$PR_NUMBER: no conflict with main after clearing untracked screenshots"
              exit 0
            fi
            if ! git rev-parse -q --verify MERGE_HEAD >/dev/null; then
              echo "::error::PR #$PR_NUMBER: git merge origin/$BASE_BRANCH failed without MERGE_HEAD"
              exit 1
            fi
          fi
          conflicts="$(git diff --name-only --diff-filter=U)"
          non_ss="$(printf '%s\n' "$conflicts" | grep -vE '^tests/e2e/screenshots/' || true)"
          if [ -n "$non_ss" ]; then
            echo "PR #$PR_NUMBER: non-screenshot conflicts need a human — not auto-resolving:"
            printf '%s\n' "$non_ss"
            git merge --abort
            {
              echo "manual=true"
              echo "manual-files<<EOF"
              printf '%s\n' "$non_ss"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Per-file resolution by ownership, mirroring ci.yml's reconcile: the PR
          # keeps only the shots its diff owns; the rest take main's newer render
          # rather than being reverted by a branch that merely re-rendered them.
          # A lone `*` means scope is unavailable — keep everything (pre-scope
          # policy). The merge is in progress here, so HEAD is still the PR head and
          # the oracle sees the PR's own diff.
          echo "PR #$PR_NUMBER: screenshot-only conflict — resolving by ownership"
          resolve_shot() {
            # `git checkout --ours/--theirs` reads the conflict's index stage, which
            # is absent when that side DELETED the shot (modify/delete). Removing
            # the file is the correct resolution for that side, so fall back to it
            # rather than dying under `set -e` mid-merge.
            local side="$1" path="$2"
            git checkout "--${side}" -- "$path" 2>/dev/null && return 0
            echo "    ${side} side deleted this shot — taking the deletion"
            git rm -q -f -- "$path"
          }
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            keep_ours=0
            for o in "${owned[@]}"; do
              if [ "$o" = '*' ] || [ "$o" = "$path" ]; then
                keep_ours=1
                break
              fi
            done
            if [ "$keep_ours" = 1 ]; then
              echo "  ours   $path (owned by this PR)"
              resolve_shot ours "$path"
            else
              echo "  theirs $path (not owned by this PR — keeping main's render)"
              resolve_shot theirs "$path"
            fi
          done <<< "$conflicts"
          git add tests/e2e/screenshots/
          # If the base advanced a file under .github/workflows/, the merge folds
          # that change in, and a token without `workflow` scope has its push
          # rejected ("refusing to allow a Personal Access Token to create or
          # update workflow ... without workflow scope").
          #
          # This used to bail BEFORE pushing whenever the merge touched a workflow
          # file at all — which made the hand-off unconditional and unfixable: it
          # fired even once SCREENSHOTS_PAT *had* the scope, so the note telling
          # people that granting it "lets CI resolve these automatically" was
          # false. It also scaled badly. A single base commit touching
          # .github/workflows/ puts that change in EVERY stale branch's merge, so
          # one such commit hands off every open PR at once (observed: 11 PRs in
          # one run, none with a real conflict — `manual-files` was empty).
          #
          # Try the push instead, and only hand off if it is actually refused.
          # `--cached` diff vs HEAD lists what the merge would push, captured
          # before the commit so it can be reported if the push fails.
          wf="$(git diff --cached --name-only -- .github/workflows/ || true)"
          git commit --no-edit
          if git push; then
            echo "resolved=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Push refused. Undo the merge so the branch is left exactly as found,
          # then hand off. A workflow-file change is the expected cause and gets
          # the specific message; anything else (a race pushing to the head
          # branch, a protected-branch rule) still needs a human, so report it
          # rather than failing red or silently dropping the reconcile.
          echo "PR #$PR_NUMBER: push refused; reverting the local merge."
          git reset --hard HEAD~1
          if [ -n "$wf" ]; then
            echo "Merge updates workflow files the token cannot push — needs a human:"
            printf '%s\n' "$wf"
            {
              echo "workflow=true"
              echo "workflow-files<<EOF"
              printf '%s\n' "$wf"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "Push refused for a non-workflow reason — needs a human."
            {
              echo "manual=true"
              echo "manual-files<<EOF"
              echo "(push refused; see the reconcile job log)"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi
      - name: Comment when manual resolution is needed
        if: >-
          steps.pr.outputs.open == 'true' &&
          (steps.merge.outputs.manual == 'true' || steps.merge.outputs.workflow == 'true')
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ matrix.pr.number }}
          MANUAL_FILES: ${{ steps.merge.outputs.manual-files }}
          WORKFLOW_FILES: ${{ steps.merge.outputs.workflow-files }}
          BASE_BRANCH: ${{ github.ref_name }}
        with:
          script: |
            const marker = '<!-- reconcile-screenshots-manual -->';
            const manual = (process.env.MANUAL_FILES || '').split('\n').filter(Boolean);
            const workflow = (process.env.WORKFLOW_FILES || '').split('\n').filter(Boolean);
            // Two reasons CI can't finish the merge for you: a non-screenshot file
            // genuinely conflicts, or the base advanced a workflow file that CI's
            // PAT isn't scoped to push. Both need a human to merge/rebase.
            const base = process.env.BASE_BRANCH;
            const bullets = (process.env.WORKFLOW_FILES ? workflow : manual).map((p) => `- \`${p}\``);
            const reason = process.env.WORKFLOW_FILES
              ? `\`${base}\` advanced and screenshot conflicts were resolved automatically, but the ` +
                'merge updates these **workflow** files, which CI\'s token isn\'t scoped to push. ' +
                `Merge or rebase \`${base}\` by hand (or grant the \`SCREENSHOTS_PAT\` the \`workflow\` scope ` +
                'to let CI resolve these automatically):'
              : `\`${base}\` advanced and screenshot conflicts were resolved automatically, but ` +
                'these **non-screenshot** files conflict and can\'t be auto-merged. ' +
                `Resolve them by hand (merge or rebase \`${base}\`):`;
            const body = [
              marker,
              '### Merge conflict needs a human',
              '',
              reason,
              '',
              bullets.join('\n'),
            ].join('\n');
            const number = Number(process.env.PR_NUMBER);
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: number,
            });
            const existing = comments.find(
              (c) => c.user?.type === 'Bot' && typeof c.body === 'string' && c.body.includes(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: number,
                body,
              });
            }
