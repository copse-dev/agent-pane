# Automated dependency updates for npm and GitHub Actions.
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '11:00'
      timezone: Etc/UTC
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps)
    cooldown:
      default-days: 7
    groups:
      npm-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '11:00'
      timezone: Etc/UTC
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps)
    cooldown:
      default-days: 7
