name: Setup
description: >-
  Install Node, ripgrep, and project dependencies from a locked, input-only
  cache. Installed node_modules trees are never restored or shared: every job
  materializes a fresh tree and runs the required lifecycle scripts.

inputs:
  github-pat:
    description: >-
      Optional PAT with read access to copse-dev/streaming-markdown. It
      authenticates a cold pnpm install of the private git dependency.
    required: false
    default: ''

runs:
  using: composite
  steps:
    # pnpm records the @copse/streaming-markdown git dependency as git+ssh in the
    # lockfile, but Actions runners have no SSH key. Rewrite GitHub SSH URLs to
    # HTTPS and attach the optional read token without writing credentials to disk.
    - shell: bash
      env:
        GH_DEP_PAT: ${{ inputs.github-pat }}
      run: |
        if [ -n "${GH_DEP_PAT}" ]; then
          auth="$(printf 'x-access-token:%s' "${GH_DEP_PAT}" | base64 | tr -d '\n')"
          echo "::add-mask::${auth}"
          {
            echo "GIT_CONFIG_COUNT=4"
            echo "GIT_CONFIG_KEY_0=http.https://github.com/.extraheader"
            echo "GIT_CONFIG_VALUE_0="
            echo "GIT_CONFIG_KEY_1=http.https://github.com/.extraheader"
            echo "GIT_CONFIG_VALUE_1=Authorization: Basic ${auth}"
            echo "GIT_CONFIG_KEY_2=url.https://github.com/.insteadOf"
            echo "GIT_CONFIG_VALUE_2=ssh://git@github.com/"
            echo "GIT_CONFIG_KEY_3=url.https://github.com/.insteadOf"
            echo "GIT_CONFIG_VALUE_3=git@github.com:"
          } >> "$GITHUB_ENV"
        else
          {
            echo "GIT_CONFIG_COUNT=2"
            echo "GIT_CONFIG_KEY_0=url.https://github.com/.insteadOf"
            echo "GIT_CONFIG_VALUE_0=ssh://git@github.com/"
            echo "GIT_CONFIG_KEY_1=url.https://github.com/.insteadOf"
            echo "GIT_CONFIG_VALUE_1=git@github.com:"
          } >> "$GITHUB_ENV"
        fi

    - uses: actions/setup-node@v7
      with:
        node-version-file: '.nvmrc'

    - name: Activate package-manager-pinned pnpm
      run: |
        corepack enable
        corepack prepare --activate
        pnpm --version
      shell: bash

    # GitHub-hosted Linux images need the runtime search/font dependencies.
    - name: Install hosted Linux system dependencies
      run: >-
        sudo apt-get update && sudo apt-get install -y ripgrep
        fonts-noto-core fonts-noto-cjk fonts-noto-color-emoji
      if: runner.environment == 'github-hosted' && runner.os == 'Linux'
      shell: bash

    # Self-hosted macOS runners do not have apt. coreutils supplies gtimeout,
    # which the e2e shard uses to cap a wedged run.
    - name: Install self-hosted macOS tools
      run: |
        command -v rg >/dev/null 2>&1 || brew install ripgrep
        command -v gtimeout >/dev/null 2>&1 || brew install coreutils
      if: runner.environment == 'self-hosted' && runner.os == 'macOS'
      shell: bash
      env:
        HOMEBREW_NO_AUTO_UPDATE: '1'
        HOMEBREW_NO_ANALYTICS: '1'

    # A runner image may contain a root-owned pnpm content store for this exact
    # lockfile. Copy it into RUNNER_TEMP so lifecycle bookkeeping and any package
    # mutation stay job-local. Otherwise restore that same job-local path from
    # Actions. Either source is package input, never an installed dependency tree.
    - name: Select pnpm content store
      id: dependency-store
      shell: bash
      run: |
        lockhash="$(
          node -e "const fs=require('node:fs'),c=require('node:crypto');process.stdout.write(c.createHash('sha256').update(fs.readFileSync('pnpm-lock.yaml')).digest('hex'))"
        )"
        source=cache
        path="${RUNNER_TEMP}/pnpm-store"
        rm -rf "$path"
        mkdir -p "$path"
        if [ -n "${COPSE_BAKED_STORE:-}" ] && [ -f "${COPSE_BAKED_STORE}/.ready" ]; then
          baked_hash="$(cat "${COPSE_BAKED_STORE}/.lockhash" 2>/dev/null || true)"
          if [ "$lockhash" = "$baked_hash" ] && [ -d "${COPSE_BAKED_STORE}/store" ]; then
            if cp -a "${COPSE_BAKED_STORE}/store/." "$path/"; then
              source=baked
              echo "Copied package inputs baked for this lockfile"
            else
              echo "::warning::baked package-store copy failed; restoring the remote cache"
              rm -rf "$path"
              mkdir -p "$path"
            fi
          fi
        fi
        {
          echo "lockhash=$lockhash"
          echo "path=$path"
          echo "source=$source"
        } >> "$GITHUB_OUTPUT"

    - name: Restore pnpm content-addressed store
      uses: actions/cache@v4
      if: steps.dependency-store.outputs.source == 'cache'
      with:
        path: ${{ steps.dependency-store.outputs.path }}
        key: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-v1-${{ hashFiles('pnpm-lock.yaml') }}

    # Cache immutable downloads that lifecycle scripts verify and consume. These
    # are inputs to a clean install, unlike node_modules itself.
    - name: Restore verified runtime downloads
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/electron
          ~/Library/Caches/electron
          vendor/gortex
        key: ${{ runner.os }}-${{ runner.arch }}-runtime-inputs-v1-${{ hashFiles('pnpm-lock.yaml', 'scripts/fetch-gortex.mts') }}

    - name: Install a clean dependency tree
      shell: bash
      env:
        CI: 'true'
        npm_config_ignore_scripts: 'false'
        npm_config_store_dir: ${{ steps.dependency-store.outputs.path }}
        STORE_SOURCE: ${{ steps.dependency-store.outputs.source }}
      run: |
        rm -rf node_modules
        args=(--frozen-lockfile)
        if [ "$STORE_SOURCE" = baked ]; then args+=(--offline); fi
        pnpm install "${args[@]}"

    # Exercise the same esbuild service path used by the build and unit runner.
    # A corrupt install fails here; CI never mutates and republishes it as a cure.
    - name: Verify installed native tooling
      shell: bash
      run: |
        node_modules/.bin/esbuild --version
        node -e "require('esbuild').transformSync('export default 1',{loader:'ts'})"
