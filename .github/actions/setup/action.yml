name: Setup
description: >-
  Install Node, ripgrep, and project dependencies with a cached node_modules.
  On a cache hit the slow postinstall steps (node-pty electron-rebuild + the
  vendored gortex download) are skipped entirely, since their outputs live
  inside the cached node_modules / vendor/gortex trees.

inputs:
  github-pat:
    description: >-
      Optional PAT with read access to copse-dev/streaming-markdown. When set, it
      authenticates `npm ci`'s fetch of the private @copse/streaming-markdown git
      dependency. Left empty, git auth is untouched (fine on a cache/baked hit,
      where npm ci is skipped).
    required: false
    default: ''

runs:
  using: composite
  steps:
    # npm records the @copse/streaming-markdown git dependency as git+ssh in the
    # lockfile (npm normalizes github: hosts to ssh regardless of the spec form),
    # but Actions runners have no SSH key — so `npm ci` below would die with
    # "Permission denied (publickey)". Rewrite the ssh:// form to HTTPS so npm
    # fetches over https instead: anonymously when streaming-markdown is public,
    # or token-authenticated when a PAT with read access to it is provided. npm
    # clones git deps into their own temp dir, so only this GLOBAL git config
    # reaches that clone — the checkout step's credential is local to the app
    # checkout and never applies there. Scoped to github.com ssh URLs (the sole
    # git dependency), keeping any PAT out of unrelated fetches.
    - shell: bash
      env:
        GH_DEP_PAT: ${{ inputs.github-pat }}
      run: |
        if [ -n "${GH_DEP_PAT}" ]; then
          base="https://x-access-token:${GH_DEP_PAT}@github.com/"
        else
          base="https://github.com/"
        fi
        git config --global url."${base}".insteadOf "ssh://git@github.com/"
        git config --global url."${base}".insteadOf "git@github.com:"
    # Deliberately NO `cache: 'npm'` here. That option caches ~/.npm (the npm
    # download cache — inputs to `npm ci`), which on this repo is ~2.5 GB. But the
    # actions/cache step below already caches node_modules (the *output* of the
    # install), and on a cache hit the `npm ci` step is skipped — so ~/.npm is
    # never read. Restoring that 2.5 GB archive cost ~3 min per hit job for nothing.
    # On a miss, `npm ci` simply repopulates ~/.npm from the network and the
    # node_modules cache hits next time. So this layer is pure waste on the hit path
    # and redundant on the miss path.
    - uses: actions/setup-node@v6
      with: { node-version: '22' }
    # ripgrep backs the app's code-search services at runtime; the unit suite
    # and the e2e app both exercise them. GitHub-hosted runners have passwordless
    # sudo + apt, so install it there. Self-hosted runners typically have neither
    # (sudo prompts for a password, apt may be unavailable), so provision ripgrep
    # — and the Electron e2e system libs — on the host once instead (see PR #371).
    - run: sudo apt-get update && sudo apt-get install -y ripgrep
      if: runner.environment == 'github-hosted'
      shell: bash
    # Self-hosted macOS runner: provision ripgrep + coreutils via Homebrew (no
    # apt). coreutils supplies `gtimeout`, which the e2e shard step uses to cap a
    # wedged run (macOS has no `timeout`). Skips installs that are already
    # present, so it's cheap on warm runners.
    - run: |
        command -v rg >/dev/null 2>&1 || brew install ripgrep
        command -v gtimeout >/dev/null 2>&1 || brew install coreutils
      if: runner.environment == 'self-hosted' && runner.os == 'macOS'
      shell: bash
      # Skip Homebrew's implicit `brew update` (can add minutes per install) and
      # its analytics ping. Only affects the cold-install path — warm runners that
      # already have rg/gtimeout never reach the brew calls.
      env:
        HOMEBREW_NO_AUTO_UPDATE: '1'
        HOMEBREW_NO_ANALYTICS: '1'
    # Warm-start on self-hosted runners whose image baked the dependency tree
    # (see .github/runner*/Dockerfile). If the baked layer's lockfile hash still
    # matches this checkout, seed node_modules + vendor/gortex straight from
    # local disk (a few seconds) instead of restoring ~525 MB from the Actions
    # cache service — which crawled at ~1 MB/s (≈8 min) on freshly reprovisioned
    # runners. Runs AFTER checkout (checkout's `clean` would wipe a pre-placed
    # tree), and sets `seeded=true` to skip the cache restore + npm ci below. A
    # miss — no baked layer (GitHub-hosted, or an older image) or a lockfile bump
    # — leaves seeded=false, so the existing cache / npm ci path runs unchanged.
    - id: baked
      shell: bash
      run: |
        seeded=false
        if [ -n "${COPSE_BAKED_DEPS:-}" ] && [ -f "${COPSE_BAKED_DEPS}/.ready" ]; then
          want="$(sha256sum package-lock.json 2>/dev/null | awk '{ print $1 }' || echo want)"
          have="$(cat "${COPSE_BAKED_DEPS}/.lockhash" 2>/dev/null || echo have)"
          if [ "$want" = "$have" ]; then
            # Best-effort: the seed runs inside the `if` condition, so a failing
            # copy is caught (not fatal under set -e) — clean up and fall back.
            if rm -rf node_modules \
               && cp -a "${COPSE_BAKED_DEPS}/node_modules" node_modules \
               && { [ ! -d "${COPSE_BAKED_DEPS}/vendor/gortex" ] \
                    || { mkdir -p vendor && rm -rf vendor/gortex \
                         && cp -a "${COPSE_BAKED_DEPS}/vendor/gortex" vendor/gortex; }; }; then
              seeded=true
              echo "Seeded node_modules + vendor/gortex from ${COPSE_BAKED_DEPS} (lockfile match)"
            else
              echo "Baked-dep seed failed — cleaning up and falling back to cache / npm ci"
              rm -rf node_modules
            fi
          else
            echo "Baked deps present but stale (lockfile changed) — using cache / npm ci"
          fi
        fi
        echo "seeded=$seeded" >> "$GITHUB_OUTPUT"
    # Cache the fully-installed dependency tree, not just the npm download cache.
    # The key is the lockfile hash, so an electron/node-pty bump (which changes
    # the native ABI) busts it and forces a fresh electron-rebuild. vendor/
    # gortex is a pinned-version binary fetch that postinstall guards as
    # idempotent, so it caches cleanly alongside node_modules.
    #
    # Key by runner.arch as well as runner.os: the tree holds arch-specific native
    # binaries (esbuild's @esbuild/<platform> optional dep, node-pty/electron
    # rebuilds, the vendor/gortex fetch), but `runner.os` is `macOS` for BOTH
    # Intel and Apple-Silicon runners. A mixed-arch self-hosted Mac fleet would
    # otherwise share one entry, and an arm64 box restoring an x64-populated cache
    # (or vice-versa) fails at load with "@esbuild/darwin-arm64 could not be found".
    - uses: actions/cache@v4
      id: deps
      # Skip the remote cache entirely when the baked layer already seeded the
      # tree — the whole point is to avoid this network transfer.
      if: steps.baked.outputs.seeded != 'true'
      with:
        path: |
          node_modules
          vendor/gortex
        # The -vN token is a manual cache-bust: earlier runs on a runner with
        # ignore-scripts saved a node_modules with no native builds (no esbuild
        # binary, no electron-rebuilt node-pty) under the lockfile-hash key. Since
        # the lockfile is unchanged that poisoned entry would keep restoring and
        # skip the fixed npm ci; bumping the token forces one clean reinstall.
        key: ${{ runner.os }}-${{ runner.arch }}-deps-v2-${{ hashFiles('package-lock.json') }}
    # Force install scripts to run for THIS install only. A self-hosted runner may
    # set `ignore-scripts=true` globally (a sensible host-wide hardening), but that
    # skips the native setup this app's e2e needs: esbuild's platform binary (used
    # to load the wdio TS config — without it wdio dies instantly with
    # "@esbuild/<os>-<arch> could not be found"), Electron's binary download, and
    # the root postinstall that electron-rebuilds node-pty. Scoping the override to
    # this step via step env keeps the box's global setting intact for everything
    # else; running our own first-party repo's scripts here is safe (the fork guard
    # keeps untrusted PR code off the self-hosted runner). --include=optional
    # additionally overrides any host `omit=optional`, which would otherwise drop
    # esbuild's @esbuild/<os>-<arch> optional package.
    - run: npm ci --include=optional
      if: steps.baked.outputs.seeded != 'true' && steps.deps.outputs.cache-hit != 'true'
      shell: bash
      env:
        npm_config_ignore_scripts: 'false'
    # Self-heal a poisoned dependency tree on the cache-HIT path too (where the
    # npm ci above is skipped). If a cache was saved before this fix — or restored
    # missing esbuild's working binary — the probe rebuilds just esbuild with
    # scripts forced on, refetching the platform binary. Runs on every setup (hit
    # or miss), cheap when the binary is already there.
    - run: |
        if ! node_modules/.bin/esbuild --version >/dev/null 2>&1; then
          echo "::warning::esbuild platform binary missing after dep restore — running npm rebuild esbuild"
          npm rebuild esbuild
          node_modules/.bin/esbuild --version
        fi
      shell: bash
      env:
        npm_config_ignore_scripts: 'false'
