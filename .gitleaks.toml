title = "Copse gitleaks configuration"

[extend]
useDefault = true

# These files intentionally contain inert example credentials to prove that the
# application's redactors recognize them. Scope each exemption to the specific
# default rules those fixtures exercise; other secret rules still scan the files.
[[allowlists]]
description = "Curl authorization-header redaction fixture"
targetRules = ["curl-auth-header"]
paths = ['''^src/shared/threads/decision-log\.test\.ts$''']

[[allowlists]]
description = "AWS and private-key redaction fixtures"
targetRules = ["aws-access-token", "private-key"]
# History still contains the pre-#715 path; the package extraction moved the
# fixtures to packages/llm without rewriting git history.
paths = [
  '''^src/shared/llm/redact-secrets\.test\.ts$''',
  '''^packages/llm/src/redact-secrets\.test\.ts$''',
]

[[allowlists]]
# CLAUDE_OAUTH_CLIENT_ID is the Claude Code CLI's public PKCE OAuth client id
# (a UUID) — an identifier the client ships in the clear, not a secret. It has
# no client secret and grants nothing on its own, but its entropy trips the
# generic-api-key heuristic. Scope the exemption to that one rule + file.
description = "Public Claude Code OAuth client id (not a secret)"
targetRules = ["generic-api-key"]
paths = ['''^packages/plan-usage/src/claude-oauth\.ts$''']

[[allowlists]]
# Per-PR demo preview builds land under `pr-<n>/` on the machine-managed
# `demo-previews` branch. Minified bundles and source maps trip entropy
# heuristics (`generic-api-key`, `sourcegraph-access-token`, …) even though they
# contain no real credentials. Scope by path only — the Secret scan workflow
# also limits `gitleaks git` to the checked-out tip so these refs are not walked
# for unrelated PRs, but keep the path exemption if a preview commit is ever
# reachable from a scanned tip.
description = "Per-PR demo preview build artifacts (minified bundles, not secrets)"
paths = ['''^pr-\d+/''']
