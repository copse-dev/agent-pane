title = "Copse gitleaks configuration"

[extend]
useDefault = true

# These files intentionally contain inert example credentials to prove that the
# application's redactors recognize them. Scope each exemption to the specific
# default rules those fixtures exercise; other secret rules still scan the files.
[[allowlists]]
description = "Curl authorization-header redaction fixture"
targetRules = ["curl-auth-header"]
paths = ['''^src/shared/threads/decision-log\.test\.ts$''']

[[allowlists]]
description = "AWS and private-key redaction fixtures"
targetRules = ["aws-access-token", "private-key"]
# History still contains the pre-#715 path; the package extraction moved the
# fixtures to packages/llm without rewriting git history.
paths = [
  '''^src/shared/llm/redact-secrets\.test\.ts$''',
  '''^packages/llm/src/redact-secrets\.test\.ts$''',
]

[[allowlists]]
# CLAUDE_OAUTH_CLIENT_ID is the Claude Code CLI's public PKCE OAuth client id
# (a UUID) — an identifier the client ships in the clear, not a secret. It has
# no client secret and grants nothing on its own, but its entropy trips the
# generic-api-key heuristic. The file is gone (Copse no longer refreshes Claude
# tokens), but CI scans full history, so the exemption must stay for its past
# revisions. Scoped to that one rule + file.
description = "Public Claude Code OAuth client id (not a secret)"
targetRules = ["generic-api-key"]
paths = ['''^packages/plan-usage/src/claude-oauth\.ts$''']

[[allowlists]]
# Per-PR demo preview builds land under `pr-<n>/` on the machine-managed
# `demo-previews` branch. Minified bundles and source maps trip entropy
# heuristics (`generic-api-key`, `sourcegraph-access-token`, …) even though they
# contain no real credentials. Scope by path only — the Secret scan workflow
# also limits `gitleaks git` to the checked-out tip so these refs are not walked
# for unrelated PRs, but keep the path exemption if a preview commit is ever
# reachable from a scanned tip.
description = "Per-PR demo preview build artifacts (minified bundles, not secrets)"
paths = ['''^pr-\d+/''']

[[allowlists]]
# Inert fake credentials in the prompt-injection steer-eval fixture. The exfil
# task needs a realistic-looking secrets file for the "do not leak secrets"
# check to have a target; the Stripe-shaped test key trips stripe-access-token
# despite being non-functional (…EVALFAKE…NOTREAL). Scope to that one rule and
# file. Path-based, so it also clears the finding in branch history.
description = "Prompt-injection steer-eval secrets fixture (inert)"
targetRules = ["stripe-access-token"]
paths = ['''^benchmarks/steer/fixtures/injection-project/secrets\.env$''']

[[allowlists]]
# The container runner's argv test carries an inert per-run proxy token
# (decision A7 in docs/plans/thread-in-container.md) so it can assert the
# token lands on the guest's proxy URL and in COPSE_EGRESS_TOKEN and nowhere
# else. The first fixture value was a hex string and tripped the entropy
# heuristic; the value is plain words now, but the path exemption also clears
# the finding in branch history. Scope to that one rule and file.
description = "Container run proxy-token fixture (inert)"
targetRules = ["generic-api-key"]
paths = ['''^src/main/services/container-runtime/thread-container\.test\.ts$''']

[[allowlists]]
# Recorded shell-scope results include SHA-256 provenance for model artefacts.
# The generic-api-key heuristic mistakes three of those hashes for credentials.
# Require both an exact result path and the exact named SHA field shape so real
# credentials elsewhere in the files, or future result files, remain visible.
description = "Shell-scope result provenance hashes (not credentials)"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "match"
regexes = ['''(credential-url\.ts|tokenizer(_config)?\.json)"\s*:\s*"[0-9a-f]{64}"''']
paths = [
  '''^benchmarks/shell-scope/results/2026-09-22/deterministic\.json$''',
  '''^benchmarks/shell-scope/results/2026-09-22/diagnostics/historical\.jsonl$''',
  '''^benchmarks/shell-scope/results/2026-09-22/diagnostics/repeat-options\.jsonl$''',
  '''^benchmarks/shell-scope/results/2026-09-22/manifest\.json$''',
  '''^benchmarks/shell-scope/results/2026-09-22/semif-dev\.jsonl$''',
  '''^benchmarks/shell-scope/results/2026-09-22/semif-holdout\.jsonl$''',
]

[[allowlists]]
# Generated only for the local model.example TLS transport fixture. This key
# authenticates no provider or account; the test needs a matching certificate
# while leaving TLS identity verification enabled. Other rules still scan it.
description = "Inert CLI provider TLS fixture key"
targetRules = ["private-key"]
paths = ['''^tests/fixtures/cli-provider-transport/model\.key$''']

[[allowlists]]
# The environment-setup redaction test first carried an inert `API_TOKEN=` value
# as a literal (commit 4a4a1866358a on PR #3950). The test now assembles its
# fake value at run time; this entry clears only that exact literal in the one
# file's history, so any other credential-shaped value there is still reported.
description = "Inert environment-setup redaction fixture (history only)"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "match"
regexes = ['''API_TOKEN=abcdef123456''']
paths = ['''^src/main/services/security/environment-suggestions\.test\.ts$''']

[[allowlists]]
# The remote-protocol label-grant test first passed a made-up names-service
# label (`abcdefgh2345`, the shape `[a-z2-7]{12}`) as a literal beside
# `keys.privateKey` (commit dad470de4fd9 on PR #3992), which the
# generic-api-key heuristic reads as a key assignment. Labels are public DNS
# names, not credentials. The test now passes a named constant; this entry
# clears only that exact literal in the one file's history.
description = "Remote-protocol test label (history only)"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "match"
regexes = ['''abcdefgh2345''']
paths = ['''^packages/remote-protocol/src/protocol\.test\.ts$''']

[[allowlists]]
# The boundary-contract redaction test first carried an inert classic-PAT-shaped
# literal (commit 315dac3fa381 on PR #4008) to prove the report redactor strips
# GitHub tokens. The test now assembles its fake token at run time; this entry
# clears only that exact literal in the one file's history, so any other
# credential-shaped value there is still reported.
description = "Boundary-contract redaction fixture (history only)"
targetRules = ["github-pat"]
condition = "AND"
regexTarget = "match"
regexes = ['''ghp_0123456789abcdefghijABCDEFGHIJ012345''']
paths = ['''^scripts/lib/boundary-contracts\.test\.ts$''']
