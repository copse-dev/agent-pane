[package]
name = "copse-remote-watcher"
version = "0.1.0"
edition = "2021"
description = "Streaming file watcher Copse uploads to SSH workspace hosts"
license = "MIT"
publish = false

[dependencies]
notify = "6.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Static, small, strippable: the binary rides an SSH channel on every first
# connect to a host, so size is a user-visible cost.
[profile.release]
strip = true
lto = true
opt-level = "z"
codegen-units = 1
