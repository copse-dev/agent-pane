<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1e201e" />
    <title>Copse · Activity</title>
    <link rel="stylesheet" href="app.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="brand"><span class="brand-mark" aria-hidden="true"></span> Copse</div>
        <button id="back" class="back" type="button" hidden>
          <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M19 12H5m7 7-7-7 7-7" />
          </svg>
          <span>Activity</span>
        </button>
      </header>
      <section id="pair" class="pair" hidden>
        <span class="eyebrow">MOBILE COMPANION</span>
        <h1>See what needs you.</h1>
        <p>
          Your Mac must be awake with Copse open. Pair this phone from the desktop to read your
          threads and control runs.
        </p>
        <label for="device-name">This phone’s name</label>
        <input id="device-name" maxlength="64" autocomplete="off" value="My phone" />
        <button id="pair-button" class="ui-btn ui-btn-primary">Request pairing</button>
        <div id="pair-code" class="pair-code" hidden></div>
        <p id="pair-status" class="status" role="status"></p>
      </section>
      <section id="activity" hidden>
        <div class="page-heading">
          <span class="eyebrow">YOUR THREADS</span>
          <h1>Activity</h1>
          <p id="freshness">Checking desktop…</p>
        </div>
        <button id="new-chat" class="ui-btn ui-btn-primary" hidden>New chat</button>
        <form id="new-chat-form" hidden>
          <label for="project">Project</label>
          <select id="project" required></select>
          <label for="new-message">Message</label>
          <div class="message-compose">
            <div id="new-image-preview" class="image-preview" hidden>
              <img alt="Image to send" />
              <button
                type="button"
                class="ui-btn image-remove"
                aria-label="Remove image"
                title="Remove image"
              >
                <span class="image-remove-glyph" aria-hidden="true">
                  <svg viewBox="0 0 24 24" focusable="false">
                    <path d="M5 5 19 19M19 5 5 19" />
                  </svg>
                </span>
              </button>
            </div>
            <textarea
              id="new-message"
              rows="4"
              maxlength="32000"
              placeholder="What would you like to work on?"
            ></textarea>
            <div class="composer-actions">
              <div class="image-attachment">
                <button
                  class="ui-btn ui-btn-ghost image-picker"
                  type="button"
                  aria-label="Add image"
                  title="Add image"
                >
                  <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path
                      d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"
                    />
                  </svg>
                </button>
                <input
                  id="new-image"
                  type="file"
                  accept="image/*"
                  aria-label="Choose image"
                  tabindex="-1"
                />
              </div>
              <button class="ui-btn ui-btn-primary" type="submit">Start chat</button>
            </div>
          </div>
          <p class="hint">Opens on your Mac using its project and model settings.</p>
        </form>
        <div id="groups"></div>
        <div id="inline-decision" hidden></div>
      </section>
      <section id="thread" hidden>
        <span id="thread-project" class="eyebrow"></span>
        <h1 id="thread-title"></h1>
        <p id="thread-status" class="read-only"></p>
        <button id="stop" class="ui-btn" hidden>Stop run</button>
        <div id="messages"></div>
        <div id="attention"></div>
        <form id="composer" hidden>
          <label for="message">Message</label>
          <div class="message-compose">
            <div id="message-image-preview" class="image-preview" hidden>
              <img alt="Image to send" />
              <button
                type="button"
                class="ui-btn image-remove"
                aria-label="Remove image"
                title="Remove image"
              >
                <span class="image-remove-glyph" aria-hidden="true">
                  <svg viewBox="0 0 24 24" focusable="false">
                    <path d="M5 5 19 19M19 5 5 19" />
                  </svg>
                </span>
              </button>
            </div>
            <textarea
              id="message"
              rows="3"
              maxlength="32000"
              placeholder="Send a follow-up…"
            ></textarea>
            <div class="composer-actions">
              <div class="image-attachment">
                <button
                  class="ui-btn ui-btn-ghost image-picker"
                  type="button"
                  aria-label="Add image"
                  title="Add image"
                >
                  <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path
                      d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"
                    />
                  </svg>
                </button>
                <input
                  id="message-image"
                  type="file"
                  accept="image/*"
                  aria-label="Choose image"
                  tabindex="-1"
                />
              </div>
              <button id="send" class="ui-btn ui-btn-primary" type="submit">Send</button>
            </div>
          </div>
        </form>
      </section>
      <p id="action-status" class="status" role="status"></p>
      <p id="error" class="error" role="alert" hidden></p>
    </main>
  </body>
</html>
