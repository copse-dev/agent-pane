<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <!--
      style-src keeps 'unsafe-inline' on purpose. Our own code never emits
      markup-level inline styles (no style="" attributes, no <style> blocks —
      all dynamic styling goes through the CSSOM, which CSP does not govern).
      The requirement comes from two bundled libraries that inject styles at
      runtime and offer no CSP nonce hook:
        - monaco-editor injects <style> elements (and uses innerHTML) for its
          theming; content is dynamic per load, so nonce/hash do not apply.
          This is unfixed upstream since 2016 (microsoft/monaco-editor#271),
          and VS Code itself ships style-src 'unsafe-inline' for the same
          reason (src/vs/code/electron-browser/workbench/workbench.html).
        - mermaid emits SVG with <style> blocks and inline style="" attributes
          (which cannot be nonced at all). Its securityLevel:'sandbox' iframe
          uses srcdoc, which INHERITS this CSP, so it does not help here.
      Dropping 'unsafe-inline' would break the editor and diagram rendering.
      The exfiltration risk it would otherwise carry is already closed off by
      img-src below (no remote URLs), so CSS-based data exfiltration is blocked.

      Compensating controls for the residual mermaid concern (diagram source is
      model/workspace-controlled and mermaid has a history of XSS via crafted
      syntax):
        - mermaid runs with securityLevel:'strict' (markdown/mermaid.ts), which
          HTML-encodes labels, disables click/interaction directives, and passes
          its SVG through DOMPurify. Do not relax that setting.
        - all renderer innerHTML of model output is sanitized through DOMPurify
          first (markdown/sanitize.ts); the mermaid fallback path inserts source
          via textContent only (markdown/mermaid-fallback.ts), never as markup.
        - script-src 'self' blocks inline/remote script regardless, and
          img-src below has no remote http(s) origin, so even a style/SVG that
          slipped through has no network sink to exfiltrate to.
      Note: 'unsafe-inline' here governs style only; it does NOT loosen
      script-src, so it cannot enable script-based XSS.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none';"
    />
    <title>Copse</title>
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="stylesheet" href="./app.css" />
    <link rel="stylesheet" href="./monaco/vs/editor/browser/widget/diffEditor/style.css" />
  </head>
  <body>
    <div id="app">
      <div id="titlebar"></div>
      <div id="body" class="three-pane">
        <div id="pane-projects" class="pane-projects"></div>
        <div id="resizer-projects" class="pane-resizer" aria-hidden="true"></div>
        <div id="pane-chat" class="pane-chat">
          <div id="conversation" class="conversation"></div>
          <div id="input-bar"></div>
        </div>
        <div id="resizer-files" class="pane-resizer" aria-hidden="true" hidden></div>
        <div id="pane-files" class="pane-files" hidden>
          <div class="pane-files-body">
            <div id="right-sidebar" class="right-sidebar">
              <div id="file-tree-host" class="file-tree-host"></div>
              <div id="terminals-list-host" class="terminals-list-host" hidden></div>
              <div id="git-changes-host" class="git-changes-host" hidden></div>
              <div id="pr-list-host" class="git-changes-host pr-list-host" hidden></div>
              <div id="memories-host" class="git-changes-host memories-host" hidden></div>
              <div id="browser-tabs-host" class="browser-tabs-host" hidden></div>
            </div>
            <div id="resizer-tree" class="pane-resizer" aria-hidden="true"></div>
            <div id="file-viewer" class="file-viewer"></div>
            <div id="terminals-viewer-host" class="terminals-viewer-host" hidden>
              <div id="agent-tasks-host" class="agent-tasks-host"></div>
            </div>
            <div id="git-diff-viewer-host" class="git-diff-viewer-host" hidden></div>
            <div id="pr-viewer-host" class="git-diff-viewer-host pr-viewer-host" hidden></div>
            <div
              id="memories-viewer-host"
              class="git-diff-viewer-host memories-viewer-host"
              hidden
            ></div>
            <div id="browser-viewer-host" class="browser-viewer-host" hidden></div>
          </div>
        </div>
      </div>
      <div id="welcome"></div>
    </div>
    <script src="./app.js"></script>
  </body>
</html>
