<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Copse: one list and one review surface for local changes and PRs (exploration)</title>
    <style>
      :root {
        --bg: #1e1e1e;
        --bg2: #252526;
        --bg3: #2d2d30;
        --hover: #2a2d2e;
        --sel: #094771;
        --fg: #d4d4d4;
        --fg2: #9d9d9d;
        --fg3: #6e6e6e;
        --bd: #3a3a3c;
        --accent: #4daafc;
        --accent-soft: color-mix(in srgb, #4daafc 14%, #252526);
        --add-bg: rgba(46, 160, 67, 0.16);
        --add-fg: #7ee787;
        --del-bg: rgba(248, 81, 73, 0.15);
        --del-fg: #ffa198;
        --error: #f85149;
        --warning: #e3b341;
        --success: #3fb950;
        --radius: 4px;
        --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
        color-scheme: dark;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #fff;
          --bg2: #f6f8fa;
          --bg3: #eef1f4;
          --hover: #eaeef2;
          --sel: #ddf4ff;
          --fg: #1f2328;
          --fg2: #59636e;
          --fg3: #8c959f;
          --bd: #d0d7de;
          --accent: #0969da;
          --accent-soft: #ddf4ff;
          --add-bg: #dafbe1;
          --add-fg: #116329;
          --del-bg: #ffebe9;
          --del-fg: #a40e26;
          --error: #cf222e;
          --warning: #9a6700;
          --success: #1a7f37;
          color-scheme: light;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        font:
          13px/1.45 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        background: var(--bg);
        color: var(--fg);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      button {
        font: inherit;
        color: inherit;
        background: var(--bg3);
        border: 1px solid var(--bd);
        border-radius: 999px;
        padding: 3px 11px;
        cursor: pointer;
        white-space: nowrap;
      }
      button:hover {
        background: var(--hover);
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      button.link {
        background: none;
        border: 0;
        padding: 0;
        color: var(--fg2);
        border-radius: 0;
      }
      button.link:hover {
        color: var(--fg);
        text-decoration: underline;
      }
      code {
        font-family: var(--mono);
        font-size: 11.5px;
      }
      .muted {
        color: var(--fg2);
      }
      .faint {
        color: var(--fg3);
      }
      [hidden] {
        display: none !important;
      }

      /* one badge recipe (docs/ui-taste.md "Badges are labels"): radius corner, sentence case, neutral */
      .badge {
        display: inline-block;
        font-size: 10.5px;
        font-weight: 500;
        line-height: 15px;
        color: var(--fg2);
        border: 1px solid var(--bd);
        border-radius: var(--radius);
        padding: 0 5px;
        white-space: nowrap;
        vertical-align: 1px;
      }
      .badge::first-letter {
        text-transform: uppercase;
      }

      .intro {
        padding: 7px 14px;
        border-bottom: 1px solid var(--bd);
        background: var(--bg2);
        font-size: 12px;
        color: var(--fg2);
      }
      .intro b {
        color: var(--fg);
      }

      .review-root {
        flex: 1 1 0;
        min-height: 0;
        position: relative;
        container: review / size;
      }
      .app {
        height: 100%;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 270px;
        grid-template-rows: minmax(0, 1fr);
        overflow: hidden;
      }
      .narrow-only {
        display: none;
      }

      /* other changes live behind a switcher, closed by default */
      .ctxrow {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 11.5px;
        color: var(--fg3);
        margin-bottom: 3px;
        position: relative;
      }
      .ctxrow .sp {
        flex: 1;
      }
      .switch {
        position: absolute;
        right: 0;
        top: calc(100% + 4px);
        width: min(300px, calc(100cqw - 20px));
        max-height: 60vh;
        overflow: auto;
        background: var(--bg2);
        border-radius: 6px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
        z-index: 10;
        padding-bottom: 6px;
      }
      #list,
      #side {
        background: var(--bg2);
        overflow: auto;
        min-height: 0;
      }
      #list {
        border-right: 1px solid var(--bd);
      }
      #side {
      }
      #center {
        overflow: auto;
        min-height: 0;
      }

      /* combined list */
      .lh {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 9px 12px 6px;
      }
      .lh b {
        font-size: 12.5px;
      }
      .filter {
        margin: 0 10px 6px;
        width: calc(100% - 20px);
        font: inherit;
        color: inherit;
        background: var(--bg);
        border: 1px solid var(--bd);
        border-radius: var(--radius);
        padding: 3px 8px;
      }
      .grp {
        padding: 8px 12px 3px;
        font-size: 11.5px;
        color: var(--fg3);
      }
      .item {
        display: flex;
        gap: 8px;
        padding: 6px 12px;
        cursor: pointer;
        align-items: flex-start;
      }
      .item:hover {
        background: var(--hover);
      }
      .item.sel {
        background: var(--sel);
      }
      .item .dot {
        margin-top: 5px;
      }
      .item .t {
        font-size: 12.5px;
        line-height: 1.3;
      }
      .item .s {
        font-size: 11.5px;
        color: var(--fg3);
        margin-top: 1px;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex: none;
      }
      .dot.ok {
        background: var(--success);
      }
      .dot.fail {
        background: var(--error);
      }
      .dot.run {
        background: var(--warning);
      }
      .dot.none {
        background: none;
        border: 1.5px solid var(--fg3);
      }

      /* change header */
      .ch {
        padding: 10px 14px 0;
        position: sticky;
        top: 0;
        background: var(--bg);
        z-index: 3;
      }
      .ch h2 {
        margin: 0;
        font-size: 15px;
      }
      .title-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .status-btn {
        align-items: center;
        gap: 6px;
        font-size: 12px;
      }
      .drawer-head {
        align-items: center;
        padding: 10px 12px 0;
      }
      .drawer-head .sp {
        flex: 1;
      }
      .dh .sp {
        flex: 1;
      }
      .dh-acts {
        display: flex;
        gap: 6px;
        align-items: center;
        margin-left: auto;
        flex: none;
      }
      .vw {
        display: flex;
        align-items: center;
        gap: 4px;
        font-family: -apple-system, sans-serif;
        font-size: 11.5px;
        color: var(--fg2);
        cursor: pointer;
      }
      .pendbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        margin: 12px 14px 0;
        padding: 8px 10px;
        border-radius: 6px;
        background: var(--bg2);
        font-size: 12.5px;
      }
      .pendbar .sp {
        flex: 1;
      }
      .badge-btn {
        cursor: pointer;
        background: none;
        font:
          500 10.5px/15px -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        padding: 0 5px;
        border-radius: var(--radius);
      }
      .badge-btn:hover,
      .badge-btn[aria-expanded='true'] {
        color: var(--fg);
        border-color: var(--fg3);
      }
      .cx {
        padding-top: 4px;
      }
      .dfile.pending {
        overflow: visible;
      }
      .cx-menu {
        width: min(320px, calc(100cqw - 20px));
        text-align: left;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 12.5px;
        padding: 4px;
      }
      .cx-menu .mi {
        display: block;
        width: 100%;
        white-space: normal;
      }
      .mi-sub {
        display: block;
        margin-top: 2px;
        font-family: var(--mono);
        font-size: 11px;
        color: var(--fg3);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .cx-opt {
        margin: 6px 10px;
        border-radius: var(--radius);
        overflow: hidden;
        background: var(--bg);
      }
      .cx-h {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 3px 8px;
        background: var(--bg3);
        font-size: 11px;
        color: var(--fg2);
      }
      .cx-h button {
        font-size: 11px;
        padding: 0 9px;
      }
      .cx-opt pre {
        margin: 0;
        padding: 4px 8px;
        font-family: var(--mono);
        font-size: 11.5px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .cx-f {
        display: flex;
        gap: 14px;
        padding: 2px 10px 8px;
      }
      .cx-f .sp {
        flex: 1;
      }
      .cx-ed {
        display: block;
        box-sizing: border-box;
        width: calc(100% - 20px);
        margin: 6px 10px;
        min-height: 60px;
        font-family: var(--mono);
        font-size: 11.5px;
        background: var(--bg);
        color: var(--fg);
        border: 1px solid var(--bd);
        border-radius: var(--radius);
        padding: 6px 8px;
        resize: vertical;
      }
      .localbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        margin-top: 8px;
        padding: 6px 10px;
        border-radius: 6px;
        background: var(--bg2);
        font-size: 12.5px;
      }
      .localbar .sp {
        flex: 1;
      }
      .localbar button {
        font-size: 12px;
      }
      .pendbar button,
      .dfile.pending .dh button {
        font-size: 12px;
        padding: 1px 10px;
      }
      .dfile.pending {
        margin-top: 8px;
      }
      .merge-row {
        margin-top: 10px;
      }
      .split {
        position: relative;
        display: inline-flex;
      }
      .split .split-main {
        border-radius: 999px 0 0 999px;
        padding-right: 10px;
      }
      .split .split-arrow {
        border-radius: 0 999px 999px 0;
        border-left: 0;
        padding: 3px 9px;
      }
      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .mm-menu {
        left: 0;
        right: auto;
        width: 220px;
      }
      .pc-compose {
        margin-top: 12px;
      }
      .pc-compose textarea {
        width: 100%;
        height: 56px;
        font: inherit;
        color: inherit;
        background: var(--bg2);
        border: 1px solid var(--bd);
        border-radius: var(--radius);
        padding: 6px 8px;
        resize: vertical;
      }
      .pc-compose .row {
        display: flex;
        gap: 6px;
        margin-top: 4px;
      }
      .pc-compose .sp {
        flex: 1;
      }
      .chk-head {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: var(--fg2);
        margin-bottom: 6px;
      }
      .chk-head .sp,
      .ckrow .sp {
        flex: 1;
      }
      .ckrow {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 5px 0;
        font-size: 12.5px;
      }
      .ckrow .ckname {
        white-space: nowrap;
      }
      .ckrow .link {
        font-size: 12px;
      }
      .title-row .sp {
        flex: 1;
      }
      .title-row button {
        font-size: 12px;
      }
      .more {
        position: relative;
      }
      .menu {
        width: 230px;
        top: calc(100% + 4px);
        padding: 4px;
        display: flex;
        flex-direction: column;
      }
      .menu .mi {
        border: 0;
        background: none;
        border-radius: var(--radius);
        text-align: left;
        padding: 5px 9px;
      }
      .menu .mi:hover {
        background: var(--hover);
      }
      .ch .ref {
        font-size: 12px;
        color: var(--fg2);
        margin-top: 2px;
      }
      .demobar {
        flex: none;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
        background: #000;
        color: var(--fg3);
        font-size: 11.5px;
      }
      .demobar b {
        font-weight: 600;
        color: var(--fg2);
      }
      .demobar .sp {
        flex: 1;
      }
      .demobar button {
        font-size: 11.5px;
        padding: 2px 8px;
      }
      .demobar .seg {
        display: flex;
        gap: 2px;
      }
      .demobar [aria-pressed='true'] {
        background: var(--bg3, #333);
        color: var(--fg);
      }
      .tabs {
        display: flex;
        gap: 2px;
        margin-top: 6px;
        overflow-x: auto;
        scrollbar-width: none;
      }
      .tabs::-webkit-scrollbar {
        display: none;
      }
      .tabs button {
        flex: none;
        border: 0;
        background: none;
        border-radius: 0;
        padding: 7px 12px;
        border-bottom: 2px solid transparent;
        color: var(--fg2);
      }
      .tabs button[aria-current='true'] {
        color: var(--fg);
        border-bottom-color: var(--accent);
      }
      .tabs .c {
        color: var(--fg3);
        margin-left: 4px;
      }

      .filebar {
        display: flex;
        gap: 4px 12px;
        flex-wrap: wrap;
        padding: 10px 14px 2px;
        font-size: 12px;
      }
      .filebar a {
        color: var(--fg2);
        text-decoration: none;
        cursor: pointer;
        font-family: var(--mono);
        font-size: 11.5px;
      }
      .filebar a:hover {
        color: var(--fg);
      }
      .filebar .n {
        color: var(--fg3);
        font-family: -apple-system, sans-serif;
      }

      .dfile {
        margin: 18px 14px;
        border-radius: 6px;
        overflow: hidden;
      }
      .dh {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 8px;
        align-items: center;
        padding: 6px 10px;
        background: var(--bg2);
        font-family: var(--mono);
        font-size: 11.5px;
      }
      .st {
        font-family: var(--mono);
        font-weight: 700;
        font-size: 10.5px;
      }
      .st-A {
        color: var(--add-fg);
      }
      .st-M {
        color: var(--warning);
      }
      table.l {
        border-collapse: collapse;
        width: 100%;
        font-family: var(--mono);
        font-size: 12px;
      }
      table.l td {
        padding: 0 6px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        vertical-align: top;
      }
      td.ln {
        width: 1%;
        min-width: 36px;
        text-align: right;
        color: var(--fg3);
        user-select: none;
      }
      table.l td.ln {
        white-space: nowrap;
        overflow-wrap: normal;
      }
      td.plus {
        width: 18px;
        padding: 0 !important;
        text-align: center;
      }
      td.plus button {
        opacity: 0;
        width: 16px;
        height: 16px;
        padding: 0;
        line-height: 14px;
        font-size: 12px;
        border-radius: var(--radius);
        background: var(--accent);
        color: #fff;
        border: 0;
      }
      tr:hover td.plus button {
        opacity: 1;
      }
      tr.a td.code,
      tr.a td.ln {
        background: var(--add-bg);
      }
      tr.d td.code,
      tr.d td.ln {
        background: var(--del-bg);
      }
      tr.hk td {
        background: var(--accent-soft);
        color: var(--fg3);
        padding: 2px 10px;
      }
      tr.th > td {
        padding: 6px 10px 8px 50px;
        background: var(--bg);
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 12.5px;
        white-space: normal;
        word-break: normal;
        overflow-wrap: anywhere;
      }

      /* review thread */
      .thread {
        border-radius: 6px;
        background: var(--bg2);
        max-width: 720px;
        padding: 2px 0;
      }
      .thread-h {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 4px 10px 0;
        font-size: 11.5px;
        color: var(--fg2);
      }
      .thread-h .sp {
        flex: 1;
      }
      .who-row {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .who-row .sp {
        flex: 1;
      }
      .who-row .link {
        font-size: 11.5px;
      }
      /* resolved: one quiet line, no frame */
      .thread-min {
        display: flex;
        gap: 8px;
        align-items: center;
        font-size: 12px;
        color: var(--fg3);
        padding: 2px 0;
        max-width: 720px;
      }
      .thread-min .sp {
        flex: 1;
      }
      .thread-min .snip {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        min-width: 0;
      }
      .thread-min {
        white-space: nowrap;
        padding: 0 10px;
        width: 0;
        min-width: 100%;
        box-sizing: border-box;
      }
      .thread-min .snip {
        flex: 1 1 0 !important;
      }
      .thread-min > * {
        flex: none;
      }
      .thread-min .snip {
        flex: 0 1 auto;
      }
      .thread-min .sp {
        flex: 1 1 0;
      }
      .cmt {
        display: flex;
        gap: 8px;
        padding: 8px 10px;
      }
      .cmt + .cmt {
        padding-top: 2px;
      }
      .av {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        flex: none;
        display: grid;
        place-items: center;
        font-size: 10.5px;
        font-weight: 700;
        color: #fff;
      }
      .who {
        font-weight: 600;
        font-size: 12px;
      }
      .body p {
        margin: 2px 0;
      }
      .finding {
        font-size: 11.5px;
        color: var(--fg2);
      }
      .finding .sev-high {
        color: var(--error);
      }
      .finding .sev-medium {
        color: var(--warning);
      }
      .meta-line {
        font-size: 11px;
        color: var(--fg3);
        margin-top: 3px;
      }
      .ext-note {
        font-size: 11px;
        color: var(--fg3);
        margin-top: 3px;
      }
      .sugg {
        border-radius: var(--radius);
        margin-top: 6px;
        overflow: hidden;
        background: var(--bg);
      }
      .sugg-h {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 3px 8px;
        background: var(--bg3);
        font-size: 11px;
        color: var(--fg2);
      }
      .sugg-h button {
        font-size: 11px;
        padding: 0 9px;
      }
      .sugg pre {
        margin: 0;
        padding: 3px 8px;
        font-family: var(--mono);
        font-size: 11.5px;
        white-space: pre-wrap;
      }
      .sugg .o {
        background: var(--del-bg);
      }
      .sugg .n {
        background: var(--add-bg);
      }
      .reply {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        padding: 4px 10px 8px;
      }
      .reply input {
        min-width: 160px;
      }
      .reply input {
        flex: 1;
        font: inherit;
        color: inherit;
        background: var(--bg);
        border: 1px solid var(--bd);
        border-radius: var(--radius);
        padding: 3px 8px;
      }
      .typing {
        color: var(--fg3);
        padding: 6px 10px;
        font-size: 12px;
      }
      /* ask-or-publish box: Enter asks the agent; holding cmd+shift arms the public reply */
      .askbox .ask-btn {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      .askbox .pub-btn {
        background: none;
      }
      .askbox.armed .ask-btn {
        background: none;
        border-color: var(--bd);
        color: var(--fg2);
      }
      .askbox.armed .pub-btn {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      .askbox.armed input {
        border-color: var(--accent);
      }
      .keyhint {
        font-size: 11px;
        color: var(--fg3);
        padding: 0 10px 7px;
      }
      .keyhint kbd {
        font-family: inherit;
        font-size: 10.5px;
        border: 1px solid var(--bd);
        border-radius: 3px;
        padding: 0 3px;
        margin: 0 1px;
      }
      .aside {
        margin: 0 10px 8px 40px;
        border-left: 2px solid var(--bd);
        padding-left: 10px;
      }
      .aside-h {
        font-size: 11px;
        color: var(--fg3);
        padding-top: 4px;
      }
      .aside .cmt {
        padding: 6px 0;
      }
      .aside .cmt + .cmt {
        border-top: 0;
      }
      .draft {
        border-radius: var(--radius);
        padding: 6px 8px;
        margin-top: 6px;
        background: var(--bg);
      }
      .draft p {

      // One main action for the stage, everything else under ⋯ (same pattern as the PR panel's Approve + ⋯).

            save()
            renderAll()
            toast(`Submitted. ${pub.length} thread${pub.length === 1 ? '' : 's'} published`)
          },
        )
      }

      function renderDemo() {
        const on = S.sel === 'c1'
        $('#demobar').innerHTML =
          `<b>Demo</b><span class="seg">${STAGES.map(([id, l]) => `<button data-demo-stage="${id}" aria-pressed="${on && S.stage === id}" ${on ? '' : 'disabled'}>${l}</button>`).join('')}</span><span class="sp"></span><button data-demo-reset>Reset</button>`
        $('#demobar')
          .querySelectorAll('[data-demo-stage]')
          .forEach(
            (b) =>
              (b.onclick = () => {
                S.stage = b.dataset.demoStage
                save()
                renderAll()
              }),
          )
        $('#demobar').querySelector('[data-demo-reset]').onclick = () => {
          sessionStorage.removeItem(KEY)
          location.reload()
        }
      }
      function renderAll() {
        renderDemo()
        document.getElementById('root').classList.toggle('drawer', !!S.drawer)
        renderCenter()
        renderSide()
      }
      document.addEventListener('click', (e) => {
        if (S.menu || S.more) {
          S.menu = false
          S.more = false
          save()
          renderCenter()
        }
        if (S.cxOpen && !e.target.closest('.cx-wrap')) {
          S.cxOpen = null
          renderCenter()
        }
      })
      function closeDrawer() {
        if (!S.drawer) return
        S.drawer = false
        save()
        renderAll()
      }
      document.addEventListener(
        'pointerdown',
        (e) => {
          if (S.drawer && !e.target.closest('#side,[data-mi="status"]')) closeDrawer()
        },
        true,
      )
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeDrawer()
      })
      S.menu = false
      S.more = false
      // Popovers open into whatever space the pane has: flip sideways or upwards and cap height instead of running off an edge.
      function placePopovers() {
        const box = document.getElementById('root').getBoundingClientRect(),
          pad = 8
        document.querySelectorAll('#root .switch').forEach((m) => {
          m.style.left = m.style.right = m.style.top = m.style.bottom = m.style.maxHeight = ''
          let r = m.getBoundingClientRect()
          if (r.left < box.left + pad) {
            m.style.left = '0'
            m.style.right = 'auto'
            r = m.getBoundingClientRect()
            if (r.right > box.right - pad)
              m.style.left = box.left + pad - m.offsetParent.getBoundingClientRect().left + 'px'
          } else if (r.right > box.right - pad) {
            m.style.right = '0'
            m.style.left = 'auto'
            r = m.getBoundingClientRect()
            if (r.left < box.left + pad) {
              m.style.right = 'auto'
              m.style.left = box.left + pad - m.offsetParent.getBoundingClientRect().left + 'px'
            }
          }
          r = m.getBoundingClientRect()
          const a = m.offsetParent.getBoundingClientRect(),
            below = box.bottom - pad - a.bottom - 4,
            above = a.top - box.top - pad - 4
          if (r.bottom > box.bottom - pad && above > below) {
            m.style.top = 'auto'
            m.style.bottom = 'calc(100% + 4px)'
            m.style.maxHeight = above + 'px'
          } else if (r.bottom > box.bottom - pad) m.style.maxHeight = below + 'px'
        })
      }
      new MutationObserver(() => requestAnimationFrame(placePopovers)).observe(
        document.getElementById('root'),
        { childList: true, subtree: true },
      )
      addEventListener('resize', placePopovers)
      document.addEventListener('scroll', placePopovers, true)
      renderAll()
    </script>
  </body>
</html>
