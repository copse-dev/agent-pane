<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Copse — New thread activity prototype</title>
    <style>
      :root {
        color-scheme: dark;
        --tint: #244c25;
        --bg: color-mix(in srgb, var(--tint) 4%, #1e1e1e);
        --panel: color-mix(in srgb, var(--tint) 4%, #252526);
        --surface: color-mix(in srgb, var(--tint) 4%, #232324);
        --hover: color-mix(in srgb, var(--tint) 4%, #2a2d2e);
        --line: #414141;
        --line-subtle: #333;
        --text: #d4d4d4;
        --secondary: #a6a6a6;
        --muted: #808080;
        --accent: #ff93d0;
        --accent-fill: #ff93d0;
        --pr-merged: #9d7cf4;
        --pr-closed: #f48771;
        --accent-fill-hover: color-mix(in srgb, #ff93d0 85%, white);
        --on-accent: #444;
        --selected: color-mix(in srgb, var(--accent) 20%, var(--panel));
        --teal: #4ec9b0;
        --warning: #f0a15e;
        --shadow: 0 2px 12px #00000040;
        --font: 'Pliant', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        --display: 'Averia Serif Libre', Georgia, serif;
        --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      }
      :root[data-theme='light'] {
        color-scheme: light;
        --pr-merged: #8250df;
        --pr-closed: #cf222e;
        --bg: color-mix(in srgb, var(--tint) 7.6%, #fff);
        --panel: color-mix(in srgb, var(--tint) 7.6%, #f3f3f3);
        --surface: color-mix(in srgb, var(--tint) 7.6%, #f7f7f7);
        --hover: color-mix(in srgb, var(--tint) 7.6%, #e8e8e8);
        --line: #d4d4d4;
        --line-subtle: #cfcfcf;
        --text: #333;
        --secondary: #5f5f5f;
        --muted: #767676;
        --accent: color-mix(in srgb, #ff93d0 30%, black);
        --accent-fill-hover: color-mix(in srgb, #ff93d0 85%, black);
        --selected: color-mix(in srgb, #ff93d0 22%, var(--panel));
        --teal: #1a7f37;
        --warning: #b45a14;
        --shadow: 0 2px 12px #00000018;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.45 var(--font);
      }
      button,
      textarea {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      button:focus-visible,
      textarea:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .app {
        height: 100dvh;
        min-height: 550px;
        display: grid;
        grid-template-columns: var(--sw, 300px) minmax(0, 1fr);
        position: relative;
      }
      .sidebar {
        background: var(--panel);
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      .side-head {
        height: 61px;
        padding: 18px 15px 12px 19px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid var(--line);
      }
      .brand {
        font-family: var(--display);
        font-size: 23px;
        font-weight: 400;
        letter-spacing: -0.02em;
      }
      .side-controls {
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .icon-btn {
        display: inline-grid;
        place-items: center;
        border: 0;
        background: transparent;
        color: var(--secondary);
        width: 28px;
        height: 28px;
        border-radius: 6px;
      }
      .icon-btn:hover {
        background: var(--hover);
        color: var(--text);
      }
      .icon-btn svg {
        width: 16px;
        height: 16px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .side-scroll {
        overflow: auto;
        flex: 1;
        padding: 18px 8px;
      }
      .side-label {
        padding: 0 11px 10px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      .project {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        font-size: 13px;
        font-weight: 650;
      }
      .project .chev {
        font-size: 11px;
        color: var(--muted);
      }
      .project .plus {
        margin-left: auto;
        color: var(--muted);
        font-size: 19px;
        line-height: 1;
      }
      .side-row {
        display: flex;
        align-items: center;
        gap: 9px;
        width: 100%;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--secondary);
        text-align: left;
        padding: 8px 10px 8px 25px;
        font-size: 13px;
      }
      .side-row:hover {
        background: var(--hover);
        color: var(--text);
      }
      .side-row.active {
        background: var(--selected);
        color: var(--text);
      }
      .side-row .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent);
        flex: none;
      }
      .side-row .thread-name {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .side-row .age {
        margin-left: auto;
        color: var(--muted);
        font-size: 11px;
      }
      .side-footer {
        border-top: 1px solid var(--line);
        padding: 10px 11px;
        display: flex;
        align-items: center;
        gap: 9px;
        color: var(--secondary);
        font-size: 12px;
      }
      .avatar {
        display: grid;
        place-items: center;
        width: 26px;
        height: 26px;
        border-radius: 6px;
        background: #6c5064;
        color: #fff;
        font-weight: 700;
      }
      .main {
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
      }
      .topbar {
        height: 61px;
        flex: none;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 24px;
      }
      .crumb {
        color: var(--muted);
        white-space: nowrap;
      }
      .top-title {
        font-size: 13px;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .top-spacer {
        flex: 1;
      }
      .top-pill {
        color: var(--muted);
        font-size: 12px;
        border: 1px solid var(--line);
        border-radius: 5px;
        padding: 3px 7px;
      }
      .content {
        overflow: auto;
        flex: 1;
        padding: 26px clamp(22px, 5.4vw, 76px) 20px;
      }
      .content-inner {
        width: min(100%, 1050px);
        margin: 0 auto;
      }
      .eyebrow {
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        margin: 0 0 7px;
      }
      .page-title {
        font-family: var(--display);
        font-size: clamp(30px, 3vw, 39px);
        line-height: 1.13;
        letter-spacing: -0.035em;
        margin: 0;
      }
      .intro {
        color: var(--secondary);
        font-size: 14px;
        margin: 11px 0 27px;
        max-width: 650px;
      }
      .overview {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        padding: 0 0 16px;
        border-bottom: 1px solid var(--line);
      }
      .overview-copy {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }
      .quiet {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        color: var(--secondary);
        font-size: 13px;
      }
      .quiet .check {
        color: var(--teal);
        font-weight: 700;
      }
      .count {
        color: var(--secondary);
        font-size: 13px;
      }
      .count strong {
        color: var(--text);
        font-weight: 700;
      }
      .overview-actions {
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .subtle-btn {
        background: transparent;
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 5px 14px;
        font-size: 13px;
        font-weight: 600;
      }
      .subtle-btn:hover {
        color: var(--text);
        background: var(--hover);
      }
      .activity {
        display: grid;
        grid-template-columns: minmax(285px, 0.43fr) minmax(0, 0.57fr);
        border: 1px solid var(--line);
        border-radius: 9px;
        overflow: hidden;
        height: calc(100dvh - 330px);
        min-height: 340px;
        background: var(--panel);
        box-shadow: var(--shadow);
      }
      .activity-list {
        overflow: auto;
        border-right: 1px solid var(--line);
        background: var(--surface);
        padding: 11px 0;
        min-width: 0;
      }
      .list-heading {
        display: flex;
        gap: 8px;
        align-items: baseline;
        padding: 11px 18px 7px;
        color: var(--secondary);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .list-heading span {
        color: var(--muted);
        font-weight: 500;
      }
      .list-heading.recent {
        margin-top: 9px;
      }
      .activity-row {
        display: grid;
        grid-template-columns: 17px minmax(0, 1fr) auto;
        grid-template-rows: auto auto;
        column-gap: 9px;
        row-gap: 4px;
        width: 100%;
        border: 0;
        background: transparent;
        color: var(--text);
        text-align: left;
        padding: 10px 17px;
      }
      .activity-row:hover {
        background: var(--hover);
      }
      .activity-row.selected {
        background: var(--selected);
      }
      .activity-row .glyph {
        grid-row: 1/3;
        color: var(--secondary);
        font-size: 15px;
        line-height: 18px;
      }
      .activity-row.done .glyph {
        color: var(--teal);
      }
      .activity-row .name {
        font-size: 13px;
        font-weight: 640;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .activity-row .age {
        color: var(--muted);
        font-size: 12px;
      }
      .activity-row .second {
        grid-column: 2/4;
        display: flex;
        gap: 5px;
        min-width: 0;
        color: var(--secondary);
        font-size: 12px;
        white-space: nowrap;
      }
      .activity-row .second .state {
        font-weight: 650;
      }
      .activity-row .second .task {
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .activity-row .second .project-name {
        margin-left: auto;
        color: var(--muted);
        padding-left: 8px;
      }
      .detail {
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      .detail-body {
        padding: 26px 30px;
        flex: 1;
      }
      .detail-meta {
        display: flex;
        gap: 9px;
        align-items: center;
        color: var(--muted);
        font-size: 12px;
        flex-wrap: wrap;
      }
      .badge {
        background: var(--hover);
        color: var(--text);
        border-radius: 6px;
        padding: 1px 6px;
        font-weight: 500;
        font-size: 11px;
      }
      .badge.done {
        color: var(--teal);
      }
      .detail-title {
        font: 400 24px/1.18 var(--display);
        letter-spacing: -0.025em;
        margin: 18px 0 26px;
      }
      .detail-label {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.07em;
        color: var(--muted);
        text-transform: uppercase;
        margin-bottom: 11px;
      }
      .activity-text {
        font-size: 15px;
        color: var(--text);
      }
      .detail-foot {
        border-top: 1px solid var(--line);
        padding: 14px 30px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .open-btn {
        background: transparent;
        border: 0;
        color: var(--text);
        font-weight: 600;
        padding: 4px 0;
      }
      .open-btn:hover {
        color: var(--accent);
      }
      .arrow {
        margin-left: 8px;
      }
      .hint {
        color: var(--muted);
        font-size: 11px;
      }
      .composer-zone {
        flex: none;
        padding: 14px clamp(22px, 5.4vw, 76px) 23px;
        background: transparent;
      }
      .composer-wrap {
        width: min(100%, 800px);
        margin: 0 auto;
      }
      .composer-caption {
        color: var(--muted);
        font-size: 11px;
        margin: 0 0 7px 2px;
      }
      .composer {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--bg);
        box-shadow: 0 -6px 18px #0000001a;
        overflow: hidden;
      }
      .composer textarea {
        display: block;
        width: 100%;
        min-height: calc(2lh + 24px);
        max-height: 180px;
        resize: vertical;
        border: 0;
        background: transparent;
        color: var(--text);
        outline: 0;
        padding: 12px;
      }
      .composer textarea::placeholder {
        color: var(--muted);
      }
      .composer-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px 12px;
        border-top: 1px solid var(--line);
        font-size: 11px;
        color: var(--muted);
      }
      .small-chip {
        border: 0;
        background: transparent;
        color: var(--text-muted, var(--muted));
        border-radius: 6px;
        padding: 4px 8px;
        font-size: 11px;
      }
      .small-chip:hover {
        background: var(--hover);
        color: var(--text);
      }
      .send {
        margin-left: auto;
        border: 0;
        background: var(--accent-fill);
        color: var(--on-accent);
        border-radius: 999px;
        padding: 5px 16px;
        font-size: 13px;
        font-weight: 600;
      }
      .send:hover:not(:disabled) {
        background: var(--accent-fill-hover);
      }
      .send:disabled {
        opacity: 0.45;
        cursor: default;
      }
      .composer-help {
        color: var(--muted);
        font-size: 11px;
        text-align: center;
        margin-top: 7px;
      }
      .thread-view {
        display: none;
        max-width: 800px;
        margin: 0 auto;
        padding-top: 20px;
      }
      .message {
        padding: 18px 20px;
        border-radius: 10px;
        background: var(--panel);
        border: 1px solid var(--line);
        margin: 20px 0;
      }
      .message .speaker {
        font-size: 11px;
        font-weight: 700;
        color: var(--secondary);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom: 9px;
      }
      .back-link {
        background: transparent;
        border: 0;
        color: var(--secondary);
        padding: 0;
      }
      .back-link:hover {
        color: var(--text);
      }
      .thread-view .page-title {
        margin-top: 22px;
      }
      .mobile-activity-nav {
        display: none;
      }
      @media (max-width: 850px) {
        .app {
          grid-template-columns: 185px minmax(0, 1fr);
        }
        .activity {
          grid-template-columns: 1fr;
        }
        .activity-list {
          border-right: 0;
          border-bottom: 1px solid var(--line);
          max-height: 260px;
        }
        .activity {
          height: auto;
        }
        .detail {
          min-height: 245px;
        }
        .content {
          padding-top: 28px;
        }
        .topbar {
          padding: 0 18px;
        }
      }
      @media (max-width: 600px) {
        .app {
          display: block;
        }
        .sidebar {
          display: none;
        }
        .topbar {
          height: 54px;
          padding: 0 16px;
        }
        .content {
          padding: 24px 15px 12px;
        }
        .intro {
          margin-bottom: 20px;
        }
        .activity {
          margin-top: 12px;
        }
        .activity-list {
          padding-bottom: 5px;
        }
        .detail-body {
          padding: 20px;
        }
        .detail-foot {
          padding: 12px 20px;
        }
        .composer-zone {
          padding: 10px 15px 16px;
        }
        .mobile-activity-nav {
          display: inline-grid;
        }
      }
      @keyframes attn-pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.6;
        }
      }
      @keyframes run-dot {
        0%,
        80%,
        100% {
          opacity: 0.4;
        }
        40% {
          opacity: 1;
        }
      }
      .run-dots path {
        animation: run-dot 1.2s ease-in-out infinite;
      }
      .run-dots path:nth-child(2) {
        animation-delay: 0.2s;
      }
      .run-dots path:nth-child(3) {
        animation-delay: 0.4s;
      }
      .run-dots {
        stroke-width: 3 !important;
      }
      @media (prefers-reduced-motion: reduce) {
        .run-dots path,
        .has-attention,
        .attention .glyph,
        .side-attn {
          animation: none !important;
        }
      }
      .output {
        margin-top: 20px;
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--surface);
        font: 12px/1.5 var(--mono);
        color: var(--secondary);
        white-space: pre-wrap;
      }
      .stop-btn {
        margin-left: 14px;
      }
      .bell-btn {
        display: inline-flex;
        align-items: center;
        gap: 3px;
        border: 0;
        background: transparent;
        color: var(--muted);
        padding: 4px 6px;
        border-radius: 6px;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }
      .bell-btn:hover {
        background: var(--hover);
        color: var(--text);
      }
      .bell-btn svg {
        width: 16px;
        height: 16px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .bell-btn.has-attention {
        color: var(--warning);
        animation: attn-pulse 1.8s ease-in-out infinite;
      }
      .bell-btn[hidden] {
        display: none;
      }
      .top-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .split {
        display: inline-flex;
        border: 1px solid var(--line);
        border-radius: 6px;
        overflow: hidden;
        font-size: 12px;
      }
      .split span {
        padding: 3px 9px;
        color: var(--secondary);
      }
      .split span + span {
        border-left: 1px solid var(--line);
        padding: 3px 6px;
      }
      .activity-row.attention .glyph {
        color: var(--warning);
        animation: attn-pulse 1.8s ease-in-out infinite;
      }
      .activity-row.attention .state {
        color: var(--warning);
      }
      .badge.attention {
        color: var(--warning);
      }
      .side-row .dot.attn {
        background: var(--warning);
      }
      .primary-btn {
        background: var(--accent-fill);
        color: var(--on-accent);
        border: 0;
        border-radius: 999px;
        padding: 5px 16px;
        font-size: 13px;
        font-weight: 600;
      }
      .primary-btn:hover {
        background: var(--accent-fill-hover);
      }
      .gl {
        width: 16px;
        height: 16px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
        display: block;
      }
      .activity-row .glyph {
        display: grid;
        place-items: start center;
        padding-top: 1px;
      }
      .foot-actions {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .foot-actions .stop-btn {
        margin-left: 0;
      }
      .head-label {
        padding: 0;
        margin: 0;
      }
      .side-head {
        height: 44px;
        padding: 0 10px 0 19px;
      }
      .side-row {
        padding: 8px 10px 8px 28px;
        border-radius: 0;
      }
      .side-row.active {
        font-weight: 600;
      }
      .side-attn {
        margin-left: auto;
        color: var(--warning);
        display: grid;
        animation: attn-pulse 1.8s ease-in-out infinite;
      }
      .side-attn .gl {
        width: 14px;
        height: 14px;
      }
      .side-run {
        margin-left: auto;
        color: var(--muted);
      }
      .side-footer {
        padding: 0;
        display: block;
      }
      .settings-btn {
        width: 100%;
        border: 0;
        background: transparent;
        color: var(--secondary);
        padding: 12px;
        font-size: 13px;
      }
      .settings-btn:hover {
        background: var(--hover);
        color: var(--text);
      }
      .side-scroll {
        padding: 8px 0;
      }
      .project {
        padding: 8px 14px;
      }
      .tb {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 8px;
        color: var(--secondary);
        font-size: 13px;
        border-radius: 6px;
      }
      .tb:hover {
        background: var(--hover);
        color: var(--text);
      }
      .tb svg {
        width: 16px;
        height: 16px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .top-actions {
        gap: 2px;
      }
      .topbar {
        height: 44px;
      }
      .tb-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 16px 6px 20px;
      }
      .tb-title {
        margin: 0;
        font: 400 26px/1.1 var(--display);

        border: 1px solid var(--line);
        border-radius: 6px;
        outline: 0;

      }

      }

        background: var(--hover);
        color: var(--text);
      }
      .br-bar {
        gap: 4px;
      }

        stroke-width: 2;
        stroke-linecap: round;
        display: block;
      }
      .br-new {

        height: 24px;
        display: inline-grid;

      .br-tab {
        padding: 6px 6px 6px 12px;
      }

      .br-page {

      .br-tabs {

      .open-btn {

      .detail-foot {

      .proj-strip {
        flex-wrap: wrap;
        overflow: visible;
      }
      .proj-card {

        max-width: 340px;

        border-style: dashed;

      .proj-strip {
        flex-wrap: nowrap !important;

        overflow-y: hidden;
        scroll-snap-type: x proximity;
        scrollbar-width: none;
        padding-bottom: 2px;
      }
      .proj-strip::-webkit-scrollbar {
        display: none;
      }
      .proj-strip .proj-card {
        flex: 0 0 auto;

        max-width: none;
        scroll-snap-align: start;
      }
      .proj-strip .proj-card:first-child {
        width: 170px;
      }
      .proj-strip.fade-r {
        -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 48px), transparent);
        mask-image: linear-gradient(to right, #000 calc(100% - 48px), transparent);
      }
      .proj-strip.fade-l {
        -webkit-mask-image: linear-gradient(to left, #000 calc(100% - 48px), transparent);
        mask-image: linear-gradient(to left, #000 calc(100% - 48px), transparent);
      }
      .proj-strip.fade-l.fade-r {
        -webkit-mask-image: linear-gradient(
          to right,
          transparent,
          #000 40px,
          #000 calc(100% - 48px),
          transparent
        );
        mask-image: linear-gradient(
          to right,
          transparent,
          #000 40px,
          #000 calc(100% - 48px),
          transparent
        );

      .with-strip .activity {
        max-height: 920px;

        display: none;
      }
      .popwin {

        height: 36px;
        padding: 0 6px 0 12px;

        background: var(--bg);

        display: inline-flex;
        gap: 6px;
      }
      .pw-lights i {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--line);
      }
      .pw-title {
        flex: 1;
        text-align: center;
        font-size: 12px;
        color: var(--secondary);
      }
      .pw-bar .icon-btn {
        width: 24px;
        height: 24px;
      }
      .pw-bar .icon-btn svg {
        width: 14px;
        height: 14px;
      }
      .pw-body {
        flex: 1;
        min-height: 0;
        overflow: auto;
        display: flex;
        flex-direction: column;
      }
      .pw-body .cg,
      .pw-body .br,
      .pw-body .mr {
        flex: 1;
        min-height: 0;
      }
      .br-th-tools {
        display: inline-flex;
        align-items: center;
        gap: 2px;
      }
      /*files*/
      .fv {
        display: grid;
        grid-template-columns: minmax(150px, 230px) minmax(0, 1fr);
        flex: 1;
        min-height: 0;
      }
      .fv-tree {
        display: flex;
        flex-direction: column;
        border-right: 1px solid var(--line);
        min-height: 0;
      }
      .fv-th {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 36px;
        padding: 0 6px 0 12px;
        font-size: 12px;
        font-weight: 600;
        color: var(--secondary);
        border-bottom: 1px solid var(--line);
        flex: none;
      }
      .fv-th .icon-btn {
        width: 24px;
        height: 24px;
      }
      .fv-th .icon-btn svg {
        width: 14px;
        height: 14px;
      }
      .fv-list {
        flex: 1;
        overflow: auto;
        padding: 4px 0;
      }
      .ft-row {
        display: flex;
        align-items: center;
        gap: 4px;
        width: 100%;
        border: 0;
        background: transparent;
        text-align: left;
        padding: 2px 8px;
        font-size: 12px;
        color: var(--secondary);
        white-space: nowrap;
        overflow: hidden;
        line-height: 22px;
      }
      .ft-row:hover {
        background: var(--hover);
      }
      .ft-row.sel {
        background: var(--selected);
        color: var(--text);
      }
      .ft-row .nm {
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .tw-wrap {
        width: 12px;
        height: 12px;
        flex: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: var(--muted);
        transition: transform 0.1s;
      }
      .tw-wrap.ex {
        transform: rotate(90deg);
      }
      .tw {
        width: 12px;
        height: 12px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .fi {
        width: 16px;
        height: 16px;
        flex: none;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        color: var(--muted);
      }
      .fv-view {
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
      }
      .fv-bar {
        display: flex;
        align-items: center;
        gap: 4px;
        height: 36px;
        padding: 0 8px;
        border-bottom: 1px solid var(--line);
        flex: none;
      }
      .fv-bar button {
        border: 0;
        background: transparent;
        font-size: 12px;
        padding: 2px 8px;
        border-radius: 6px;
        color: var(--secondary);
      }
      .fv-bar button:hover {
        background: var(--hover);
      }
      .fv-bar button.is-active {
        background: var(--selected);
        color: var(--text);
      }
      .fv-path {
        margin-left: auto;
        font-size: 11px;
        color: var(--muted);
        font-family: var(--mono);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .fv-code {
        flex: 1;
        overflow: auto;
        font: 12px/1.6 var(--mono);
        padding: 6px 0;
        background: color-mix(in srgb, var(--bg) 70%, #000);
      }
      .fv-prev {
        padding: 16px;
        color: var(--secondary);
        font-size: 13px;
      }
      .fv-prev .muted {
        color: var(--muted);
      }
      .fv-tools {
        display: inline-flex;
        align-items: center;
        gap: 0;
      }
      .fv-th {
        padding-right: 4px;
      }
      .fv-th span:first-child {
        font-size: 12px;
      }
      /*road-doc*/
      .mr-view .rd-head h3 {
        outline: 0;
        border-radius: 4px;
      }
      .mr-view .rd-head h3:focus {
        box-shadow: 0 0 0 1px var(--line);
      }
      .rd-meta {
        color: var(--muted);
        font-size: 11px;
        margin-bottom: 10px;
      }
      .rd-modes {
        display: flex;
        gap: 4px;
        margin-bottom: 10px;
        align-items: center;
      }
      .rd-modes button {
        border: 0;
        background: transparent;
        font-size: 12px;
        padding: 2px 8px;
        border-radius: 6px;
        color: var(--secondary);
      }
      .rd-modes button:hover {
        background: var(--hover);
      }
      .rd-modes button.is-active {
        background: var(--selected);
        color: var(--text);
      }
      .rd-modes .fmtbtn {
        margin-left: auto;
      }
      .rd-fmt {
        display: flex;
        gap: 2px;
        padding: 3px;
        margin-bottom: 8px;
        border: 1px solid var(--line);
        border-radius: 8px;
        width: fit-content;
      }
      .rd-fmt button {
        border: 0;
        background: transparent;
        color: var(--secondary);
        width: 26px;
        height: 24px;
        border-radius: 5px;
        font-size: 13px;
      }
      .rd-fmt button:hover {
        background: var(--hover);
        color: var(--text);
      }
      .rd-page {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--bg);
        padding: 14px 18px;
        min-height: 180px;
        font-size: 13px;
        line-height: 1.55;
        color: var(--text);
        outline: 0;
      }
      .rd-page:focus {
        border-color: var(--accent);
      }
      .rd-page h2 {
        font: 600 13px var(--font);
        margin: 12px 0 4px;
        color: var(--text);
      }
      .rd-page h2:first-child {
        margin-top: 0;
      }
      .rd-page p {
        margin: 0 0 6px;
        color: var(--secondary);
      }
      .rd-page ul {
        margin: 0 0 6px;
        padding-left: 18px;
        color: var(--secondary);
      }
      .rd-quick {
        width: 100%;
        min-height: 120px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--bg);
        color: var(--text);
        font: inherit;
        font-size: 13px;
        padding: 10px 12px;
        outline: 0;
        resize: vertical;
      }
      .rd-quick:focus {
        border-color: var(--accent);
      }
      .rd-details {
        margin-top: 10px;
        font-size: 12px;
        color: var(--secondary);
      }
      .rd-details summary {
        cursor: pointer;
        padding: 2px 0;
      }
      .rd-dgrid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-top: 8px;
      }
      .rd-dgrid label {
        display: flex;
        flex-direction: column;
        gap: 3px;
        font-size: 11px;
        color: var(--muted);
      }
      .rd-dgrid .wide {
        grid-column: 1/-1;
      }
      .rd-dgrid select,
      .rd-dgrid input {
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--bg);
        color: var(--text);
        font: inherit;
        font-size: 12px;
        padding: 3px 6px;
      }
      .rp-btn.primary {
        background: var(--accent-fill);
        border-color: var(--accent-fill);
        color: var(--on-accent);
      }
      .rp-btn.primary:hover {
        background: var(--accent-fill-hover);
      }
      .rd-linked {
        margin-top: 16px;
        border-top: 1px solid var(--line-subtle);
        padding-top: 8px;
      }
      .rd-linked h4 {
        margin: 0 0 6px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .rd-att {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 6px 0;
        font-size: 12px;
      }
      .rd-att .t {
        display: block;
        color: var(--text);
        font-weight: 600;
      }
      .rd-att .s {
        display: block;
        color: var(--muted);
        font-size: 11px;
      }
      .rd-prev {
        margin-top: 4px;
        color: var(--secondary);
        font-size: 12px;
      }
      .rd-prev summary {
        cursor: pointer;
      }
      .mr-view {
        padding-bottom: 24px;
      }
      /*light-fixes*/
      :root[data-theme='light'] .cg-diff,
      :root[data-theme='light'] .fv-code {
        background: var(--surface);
      }
      :root[data-theme='light'] .cg-ln.add {
        background: color-mix(in srgb, var(--teal) 14%, transparent);
      }
      :root[data-theme='light'] .cg-ln.del {
        background: color-mix(in srgb, var(--pr-closed) 14%, transparent);
      }
      :root[data-theme='light'] .cg-diff .hd {
        background: var(--panel);
      }
      /*narrow-panels*/
      .rp-body {
        container: rpbody/inline-size;
      }
      .pw-body {
        container: rpbody/inline-size;
      }
      @container rpbody (max-width:540px) {
        .mr,
        .fv,
        .cg {
          grid-template-columns: minmax(0, 1fr) !important;
          grid-template-rows: minmax(110px, 38%) minmax(0, 1fr) !important;
        }
        .mr-list,
        .fv-tree,
        .cg-list {
          border-right: 0 !important;
          border-bottom: 1px solid var(--line);
          min-height: 0;
        }
        .cg-diff,
        .fv-view,
        .mr-view {
          min-height: 0;
        }
        .br {
          grid-template-columns: minmax(0, 1fr) !important;
          grid-template-rows: auto minmax(0, 1fr) !important;
        }
        .br-tabs {
          border-right: 0 !important;
          border-bottom: 1px solid var(--line);
          max-height: 132px;
        }
        .br-th {
          height: 32px;
        }
        .rd-dgrid {
          grid-template-columns: 1fr;
        }
      }

      .autoclock {
        width: 12px;
        height: 12px;
        stroke: currentColor;
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        margin-left: 6px;
        vertical-align: -1px;
        opacity: 0.6;
      }
      .pill {
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 0 6px;
        font-size: 11px;
        color: var(--muted);
        margin-left: 6px;
        white-space: nowrap;
        font-weight: 400;
      }
      .tb-fold-n {
        color: var(--muted);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }
      .fold-kids {
        margin-left: 18px;
      }
      .tb-fold .tb-name,
      .activity-row.fold .name {
        font-weight: 400;
      }
      .activity-row.fold .glyph,
      .tb-fold .tb-glyph {
        color: var(--muted);
      }

      .small-chip svg.gl {
        flex: none;
      }
      .small-chip.locked {
        cursor: default;
      }
      .small-chip.locked:hover {
        background: transparent;
        color: inherit;
      }
      .bp {
        position: fixed;
        z-index: 60;
        min-width: 220px;
        max-width: 320px;
        display: flex;
        flex-direction: column;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: var(--shadow);
        padding: 4px 0;
      }
      .bp-filter {
        margin: 4px 8px;
        background: var(--surface);
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 6px;
        font: inherit;
        font-size: 13px;
        padding: 4px 8px;
        outline: 2px solid transparent;
        outline-offset: 1px;
      }
      .bp-filter:focus-visible {
        outline: 2px solid var(--accent);
      }
      .bp-list {
        overflow-y: auto;
        max-height: 240px;
      }
      .bp-opt {
        display: flex;
        align-items: center;
        width: 100%;
        padding: 5px 12px;
        border: 0;
        background: transparent;
        color: var(--text);
        font: inherit;
        font-size: 13px;
        text-align: left;
        cursor: pointer;
      }
      .bp-opt:hover,
      .bp-opt.act {
        background: var(--hover);
      }
      .bp-opt.sel {
        color: var(--accent);
        font-weight: 600;
      }
      .bp-opt .l {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .bp-badge {
        flex: none;
        margin-left: 6px;
        border: 1px solid var(--line);
        border-radius: 3px;
        padding: 0 4px;
        font-size: 9px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--muted);
        font-weight: 400;
      }
      .bp-empty {
        padding: 8px 12px;
        color: var(--muted);
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="topbar">

        >

      <aside class="sidebar" aria-label="Threads">

                  workspace <svg class="gl sm" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6" /></svg>

        w.style.top = 80 + n * 28 + 'px'
        rpWide = false
        document.querySelector('.app').classList.remove('rp-wide')
        setRP(mode)
      }
      const I_X = '<svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>'
      function setRPWire() {
        const bd = document.getElementById('rpBody')
        bd.querySelectorAll('.cg-file').forEach(function (b) {
          b.addEventListener('click', function () {
            chSel = b.dataset.f
            bd.innerHTML = chBuild()
            setRPWire()
          })
        })
      }
      function setRP(mode) {
        rpMode = mode === rpMode ? null : mode
        if (!rpMode) {
          rpWide = false
          document.querySelector('.app').classList.remove('rp-wide')
        }
        const app = document.querySelector('.app'),
          rp = document.getElementById('rpanel')
        app.classList.toggle('rp-open', !!rpMode)
        rp.hidden = !rpMode
        document.querySelectorAll('[data-rp]').forEach(function (b) {
          b.setAttribute('aria-pressed', String(b.dataset.rp === rpMode))
        })
        document
          .getElementById('rpanel')
          .classList.toggle('nohead', rpMode === 'browser' || rpMode === 'explorer')
        if (rpMode) {
          document.getElementById('rpTitle').textContent = RP[rpMode][0]
          document.getElementById('rpTools').innerHTML = (RP_TOOLS[rpMode] || '') + rpCommon()
          rpWireCommon()
          const bd = document.getElementById('rpBody')
          bd.innerHTML =
            RP[rpMode][1] === '__CHANGES__'
              ? chBuild()
              : RP[rpMode][1] === '__BROWSER__'
                ? brBuild()
                : RP[rpMode][1] === '__FILES__'
                  ? filesBuild()
                  : RP[rpMode][1] === '__MEM__'
                    ? memBuild()
                    : RP[rpMode][1] === '__ROAD__'
                      ? roadBuild()
                      : RP[rpMode][1]
          bd.style.overflow =
            rpMode === 'changes' ||
            rpMode === 'browser' ||
            rpMode === 'memories' ||
            rpMode === 'roadmap' ||
            rpMode === 'explorer'
              ? 'hidden'
              : 'auto'
          if (rpMode === 'explorer') filesWire()
          if (rpMode === 'browser') brWire()
          if (rpMode === 'memories') memWire()
          if (rpMode === 'roadmap') roadWire()
          bd.querySelectorAll('.cg-file').forEach(function (b) {
            b.addEventListener('click', function () {
              chSel = b.dataset.f
              bd.innerHTML = chBuild()
              setRPWire()
            })
          })
        }
        setTimeout(function () {
          renderSide()
        }, 0)
      }
      document.querySelectorAll('.topbar [data-rp]').forEach(function (b) {
        const c = b.cloneNode(true)
        c.className = 'pb'
        document.getElementById('pbar').appendChild(c)
      })
      document.querySelectorAll('[data-rp]').forEach(function (b) {
        b.addEventListener('click', function () {
          setRP(b.dataset.rp)
        })
      })
      applyPos()
      document.getElementById('rpClose').addEventListener('click', function () {
        setRP(rpMode)
      })
      input.focus()
      updateWheel(6, true)
      selected = idx('attention')[0] ?? 0
      /*unread*/ render()
      renderSide()
      updateBell()
      {
        const np = +new URLSearchParams(location.search).get('projects')
        const nm = [
          'design-system',
          'infra',
          'mobile-app',
          'api-gateway',
          'billing',
          'analytics',
          'website',
          'sdk',
          'payments',
          'search',
          'auth',
          'docs',
        ]
        const nq = +new URLSearchParams(location.search).get('quiet') || 0
        for (let k = 0; k < np + nq; k++) {
          const name = nm[k % 12] + (k >= 12 ? '-' + k : '')
          layout.push({ t: 'p', n: name })
          if (k < np)
            threads.push({
              title: 'Review ' + name + ' change',
              project: name,
              kind: 'attention',
              need: 'approval',
              state: 'Needs you',
              activity: 'Approve a command?',
              age: k + 1 + 'm',
              longAge: 'started ' + (k + 1) + ' minutes ago',
              created: k,
              updated: k,
              files: 0,
              pr: null,
              out: '$ pnpm install',
            })
        }
        if (np + nq) {
          render()
          renderSide()
          updateBell()
        }
      }
      {
        const q = new URLSearchParams(location.search)
        if (q.get('open')) {
          const ix = threads.findIndex(function (t) {
            return t.title.indexOf(q.get('open')) >= 0
          })
          if (ix >= 0) showThread(ix)
        }
        if (q.get('wheel') === 'open') document.getElementById('cwPop').hidden = false
      }
      {
        const pm = new URLSearchParams(location.search).get('panel')
        if (pm && RP[pm]) setRP(pm)
      }
      {
        const q0 = new URLSearchParams(location.search)
        if (q0.get('theme') === 'light') document.documentElement.dataset.theme = 'light'
      }
      {
        const q = new URLSearchParams(location.search)
        if (q.get('rw')) __rz.setRight(+q.get('rw'))
        if (q.get('wide') === '1' && rpMode) rpToggleWide()
        if (q.get('rh')) __rz.setBottom(+q.get('rh'))
        if (q.get('sw')) __rz.setSide(+q.get('sw'))
        if (q.get('sw') || q.get('rw') || q.get('rh')) {
          try {
            localStorage.removeItem('sw')
            localStorage.removeItem('rw')
            localStorage.removeItem('rh')
          } catch (e) {}
        }
      }
      if (new URLSearchParams(location.search).get('demo') === 'drag') {
        applyDrop(
          { kind: 'project', id: 'docs-site' },
          { kind: 'project', id: 'workspace', pos: 'before' },
        )
        applyDrop({ kind: 'thread', id: '5' }, { kind: 'thread', id: '0', pos: 'before' })
        layout.unshift({ t: 'g', id: ++gid, name: 'Archive', open: true, kids: [] })
        applyDrop(
          { kind: 'project', id: 'agent-pane' },
          { kind: 'group', id: String(gid), pos: 'into' },
        )
      }

      /*test-hook*/ ;(function () {
        const q = new URLSearchParams(location.search).get('click')
        if (!q) return
        const steps = q.split('|')
        let i = 0
        ;(function next() {
          if (i >= steps.length) return
          const st = steps[i++]
          const m = st.match(/^(.*?)(?:@(\d+))?$/)
          const els = document.querySelectorAll(m[1])
          const el = els[m[2] ? +m[2] : 0]
          if (!el) {
            document.title = 'MISS ' + st
            return
          }
          el.click()
          setTimeout(next, 60)
        })()
      })()
    </script>
  </body>
</html>
