<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Copse side chats – many instances</title>
    <style>
      :root {
        color-scheme: dark;
        --tint-hue: #244c25;
        --tint-amount: 4%;
        --tint-light: 7.6%;
        --bg-base: color-mix(in srgb, var(--tint-hue) var(--tint-amount), #1e1e1e);
        --bg-elevated: color-mix(in srgb, var(--tint-hue) var(--tint-amount), #252526);
        --bg-hover: color-mix(in srgb, var(--tint-hue) var(--tint-amount), #2a2d2e);
        --bg-muted: color-mix(in srgb, var(--tint-hue) var(--tint-amount), #2d2d2d);
        --bg-subtle: color-mix(in srgb, var(--tint-hue) var(--tint-amount), #232324);
        --text-primary: #d4d4d4;
        --text-secondary: #a6a6a6;
        --text-muted: #808080;
        --border: #414141;
        --border-subtle: #333;
        --border-strong: #565656;
        --accent-color: #ff93d0;
        --accent: var(--accent-color);
        --accent-fill: var(--accent-color);
        --accent-soft: color-mix(in srgb, var(--accent) 14%, var(--bg-elevated));
        --bg-selected: color-mix(in srgb, var(--accent) 20%, var(--bg-elevated));
        --text-on-accent: #444;
        --link: color-mix(in srgb, var(--accent) 65%, white);
        --error: #f48771;
        --danger: #f14c4c;
        --success: #4ec9b0;
        --warning: #cca700;
        --info: #6fb3d9;
        --important: #9d7cf4;
        --change-added: var(--success);
        --change-deleted: var(--error);
        --diff-insert: color-mix(in srgb, var(--success) 20%, transparent);
        --diff-delete: color-mix(in srgb, var(--danger) 26%, transparent);
        --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.2);
        --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.35);
        --bg: var(--bg-elevated);
        --surface: var(--bg-base);
        --surface2: var(--bg-muted);
        --line: var(--border-subtle);
        --text: var(--text-primary);
        --muted: var(--text-muted);
        --side: var(--important);
        --side-soft: color-mix(in srgb, var(--important) 12%, var(--bg-elevated));
        --code: var(--bg-subtle);
        --shadow: var(--shadow-md);
        --radius-sm: 4px;
        --radius: 6px;
        --radius-lg: 8px;
        --band: 36px;
        --titlebar-h: 40px;
        --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
        --sans: 'Pliant', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      :root[data-theme='light'] {
        color-scheme: light;
        --bg-base: color-mix(in srgb, var(--tint-hue) var(--tint-light), #fff);
        --bg-elevated: color-mix(in srgb, var(--tint-hue) var(--tint-light), #f3f3f3);
        --bg-hover: color-mix(in srgb, var(--tint-hue) var(--tint-light), #e8e8e8);
        --bg-muted: color-mix(in srgb, var(--tint-hue) var(--tint-light), #ececec);
        --bg-subtle: color-mix(in srgb, var(--tint-hue) var(--tint-light), #f7f7f7);
        --text-primary: #333;
        --text-secondary: #5f5f5f;
        --text-muted: #767676;
        --border: #d4d4d4;
        --border-subtle: #e4e4e4;
        --border-strong: #ababab;
        --accent: color-mix(in srgb, var(--accent-color) 30%, black);
        --accent-soft: color-mix(in srgb, var(--accent) 10%, var(--bg-elevated));
        --bg-selected: color-mix(in srgb, var(--accent-fill) 22%, var(--bg-elevated));
        --link: var(--accent);
        --error: #cf222e;
        --danger: #cf222e;
        --success: #1a7f37;
        --warning: #9a6700;
        --info: #0969da;
        --important: #8250df;
        --change-added: color-mix(in srgb, var(--success) 80%, black);
        --change-deleted: color-mix(in srgb, var(--error) 80%, black);
        --diff-insert: color-mix(in srgb, var(--success) 16%, transparent);
        --diff-delete: color-mix(in srgb, var(--danger) 14%, transparent);
        --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.08);
        --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.14);
      }
      @media (prefers-color-scheme: light) {
        :root:not([data-theme='dark']) {
          color-scheme: light;
          --bg-base: color-mix(in srgb, var(--tint-hue) var(--tint-light), #fff);
          --bg-elevated: color-mix(in srgb, var(--tint-hue) var(--tint-light), #f3f3f3);
          --bg-hover: color-mix(in srgb, var(--tint-hue) var(--tint-light), #e8e8e8);
          --bg-muted: color-mix(in srgb, var(--tint-hue) var(--tint-light), #ececec);
          --bg-subtle: color-mix(in srgb, var(--tint-hue) var(--tint-light), #f7f7f7);
          --text-primary: #333;
          --text-secondary: #5f5f5f;
          --text-muted: #767676;
          --border: #d4d4d4;
          --border-subtle: #e4e4e4;
          --border-strong: #ababab;
          --accent: color-mix(in srgb, var(--accent-color) 30%, black);
          --accent-soft: color-mix(in srgb, var(--accent) 10%, var(--bg-elevated));
          --bg-selected: color-mix(in srgb, var(--accent-fill) 22%, var(--bg-elevated));
          --link: var(--accent);
          --error: #cf222e;
          --danger: #cf222e;
          --success: #1a7f37;
          --warning: #9a6700;
          --info: #0969da;
          --important: #8250df;
          --change-added: color-mix(in srgb, var(--success) 80%, black);
          --change-deleted: color-mix(in srgb, var(--error) 80%, black);
          --diff-insert: color-mix(in srgb, var(--success) 16%, transparent);
          --diff-delete: color-mix(in srgb, var(--danger) 14%, transparent);
          --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.08);
          --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.14);
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        font: 13px/1.45 var(--sans);
        background: var(--bg);
        color: var(--text);
        display: flex;
        flex-direction: column;
      }
      button,
      select,
      input {
        font: inherit;
        color: inherit;
      }
      button {
        background: none;
        border: 0;
        cursor: pointer;
        padding: 0;
        text-align: left;
      }
      svg {
        width: 14px;
        height: 14px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex: none;
      }
      .top {
        padding: 8px 14px;
        border-bottom: 1px solid var(--line);
        background: var(--surface);
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }
      .top h1 {
        font-size: 13px;
        margin: 0;
        font-weight: 600;
      }
      .seg {
        display: flex;
        gap: 2px;
        background: var(--surface2);
        padding: 2px;
        border-radius: 8px;
        flex-wrap: wrap;
      }
      .seg button {
        padding: 3px 9px;
        border-radius: 6px;
        color: var(--muted);
        text-align: center;
      }
      .seg button.on {
        background: var(--bg-selected);
        color: var(--text);
      }
      .seg.mini button {
        padding: 1px 8px;
        display: flex;
        gap: 4px;
        align-items: center;
        font-size: 12px;
      }
      .seg-l {
        font-size: 11px;
        color: var(--muted);
      }
      .tbtn {
        color: var(--muted);
        padding: 3px 8px;
        border: 1px solid var(--line);
        border-radius: 6px;
      }
      .tbtn.on {
        color: var(--text);
        background: var(--surface2);
      }
      .note {
        padding: 8px 14px;
        display: grid;
        grid-template-columns: 1.2fr 1.4fr 1fr;
        gap: 16px;
        border-bottom: 1px solid var(--line);
        font-size: 12px;
      }
      .note h4 {
        margin: 0 0 2px;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--muted);
      }
      .note p {
        margin: 0 0 3px;
      }
      .note ol {
        margin: 0;
        padding-left: 16px;
      }
      .note li {
        margin-bottom: 1px;
      }
      .con h4 {
        color: var(--warning);
      }
      .rules h4 {
        color: var(--text-secondary);
      }
      @media (max-width: 900px) {
        .note {
          grid-template-columns: 1fr;
        }
      }
      .stage {
        flex: 1;
        min-height: 0;
        padding: 12px 12px 6px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        overflow: auto;
      }
      #status {
        font-size: 12px;
        color: var(--muted);
        min-height: 20px;
        text-align: center;
        flex: none;
      }
      #status b {
        color: var(--text);
        font-weight: 600;
      }

      /* window = titlebar + app */
      .win {
        --pw: 380px;
        flex: 1;
        min-height: 0;
        width: 100%;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius-lg);
        overflow: hidden;
      }
      .win.sz-M {
        max-width: 960px;
        --pw: 320px;
      }
      .win.sz-S {
        max-width: 720px;
        --pw: 280px;
      }
      .win.sz-XS {
        max-width: 520px;
      }
      .win.sz-T {
        max-width: 760px;
        --pw: 300px;
      }
      .win.short {
        flex: none;
        height: 520px;
      }
      .titlebar {
        height: var(--titlebar-h);
        flex: none;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 10px 0 14px;
        background: var(--bg);
        border-bottom: 1px solid var(--line);
        user-select: none;
      }
      .lights {
        display: flex;
        gap: 8px;
        width: 52px;
        margin-right: 12px;
        flex: none;
      }
      .lights i {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        display: block;
        opacity: 0.92;
      }
      .titlebar .sp {
        flex: 1;
      }
      .tb-btn {
        display: flex;
        gap: 5px;
        align-items: center;
        padding: 4px 8px;
        border-radius: var(--radius);
        color: var(--text-secondary);
        font-size: 12px;
      }
      .tb-btn:hover {
        background: var(--bg-hover);
        color: var(--text);
      }
      .tb-btn.on {
        color: var(--text);
      }
      .app {
        flex: 1;
        min-height: 0;
        display: flex;
        position: relative;
        overflow: hidden;
      }
      .sidebar {
        width: 178px;
        flex: none;
        background: var(--bg);
        border-right: 1px solid var(--line);
        padding: 10px 8px;
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
      }
      .sz-M .sidebar {
        width: 150px;
      }
      .sz-S .sidebar {
        width: 46px;
        padding: 10px 4px;
        align-items: center;
      }
      .nosb .sidebar {
        display: none;
      }
      .sz-S .tx,
      .sz-S .lbl,
      .sz-S .tgl span {
        display: none;
      }
      .sidebar .logo {
        font-weight: 700;
        padding: 2px 8px 8px;
      }
      .sz-S .logo {
        padding: 2px 0 8px;
      }
      .sidebar .item {
        padding: 5px 8px;
        border-radius: 6px;
        color: var(--muted);
        display: flex;
        gap: 6px;
        align-items: center;
        width: 100%;
        min-width: 0;
      }
      .sidebar .item .tx {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        flex: 1;
      }
      .sidebar .item .ab {
        display: none;
        width: 20px;
        text-align: center;
        font-weight: 600;
      }
      .sz-S .item .ab {
        display: block;
      }
      .sidebar .item.on {
        background: var(--bg-selected);
        color: var(--text);
      }
      .sidebar .sub {
        padding: 3px 8px 3px 22px;
        color: var(--muted);
        font-size: 12px;
        display: flex;
        gap: 6px;
        align-items: center;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        width: 100%;
      }
      .sz-S .sub {
        display: none;
      }
      .sidebar .sub svg {
        color: var(--side);
        width: 12px;
        height: 12px;
      }
      .sidebar .lbl {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
        padding: 10px 8px 3px;
      }
      .sidebar .tgl {
        margin-top: auto;
        font-size: 11px;
        color: var(--muted);
        padding: 6px 8px;
        display: flex;
        gap: 6px;
        align-items: center;
        cursor: pointer;
      }
      .main {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      .mhead {
        padding: 6px 14px;
        border-bottom: 1px solid var(--line);
        display: flex;
        gap: 8px;
        align-items: center;
        min-width: 0;
      }
      .mhead .t {
        font-weight: 600;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .mhead .sp {
        flex: 1;
      }
      .mhead .xs-only {
        display: none;
      }
      .nosb .mhead .xs-only {
        display: flex;
      }
      .pill {
        font-size: 11px;
        padding: 2px 8px;
        border-radius: 99px;
        background: var(--surface2);
        color: var(--muted);
        white-space: nowrap;
      }
      .chat {
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding: 14px 16px;
      }
      .msg {
        position: relative;
        margin: 0 auto 14px;
        max-width: 620px;
      }
      .msg .who {
        font-size: 11px;
        color: var(--muted);
        margin-bottom: 2px;
      }
      .msg.user .body {
        background: var(--surface2);
        padding: 7px 11px;
        border-radius: 10px;
        display: inline-block;
      }
      .msg .body p {
        margin: 0 0 6px;
      }
      .msg .acts {
        position: absolute;
        top: -4px;
        right: 0;
        opacity: 0;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 6px;
      }
      .msg:hover .acts {
        opacity: 1;
      }
      .acts button {
        padding: 3px 7px;
        display: flex;
        gap: 4px;
        align-items: center;
        color: var(--muted);
        font-size: 12px;
      }
      .acts button:hover {
        color: var(--text);
      }
      .tool {
        border: 1px solid var(--line);
        border-radius: 7px;
        padding: 5px 9px;
        margin: 4px 0;
        font-family: var(--mono);
        font-size: 11.5px;
        color: var(--muted);
        display: flex;
        gap: 6px;
        align-items: center;
        background: var(--code);
        width: 100%;
      }
      .tool b {
        color: var(--text);
        font-weight: 500;
      }
      .tool.op:hover {
        border-color: var(--border-strong);
      }
      .tool .go {
        margin-left: auto;
        color: var(--link);
        font-family: var(--sans);
      }
      .ops {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin: 6px 0;
      }
      .op {
        display: inline-flex;
        gap: 5px;
        align-items: center;
        border: 1px solid var(--line);
        border-radius: 99px;
        padding: 2px 10px;
        font-size: 12px;
        background: var(--surface);
      }
      .op:hover {
        border-color: var(--border-strong);
        background: var(--bg-hover);
      }
      .diff {
        font-family: var(--mono);
        font-size: 11.5px;
        background: var(--code);
        border: 1px solid var(--line);
        border-radius: 7px;
        padding: 6px 0;
        margin: 6px 0;
        overflow: auto;
      }
      .diff div {
        padding: 0 10px;
        white-space: pre;
      }
      .diff .a,
      .dl.a {
        background: var(--diff-insert);
      }
      .diff .d,
      .dl.d {
        background: var(--diff-delete);
      }
      code {
        font-family: var(--mono);
        font-size: 12px;
        background: var(--code);
        padding: 0 4px;
        border-radius: 4px;
      }
      .composer {
        border-top: 1px solid var(--line);
        padding: 8px 14px;
      }
      .composer .box {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 7px 10px;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .btn {
        display: inline-flex;
        gap: 5px;
        align-items: center;
        padding: 3px 10px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: transparent;
      }
      .btn:hover {
        background: var(--bg-hover);
      }
      .btn.ghost {
        border-color: transparent;
        background: none;
        color: var(--muted);
      }

      /* PR surface */
      .surface {
        flex: 1;
        min-height: 0;
        overflow: auto;
        display: flex;
        flex-direction: column;
      }
      .sf-h {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 14px;
        border-bottom: 1px solid var(--line);
        flex-wrap: wrap;
      }
      .sf-h b {
        margin-right: 4px;
      }
      .chip {
        font-size: 12px;
        padding: 1px 10px;
        border-radius: 999px;
        border: 1px solid var(--border);
        color: var(--text-secondary);
      }
      .chip.on {
        background: var(--bg-selected);
        color: var(--text);
        border-color: transparent;
      }
      .grp-h {
        position: sticky;
        top: 0;
        background: var(--bg);
        padding: 4px 14px;
        font-size: 11px;
        color: var(--muted);
        border-bottom: 1px solid var(--line);
        z-index: 1;
      }
      .prrow {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        gap: 10px;
        align-items: center;
        padding: 8px 14px;
        border-bottom: 1px solid var(--line);
        width: 100%;
      }
      .prrow:hover {
        background: var(--bg-hover);
      }
      .prrow.sel {
        background: var(--bg-selected);
      }
      .prm {
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      .prm .ttl {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .prm .repo {
        font-size: 11px;
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .prr {
        display: flex;
        gap: 10px;
        font-size: 11px;
        color: var(--muted);
        align-items: center;
      }
      .prst {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        display: block;
        border: 2px solid var(--success);
      }
      .prst.merged {
        border-color: var(--important);
        background: var(--important);
      }
      .prst.draft {
        border-color: var(--text-muted);
      }
      .chk.pass {
        color: var(--success);
      }
      .chk.fail {
        color: var(--error);
      }
      .chk.pending {
        color: var(--warning);
      }
      .pr-top {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        padding: 10px 12px 0;
      }
      .pr-top b {
        font-size: 14px;
      }
      .pr-meta {
        padding: 2px 12px 8px;
        font-size: 11px;
        color: var(--muted);
      }
      .pr-badge {
        font-size: 11px;
        padding: 0 8px;
        border-radius: 999px;
        border: 1px solid var(--border);
        color: var(--text-secondary);
        flex: none;
        margin-top: 2px;
      }
      .pr-badge.merged {
        color: var(--important);
        border-color: var(--important);
      }
      .chkrow {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 3px 0;
        font-size: 12px;
      }
      .mock {
        font-size: 11px;
        color: var(--muted);
        margin-top: 10px;
      }

      .right {
        width: var(--pw);
        flex: none;
        border-left: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      .panel-multi {
        width: var(--pw);
        flex: none;
        border-left: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      .win.sz-XS:not(.stacked) .right,
      .win.sz-XS:not(.stacked) .panel-multi {
        flex: 1;
        width: auto;
      }
      .win.sz-XS:not(.stacked):not(.hasopen) .right {
        display: none;
      }
      .win.sz-XS:not(.stacked).hasopen .main {
        display: none;
      }
      .back {
        display: none;
        padding: 6px 8px;
        border-bottom: 1px solid var(--line);
        background: var(--bg);
      }
      .win.sz-XS:not(.stacked) .back {
        display: flex;
      }
      .mhead .xsp {
        display: none;
      }

            build()
          }
          return
        }
        if (el.tagName === 'SELECT' || (el.tagName === 'INPUT' && el.dataset.act !== 'showSide'))
          return
        const a = el.dataset.act,
          id = el.dataset.id,
          k = el.dataset.kind,
          t = T()
        let skip = false
        if (a === 'undo') {
          if (S.undo) {
            Object.assign(T(), JSON.parse(S.undo))
            S.undo = null
            status('Undone.')
          }
          document.querySelectorAll('.toast').forEach((x) => x.remove())
        } else if (a === 'strat') {
          S.strat = id
          S.menu = null
          if (id === 'tabs') t.open = t.open.slice(-1)
        } else if (a === 'size') {
          S.size = id
          S.dockPx = null
          S.menu = null
        } else if (a === 'pos') {
          S.pos = id
          S.dockPx = null
          S.menu = null
          status(
            id === 'auto'
              ? 'Panel position: Auto — stacks below chat only in tall windows.'
              : id === 'side'
                ? 'Panel position: always right of chat.'
                : 'Panel position: always below chat.',
          )
        } else if (a === 'sidebar') {
          S.sbHidden = !S.sbHidden
          S.menu = null
        } else if (a === 'layoutmenu')
          S.menu =
            S.menu && S.menu.mode === 'layout' ? null : { mode: 'layout', anchor: anchorOf(el) }
        else if (a === 'panelToggle') {
          if (t.open.length) t.open = []
          else {
            const x = item(t.active) || alive()[0]
            if (x) exec({ id: x.id, from: 'menu' })
          }
        } else if (a === 'surface') {
          t.surface = id
          S.menu = null
          status(
            id === 'prs'
              ? 'PR list shown in the main area — chat is one click away. Picking a PR opens just that PR in the panel.'
              : 'Back to chat.',
          )
        } else if (a === 'prfilter') S.prFilter = id
        else if (a === 'showSide') S.showSide = el.checked
        else if (a === 'thread') {
          S.cur = id
          S.menu = null
          const n = T().open.length
          status(
            `Restored this thread’s layout: ${n} panel${n === 1 ? '' : 's'} open${T().surface === 'prs' ? ', PR list shown' : ''}.`,
          )
        } else if (a === 'threads')
          S.menu = S.menu ? null : { mode: 'threads', anchor: anchorOf(el) }
        else if (a === 'showPanel') {
          const x = item(t.active) || alive()[0]
          if (x) exec({ id: x.id, from: 'menu' })
        } else if (a === 'hideAll') t.open = []
        else if (a === 'rail') {
          S.menu = null
          const its = ofKind(k)
          if (its.length > 1) S.menu = { kind: k, mode: 'list', anchor: anchorOf(el) }
          else exec(intentOf(el, e.altKey))
        } else if (a === 'go' || a === 'fork' || a === 'pick' || a === 'new' || a === 'restore') {
          if (a === 'restore') item(id).archived = false
          if (a === 'pick' && e.target.closest('.x')) skip = true
          if (!skip) exec(intentOf(el, e.altKey))
        } else if (a === 'menu')
          S.menu = S.menu
            ? null
            : {
                kind: k || null,
                mode: el.dataset.mode || 'list',
                search: !!el.dataset.search,
                q: '',
                anchor: anchorOf(el),
              }
        else if (a === 'kill') {
          e.stopPropagation()
          const i = item(id)
          const snap = snapshot()
          if (i.kind === 'chat') {
            i.archived = true
            toast(`Archived “${i.title}”. Restore it from the chat list.`, true)
          } else {
            t.items = t.items.filter((x) => x.id !== id)
            toast(`Closed “${i.title}”.`, true)
          }
          S.undo = snap
          t.open = t.open.filter((x) => x !== id)
          S.menu = null
        } else if (a === 'archive') {
          const i = item(id),
            snap = snapshot()
          i.archived = true
          t.open = t.open.filter((x) => x !== id)
          S.undo = snap
          toast(`Archived “${i.title}”. Restore from the chat list.`, true)
        } else if (a === 'close') t.open = t.open.filter((x) => x !== id)
        else if (a === 'pin') {
          t.pinned = t.pinned.includes(id) ? t.pinned.filter((x) => x !== id) : [...t.pinned, id]
        } else if (a === 'nav') {
          const i =
            item(
              t.open.find((x) => item(x).kind === 'browser' && el.closest(`[data-slot="${x}"]`)),
            ) || item(t.active)
          if (e.altKey) {
            exec({ kind: 'browser', fresh: true, arg: el.dataset.page, from: 'link' })
          } else {
            i.hist.push(i.page)
            i.page = el.dataset.page
            i.title = BP[i.page].u.split('/')[0]
            i.used = ++S.tick
            status(`Navigated “${i.title}” in place — layout unchanged.`)
          }
        } else if (a === 'back') {
          const i = item(id)
          if (i.hist.length) {
            i.page = i.hist.pop()
            i.title = BP[i.page].u.split('/')[0]
          }
        } else if (a === 'file') {
          const i = item(id)
          i.file = el.dataset.file
          i.used = ++S.tick
        } else if (a === 'sug') {
          send(id, el.textContent)
          return
        } else if (a === 'merge') {
          toast(
            `Posted a one-paragraph summary of “${item(id).title}” to the main thread (prototype).`,
          )
          return
        } else if (a === 'promote') {
          const c = item(id)
          toast(`“${c.title}” promoted to its own thread (prototype).`)
          return
        } else if (a === 'noop') return
        build()
        if (['fork', 'new', 'pick', 'rail', 'go'].includes(a) && !skip && !(el.dataset.k === 'pr'))
          focusInput()
        const q = $('#q')
        if (q) q.focus()
      })
      document.addEventListener('mouseover', (e) => {
        const el = e.target.closest(
          '[data-act="go"],[data-act="rail"],[data-act="fork"],[data-act="pick"],[data-act="new"],[data-act="nav"],[data-act="surface"]',
        )
        document.querySelectorAll('.slot.target').forEach((x) => x.classList.remove('target'))
        if (!el) {
          status('')
          return
        }
        if (el.dataset.act === 'nav') {
          status('<b>Navigates this browser in place.</b> ⌥-click opens it in a fresh browser.')
          return
        }
        if (el.dataset.act === 'surface') {
          status(
            el.dataset.id === 'prs'
              ? '<b>Shows the PR list across all repos in the main area</b> — chat is one click away. Picking a PR opens just that PR in the panel.'
              : '<b>Back to chat.</b>',
          )
          return
        }
        if (el.dataset.act === 'rail' && ofKind(el.dataset.kind).length > 1) {
          status(
            `<b>Choose</b> which ${KIND[el.dataset.kind].n.toLowerCase()} to open (most recent first).`,
          )
          return
        }
        const r = resolve(intentOf(el, e.altKey))
        status('<b>→</b> ' + r.text)
        const tgt = r.mode === 'focus' || r.victim ? T().open[r.slot] : null
        if (tgt) {
          const s = document.querySelector(`.slot[data-slot="${tgt}"]`)
          if (s) s.classList.add('target')
        }
      })
      document.addEventListener('mousedown', (e) => {
        const g = e.target.closest('[data-grip]')
        if (g) {
          e.preventDefault()
          const app = $('#app'),
            rect = app.getBoundingClientRect()
          const mv = (ev) => {
            S.dockPx = Math.max(90, Math.min(rect.height - 160, rect.bottom - ev.clientY))
            app.style.gridTemplateRows = `minmax(0,1fr) auto ${S.dockPx}px`
          }
          const up = () => {
            document.removeEventListener('mousemove', mv)
            document.removeEventListener('mouseup', up)
          }
          document.addEventListener('mousemove', mv)
          document.addEventListener('mouseup', up)
          return
        }
        const s = e.target.closest('.slot[data-slot]')
        if (s) {
          const i = item(s.dataset.slot)
          if (i) {
            i.used = ++S.tick
            T().active = i.id
          }
        }
      })
      document.addEventListener('dblclick', (e) => {
        if (e.target.closest('[data-grip]')) {
          S.dockPx = null
          S.dockPct = S.dockPct < 40 ? 55 : S.dockPct < 60 ? 80 : 30
          build()
        }
      })
      document.addEventListener('change', (e) => {
        const el = e.target
        if (el.dataset.act === 'model') {
          item(el.dataset.id).model = el.value
          toast(`This side chat now uses ${el.value}; main stays on ${T().model}.`)
        }
      })
      document.addEventListener('input', (e) => {
        if (e.target.id === 'q' && S.menu) {
          S.menu.q = e.target.value
          $('#mlist').innerHTML = menuListHTML(S.menu)
          placeMenu()
        }
      })
      document.addEventListener('submit', (e) => {
        e.preventDefault()
        const f = e.target,
          i = f.querySelector('input'),
          v = i.value
        i.value = ''
        if (f.dataset.term) {
          const tm = item(f.dataset.term)
          if (!v.trim()) return
          tm.lines.push(
            '<b>$</b> ' + esc(v),
            /test/.test(v) ? '<b>✓</b> 42 passed' : `zsh: ran “${esc(v)}” (prototype)`,
          )
          build()
          const x = document.querySelector(`.slot[data-slot="${tm.id}"] .tin input`)
          if (x) x.focus()
          return
        }
        send(f.dataset.id, v)
      })
      document.addEventListener('keydown', (e) => {
        if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
          e.preventDefault()
          const f = document.querySelector('.find')
          S.menu = { kind: null, mode: 'list', search: true, q: '', anchor: f ? anchorOf(f) : null }
          build()
          const q = $('#q')
          if (q) q.focus()
        }
        if (e.key === 'Escape' && S.menu) {
          S.menu = null
          build()
        }
      })
      $('#short').onclick = () => {
        S.short = !S.short
        build()
      }
      $('#notes').onclick = () => {
        S.notes = !S.notes
        build()
      }
      $('#theme').onclick = () => {
        const r = document.documentElement
        const light = r.dataset.theme
          ? r.dataset.theme === 'light'
          : matchMedia('(prefers-color-scheme:light)').matches
        r.dataset.theme = light ? 'dark' : 'light'
      }
      build()
    </script>
  </body>
</html>
