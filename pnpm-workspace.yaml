# Project-level pnpm config (allowBuilds + overrides). npm's package.json
# "overrides" field is not applied by pnpm — keep security pins here.
allowBuilds:
  ddg-search: true
  edgedriver: true
  electron-chromedriver: true
  electron-winstaller: true
  esbuild: true
  geckodriver: true
  lzma-native: true
  node-pty: true
  onnxruntime-node: true
  protobufjs: true
  sharp: true

overrides:
  '@hono/node-server': 2.0.11
  adm-zip: ^0.6.0
  brace-expansion: 5.0.9
  minimatch: 10.2.5
  deepmerge-ts: 8.0.0
  dompurify: ^3.4.13
  js-yaml@4: 4.3.1
  serialize-javascript: ^7.0.7
  tar: ^7.5.22
  sharp: 0.35.3
  fast-xml-parser: 5.10.1
  fast-uri: 3.1.5
  hono: 4.12.34
  ip-address: 10.3.1
  extract-zip: file:packages/extract-zip
  undici@6: 6.28.0
  undici@7: 7.29.0

# Dependabot's `cooldown.default-days: 7` (.github/dependabot.yml) runs pnpm
# with --config.minimumReleaseAge=10080, which makes pnpm refuse to resolve
# any version published in the last 7 days — including the security pins in
# `overrides` above, which are by nature a few days old when added. That
# aborted every version-update job with ERR_PNPM_NO_MATURE_MATCHING_VERSION
# ("Version 8.0.0 of deepmerge-ts does not meet the minimumReleaseAge
# constraint"). Overridden versions are chosen by hand, so exempt them from
# the age check. Keep this list in sync with `overrides`
# (scripts/pnpm-workspace-invariants.test.ts enforces it).
minimumReleaseAgeExclude:
  - '@hono/node-server'
  - adm-zip
  - brace-expansion
  - minimatch
  - deepmerge-ts
  - dompurify
  - js-yaml
  - serialize-javascript
  - tar
  - sharp
  - fast-xml-parser
  - fast-uri
  - hono
  - ip-address
  - undici
