<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Explainer</title>
  <style>
    * {
      box-sizing: border-box;
    }
    html,
    body {
      margin: 0;
      background: #171c22;
      color: #eef1f0;
      font:
        14px system-ui,
        sans-serif;
    }
    main {
      height: 100vh;
      display: flex;
      flex-direction: column;
      max-width: 1280px;
      margin: auto;
    }
    canvas {
      flex: 1;
      min-height: 0;
      height: 0;
      object-fit: contain;
      display: block;
      width: 100%;
      aspect-ratio: 16/9;
    }
    nav {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
    }
    button {
      color: inherit;
      background: #29333b;
      border: 1px solid #52606b;
      border-radius: 7px;
      padding: 7px 13px;
      cursor: pointer;
    }
    button:focus-visible,
    input:focus-visible,
    summary:focus-visible {
      outline: 2px solid #9ee7c5;
      outline-offset: 3px;
    }
    input {
      flex: 1;
      min-width: 40px;
      accent-color: #9ee7c5;
    }
    output {
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    details {
      max-height: 40vh;
      overflow: auto;
      flex-shrink: 0;
      padding: 0 16px 16px;
      color: #d0d8d5;
    }
    summary {
      cursor: pointer;
    }
    li {
      margin: 12px 0;
      line-height: 1.55;
    }
    strong {
      display: block;
      color: #fff;
    }
    p {
      line-height: 1.5;
    }
    #style {
      font-size: 12px;
      color: #b5c6bd;
      margin-left: auto;
    }
    @media (max-width: 480px) {
      #style {
        display: none;
      }
      nav {
        flex-shrink: 0;
        gap: 6px;
        padding: 8px;
      }
      button {
        padding: 7px;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      * {
        scroll-behavior: auto;
      }
    }
  </style>

    <canvas
      id="scene"
      width="1280"
      height="720"
      role="img"
      aria-label="Animated explanation; written transcript below"
    ></canvas>

        aria-label="Playback position"

        min="0"
        max="18"
        step="0.1"
        value="0"
      /><output id="time">0:00 / 0:18</output><span id="style"></span>
    </nav>
    <details>
      <summary>Read the narration</summary>
      <ol id="transcript"></ol>
      <p id="source"></p>
    </details>
  </main>

            }
            if (t > 15) label('Review the combined evidence', 640, 530, s.ink, s.paper)
          } else if (p.pattern === 'routing') {
            const xs = [262, 641, 1019]
            for (let i = 0; i < 3; i++) {
              card(xs[i], 382, p.labels[i], i, 0, 0.91)
              if (i > 0)
                line(
                  [
                    [xs[i - 1] + 110, 380],
                    [xs[i] - 115, 380],
                  ],
                  s.accent,
                  4,
                )
            }
            const travel = t < 6 ? 0 : t < 12 ? ease((t - 6) / 3) : ease((t - 12) / 3)
            const x = t < 6 ? 262 : t < 12 ? mix(262, 641, travel) : mix(641, 1019, travel)
            label(t < 12 ? 'Model request' : 'Tool request', x, 230, s.ink, s.paper)
            card(x, 382, 'Request', 0, -0.06, 0.42)
          } else {
            for (let i = 0; i < 3; i++) {
              const x = 282 + i * 355,
                active = beat === i
              card(
                x,
                375,
                p.labels[i],
                i,
                active ? Math.sin(t * 2) * 0.015 : 0,
                active ? 1.1 : 0.85,
                beat > i ? 'found' : '',
              )
              if (i < 2)
                line(
                  [
                    [x + 126, 375],
                    [x + 224, 375],
                  ],
                  s.accent,
                  4,
                )
            }
            const q = ease((t - beat * 6) / 3)
            rr(232 + beat * 355, 522, 100 * q, 7, 3, s.accent)
          }
        }
        function isometric() {
          const workshop = s.id === 'workshop'
          iso(134, 431, 714, 242, 23, workshop ? '#ccb9dd' : '#d6cdb3')
          const rows = [
            { x: 256, y: 385 },
            { x: 397, y: 326 },
            { x: 538, y: 267 },
          ]
          for (let i = 0; i < 3; i++) {
            const { x, y } = rows[i]
            for (let j = 0; j < 5; j++) {
              let filled = t < 6 ? i === 0 && j < t * 0.82 : t < 12 ? j < (t - 6) * 1.1 : true
              iso(
                x + j * 98,
                y + j * 37,
                80,
                56,
                56,
                filled ? s.colors[i] : workshop ? '#d7c7e4' : '#cec5a9',
              )
            }
          }
          for (let i = 0; i < 3; i++) {
            const { x, y } = rows[i]
            label(p.labels[i], x + 470, y + 132, s.ink, s.paper)
          }
          const q = ease((t - 6) / 1.2)
          for (let i = 0; i < (t < 6 ? 1 : 3); i++) {
            const { x, y } = rows[i]
            const walk = t < 6 ? ease(t / 5) : t < 12 ? ease((t - 6) / 4) : 1 - ease((t - 12) / 3)
            cart(
              x - 30 + walk * 395,
              y + walk * 145 + 42,
              i,
              t < 6 ? 'One worker' : t < 12 ? 'Worker ' + (i + 1) : 'Report',
            )
          }
          if (t >= 12) {
            const reveal = ease((t - 13) / 1.2)
            group(
              330,
              288,
              0,
              () => {
                rr(-171, -85, 342, 170, 14, s.paper, s.accent)
                text(
                  p.pattern === 'review'
                    ? 'REVIEW COMPLETE'
                    : p.pattern === 'context'
                      ? 'WORKING SET'
                      : p.pattern === 'routing'
                        ? 'DESTINATION CHECK'
                        : 'FINDINGS TOGETHER',
                  0,
                  -49,
                  19,
                  s.ink,
                )
                wrap(p.beats[2].title, 0, 2, 300, 29, s.ink)
                tick(127, 52)
              },
              reveal,
            )
          }
          if (p.pattern !== 'parallel') {
            label(PATTERNS[p.pattern].name, 355, 192, s.ink, s.paper)
          }
        }
        function kinetic() {
          const action = [p.beats[0].title, p.beats[1].title, p.beats[2].title][beat]
          wrap(action.toUpperCase(), 65, 264, 600, 70, s.accent, 3, 'left')
          for (let i = 0; i < 3; i++) {
            const baseX = 869 + (i - 1) * 70,
              baseY = 357 + (i - 1) * 46
            const offset = Math.sin(ease((t - beat * 6) / 1.2) * Math.PI) * 45
            card(
              baseX + offset,
              baseY,
              p.labels[i],
              i,
              (i - 1) * 0.12,
              0.9,
              beat === 0 ? 'edit' : beat === 2 ? 'found' : '',
            )
          }
          text(['01', '02', '03'][beat], 98, 524, 108, s.ink, 'left', 850)
          line(
            [
              [261, 533],
              [1200, 533],
            ],
            s.ink,
            7,
          )
        }
        function signal() {
          c.strokeStyle = '#234247'
          c.lineWidth = 1
          for (let x = 40; x < 1280; x += 40) {
            c.beginPath()
            c.moveTo(x, 168)
            c.lineTo(x, 576)
            c.stroke()
          }
          for (let y = 176; y < 570; y += 40) {
            c.beginPath()
            c.moveTo(40, y)
            c.lineTo(1240, y)
            c.stroke()
          }
          for (let i = 0; i < 3; i++) {
            const y = 252 + i * 124
            label(p.labels[i], 172, y, s.ink, s.paper)
            line(
              [
                [330, y],
                [1160, y],
              ],
              '#34545a',
              2,
            )
            const progress =
              p.pattern === 'context' && i === 1
                ? 1 - ease((t - 6) / 5)
                : p.pattern === 'parallel' && t < 6 && i > 0
                  ? 0
                  : ease((t - i * 0.4) / 11)
            for (let j = 0; j < 8; j++) {
              rr(348 + j * 93, y - 18, 72, 36, 3, j / 8 < progress ? s.colors[i] : '#1f373c')
            }
            if (t > 13 && !(p.pattern === 'context' && i === 1)) tick(1178, y, s.colors[i])
          }
          label(p.beats[beat].title, 640, 562, s.ink, s.paper)
        }
        text(p.project.toUpperCase(), 48, 43, 19, s.ink, 'left', 700)
        text(s.name.toUpperCase(), 1230, 43, 17, s.ink, 'right', 600)
        wrap(p.title, 48, 110, 1160, 42, s.ink, 2, 'left')
        if (s.id === 'kinetic') kinetic()
        else if ((s.id === 'mailroom' || s.id === 'workshop') && p.pattern === 'parallel')
          isometric()
        else if (s.id === 'signal') signal()
        else {
          flat()
          if (s.id === 'comic' && p.pattern === 'context') {
            // A small reader keeps the metaphor human without competing with the objects.
            c.fillStyle = '#d99773'
            c.beginPath()
            c.arc(1210, 439, 20, 0, Math.PI * 2)
            c.fill()
            rr(1187, 462, 48, 85, 15, '#eaa78e')
            line(
              [
                [1203, 448],
                [1217, 448],
              ],
              s.ink,
              2,
            )
          }
        }
        const dark = ['paper', 'folded', 'signal'].includes(s.id)
        rr(28, 586, 1224, 112, 14, dark ? '#ffffffed' : '#122d36')
        for (let i = 0; i < 3; i++) {
          rr(
            43 + i * 112,
            624,
            105,
            27,
            13,
            beat === i ? s.accent : dark ? '#183d3315' : '#ffffff17',
          )
          text(
            ['1 Problem', '2 Action', '3 Result'][i],
            95 + i * 112,
            638,
            14,
            beat === i ? (s.id === 'kinetic' ? '#fff' : '#123b32') : dark ? '#315248' : '#d4e4de',
            'center',
            700,
          )
        }
        wrap(
          p.beats[beat].caption,
          805,
          643,
          798,
          Math.min(p.captionSize, p.beats[beat].caption.length > 125 ? 25 : 30),
          dark ? '#143e36' : '#f5fbf5',
          3,
        )
        rr(29, 704, 1222 * clamp(t / 18), 4, 2, s.accent)
        if (options.narrated) text('AI NARRATION', 1208, 588, 12, s.ink, 'right')
        c.restore()
        return beat
      }
      const api = { STYLES, PATTERNS, render }
      if (typeof module !== 'undefined') module.exports = api
      else root.Explainer = api
    })(typeof window !== 'undefined' ? window : globalThis)
  </script>
  <script>
    'use strict'
    const story = JSON.parse(document.getElementById('story').textContent)
    const canvas = document.getElementById('scene'),
      play = document.getElementById('play'),
      seek = document.getElementById('seek'),
      time = document.getElementById('time')
    document.title = story.title
    canvas.setAttribute(
      'aria-label',
      story.title + ' — animated explanation; written transcript below',
    )
    document.getElementById('style').textContent = Explainer.STYLES.find(
      (s) => s.id === story.style,
    ).name
    for (const beat of story.beats) {
      const li = document.createElement('li'),
        strong = document.createElement('strong')
      strong.textContent = beat.title
      li.append(strong, document.createTextNode(beat.caption))
      document.getElementById('transcript').append(li)
    }
    document.getElementById('source').textContent = story.source
    seek.max = story.duration
    let position = 0,
      playing = false,
      last = 0,
      frame = 0
    const clock = (s) => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0')
    function draw() {
      Explainer.render(canvas, story, position)
      seek.value = position
      time.textContent = clock(position) + ' / ' + clock(story.duration)
      play.textContent = playing ? 'Pause' : position >= story.duration ? 'Replay' : 'Play'
      play.setAttribute('aria-pressed', String(playing))
    }
    function tick(now) {
      if (!playing) return
      position = Math.min(story.duration, position + (now - last) / 1000)
      last = now
      if (position >= story.duration) playing = false
      draw()
      if (playing) frame = requestAnimationFrame(tick)
    }
    function pause() {
      playing = false
      cancelAnimationFrame(frame)
      draw()
    }
    play.addEventListener('click', () => {
      if (playing) {
        pause()
        return
      }
      if (position >= story.duration) position = 0
      playing = true
      last = performance.now()
      draw()
      frame = requestAnimationFrame(tick)
    })
    seek.addEventListener('input', () => {
      position = Number(seek.value)
      last = performance.now()
      draw()
    })
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) pause()
    })
    draw()
  </script>
